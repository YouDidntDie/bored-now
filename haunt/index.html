'use strict';
/* ============================================================
   HAUNT v3 — "THE KNIGHT'S VIGIL"
   A 1980 maze-chase, told from the other side. YOU are the knight.

   - Every maze is procedurally generated. No two runs are the same.
   - The sword is a POWER-UP: find a blade, earn 3 charges.
     Every slash spends one charge. No blade, no slash.
   - The dead rise from CRYPTS scattered through the maze:
       SENTRY — patrols its crypt, charges only when it sees you.
       REAVER — hunts you relentlessly... but flees an armed knight.
       WISP   — drifts on the wind, wild and unreadable.
   - Chain kills for combo: 200 / 400 / 800 / 1600.
   - Versus: P1 is the knight, P2 is the REAVER. 90 seconds. Best of 3.

   Original in every way: original maze, original foes, original code,
   original art, original audio. Mechanics only nod at 1980.
   ============================================================ */

function drawPixText(str, dx, y0, u) {
  let cx = dx;
  for (const ch of str) {
    const gl = ch === ' ' ? null : (FONT5X7[ch] || FONT5X7['?']);
    if (gl) for (let r = 0; r < gl.length; r++) {
      const row = gl[r];
      for (let c = 0; c < 5; c++)
        if (row[c] === '1') bctx.fillRect(cx + c * u, y0 + r * u, u, u);
    }
    cx += ch === ' ' ? 4 * u : 6 * u;
  }
}
// u = unite de police en px logiques, multiple de PX pour tomber sur la grille.
function text(str, x, y, font, color, glow, align) {
  str = String(str).toUpperCase();
  const m = /(\d+)/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of str) w += ch === ' ' ? 4 * u : 6 * u;
  let dx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  dx = Math.round(dx / PX) * PX;
  const y0 = Math.round((y - 3.5 * u) / PX) * PX;
  if (glow) {  // halo pixel : 8 voisins, alpha d'autant plus douce que le texte est petit
    bctx.fillStyle = glow;
    const ga = bctx.globalAlpha;
    bctx.globalAlpha = ga * Math.min(1, Math.max(0.32, u / 18));
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      if (!ox && !oy) continue;
      drawPixText(str, dx + ox * u, y0 + oy * u, u);
    }
    bctx.globalAlpha = ga;
  }
  bctx.fillStyle = color;
  drawPixText(str, dx, y0, u);
}
function pixW(str, font) {
  const m = /(\d+)/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of String(str).toUpperCase()) w += ch === ' ' ? 4 * u : 6 * u;
  return w;
}


/* ---------- procedural maze ---------- */
let MAZE=[];
function genMazeGrid(){
  const w=MW,h=MH;
  const g=Array.from({length:h},()=>new Array(w).fill(1));
  const stack=[[1,1]]; g[1][1]=0;
  const D=[[2,0],[-2,0],[0,2],[0,-2]];
  while(stack.length){
    const top=stack[stack.length-1], cx=top[0], cy=top[1];
    const opts=[];
    for(let i=0;i<4;i++){
      const nx=cx+D[i][0], ny=cy+D[i][1];
      if(nx>0&&ny>0&&nx<w-1&&ny<h-1&&g[ny][nx]===1)
        opts.push([nx,ny,cx+D[i][0]/2,cy+D[i][1]/2]);
    }
    if(!opts.length){ stack.pop(); continue; }
    const p=opts[(Math.random()*opts.length)|0];
    g[p[3]][p[2]]=0; g[p[1]][p[0]]=0; stack.push([p[0],p[1]]);
  }
  // knock extra walls -> loops (escape routes, less perfect-maze cruelty)
  let knocked=0, guard=0;
  while(knocked<30&&guard++<500){
    const x=1+((Math.random()*(w-2))|0), y=1+((Math.random()*(h-2))|0);
    if(g[y][x]!==1) continue;
    const hz=g[y][x-1]===0&&g[y][x+1]===0;
    const vt=g[y-1][x]===0&&g[y+1][x]===0;
    if((hz?1:0)^(vt?1:0)){ g[y][x]=0; knocked++; }
  }
  return g.map(r=>r.map(c=>c?'#':'.').join(''));
}
function walk(x,y){ return x>=0&&y>=0&&x<MW&&y<MH&&MAZE[y][x]!== '#'; }
function bfsFrom(sx,sy){
  const d=new Int16Array(MW*MH).fill(-1);
  if(!walk(sx,sy)) return d;
  const qx=[sx],qy=[sy]; d[sy*MW+sx]=0; let head=0;
  while(head<qx.length){
    const x=qx[head],y=qy[head]; head++;
    for(let i=0;i<4;i++){
      const nx=x+DIRS4[i].x, ny=y+DIRS4[i].y;
      if(walk(nx,ny)&&d[ny*MW+nx]<0){ d[ny*MW+nx]=d[y*MW+x]+1; qx.push(nx); qy.push(ny); }
    }
  }
  return d;
}
function losClear(x0,y0,x1,y1){
  if(x0===x1){ const a=Math.min(y0,y1),b=Math.max(y0,y1);
    for(let y=a;y<=b;y++) if(!walk(x0,y)) return false; return true; }
  if(y0===y1){ const a=Math.min(x0,x1),b=Math.max(x0,x1);
    for(let x=a;x<=b;x++) if(!walk(x,y0)) return false; return true; }
  return false;
}

/* ---------- level setup: maze, crypts, blades, pellets ---------- */
let floorTiles=[], crypts=[], cryptNear=[], blades=[], pelSet=new Set(), totalPellets=0;
let knightStart={x:1,y:1};
function argmaxFloor(dist, skip){
  let best=-1, bx=1, by=1;
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    if(MAZE[y][x]==='#') continue;
    const k=x+','+y; if(skip&&skip.has(k)) continue;
    const dd=dist[y*MW+x]; if(dd>best){ best=dd; bx=x; by=y; }
  }
  return {x:bx,y:by};
}
function minDistTo(pts){
  const best=new Int16Array(MW*MH).fill(32000);
  for(const p of pts){
    const d=bfsFrom(p.x,p.y);
    for(let i=0;i<best.length;i++) if(d[i]>=0&&d[i]<best[i]) best[i]=d[i];
  }
  return best;
}
let mazeCv=null; // pre-baked static maze (floor+walls), re-baked per level
function bakeMaze(){
  if(!mazeCv){ mazeCv=document.createElement('canvas'); }
  mazeCv.width=MW*TS; mazeCv.height=MH*TS;
  const g=mazeCv.getContext('2d');
  const R2=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,h); };
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(MAZE[y][x]==='#') continue;
    const px=x*TS, py=y*TS, v=hash2(x,y);
    R2(px,py,TS,TS, v<0.14?'#0c0c15':'#090910');
    if(v>0.94) R2(px+6,py+12,3,2,'#141422');
    else if(v>0.90) R2(px+13,py+5,2,2,'#12121e');
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(MAZE[y][x]!=='#') continue;
    const px=x*TS, py=y*TS, v=hash2(x*3+7,y*5+1);
    R2(px,py,TS,TS,'#232330');
    if(v<0.32) R2(px+5,py+10,9,2,'#1a1a24');
    else if(v<0.46) R2(px+13,py+4,2,8,'#1a1a24');
    else if(v<0.55) R2(px+4,py+4,4,3,'#2c2c3e');
    if(y>0&&MAZE[y-1][x]!=='#'){ R2(px,py,TS,3,'#48455e'); R2(px,py+3,TS,1,'#34324a'); }
    if(y<MH-1&&MAZE[y+1][x]!=='#') R2(px,py+TS-3,TS,3,'#121219');
    if(x>0&&MAZE[y][x-1]!=='#') R2(px,py,3,TS,'#3a3850');
    if(x<MW-1&&MAZE[y][x+1]!=='#') R2(px+TS-3,py,3,TS,'#121219');
  }
}
function setupLevel(){
  MAZE=genMazeGrid();
  floorTiles=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)
    if(MAZE[y][x]!== '#') floorTiles.push({x,y});
  // hub: floor nearest center
  let hub=floorTiles[0], hd=1e9;
  for(const t of floorTiles){ const dd=Math.abs(t.x-10)+Math.abs(t.y-10); if(dd<hd){hd=dd;hub=t;} }
  const dh=bfsFrom(hub.x,hub.y);
  knightStart=argmaxFloor(dh,null);
  const pts=[{x:knightStart.x,y:knightStart.y}], skip=new Set([knightStart.x+','+knightStart.y]);
  crypts=[]; cryptNear=[];
  for(let i=0;i<CRYPT_COUNT;i++){
    const dd=minDistTo(pts);
    const c=argmaxFloor(dd,skip);
    crypts.push(c); pts.push(c); skip.add(c.x+','+c.y);
  }
  // floor tiles near each crypt (sentry patrol ground)
  for(const c of crypts){
    const near=[];
    for(const t of floorTiles)
      if(Math.max(Math.abs(t.x-c.x),Math.abs(t.y-c.y))<=4) near.push(t);
    cryptNear.push(near.length?near:[c]);
  }
  // blades: far from knight + crypts, spread out
  blades=[];
  for(let i=0;i<SWORDS_PER_MAZE;i++){
    const dd=minDistTo(pts);
    const b=argmaxFloor(dd,skip);
    blades.push({x:b.x,y:b.y,taken:false}); pts.push(b); skip.add(b.x+','+b.y);
  }
  // pellets: every floor tile except crypts, blades, knight start
  pelSet=new Set();
  for(const t of floorTiles){
    const k=t.x+','+t.y;
    if(skip.has(k)) continue;
    pelSet.add(t.y*MW+t.x);
  }
  totalPellets=pelSet.size;
  bakeMaze();
}

function slashSprite(dx,dy){
  return mkSprite(15,15,(g)=>{
    g.strokeStyle='#fff'; g.lineWidth=2; g.lineCap='round';
    const cx=7,cy=7,r=6;
    const a0=Math.atan2(dy,dx)-SLASH_HALF, a1=Math.atan2(dy,dx)+SLASH_HALF;
    g.beginPath(); g.arc(cx,cy,r,a0,a1); g.stroke();
    g.strokeStyle='#9fd8ff';
    g.beginPath(); g.arc(cx,cy,r-2.5,a0,a1); g.stroke();
  });
}

function spr(img,x,y,tint){
  if(!tint){ bctx.drawImage(img,x,y,img.width/PX,img.height/PX); return; }
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  const g=c.getContext('2d'); g.drawImage(img,0,0);
  g.globalCompositeOperation='source-in'; g.fillStyle=tint; g.fillRect(0,0,c.width,c.height);
  bctx.drawImage(c,x,y,img.width/PX,img.height/PX);
}

  combo:0, lastKillT:-99,
  introT:0, overT:0, clearT:0,
  // versus
  round:1, p1Wins:0, p2Wins:0, roundT:90, roundEndT:0, roundWinner:0,
};
const knight={x:1.5,y:1.5,dir:{x:0,y:0},want:{x:0,y:0},face:'down',
  speed:KNIGHT_SPEED, dead:false, deadT:0, charges:0,
  slashCD:0, slashT:0, slashFace:'down', dryT:0, rootT:0};
const p2={want:{x:0,y:0}, reaver:null, banishT:0};
const ENEMY_COL={sentry:'#4dc9ff', reaver:'#ff4d5e', wisp:'#b78bff'};
function maxAlive(){ return Math.min(3+(G.level-1),6); }
function spawnInterval(){ return Math.max(2.5, 6-0.6*(G.level-1)); }
function enemySpeed(kind,mode){
  let base=5.05;
  if(kind==='sentry') base=(mode==='chase'||mode==='flee')?6.15:4.38;
  else if(kind==='reaver') base=(mode==='flee')?5.89:5.81;
  else base=5.05;
  return Math.min(6.23, base+0.185*(G.level-1));
}
function addScore(n){ G.score+=n; if(G.score>G.best){G.best=G.score;localStorage.setItem('haunt_best',G.best);} }

/* ---------- flow ---------- */
function resetKnight(){
  knight.x=knightStart.x+0.5; knight.y=knightStart.y+0.5;
  knight.dir={x:0,y:0}; knight.want={x:0,y:0}; knight.face='down';
  knight.dead=false; knight.deadT=0; knight.slashCD=0; knight.slashT=0; knight.dryT=0;
}
function startLevel(){
  setupLevel();
  G.pelletsLeft=totalPellets; G.pelletsEaten=0;
  G.chalice=null; G.chaliceA=false; G.chaliceB=false;
  G.floaters=[]; G.enemies=[]; G.combo=0; G.lastKillT=-99;
  knight.charges=0;
  resetKnight();
  // opening cast: one of each kind rises from the crypts
  const kinds=['sentry','reaver','wisp'];
  for(let i=0;i<3;i++) spawnEnemy(kinds[i], i%CRYPT_COUNT);
  G.spawnT=spawnInterval();
  G.introT=1.6;
}
function startQuest(){
  G.score=0; G.lives=3; G.level=1;
  startLevel(); G.state='quest';
}
function startVersus(){
  G.score=0; G.round=1; G.p1Wins=0; G.p2Wins=0;
  startRound();
}
function startRound(){
  setupLevel();
  G.pelletsLeft=totalPellets; G.pelletsEaten=0;
  G.chalice=null; G.chaliceA=false; G.chaliceB=false;
  G.floaters=[]; G.enemies=[];
  knight.charges=0; G.lives=1;
  resetKnight();
  // P2 is the REAVER; two AI foes keep P1 honest
  const r=spawnEnemy('reaver',0); r.player=true; p2.reaver=r; p2.banishT=0; p2.want={x:0,y:0};
  spawnEnemy('sentry',1); spawnEnemy('wisp',2);
  G.roundT=90; G.state='versus'; G.introT=1.6;
}
function toMenu(){ G.state='menu'; }
function togglePause(){
  if(G.state==='paused'){ G.state=G.prevState; }
  else if(G.state==='quest'||G.state==='versus'){ G.prevState=G.state; G.state='paused'; }
}
function hurtKnight(){
  if(knight.dead) return;
  knight.dead=true; knight.deadT=1.3;
}
function afterDeath(){
  if(G.state==='versus'){ endRound(false); return; }
  G.lives--;
  if(G.lives<=0){ G.state='over'; G.overT=0; }
  else { resetKnight(); for(const e of G.enemies){} /* foes hold their ground */ }
}
function endRound(p1won){
  if(p1won) G.p1Wins++; else G.p2Wins++;
  G.roundWinner=p1won?1:2;
  G.state='roundend'; G.roundEndT=2.6;
}

/* ---------- enemies ---------- */
function spawnEnemy(kind, cryptIdx){
  const c=crypts[cryptIdx%CRYPT_COUNT];
  const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>walk(c.x+d.x,c.y+d.y));
  const e={kind, x:c.x+0.5, y:c.y+0.5, dir:dirs.length?dirs[(Math.random()*dirs.length)|0]:{x:1,y:0},
    speed:enemySpeed(kind,'patrol'), state:'emerge', emergeT:0.7,
    mode:'patrol', anchor:{x:c.x,y:c.y}, anchorT:0, loseT:0,
    dieT:0, crypt:cryptIdx%CRYPT_COUNT, player:false, banishT:0,
    color:ENEMY_COL[kind], name:kind.toUpperCase()};
  e.anchor=randomOf(cryptNear[e.crypt]);
  G.enemies.push(e);
  return e;
}
function randomOf(a){ return a[(Math.random()*a.length)|0]; }
function slay(e){
  const now=perfNow();
  if(now-G.lastKillT<COMBO_T) G.combo=Math.min(G.combo+1,3); else G.combo=0;
  G.lastKillT=now;
  const pts=COMBO_PTS[G.combo];
  addScore(pts);
  G.floaters.push({x:e.x,y:e.y,txt:''+pts,t:1.0});
  if(e.player){ e.state='gone'; e.banishT=3; }
  else { e.state='dying'; e.dieT=0.6; }
}
function perfNow(){ return performance.now()/1000; }

/* ---------- input ---------- */
const keyDir={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
function setWant(x,y){ knight.want={x,y}; if(knight.dir.x===0&&knight.dir.y===0&&walk(Math.floor(knight.x)+x,Math.floor(knight.y)+y)){knight.dir={x,y};} }
function trySlash(tx,ty){
  if(G.state!=='quest'&&G.state!=='versus') return false;
  if(knight.dead||knight.slashCD>0) return false;
  if(knight.charges<=0){ knight.dryT=0.18; return false; } // dry fire: empty click
  knight.charges--;
  knight.slashCD=SLASH_CD; knight.slashT=0.22;
  // aim: toward the tap point when given (touch), else the facing (keys)
  let a=faceAngle(knight.face);
  if(tx!==undefined&&ty!==undefined){
    const tdx=tx-knight.x, tdy=ty-knight.y;
    if(tdx*tdx+tdy*tdy>0.16) a=Math.atan2(tdy,tdx); // ignore taps right on the knight
    // magnetism: snap to a foe near the tap point (fat fingers)
    let best=null,bd=0.36;
    for(const e of G.enemies){
      if(e.state!=='active') continue;
      const ddx=e.x-tx, ddy=e.y-ty, d2=ddx*ddx+ddy*ddy;
      if(d2<bd){ bd=d2; best=e; }
    }
    if(best) a=Math.atan2(best.y-knight.y,best.x-knight.x);
  }
  knight.face=angleToFace(a); knight.slashFace=knight.face;
  knight.rootT=SLASH_ROOT;
  for(const e of G.enemies){
    if(e.state!=='active') continue;
    const dx=e.x-knight.x, dy=e.y-knight.y, d=Math.hypot(dx,dy);
    if(d>SLASH_RANGE) continue;
    let da=Math.atan2(dy,dx)-a;
    while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
    if(Math.abs(da)<SLASH_HALF){ slay(e); }
  }
  return true;
}
function angleToFace(a){
  const dx=Math.cos(a), dy=Math.sin(a);
  return Math.abs(dx)>=Math.abs(dy)?(dx>=0?'right':'left'):(dy>=0?'down':'up');
}
function faceAngle(f){ return f==='right'?0:f==='down'?Math.PI/2:f==='left'?Math.PI:-Math.PI/2; }
function dirToFace(d){ if(d.x===1)return'right'; if(d.x===-1)return'left'; if(d.y===1)return'down'; if(d.y===-1)return'up'; return null; }
window.addEventListener('keydown',(e)=>{
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ togglePause(); return; }
  if(e.key===' '){ e.preventDefault(); trySlash(); return; }
  const kd=keyDir[e.key];
  if(kd){
    if(G.state==='versus'&&(e.key.startsWith('Arrow'))) { /* P1 uses WASD in versus; arrows are P2 */ }
    if(G.state==='quest'||G.state==='versus'){
      if(G.state==='versus'&&e.key.startsWith('Arrow')) p2.want={x:kd[0],y:kd[1]};
      else setWant(kd[0],kd[1]);
    }
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }
  if(e.key==='Enter'&&G.state==='menu'){ startQuest(); }
});
/* touch: swipe = move, tap = slash */
let tS=null,tT=0,tMoved=false,tHalf=true;
cv.addEventListener('pointerdown',(e)=>{ tS={x:e.clientX,y:e.clientY}; tT=performance.now(); tMoved=false; tHalf=e.clientX<window.innerWidth/2; });
cv.addEventListener('pointermove',(e)=>{
  if(!tS) return;
  const dx=e.clientX-tS.x, dy=e.clientY-tS.y;
  if(Math.hypot(dx,dy)>24){
    tMoved=true;
    const d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
    handleSwipe(d[0],d[1]);
    tS={x:e.clientX,y:e.clientY}; // re-anchor: keep steering while the finger stays down
  }
});
cv.addEventListener('pointerup',(e)=>{
  if(!tS) return;
  const dt=performance.now()-tT;
  if(!tMoved&&dt<400) handleTap(e.clientX,e.clientY);
  tS=null;
});
function handleSwipe(dx,dy){
  if(G.state==='quest') setWant(dx,dy);
  else if(G.state==='versus'){
    // left half: P1 (knight), right half: P2 (reaver)
    if(tHalf) setWant(dx,dy); else p2.want={x:dx,y:dy};
  }
}
function handleTap(px,py){
  const r=cv.getBoundingClientRect();
  const x=(px-r.left)/r.width*W, y=(py-r.top)/r.height*H;
  if(G.state==='menu'){ const b=menuButtonAt(x,y); if(b) b.fn(); return; }
  if(G.state==='howto'){ const bkY=(W>H)?436:600; if(x>W/2-70&&x<W/2+70&&y>bkY&&y<bkY+48){ toMenu(); } return; }
  if(G.state==='over'||G.state==='clear'){ toMenu(); return; }
  if(G.state==='quest'||G.state==='versus'){
    if(x>W-64&&y<H-64){ togglePause(); return; }
    trySlash((x-mox())/TS,(y-moy())/TS); // screen px -> world tiles
  }
}

/* ---------- movement ---------- */
function moveEnt(e,dt,atCenter){
  if(e.dir.x===0&&e.dir.y===0) return;
  const step=e.speed*dt;
  const tx=Math.floor(e.x), ty=Math.floor(e.y);
  const cx=tx+0.5, cy=ty+0.5;
  const toC=(cx-e.x)*e.dir.x+(cy-e.y)*e.dir.y;
  if(toC>1e-6&&step>=toC){
    e.x=cx; e.y=cy;
    if(atCenter) atCenter(e);
    const left=step-toC;
    if(e.dir.x===0&&e.dir.y===0) return;
    const nx=Math.floor(e.x)+e.dir.x, ny=Math.floor(e.y)+e.dir.y;
    if(!walk(nx,ny)){ e.dir={x:0,y:0}; return; }
    e.x+=e.dir.x*left; e.y+=e.dir.y*left;
  }else{ e.x+=e.dir.x*step; e.y+=e.dir.y*step; }
}
function knightAtCenter(){
  const tx=Math.floor(knight.x), ty=Math.floor(knight.y);
  if((knight.want.x||knight.want.y)&&walk(tx+knight.want.x,ty+knight.want.y))
    knight.dir={x:knight.want.x,y:knight.want.y};
  if((knight.dir.x||knight.dir.y)&&!walk(tx+knight.dir.x,ty+knight.dir.y))
    knight.dir={x:0,y:0};
  const f=dirToFace(knight.dir); if(f) knight.face=f;
}
function enemyAtCenter(e){
  if(e.player){ // P2's reaver obeys P2
    const tx=Math.floor(e.x), ty=Math.floor(e.y);
    if((p2.want.x||p2.want.y)&&walk(tx+p2.want.x,ty+p2.want.y)) e.dir={x:p2.want.x,y:p2.want.y};
    if((e.dir.x||e.dir.y)&&!walk(tx+e.dir.x,ty+e.dir.y)) e.dir={x:0,y:0};
    return;
  }
  const tx=Math.floor(e.x), ty=Math.floor(e.y);
  const kx=Math.floor(knight.x), ky=Math.floor(knight.y);
  let target=null, flee=false;
  const armed=knight.charges>0&&!knight.dead;
  if(e.kind==='sentry'){
    if(e.mode==='chase'){ target={x:kx,y:ky}; }
    else if(e.mode==='flee'){ target={x:kx,y:ky}; flee=true; }
    else { target=e.anchor; }
  }else if(e.kind==='reaver'){
    target={x:kx,y:ky}; flee=armed;
  }else{ // wisp
    const d=Math.hypot(knight.x-e.x,knight.y-e.y);
    if(d<3.5&&Math.random()<0.4) target={x:kx,y:ky};
  }
  const opts=[];
  for(let i=0;i<4;i++){
    const dd=DIRS4[i];
    if(dd.x===-e.dir.x&&dd.y===-e.dir.y) continue;
    if(walk(tx+dd.x,ty+dd.y)) opts.push(dd);
  }
  if(!opts.length){ e.dir={x:-e.dir.x,y:-e.dir.y}; return; }
  const d2=(x,y,t)=>{const dx=x-t.x,dy=y-t.y;return dx*dx+dy*dy;};
  let pick;
  if(flee&&target) pick=opts.reduce((a,b)=>d2(tx+b.x,ty+b.y,target)>d2(tx+a.x,ty+a.y,target)?b:a);
  else if(target) pick=opts.reduce((a,b)=>d2(tx+b.x,ty+b.y,target)<d2(tx+a.x,ty+a.y,target)?b:a);
  else pick=opts[(Math.random()*opts.length)|0];
  e.dir={x:pick.x,y:pick.y};
}

/* ---------- update ---------- */
let lastT=0;
function update(dt){
  if(G.state==='quest') updateQuest(dt);
  else if(G.state==='versus') updateVersus(dt);
  else if(G.state==='roundend'){ G.roundEndT-=dt; if(G.roundEndT<=0){
    if(G.p1Wins>=2||G.p2Wins>=2){ toMenu(); } else { G.round++; startRound(); } } }
  else if(G.state==='over'){ G.overT+=dt; }
  else if(G.state==='clear'){ G.clearT+=dt; if(G.clearT>2.2){ G.level++; startLevel(); G.state='quest'; } }
  for(const f of G.floaters) f.t-=dt;
  G.floaters=G.floaters.filter(f=>f.t>0);
}
function updateKnight(dt){
  if(knight.dead){
    knight.deadT-=dt;
    if(knight.deadT<=0) afterDeath();
    return;
  }
  if(knight.rootT>0){ knight.rootT-=dt; }
  else moveEnt(knight,dt,knightAtCenter);
  knight.slashCD-=dt; knight.slashT-=dt; knight.dryT-=dt;
  // pellets
  const tx=Math.floor(knight.x), ty=Math.floor(knight.y), idx=ty*MW+tx;
  if(pelSet.has(idx)){
    pelSet.delete(idx); G.pelletsLeft--; G.pelletsEaten++;
    addScore(10);
    maybeChalice();
    if(G.pelletsLeft<=0){ G.state='clear'; G.clearT=0; return; }
  }
  // blades
  for(const b of blades){
    if(!b.taken&&b.x===tx&&b.y===ty){
      b.taken=true;
      knight.charges=Math.min(MAX_CHARGES,knight.charges+CHARGES_PER_BLADE);
      G.floaters.push({x:b.x+0.5,y:b.y,txt:'BLADE +3',t:1.2});
    }
  }
  // chalice
  if(G.chalice){
    G.chalice.t-=dt;
    if(G.chalice.t<=0) G.chalice=null;
    else if(G.chalice.x===tx&&G.chalice.y===ty){
      addScore(CHALICE_PTS);
      G.floaters.push({x:knight.x,y:knight.y-0.5,txt:'+'+CHALICE_PTS,t:1.2});
      G.chalice=null;
    }
  }
}
function maybeChalice(){
  const frac=G.pelletsEaten/totalPellets;
  if(!G.chaliceA&&frac>=CHALICE_FRAC_A){ G.chaliceA=true; dropChalice(); }
  else if(!G.chaliceB&&frac>=CHALICE_FRAC_B){ G.chaliceB=true; dropChalice(); }
}
function dropChalice(){
  const c=randomOf(floorTiles);
  G.chalice={x:c.x,y:c.y,t:CHALICE_T};
}
function updateEnemies(dt, aiOnly){
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.state==='gone'){ // P2 banished
      e.banishT-=dt;
      if(e.banishT<=0){
        const c=crypts[0];
        e.x=c.x+0.5; e.y=c.y+0.5; e.dir={x:1,y:0};
        e.state='emerge'; e.emergeT=0.7; p2.want={x:0,y:0};
      }
      continue;
    }
    if(e.state==='emerge'){ e.emergeT-=dt; if(e.emergeT<=0) e.state='active'; continue; }
    if(e.state==='dying'){ e.dieT-=dt; if(e.dieT<=0) G.enemies.splice(i,1); continue; }
    if(e.kind==='sentry'){
      // perception runs every frame: even a still sentry sees you coming
      const kx=Math.floor(knight.x), ky=Math.floor(knight.y);
      const ex=Math.floor(e.x), ey=Math.floor(e.y);
      const armed=knight.charges>0&&!knight.dead;
      if(!knight.dead&&Math.abs(kx-ex)+Math.abs(ky-ey)<=7&&losClear(ex,ey,kx,ky)){
        e.mode=armed?'flee':'chase'; e.loseT=0;
      }else if(e.mode!=='patrol'){ e.loseT+=dt; if(e.loseT>2.5) e.mode='patrol'; }
      e.speed=enemySpeed('sentry',e.mode);
      e.anchorT-=dt;
      if(e.anchorT<=0){ e.anchorT=4+Math.random()*2; e.anchor=randomOf(cryptNear[e.crypt]); }
    }else if(e.kind==='reaver'&&!e.player){
      e.speed=enemySpeed('reaver',(knight.charges>0&&!knight.dead)?'flee':'hunt');
    }
    moveEnt(e,dt,enemyAtCenter);
  }
  // collisions
  if(!knight.dead){
    for(const e of G.enemies){
      if(e.state!=='active') continue;
      const d=Math.hypot(e.x-knight.x,e.y-knight.y);
      if(d<0.55){ hurtKnight(); break; }
    }
  }
}
function updateQuest(dt){
  if(G.introT>0){ G.introT-=dt; return; }
  updateKnight(dt);
  if(G.state!=='quest') return;
  updateEnemies(dt);
  // spawn scheduler
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=spawnInterval();
    const alive=G.enemies.filter(e=>e.state==='emerge'||e.state==='active').length;
    if(alive<maxAlive()) spawnEnemy(randomOf(['sentry','reaver','wisp']),(Math.random()*CRYPT_COUNT)|0);
  }
}
function updateVersus(dt){
  if(G.introT>0){ G.introT-=dt; return; }
  updateKnight(dt);
  if(G.state!=='versus') return;
  updateEnemies(dt);
  // AI scheduler: keep 2 AI foes
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=5;
    const ai=G.enemies.filter(e=>!e.player&&(e.state==='emerge'||e.state==='active')).length;
    if(ai<2) spawnEnemy(randomOf(['sentry','wisp']),(Math.random()*CRYPT_COUNT)|0);
  }
  G.roundT-=dt;
  if(G.roundT<=0) endRound(true);
}

/* ---------- render ---------- */
function mox(){ return (W-MW*TS)/2; }
const moy=()=>MOY;
function R(x,y,w,h,c){ bctx.fillStyle=c; bctx.fillRect(x,y,w,h); }
function circle(x,y,r,c){ bctx.fillStyle=c; bctx.beginPath(); bctx.arc(x,y,r,0,7); bctx.fill(); }
function clear(){ bctx.fillStyle='#04040a'; bctx.fillRect(0,0,buf.width,buf.height); }
function hash2(x,y){ let h=(x*374761393+y*668265263)|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }
function drawMaze(){
  const ox=mox(), oy=moy();
  bctx.drawImage(mazeCv,ox,oy);
  // crypts: tombs breathing purple (animated, drawn live)
  for(const c of crypts){
    const px=ox+c.x*TS, py=oy+c.y*TS;
    const gl=0.5+0.5*Math.sin(perfNow()*2+c.x*1.7+c.y);
    bctx.globalAlpha=0.10+0.09*gl;
    circle(px+TS/2,py+TS/2,TS+4,'#7a3fd1');
    bctx.globalAlpha=1;
    R(px+5,py+8,TS-10,TS-8,'#2e2e42');
    R(px+5,py+8,TS-10,3,'#54546e');
    R(px+8,py+4,TS-16,6,'#2e2e42');
    R(px+8,py+4,TS-16,2,'#54546e');
    R(px+10,py+12,TS-20,5,'#07070e');
    R(px+5,py+TS-2,TS-10,2,'#1a1a28');
  }
}
function drawPellets(){
  const ox=mox(), oy=moy();
  bctx.fillStyle='#c9a86a';
  for(const idx of pelSet){
    const x=idx%MW, y=(idx/MW)|0;
    bctx.fillRect(ox+x*TS+TS/2-1.5, oy+y*TS+TS/2-1.5, 3, 3);
  }
}
function drawBlades(){
  const ox=mox(), oy=moy();
  for(const b of blades){
    if(b.taken) continue;
    const cx=ox+b.x*TS+TS/2, cy=oy+b.y*TS+TS/2;
    circle(cx,cy,8,'#23233a');
    circle(cx,cy,8,'#00000000');
    bctx.strokeStyle='#4a4a6a'; bctx.lineWidth=2;
    bctx.beginPath(); bctx.arc(cx,cy,8,0,7); bctx.stroke();
    const pulse=0.85+0.15*Math.sin(perfNow()*4+b.x);
    bctx.globalAlpha=pulse;
    spr(SWORD,cx-3.5,cy-7,'#dfe8ff');
    bctx.globalAlpha=1;
  }
}
function drawChalice(){
  if(!G.chalice) return;
  const ox=mox(), oy=moy();
  const blink=Math.sin(perfNow()*8)>0?1:0.6;
  bctx.globalAlpha=blink;
  spr(CHALICE, ox+G.chalice.x*TS+TS/2-5.5, oy+G.chalice.y*TS+TS/2-6.5);
  bctx.globalAlpha=1;
}
function drawWraith(e){
  const ox=mox(), oy=moy();
  const cx=ox+e.x*TS, cy=oy+e.y*TS;
  if(e.state==='emerge'){
    if(Math.floor(perfNow()*12)%2===0) return; // shimmer
    spr(WRAITH,cx-5.5,cy-9,e.color);
    return;
  }
  if(e.state==='dying'){
    bctx.save(); bctx.translate(cx,cy); bctx.scale(1,e.dieT>0.3?1:-1);
    spr(WRAITH,-5.5,-9,'#ffffff');
    bctx.restore(); return;
  }
  if(e.state==='gone') return;
  spr(WRAITH,cx-5.5,cy-9,e.color);
  const f=dirToFace(e.dir)||'down';
  const ey=EYES[f];
  bctx.drawImage(ey,cx-3.5,cy-6,7,3);
  // sentry on alert: red rim
  if(e.kind==='sentry'&&(e.mode==='chase'||e.mode==='flee')){
    bctx.strokeStyle=e.mode==='chase'?'#ff4d5e':'#ffd24d'; bctx.lineWidth=1.5;
    bctx.beginPath(); bctx.arc(cx,cy-4,9,0,7); bctx.stroke();
  }
}
function drawKnight(){
  const ox=mox(), oy=moy();
  const cx=ox+knight.x*TS, cy=oy+knight.y*TS;
  if(knight.dead){
    const f=Math.min(1,(1.3-knight.deadT)/0.5);
    bctx.globalAlpha=1-f*0.7;
    spr(KNIGHT_SPR[knight.face],cx-5.5,cy-8);
    bctx.globalAlpha=1;
    return;
  }
  spr(KNIGHT_SPR[knight.face],cx-5.5,cy-8);
  // armed glint
  if(knight.charges>0){
    bctx.strokeStyle='#ffd24d'; bctx.lineWidth=1.5;
    bctx.beginPath(); bctx.arc(cx,cy-3,10+2*Math.sin(perfNow()*6),0,7); bctx.stroke();
  }
  if(knight.slashT>0){
    const s=SLASH_SPR[knight.slashFace];
    bctx.drawImage(s,cx-7.5,cy-7.5-3,15,15);
  }else if(knight.dryT>0){
    bctx.globalAlpha=0.4;
    const s=SLASH_SPR[knight.face];
    bctx.drawImage(s,cx-7.5,cy-7.5-3,15,15);
    bctx.globalAlpha=1;
  }
}
function drawFloaters(){
  const ox=mox(), oy=moy();
  for(const f of G.floaters){
    const a=Math.min(1,f.t*2);
    bctx.globalAlpha=a;
    text(f.txt, ox+f.x*TS, oy+f.y*TS-14, 11, '#ffd24d', null, 'center');
    bctx.globalAlpha=1;
  }
}
/* HUD */
function drawHUD(){
  text('SCORE '+String(G.score).padStart(6,'0'), 14, 12, 13, '#e8ecff', '#2b2bd8');
  text('BEST '+String(G.best).padStart(6,'0'), 14, 30, 13, '#8a93a6', null);
  const lv='LEVEL '+G.level;
  text(lv, W-14-pixW(lv,13), 12, 13, '#8a93a6', null);
  if(G.state==='versus'){
    const t=Math.ceil(G.roundT);
    const ts='0:'+String(t).padStart(2,'0');
    text(ts, W/2-pixW(ts,20)/2, 10, 20, t<=10?'#ff4d5e':'#e8ecff', t<=10?'#5e1010':null);
    const pips='P1 '+'●'.repeat(G.p1Wins)+'○'.repeat(2-G.p1Wins)+'   P2 '+'●'.repeat(G.p2Wins)+'○'.repeat(2-G.p2Wins);
    text(pips, W/2-pixW(pips,12)/2, 34, 12, '#8a93a6', null);
  }
  // bottom bar: lives, blades, cooldown
  const by=H-34;
  text('LIVES', 14, by, 12, '#8a93a6', null);
  for(let i=0;i<G.lives;i++) spr(KNIGHT_SPR.down, 70+i*20, by-6);
  text('BLADE', 14, by+16, 12, '#8a93a6', null);
  for(let i=0;i<knight.charges;i++) spr(SWORD, 70+i*12, by+10, i<3?'#dfe8ff':'#ffd24d');
  if(knight.charges===0) text('FIND A BLADE', 80, by+16, 12, '#4a4a6a', null);
  // cooldown meter
  const mw2=90, mx=W-58-10-mw2;
  text('SWORD', mx, by, 12, '#8a93a6', null);
  R(mx,by+16,mw2,6,'#1a1a2e');
  const f=knight.slashCD>0?1-knight.slashCD/SLASH_CD:1;
  R(mx,by+16,mw2*f,6, knight.charges>0?'#ffd24d':'#4a4a6a');
  // pause button
  R(W-58,H-58,44,44,'#141428');
  bctx.strokeStyle='#4a4a8a'; bctx.lineWidth=2; bctx.strokeRect(W-58,H-58,44,44);
  text('❚❚', W-36-pixW('❚❚',16)/2, H-44, 16, '#8a93a6', null);
}
/* menus */
let menuBtns=[];
function drawMenu(){
  clear();
  const cx=W/2, land=W>H;
  const tSize=land?40:64, tY=land?44:90;
  text('HAUNT', cx-pixW('HAUNT',tSize)/2, tY, tSize, '#ffd24d', null);
  const sub="1980 · THE KNIGHT'S VIGIL";
  const sSize=land?13:15, sY=land?96:168;
  text(sub, cx-pixW(sub,sSize)/2, sY, sSize, '#8a93a6', null);
  if(!land){
    // vignette: knight vs wraiths
    const ox=mox(), oy=250;
    spr(KNIGHT_SPR.right, ox+120, oy, null);
    spr(SWORD, ox+138, oy-4, '#dfe8ff');
    spr(WRAITH, ox+220, oy, '#ff4d5e');
    spr(WRAITH, ox+260, oy+6, '#4dc9ff');
  }
  const by0=land?150:360, pitch=land?76:76;
  menuBtns=[
    {id:'quest', label:'QUEST', sub:'a new maze every run', y:by0, fn:startQuest},
    {id:'versus', label:'VERSUS', sub:'P1 knight vs P2 reaver', y:by0+pitch, fn:startVersus},
    {id:'howto', label:'HOW TO PLAY', sub:'blades, crypts & combos', y:by0+2*pitch, fn:()=>{G.state='howto';}},
  ];
  for(const b of menuBtns){
    const bw=300, bx=cx-bw/2, by=b.y;
    const hov=false;
    R(bx,by,bw,64,hov?'#1e1e3a':'#141428');
    bctx.strokeStyle='#4a4ad8'; bctx.lineWidth=2; bctx.strokeRect(bx,by,bw,64);
    text(b.label, cx-pixW(b.label,28)/2, by+14, 28, '#e8ecff', '#2b2bd8');
    text(b.sub, cx-pixW(b.sub,12)/2, by+44, 12, '#8a93a6', null);
    b.rect={x:bx,y:by,w:bw,h:64};
  }
  const bs='BEST '+String(G.best).padStart(6,'0');
  text(bs, cx-pixW(bs,13)/2, land?398:610, 13, '#8a93a6', null);
  const ft='A 1980 STORY · ORIGINAL MAZE · ORIGINAL FOES';
  text(ft, cx-pixW(ft,11)/2, H-30, 11, '#4a4a6a', null);
}
function menuButtonAt(x,y){
  for(const b of menuBtns){ const r=b.rect; if(r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return b; }
  return null;
}
function drawHowto(){
  clear();
  const cx=W/2, land=W>H;
  const tY=land?36:70;
  text('HOW TO PLAY', cx-pixW('HOW TO PLAY',28)/2, tY, 28, '#ffd24d', null);
  const lines=[
    'YOU ARE THE KNIGHT.',
    'CLEAR EVERY PELLET.',
    'EVERY MAZE IS NEW.',
    'DRAG OR ARROWS TO STEER.',
    '',
    'SWORD: SPACE OR TAP.',
    'TAP TOWARD A FOE TO AIM.',
    'FIND A BLADE: 3 CHARGES.',
    'EACH SLASH SPENDS ONE.',
    '',
    'SENTRIES PATROL THE CRYPTS.',
    'REAVERS HUNT YOU - BUT FLEE',
    'AN ARMED KNIGHT. WISPS DRIFT.',
    'THE SLAIN RISE AGAIN.',
    '',
    'CHAIN KILLS FOR COMBO:',
    '200 · 400 · 800 · 1600',
  ];
  let y=land?86:130;
  const pitch=land?21:26;
  for(const ln of lines){
    if(ln) text(ln, cx-pixW(ln,14)/2, y, 14, '#c9cfe8', null);
    y+=pitch;
  }
  const bkY=land?436:600;
  R(cx-70,bkY,140,48,'#141428');
  bctx.strokeStyle='#4a4ad8'; bctx.lineWidth=2; bctx.strokeRect(cx-70,bkY,140,48);
  text('BACK', cx-pixW('BACK',18)/2, bkY+14, 18, '#e8ecff', '#2b2bd8');
}
function drawCenter(msg,sub,msc,ssc){
  const cx=W/2, cy=H/2;
  bctx.fillStyle='rgba(4,4,10,0.72)'; bctx.fillRect(0,0,W,H);
  text(msg, cx-pixW(msg,34)/2, cy-40, 34, msc||'#ffd24d', null);
  if(sub) text(sub, cx-pixW(sub,15)/2, cy+8, 15, ssc||'#c9cfe8', null);
}
function render(){
  bctx.setTransform(PX,0,0,PX,0,0);
  bctx.imageSmoothingEnabled=false;
  if(G.state==='menu'){ drawMenu(); }
  else if(G.state==='howto'){ drawHowto(); }
  else{
    clear();
    drawMaze(); drawPellets(); drawBlades(); drawChalice();
    for(const e of G.enemies) drawWraith(e);
    drawKnight(); drawFloaters(); drawHUD();
    if(G.state==='paused') drawCenter('PAUSED','P OR TAP ❚❚ TO RESUME');
    else if(G.introT>0&&(G.state==='quest'||G.state==='versus'))
      drawCenter(G.state==='versus'?('ROUND '+G.round):('LEVEL '+G.level),
        G.state==='versus'?'P1: WASD · P2: ARROWS · 90S':'FIND A BLADE. STAY SHARP.');
    else if(G.state==='over') drawCenter('SLAIN','TAP TO RETURN');
    else if(G.state==='clear') drawCenter('MAZE CLEARED','THE VIGIL CONTINUES...');
    else if(G.state==='roundend')
      drawCenter(G.roundWinner===1?'KNIGHT PREVAILS':'REAVER FEASTS',
        'P1 '+G.p1Wins+' - '+G.p2Wins+' P2');
  }
  // composite to visible canvas
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(buf,0,0,buf.width,buf.height,0,0,cv.width,cv.height);
}
/* ---------- main loop ---------- */
function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
  if(G.state!=='paused') update(dt);
  render();
  requestAnimationFrame(frame);
}
/* ---------- debug hooks (for automated proof) ---------- */
const GAME={
  get state(){return G.state;}, get score(){return G.score;}, get lives(){return G.lives;},
  get level(){return G.level;}, get pelletsLeft(){return G.pelletsLeft;},
  get pelletsEaten(){return G.pelletsEaten;}, get round(){return G.round;},
  get p1Wins(){return G.p1Wins;}, get p2Wins(){return G.p2Wins;},
  get roundT(){return G.roundT;}, get knight(){return knight;},
  get enemies(){return G.enemies;}, get chalice(){return G.chalice;},
  get crypts(){return crypts;}, get blades(){return blades;},
  startMode:(m)=>{m==='versus'?startVersus():startQuest();},
  toMenu:()=>toMenu(),
  debug:{
    slash:()=>trySlash(),
    slashAt:(x,y)=>trySlash(x,y),
    setWant:(x,y)=>setWant(x,y),
    p2Want:(x,y)=>{p2.want={x:x,y:y};},
    killEnemy:(i)=>{const e=G.enemies[i]; if(e&&e.state==='active') slay(e);},
    eatPellets:(n)=>{let c=0; for(const idx of [...pelSet]){ if(c>=n)break; pelSet.delete(idx); c++; }
      G.pelletsLeft-=c; G.pelletsEaten+=c;},
    hurt:()=>hurtKnight(),
    setRoundT:(t)=>{G.roundT=t;},
    enemy:(i)=>G.enemies[i],
    tp:(x,y)=>{knight.x=x;knight.y=y;},
    freeze:()=>{knight.dir={x:0,y:0};knight.want={x:0,y:0};},
    setDir:(dx,dy)=>{knight.dir={x:dx,y:dy};const f=dirToFace(knight.dir);if(f)knight.face=f;},
    giveBlade:()=>{knight.charges=Math.min(MAX_CHARGES,knight.charges+CHARGES_PER_BLADE);},
    lastPellet:()=>{for(const idx of pelSet) return {x:idx%MW,y:(idx/MW)|0}; return null;},
    maze:()=>MAZE,
    walk:(x,y)=>walk(x,y),
    home:()=>({x:knightStart.x,y:knightStart.y}),
    spawn:(kind)=>{const e=spawnEnemy(kind||'wisp',0); e.state='active'; e.emergeT=0; return G.enemies.length-1;},
    los:(x0,y0,x1,y1)=>losClear(x0,y0,x1,y1),
    pelletAt:(x,y)=>pelSet.has(y*MW+x),
    clearFoes:()=>{G.enemies.length=0;},
  },
};
window.GAME=GAME;
requestAnimationFrame(frame);
</script>
