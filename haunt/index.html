/* ---------- audio ---------- */
let AC=null, muted=false;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,dur,type,vol,slideTo){
  if(muted) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.1,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur+0.02);
}
function nz(dur,vol,hi){
  if(muted) return; const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type='highpass'; f.frequency.value=hi||800;
  s.buffer=buf; g.gain.value=vol||0.15;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

function drawPixText(str, dx, y0, u) {
  let cx = dx;
  for (const ch of str) {
    const gl = ch === ' ' ? null : (FONT5X7[ch] || FONT5X7['?']);
    if (gl) for (let r = 0; r < gl.length; r++) {
      const row = gl[r];
      for (let c = 0; c < 5; c++)
        if (row[c] === '1') ctx.fillRect(cx + c * u, y0 + r * u, u, u);
    }
    cx += ch === ' ' ? 4 * u : 6 * u;
  }
}
// u = unite de police en px logiques, multiple de PX pour tomber sur la grille.
function text(str, x, y, font, color, glow, align) {
  str = String(str).toUpperCase();
  const m = /(\d+)px/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of str) w += ch === ' ' ? 4 * u : 6 * u;
  let dx = align === 'right' ? x - w : align === 'left' ? x : x - w / 2;
  dx = Math.round(dx / PX) * PX;
  const y0 = Math.round((y - 3.5 * u) / PX) * PX;
  if (glow) {  // halo pixel : 8 voisins, alpha d'autant plus douce que le texte est petit
    ctx.fillStyle = glow;
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * Math.min(1, Math.max(0.32, u / 18));
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      if (!ox && !oy) continue;
      drawPixText(str, dx + ox * u, y0 + oy * u, u);
    }
    ctx.globalAlpha = ga;
  }
  ctx.fillStyle = color;
  drawPixText(str, dx, y0, u);
}
function pixW(str, font) {
  const m = /(\d+)px/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of String(str).toUpperCase()) w += ch === ' ' ? 4 * u : 6 * u;
  return w;
}

/* ---------- sprites (pre-baked pixel art) ---------- */
function mkCanvas(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
  return [c,g];
}
function R(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x,y,w,h); }

const PAL = {
  steelL:'#dfe6f2', steelD:'#8b93a8', plume:'#e24545', face:'#f2c89b',
  tunic:'#3f6fd8', tunicD:'#2b4d9e', boots:'#7a5230', gold:'#c9a227',
  blade:'#eef2fa',
};
function bakeKnight(dir){ // 'R','L','U','D' — 16x16
  const [c,g]=mkCanvas(16,16);
  const P=PAL;
  if(dir==='R'||dir==='L'){
    const f = dir==='R' ? 1 : -1;
    const X = (x)=> f===1 ? x : 15-x;
    // legs / boots
    R(g,X(6),12,2,3,P.boots); R(g,X(9),12,2,3,P.boots);
    R(g,X(5),14,3,2,P.boots); R(g,X(9),14,3,2,P.boots);
    // tunic
    R(g,X(5),8,7,4,P.tunic); R(g,X(5),8,7,1,P.tunicD);
    R(g,X(4),9,1,3,P.tunicD); R(g,X(12),9,1,3,P.tunicD); // arms
    // belt
    R(g,X(5),11,7,1,P.gold);
    // head
    R(g,X(6),4,5,4,P.face);
    // helmet
    R(g,X(5),1,7,3,P.steelL); R(g,X(4),3,9,2,P.steelD);
    R(g,X(5),1,7,1,P.steelL);
    // nose guard
    R(g,X(8),4,1,3,P.steelD);
    // plume sweeping back
    R(g,X(1),2,4,1,P.plume); R(g,X(2),3,4,1,P.plume); R(g,X(6),1,2,1,P.plume);
    // tiny sword held low (front side)
    const sx = X(12);
    R(g,sx,8,1,4,P.blade); R(g,sx-1,12,3,1,P.gold); R(g,sx,13,1,2,P.boots);
  } else {
    // front (D) / back (U)
    R(g,6,12,2,3,P.boots); R(g,9,12,2,3,P.boots);
    R(g,5,14,3,2,P.boots); R(g,9,14,3,2,P.boots);
    R(g,5,8,7,4,P.tunic); R(g,5,8,7,1,P.tunicD);
    R(g,4,9,1,3,P.tunicD); R(g,12,9,1,3,P.tunicD);
    R(g,5,11,7,1,P.gold);
    R(g,6,4,5,4,P.face);
    R(g,5,1,7,3,P.steelL); R(g,4,3,9,2,P.steelD);
    if(dir==='D'){ R(g,7,4,3,1,P.steelD); R(g,8,5,1,2,P.steelD); } // face slit shadow
    else { R(g,5,4,7,2,P.steelD); } // back of helm
    R(g,7,0,3,2,P.plume); // plume crest
    R(g,13,8,1,4,P.blade); R(g,12,12,3,1,P.gold); R(g,13,13,1,2,P.boots);
  }
  return c;
}

const GHOST_COLS = { RUST:'#ff3b30', VEX:'#ff8ac2', MURMUR:'#4dd2ff', WISP:'#ffb340' };
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(Math.round(((n>>16)&255)*f),0,255), g=clamp(Math.round(((n>>8)&255)*f),0,255), b=clamp(Math.round((n&255)*f),0,255);
  return `rgb(${r},${g},${b})`;
}
function bakeGhost(color){ // 14x16
  const [c,g]=mkCanvas(14,16);
  const widths=[8,12,14,14,14,14,14,14,14,14,14,14,14,14,12,10];
  for(let y=0;y<16;y++){
    const w=widths[y], x0=Math.floor((14-w)/2);
    R(g,x0,y,w,1, y>=13?shade(color,0.75):color);
  }
  // skirt zigzag: cut notches
  g.clearRect(2,15,2,1); g.clearRect(6,15,2,1); g.clearRect(10,15,2,1);
  g.clearRect(3,14,2,1); g.clearRect(9,14,2,1);
  return c;
}
const GHOST_SPR = {};
for(const k in GHOST_COLS) GHOST_SPR[k]=bakeGhost(GHOST_COLS[k]);

function bakeSwoosh(dir){ // 30x30 slash arc, knight at center
  const [c,g]=mkCanvas(30,30);
  const cx=15, cy=15;
  const base = dir==='R'?0 : dir==='D'?Math.PI/2 : dir==='L'?Math.PI : -Math.PI/2;
  for(let y=0;y<30;y++) for(let x=0;x<30;x++){
    const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);
    if(d<9||d>15) continue;
    let a=Math.atan2(dy,dx)-base;
    while(a>Math.PI)a-=TAU; while(a<-Math.PI)a+=TAU;
    if(Math.abs(a)>1.0) continue; // ~57 deg
    const edge = d>13.5||d<10.5||Math.abs(Math.abs(a)-1.0)<0.12;
    R(g,x,y,1,1, edge ? '#9fd8ff' : '#ffffff');
  }
  return c;
}
const SWOOSH_SPR = { R:bakeSwoosh('R'), L:bakeSwoosh('L'), U:bakeSwoosh('U'), D:bakeSwoosh('D') };

/* ---------- maze pre-bake ---------- */
const mazeCv = (function(){
  const [c,g]=mkCanvas(pbuf.width,pbuf.height);
  g.setTransform(1/PX,0,0,1/PX,0,0);
  const walkable=(x,y)=> x>=0&&y>=0&&x<MW&&y<MH && MAZE_SRC[y][x]!=='#';
  // base
  g.fillStyle='#07070f'; g.fillRect(0,0,W,H);
  g.fillStyle='#10102a'; g.fillRect(MOX,MOY,MW*TS,MH*TS);
  // pen floor tint
  g.fillStyle='#0d0d20';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)
    if(MAZE_SRC[y][x]==='G') g.fillRect(MOX+x*TS,MOY+y*TS,TS,TS);
  // neon edges: wall cells facing walkable get a bright inner line
  g.fillStyle='#4d4dff';
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(MAZE_SRC[y][x]==='#') continue;
    // handled below per wall cell instead
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(MAZE_SRC[y][x]!=='#') continue;
    const px=MOX+x*TS, py=MOY+y*TS;
    if(walkable(x,y-1)||MAZE_SRC[y-1]&&MAZE_SRC[y-1][x]==='D') g.fillRect(px+2,py,TS-4,3);
    if(walkable(x,y+1)) g.fillRect(px+2,py+TS-3,TS-4,3);
    if(walkable(x-1,y)) g.fillRect(px,py+2,3,TS-4);
    if(walkable(x+1,y)) g.fillRect(px+TS-3,py+2,3,TS-4);
  }
  // door: gold bar
  g.fillStyle='#c9a227';
  g.fillRect(MOX+DOOR.x*TS+2, MOY+DOOR.y*TS+TS/2-2, TS-4, 4);
  return c;
})();

  knight.x=KNIGHT_START.x+0.5; knight.y=KNIGHT_START.y+0.5;
  knight.dir={x:0,y:0}; knight.want={x:0,y:0};
  knight.slashT=0; knight.slashCD=0; knight.dead=false; knight.deadT=0; knight.face='D';
  knight.speed=knightSpeed();
  ghosts=GHOST_DEF.map(d=>({
    name:d.name, x:d.sx, y:d.sy, dir:{x:-1,y:0},
    state:'pen', relT:d.rel, corner:d.corner,
    speed:ghostSpeed(), dieT:0, respT:0, wispT:0,
    wispTgt:{x:10,y:10}, bob:Math.random()*TAU,
  }));
  G.waveT=0; G.waveIdx=0; G.combo=0; G.comboT=0; G.chalice=null;
  floaters=[]; parts=[];
}
function waveMode(){ return WAVES[Math.min(G.waveIdx,WAVES.length-1)][0]; }
function waveDur(i){
  const base=WAVES[Math.min(i,WAVES.length-1)][1];
  if(WAVES[Math.min(i,WAVES.length-1)][0]==='scatter')
    return base*Math.max(0.35, 1-0.14*(G.level-1));
  return base;
}
function ghostTarget(g){
  if(waveMode()==='scatter') return g.corner;
  const k=knight, kt={x:Math.floor(k.x), y:Math.floor(k.y)};
  switch(g.name){
    case 'RUST': return kt;
    case 'VEX': return {x:kt.x+4*k.dir.x, y:kt.y+4*k.dir.y};
    case 'MURMUR': { // patrols corners in rotation
      const cs=[{x:1,y:1},{x:19,y:1},{x:19,y:19},{x:1,y:19}];
      return cs[Math.floor(G.time/5)%4];
    }
    default: return g.wispTgt; // WISP: random
  }
}
function dirToFace(d){
  if(d.x===1) return 'R'; if(d.x===-1) return 'L';
  if(d.y===1) return 'D'; if(d.y===-1) return 'U';
  return null;
}
/* smooth tile movement; atCenter fires when a tile center is reached */
function moveEnt(e, dt, passable, atCenter){
  if(e.dir.x===0&&e.dir.y===0) return;
  const step=e.speed*dt;
  const tx=Math.floor(e.x), ty=Math.floor(e.y);
  const cx=tx+0.5, cy=ty+0.5;
  const toC=(cx-e.x)*e.dir.x+(cy-e.y)*e.dir.y;
  if(toC>1e-6 && step>=toC){
    e.x=cx; e.y=cy;
    if(atCenter) atCenter(e);
    const left=step-toC;
    if(e.dir.x===0&&e.dir.y===0) return;
    const nx=Math.floor(e.x)+e.dir.x, ny=Math.floor(e.y)+e.dir.y;
    if(!passable(nx,ny)){ e.dir={x:0,y:0}; return; }
    e.x+=e.dir.x*left; e.y+=e.dir.y*left;
  } else if(toC<=0){
    const nx=tx+e.dir.x, ny=ty+e.dir.y;
    if(!passable(nx,ny)){ e.x=cx; e.y=cy; e.dir={x:0,y:0}; if(atCenter) atCenter(e); return; }
    e.x+=e.dir.x*step; e.y+=e.dir.y*step;
  } else {
    e.x+=e.dir.x*step; e.y+=e.dir.y*step;
  }
}
function knightAtCenter(e){
  const t={x:Math.floor(e.x), y:Math.floor(e.y)};
  if((e.want.x||e.want.y) && tileWalk(t.x+e.want.x, t.y+e.want.y)) e.dir={x:e.want.x,y:e.want.y};
  if(((e.dir.x||e.dir.y) && !tileWalk(t.x+e.dir.x, t.y+e.dir.y))) e.dir={x:0,y:0};
  const f=dirToFace(e.dir); if(f) e.face=f;
}
function ghostAtCenter(g){
  const t={x:Math.floor(g.x), y:Math.floor(g.y)};
  const opts=[];
  for(const d of DIRS){
    if(d.x===-g.dir.x&&d.y===-g.dir.y) continue;
    if(ghostWalk(t.x+d.x,t.y+d.y)) opts.push(d);
  }
  if(!opts.length){ g.dir={x:-g.dir.x,y:-g.dir.y}; return; }
  const tgt=ghostTarget(g);
  let best=opts[0], bd=Infinity;
  for(const d of opts){
    const dd=(t.x+d.x-tgt.x)*(t.x+d.x-tgt.x)+(t.y+d.y-tgt.y)*(t.y+d.y-tgt.y);
    if(dd<bd){bd=dd;best=d;}
  }
  g.dir={x:best.x,y:best.y};
}
function setWant(e,dx,dy){
  e.want={x:dx,y:dy};
  if(!dx&&!dy) return;
  if(dx===-e.dir.x&&dy===-e.dir.y) e.dir={x:dx,y:dy}; // instant reverse
  else if(e.dir.x===0&&e.dir.y===0){ // standing still: step off immediately
    const t={x:Math.floor(e.x),y:Math.floor(e.y)};
    if(tileWalk(t.x+dx,t.y+dy)) e.dir={x:dx,y:dy};
  }
}
function trySlash(){
  if(G.state!=='quest'&&G.state!=='versus') return false;
  if(knight.slashCD>0||knight.dead) return false;
  knight.slashT=SLASH_ACTIVE; knight.slashCD=SLASH_CD;
  const f=dirToFace(knight.dir); if(f) knight.face=f;
  knight.hitSet=new Set();
  SFX.slash();
  return true;
}
function slashHits(){
  if(knight.slashT<=0) return;
  const fx = knight.face==='R'?1:knight.face==='L'?-1:0;
  const fy = knight.face==='D'?1:knight.face==='U'?-1:0;
  const fa=Math.atan2(fy,fx);
  for(const g of ghosts){
    if(g.state!=='active'||knight.hitSet.has(g.name)) continue;
    const dx=g.x-knight.x, dy=g.y-knight.y;
    if(Math.hypot(dx,dy)>SLASH_RANGE) continue;
    let da=Math.atan2(dy,dx)-fa;
    while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
    if(Math.abs(da)>SLASH_ARC) continue;
    knight.hitSet.add(g.name);
    killGhost(g);
  }
}
function killGhost(g){
  g.state='dying'; g.dieT=0.45;
  G.combo=(G.comboT>0)?Math.min(G.combo+1,3):0;
  G.comboT=3;
  const pts=200*Math.pow(2,G.combo);
  G.score+=pts;
  addFloater('+'+pts, g.x, g.y, '#ffd21c');
  for(let i=0;i<10;i++) parts.push({x:g.x,y:g.y,
    vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6,
    t:0.4+Math.random()*0.2, color:GHOST_COLS[g.name]});
  SFX.kill();
}
function addFloater(str,x,y,color){ floaters.push({str,x,y,t:1.1,color}); }
function hurtKnight(){
  if(knight.dead) return;
  knight.dead=true; knight.deadT=1.3; G.shake=0.4;
  for(let i=0;i<14;i++) parts.push({x:knight.x,y:knight.y,
    vx:(Math.random()-0.5)*7, vy:(Math.random()-0.5)*7,
    t:0.5+Math.random()*0.3, color:'#dfe6f2'});
  SFX.hurt();
}
function startQuest(){
  G.mode='quest'; G.state='quest';
  G.score=0; G.lives=3; G.level=1; G.time=0; G.p1Wins=0; G.p2Wins=0; G.round=1;
  buildPellets(); resetPositions();
  SFX.round();
}
function startVersus(){
  G.mode='versus'; G.state='versus';
  G.score=0; G.lives=1; G.level=1; G.time=0;
  G.p1Wins=0; G.p2Wins=0; G.round=1; G.roundT=90;
  buildPellets(); resetPositions();
  SFX.round();
}
function nextLevel(){
  G.level++;
  buildPellets(); resetPositions();
  G.state='quest'; SFX.round();
}
function endRound(p1won){
  if(p1won) G.p1Wins++; else G.p2Wins++;
  G.lastP1=p1won;
  G.state='roundend'; G.stateT=2.6;
  SFX.round();
}

/* ---------- update ---------- */
const p2={want:{x:0,y:0}};
function p2AtCenter(g){
  const t={x:Math.floor(g.x), y:Math.floor(g.y)};
  if((p2.want.x||p2.want.y) && ghostWalk(t.x+p2.want.x,t.y+p2.want.y)) g.dir={x:p2.want.x,y:p2.want.y};
  if(((g.dir.x||g.dir.y) && !ghostWalk(t.x+g.dir.x,t.y+g.dir.y))) g.dir={x:0,y:0};
}
function updatePlay(dt, versus){
  G.time+=dt;
  // wave clock
  G.waveT+=dt;
  if(G.waveT>=waveDur(G.waveIdx)){
    G.waveIdx++; G.waveT=0;
    for(const g of ghosts) if(g.state==='active'&&!(versus&&g.name==='RUST')) g.dir={x:-g.dir.x,y:-g.dir.y};
  }
  G.comboT=Math.max(0,G.comboT-dt); if(G.comboT===0) G.combo=0;
  knight.slashCD=Math.max(0,knight.slashCD-dt);
  knight.slashT=Math.max(0,knight.slashT-dt);
  slashHits();
  // knight
  if(!knight.dead){
    if(knight.slashT<=0) moveEnt(knight,dt,tileWalk,knightAtCenter);
    const tx=Math.floor(knight.x), ty=Math.floor(knight.y);
    if(pellets[ty]&&pellets[ty][tx]){
      pellets[ty][tx]=false; G.pelletsLeft--; G.pelletsEaten++;
      G.score+=10; SFX.munch();
      if((G.pelletsEaten===70||G.pelletsEaten===170)&&!G.chalice){
        G.chalice={x:10.5,y:15.5}; G.chaliceT=9; // below the pen
      }
      if(G.pelletsLeft<=0){
        if(versus){ endRound(true); return; }
        G.state='clear'; G.stateT=2.4; SFX.clear(); return;
      }
    }
    if(G.chalice){
      G.chaliceT-=dt;
      if(Math.floor(knight.x)===Math.floor(G.chalice.x)&&Math.floor(knight.y)===Math.floor(G.chalice.y)){
        G.score+=500; addFloater('+500',G.chalice.x,G.chalice.y,'#f4d35e'); SFX.chalice(); G.chalice=null;
      } else if(G.chaliceT<=0) G.chalice=null;
    }
  } else {
    knight.deadT-=dt;
    if(knight.deadT<=0){
      if(versus){ endRound(false); return; }
      G.lives--;
      if(G.lives<=0){ G.state='over'; G.stateT=0; SFX.over();
        if(G.score>G.best){G.best=G.score;localStorage.setItem('haunt_best',G.best);} return; }
      resetPositions();
    }
  }
  // ghosts
  for(const g of ghosts){
    if(g.name==='WISP'&&g.state==='active'){
      g.wispT-=dt;
      if(g.wispT<=0){ g.wispT=2; g.wispTgt={x:1+Math.floor(Math.random()*19),y:1+Math.floor(Math.random()*19)}; }
    }
    if(g.state==='pen'){
      g.relT-=dt;
      if(g.relT<=0) g.state='exit';
    } else if(g.state==='exit'){
      const sp=3.5*dt;
      if(Math.abs(g.x-10.5)>0.06) g.x+=Math.sign(10.5-g.x)*Math.min(sp,Math.abs(10.5-g.x));
      else { g.x=10.5; g.y-=sp;
        if(g.y<=7.55){ g.y=7.5; g.state='active'; g.dir={x:-1,y:0}; } }
    } else if(g.state==='active'){
      if(versus&&g.name==='RUST') moveEnt(g,dt,ghostWalk,p2AtCenter);
      else moveEnt(g,dt,ghostWalk,ghostAtCenter);
    } else if(g.state==='dying'){
      g.dieT-=dt;
      if(g.dieT<=0){ g.state='gone'; g.respT=3; }
    } else if(g.state==='gone'){
      g.respT-=dt;
      if(g.respT<=0){ g.x=10.5; g.y=9.5; g.state='exit'; }
    }
  }
  // collisions
  if(!knight.dead){
    for(const g of ghosts){
      if(g.state!=='active') continue;
      const d=Math.hypot(g.x-knight.x,g.y-knight.y);
      if(d<0.55){ hurtKnight(); break; }
    }
  }
  if(versus){
    G.roundT-=dt;
    if(G.roundT<=0){ endRound(true); return; } // knight survived: P1 takes it
  }
}
function update(dt){
  G.shake=Math.max(0,G.shake-dt);
  for(const f of floaters){ f.t-=dt; f.y-=dt*1.2; }
  floaters=floaters.filter(f=>f.t>0);
  for(const p of parts){ p.t-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  parts=parts.filter(p=>p.t>0);
  switch(G.state){
    case 'quest': updatePlay(dt,false); break;
    case 'versus': updatePlay(dt,true); break;
    case 'clear':
      G.stateT-=dt; if(G.stateT<=0) nextLevel(); break;
    case 'roundend':
      G.stateT-=dt;
      if(G.stateT<=0){
        if(G.p1Wins>=2||G.p2Wins>=2){ G.state='vsover'; }
        else { G.round++; G.roundT=90; buildPellets(); resetPositions(); G.state='versus'; SFX.round(); }
      }
      break;
    case 'over': case 'vsover': case 'menu': case 'howto': case 'paused': break;
  }
}

/* ---------- input ---------- */
let buttons=[];
function togglePause(){
  if(G.state==='quest'||G.state==='versus'){ G.mode=G.mode; G.prev=G.state; G.state='paused'; }
  else if(G.state==='paused'){ G.state=G.prev||'quest'; }
}
function advance(){
  if(G.state==='howto'){ G.state='menu'; }
  else if(G.state==='over'||G.state==='vsover'){ G.state='menu'; G.mode=null; }
  else if(G.state==='roundend'){ G.stateT=0; }
}
const KEYMAP={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
for(const k of ['w','a','s','d','W','A','S','D'])
  KEYMAP[k]={w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]}[k];
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  ac();
  if(k==='m'||k==='M'){ muted=!muted; return; }
  if(k==='p'||k==='P'||k==='Escape'){ togglePause(); return; }
  if(k===' '){ if(G.state==='quest'||G.state==='versus') trySlash(); else advance(); return; }
  if(k==='Enter'){ advance(); return; }
  const d=KEYMAP[k]; if(!d||(G.state!=='quest'&&G.state!=='versus')) return;
  const isWASD=/^[wasdWASD]$/.test(k);
  if(G.state==='versus'&&isWASD){
    p2.want={x:d[0],y:d[1]};
    const r=ghosts.find(g=>g.name==='RUST');
    if(r&&r.state==='active'&&d[0]===-r.dir.x&&d[1]===-r.dir.y) r.dir={x:d[0],y:d[1]};
  } else setWant(knight,d[0],d[1]);
});
let tsx=0,tsy=0,tst=0,msx=0,msy=0;
cv.addEventListener('touchstart',e=>{ e.preventDefault(); ac();
  const t=e.changedTouches[0]; tsx=t.clientX; tsy=t.clientY; tst=performance.now();
},{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault();
  const t=e.changedTouches[0], r=cv.getBoundingClientRect();
  const x=(t.clientX-r.left)/r.width*W, y=(t.clientY-r.top)/r.height*H;
  const dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24&&performance.now()-tst<500) handleTap(x,y);
  else if(G.state==='quest'||G.state==='versus'){
    const d=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};
    if(G.state==='versus'&&x>W/2){
      p2.want=d;
      const rg=ghosts.find(g=>g.name==='RUST');
      if(rg&&rg.state==='active'&&d.x===-rg.dir.x&&d.y===-rg.dir.y) rg.dir={x:d.x,y:d.y};
    } else setWant(knight,d.x,d.y);
  }
},{passive:false});
cv.addEventListener('mousedown',e=>{ ac(); msx=e.clientX; msy=e.clientY; });
cv.addEventListener('mouseup',e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(Math.hypot(e.clientX-msx,e.clientY-msy)<8) handleTap(x,y);
});
function handleTap(x,y){
  if((G.state==='quest'||G.state==='versus')&&x>W-64&&y<64){ togglePause(); SFX.click(); return; }
  for(const b of buttons)
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ SFX.click(); b.fn(); return; }
  if(G.state==='quest'||G.state==='versus'){ trySlash(); return; }
  if(G.state==='over'||G.state==='vsover'){ G.state='menu'; G.mode=null; return; }
  if(G.state==='roundend'){ G.stateT=0; return; }
}

/* ---------- render ---------- */
function doButton(x,y,w,h,label,sub,fn){
  ctx.fillStyle='#14142a'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#4d4dff';
  ctx.fillRect(x,y,w,2); ctx.fillRect(x,y+h-2,w,2);
  ctx.fillRect(x,y,2,h); ctx.fillRect(x+w-2,y,2,h);
  text(label,x+w/2,y+h/2-(sub?7:0),'20px','#dfe6f2','#4d4dff','center');
  if(sub) text(sub,x+w/2,y+h/2+17,'12px','#8b93a8',null,'center');
  buttons.push({x,y,w,h,fn});
}
function drawEyes(gx,gy,dir){
  const ex=[2,8], ey=5;
  const ox=dir.x, oy=dir.y;
  for(const x0 of ex){
    ctx.fillStyle='#fff'; ctx.fillRect(gx+x0,gy+ey,4,5);
    ctx.fillStyle='#1a1a4d'; ctx.fillRect(gx+x0+1+ox,gy+ey+1+oy,2,3);
  }
}
function render(){
  buttons=[];
  ctx.save();
  if(G.shake>0) ctx.translate(Math.round((Math.random()-0.5)*8/PX)*PX,Math.round((Math.random()-0.5)*8/PX)*PX);
  ctx.drawImage(mazeCv,0,0,W,H);
  // pellets
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(!pellets[y]||!pellets[y][x]) continue;
    const rx=Math.round((MOX+x*TS+TS/2-2)/PX)*PX, ry=Math.round((MOY+y*TS+TS/2-2)/PX)*PX;
    ctx.drawImage(pelletCv,rx,ry,4,4);
  }
  // chalice
  if(G.chalice&&(G.chaliceT>3||Math.floor(G.time*6)%2===0)){
    const cx=Math.round((MOX+G.chalice.x*TS-6)/PX)*PX, cy=Math.round((MOY+G.chalice.y*TS-7)/PX)*PX;
    ctx.drawImage(chaliceCv,cx,cy,12,14);
  }
  // ghosts
  for(const g of ghosts){
    if(g.state==='gone') continue;
    let gx=MOX+g.x*TS-7, gy=MOY+g.y*TS-8;
    if(g.state==='pen') gy+=Math.sin(G.time*4+g.bob)*2;
    gx=Math.round(gx/PX)*PX; gy=Math.round(gy/PX)*PX;
    if(g.state==='dying'){
      const s=Math.max(0.2,g.dieT/0.45);
      ctx.globalAlpha=s;
      ctx.drawImage(GHOST_SPR[g.name],gx,gy,14,16);
      ctx.globalAlpha=1;
      continue;
    }
    ctx.drawImage(GHOST_SPR[g.name],gx,gy,14,16);
    drawEyes(gx,gy,g.dir);
  }
  // knight
  if(!knight.dead&&(G.state==='quest'||G.state==='versus'||G.state==='paused')){
    const kx=Math.round((MOX+knight.x*TS-8)/PX)*PX, ky=Math.round((MOY+knight.y*TS-8)/PX)*PX;
    ctx.drawImage(KNIGHT_SPR[knight.face],kx,ky,16,16);
    if(knight.slashT>0){
      ctx.globalAlpha=clamp(knight.slashT/SLASH_ACTIVE,0,1);
      const sx=Math.round((MOX+knight.x*TS-15)/PX)*PX, sy=Math.round((MOY+knight.y*TS-15)/PX)*PX;
      ctx.drawImage(SWOOSH_SPR[knight.face],sx,sy,30,30);
      ctx.globalAlpha=1;
    }
  }
  // floaters & particles
  for(const f of floaters)
    text(f.str,MOX+f.x*TS,MOY+f.y*TS-12,'14px',f.color,'#000000','center');
  ctx.fillStyle='#fff';
  for(const p of parts){
    ctx.globalAlpha=clamp(p.t*2,0,1); ctx.fillStyle=p.color;
    ctx.fillRect(Math.round((MOX+p.x*TS-2)/PX)*PX,Math.round((MOY+p.y*TS-2)/PX)*PX,4,4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  drawHUD();
  // overlays — if/else, composite unique en fin de frame
  if(G.state==='menu') drawMenu();
  else if(G.state==='howto') drawHowto();
  else if(G.state==='paused') drawPaused();
  else if(G.state==='clear') drawCenter('MAZE CLEAR!','#3ddc84',null);
  else if(G.state==='over') drawOver();
  else if(G.state==='roundend') drawRoundEnd();
  else if(G.state==='vsover') drawVsOver();
}
function drawHUD(){
  text('SCORE '+String(G.score).padStart(6,'0'),16,26,'14px','#dfe6f2',null,'left');
  text('BEST '+String(Math.max(G.best,G.score)).padStart(6,'0'),W/2,26,'14px','#8b93a8',null,'center');
  if(G.mode==='versus'){
    text('P1 '+G.p1Wins+' · '+G.p2Wins+' P2',W/2,52,'14px','#ffd21c','#4d1a00','center');
    text(Math.ceil(G.roundT)+'S',W-70,52,'14px','#ff8a5c',null,'right');
  } else {
    text('LEVEL '+G.level,W-16,26,'14px','#dfe6f2',null,'right');
    if(G.state==='quest'||G.state==='versus')
      text('SWIPE MOVE · TAP SLASH',W/2,52,'12px','#5a5a7a',null,'center');
  }
  text('❚❚',W-32,30,'18px','#8b93a8',null,'center');
  // lives
  text('LIVES',16,600,'12px','#8b93a8',null,'left');
  for(let i=0;i<Math.max(0,G.lives);i++) ctx.drawImage(KNIGHT_SPR.D,92+i*24,592,16,16);
  // sword meter
  const r=1-knight.slashCD/SLASH_CD;
  text('SWORD',W-16,600,'12px','#8b93a8',null,'right');
  ctx.fillStyle='#14142a'; ctx.fillRect(W-140,610,124,10);
  ctx.fillStyle=knight.slashCD<=0?'#3ddc84':'#9fd8ff';
  ctx.fillRect(W-140,610,Math.round(124*clamp(r,0,1)/PX)*PX,10);
  if(G.comboT>0) text('COMBO X'+Math.pow(2,G.combo),W/2,600,'14px','#ffd21c','#4d1a00','center');
}
function drawCenter(str,color,sub){
  ctx.fillStyle='rgba(4,4,10,0.72)'; ctx.fillRect(0,0,W,H);
  text(str,W/2,H/2-10,'40px',color,'#000000','center');
  if(sub) text(sub,W/2,H/2+34,'16px','#dfe6f2',null,'center');
}
function drawMenu(){
  ctx.fillStyle='rgba(4,4,10,0.66)'; ctx.fillRect(0,0,W,H);
  text('HAUNT',W/2,150,'72px','#ffd21c',null,'center');
  text('1980 · THE KNIGHT\'S VIGIL',W/2,196,'16px','#8b93a8',null,'center');
  ctx.drawImage(KNIGHT_SPR.R,W/2-72,222,32,32);
  ctx.drawImage(GHOST_SPR.RUST,W/2+40,222,28,32);
  doButton(W/2-130,300,260,60,'QUEST','CLEAR THE MAZE',()=>startQuest());
  doButton(W/2-130,376,260,60,'VERSUS','P1 KNIGHT VS P2 WRAITH',()=>startVersus());
  doButton(W/2-130,452,260,60,'HOW TO PLAY','SWORD BASICS',()=>{G.state='howto';});
  text('BEST '+String(G.best).padStart(6,'0'),W/2,560,'16px','#8b93a8',null,'center');
  text('A 1980 STORY · ORIGINAL MAZE & CAST',W/2,690,'12px','#3a3a52',null,'center');
}
function drawHowto(){
  ctx.fillStyle='rgba(4,4,10,0.85)'; ctx.fillRect(0,0,W,H);
  text('HOW TO PLAY',W/2,110,'32px','#ffd21c',null,'center');
  const L=[
    'YOU ARE THE KNIGHT.',
    'CLEAR EVERY PELLET.',
    '',
    'SLASH WRAITHS WITH YOUR',
    'SWORD — SPACE OR TAP.',
    '',
    'A SLASH ROOTS YOU BRIEFLY.',
    'TIME IT. SLAIN WRAITHS',
    'RETURN IN 3 SECONDS.',
    '',
    'CHAIN KILLS FOR COMBO:',
    '200 · 400 · 800 · 1600.',
    '',
    'NO FRENZY. THE BLADE IS',
    'ALWAYS YOURS.',
  ];
  L.forEach((l,i)=>{ if(l) text(l,W/2,190+i*30,'16px','#dfe6f2',null,'center'); });
  doButton(W/2-110,620,220,56,'BACK','',()=>{G.state='menu';});
}
function drawPaused(){
  ctx.fillStyle='rgba(4,4,10,0.72)'; ctx.fillRect(0,0,W,H);
  text('PAUSED',W/2,H/2-60,'40px','#dfe6f2',null,'center');
  doButton(W/2-110,H/2+10,220,56,'RESUME','',()=>togglePause());
  doButton(W/2-110,H/2+80,220,56,'QUIT','BACK TO MENU',()=>{G.state='menu';G.mode=null;});
}
function drawOver(){
  ctx.fillStyle='rgba(4,4,10,0.78)'; ctx.fillRect(0,0,W,H);
  text('GAME OVER',W/2,H/2-60,'44px','#ff3b30',null,'center');
  text('SCORE '+G.score,W/2,H/2,'20px','#dfe6f2',null,'center');
  text('BEST '+G.best,W/2,H/2+36,'16px','#8b93a8',null,'center');
  text('TAP TO CONTINUE',W/2,H/2+90,'16px','#8b93a8',null,'center');
}
function drawRoundEnd(){
  ctx.fillStyle='rgba(4,4,10,0.66)'; ctx.fillRect(0,0,W,H);
  text(G.lastP1?'P1 TAKES THE ROUND':'P2 TAKES THE ROUND',W/2,H/2-20,'28px','#ffd21c',null,'center');
  text('P1 '+G.p1Wins+' · '+G.p2Wins+' P2',W/2,H/2+24,'20px','#dfe6f2',null,'center');
}
function drawVsOver(){
  ctx.fillStyle='rgba(4,4,10,0.78)'; ctx.fillRect(0,0,W,H);
  const p1won=G.p1Wins>=2;
  text(p1won?'P1 WINS THE DUEL':'P2 WINS THE DUEL',W/2,H/2-40,'32px',p1won?'#3ddc84':'#ff3b30',null,'center');
  text('P1 '+G.p1Wins+' · '+G.p2Wins+' P2',W/2,H/2+8,'20px','#dfe6f2',null,'center');
  text('TAP TO CONTINUE',W/2,H/2+60,'16px','#8b93a8',null,'center');
}

/* ---------- test api ---------- */
window.GAME={
  get state(){return G.state;}, get mode(){return G.mode;},
  get score(){return G.score;}, get lives(){return G.lives;}, get level(){return G.level;},
  get pelletsLeft(){return G.pelletsLeft;}, get pelletsEaten(){return G.pelletsEaten;},
  get round(){return G.round;}, get p1Wins(){return G.p1Wins;}, get p2Wins(){return G.p2Wins;},
  get wave(){return waveMode();},
  get knight(){return {x:knight.x,y:knight.y,dead:knight.dead,slashCD:knight.slashCD,slashT:knight.slashT,face:knight.face};},
  get ghosts(){return ghosts.map(g=>({name:g.name,x:g.x,y:g.y,state:g.state}));},
  get chalice(){return G.chalice?{x:G.chalice.x,y:G.chalice.y}:null;},
  startMode(m){ m==='versus'?startVersus():startQuest(); },
  toMenu(){ G.state='menu'; G.mode=null; },
  debug:{
    slash:trySlash,
    setWant:(dx,dy)=>setWant(knight,dx,dy),
    p2Want:(dx,dy)=>{p2.want={x:dx,y:dy};},
    killGhost:(n)=>{const g=ghosts.find(g=>g.name===n); if(g&&g.state==='active')killGhost(g);},
    eatPellets:(leave)=>{ let kept=0;
      for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)
        if(pellets[y][x]){ if(kept<(leave||0)) kept++; else {pellets[y][x]=false;G.pelletsLeft--;G.pelletsEaten++;} } },
    hurt:hurtKnight,
    setRoundT:(t)=>{G.roundT=t;},
    setWave:(i)=>{G.waveIdx=i;G.waveT=0;},
    ghost:(n)=>ghosts.find(g=>g.name===n),
    tp:(x,y)=>{knight.x=x;knight.y=y;},
    freeze:()=>{knight.dir={x:0,y:0};knight.want={x:0,y:0};},
    setDir:(dx,dy)=>{knight.dir={x:dx,y:dy};const f=dirToFace(knight.dir);if(f)knight.face=f;},
    lastPellet:()=>{for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(pellets[y][x])return{x,y};return null;},
  },
};

/* ---------- boot & loop ---------- */
buildPellets(); resetPositions();
let last=0;
function frame(t){
  const dt=Math.min(0.05,((t-last)/1000)||0.016); last=t;
  if(G.state!=='paused') update(dt);
  render();
  dctx.clearRect(0,0,W,H);
  dctx.drawImage(pbuf,0,0,W,H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
