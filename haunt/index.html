<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HAUNT — a 1980 story, told from the other side</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:#04040a; overflow:hidden;
    font-family:'Courier New', ui-monospace, monospace; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; position:fixed; inset:0;
    touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { display:block; background:#04040a; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ================= HAUNT =================
   A 1980 maze-chase story, told from the other side. YOU ARE THE GHOSTS.
   Original in every way: original maze, original geometric ghosts
   (RUIN/AMBUSH/DRIFT/SHADE), original eater, code, art, audio.
   Modes: HAUNT (1P command the pack vs AI eater, level campaign),
          EATER (1P run the maze vs AI pack), VERSUS (2P same screen).
   Landscape-first mobile layout with visualViewport sizing.
*/

/* ---------- constants & maze ---------- */
const MW = 19, MH = 21;
const MAZE = [
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.###.#.###.####",
"####.#.......#.####",
"####.#.##-##.#.####",
"T......#   #......T",
"#####..#   #..#####",
"####.#.#####.#.####",
"#........#........#",
"#.##.###.#.###.##.#",
"#o..#.....#.....#o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"#.####..###..####.#",
"###################",
];
const DIRS = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
const EATER_START = { x: 9, y: 18 };
const DOOR = { x: 9, y: 8 };
const PEN_SPAWNS = [{x:9,y:10},{x:8,y:10},{x:10,y:10},{x:9,y:9}];
const GHOST_DEFS = [
  { name: 'RUIN',   ai: 'ruin',   color: '#ff4d5e', shape: 'diamond',  blurb: 'the chaser — never stops' },
  { name: 'AMBUSH', ai: 'ambush', color: '#ff4dd2', shape: 'triangle', blurb: 'cuts you off ahead' },
  { name: 'DRIFT',  ai: 'drift',  color: '#4dc9ff', shape: 'square',   blurb: 'patrols… then pounces' },
  { name: 'SHADE',  ai: 'shade',  color: '#b78bff', shape: 'hex',      blurb: 'unpredictable wildcard' },
];
const PEN_EXIT_DELAY = [0.2, 1.4, 2.6, 3.8];
// speeds in tiles/sec
const EATER_BASE = 7.2, GHOST_BASE = 6.6, GHOST_HEX = 4.6, EATER_HEX = 7.8;

/* ---------- layout: portrait 480x720, landscape 960x540 ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let LW = 480, LH = 720, LAND = false;
let TS = 25, MAZE_X = 0, MAZE_Y = 0, PANEL_X = 0, PANEL_W = 0;
const tileCX = tx => MAZE_X + (tx + 0.5) * TS;
const tileCY = ty => MAZE_Y + (ty + 0.5) * TS;
function fit() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth;
  const vh = vv ? vv.height : window.innerHeight;
  LAND = vw >= vh;
  if (LAND) { LW = 960; LH = 540; }
  else { LW = 480; LH = 720; }
  if (LAND) {
    TS = 24;
    const mw = MW * TS, mh = MH * TS;
    PANEL_W = 250;
    MAZE_X = Math.round((LW - PANEL_W - mw) / 2);
    MAZE_Y = Math.round((LH - mh) / 2);
    PANEL_X = LW - PANEL_W - 14;
  } else {
    TS = 25;
    const mw = MW * TS;
    MAZE_X = Math.round((LW - mw) / 2);
    MAZE_Y = 148; PANEL_X = 0; PANEL_W = 0;
  }
  const s = Math.min(vw / LW, vh / LH);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(LW * s * dpr);
  canvas.height = Math.round(LH * s * dpr);
  canvas.style.width = Math.round(LW * s) + 'px';
  canvas.style.height = Math.round(LH * s) + 'px';
  ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  snapEntitiesToTiles();
  buildMazeCache();
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 60));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

/* ---------- audio: procedural, no assets ---------- */
let AC = null, muted = false, siren = null;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if (AC) startSiren();
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol, lp) {
  if (!AC || muted) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 1200;
  const g = AC.createGain(); g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
}
// proximity siren: pitch + wobble track nearest ghost↔eater distance
function startSiren() {
  const o = AC.createOscillator(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = 130;
  lfo.type = 'sine'; lfo.frequency.value = 3; lg.gain.value = 18;
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.value = 0.0;
  o.connect(g); g.connect(AC.destination);
  o.start(); lfo.start();
  siren = { o, g, lfo };
}
function updateSiren() {
  if (!siren) return;
  let target = 0;
  if (state === 'play' && !paused && eater) {
    let md = 1e9;
    for (const g of ghosts) {
      if (g.state !== 'out') continue;
      md = Math.min(md, manhattanW(g.tx, g.ty, eater.tx, eater.ty));
    }
    if (md < 1e9) {
      const prox = Math.max(0, 1 - md / 14);
      target = 0.028 * (0.35 + 0.65 * prox);
      const f = hexT > 0 ? 200 + prox * 420 : 120 + prox * 300;
      siren.o.frequency.setTargetAtTime(f, AC.currentTime, 0.08);
      siren.lfo.frequency.setTargetAtTime(hexT > 0 ? 9 : 2.5 + prox * 5, AC.currentTime, 0.1);
    }
  }
  siren.g.gain.setTargetAtTime(muted ? 0 : target, AC.currentTime, 0.12);
}
let dotPitch = 0;
const sDot   = () => { dotPitch = (dotPitch + 1) % 14; beep(300 + dotPitch * 26, 320 + dotPitch * 26, 0.045, 'square', 0.035); };
const sRelic = () => { [392, 494, 587, 784].forEach((f, i) => beep(f, f, 0.1, 'triangle', 0.08, i * 0.05)); };
const sCatch = () => { beep(500, 90, 0.3, 'sawtooth', 0.1); noiseBurst(0.18, 0.14, 2400); };
const sChain = n => { const b = 500 + n * 120; beep(b, b * 1.5, 0.12, 'square', 0.08); beep(b * 1.5, b * 2, 0.14, 'square', 0.07, 0.07); };
const sDeath = () => { noiseBurst(0.5, 0.2, 700); beep(170, 38, 0.55, 'sawtooth', 0.1); };
const sEatGhost = () => { beep(170, 950, 0.24, 'square', 0.09); noiseBurst(0.12, 0.08, 3000); };
const sWarn  = () => { for (let i = 0; i < 3; i++) beep(880, 620, 0.12, 'square', 0.09, i * 0.16); };
const sUI    = () => beep(520, 780, 0.07, 'square', 0.055);
const sSel   = () => beep(660, 990, 0.08, 'square', 0.06);
const sLevel = () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, f, 0.13, 'square', 0.08, i * 0.09)); };
const sWin   = () => { [440, 554, 659, 880].forEach((f, i) => beep(f, f, 0.16, 'square', 0.08, i * 0.13)); };
const sLose  = () => { [330, 262, 196, 131].forEach((f, i) => beep(f, f * 0.94, 0.2, 'triangle', 0.09, i * 0.16)); };

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapX = x => ((x % MW) + MW) % MW;
const key2 = (x, y) => x + ',' + y;
function manhattanW(ax, ay, bx, by) {
  let dx = Math.abs(ax - bx); dx = Math.min(dx, MW - dx);
  return dx + Math.abs(ay - by);
}
function tileAt(x, y) { return MAZE[y][wrapX(x)]; }
function isPenTile(x, y) { const c = tileAt(x, y); return c === ' ' || c === '-'; }
function walkE(x, y) {
  if (y < 0 || y >= MH) return false;
  const c = tileAt(x, y);
  return c !== '#' && c !== ' ' && c !== '-';
}
function walkG(x, y, g) {
  if (y < 0 || y >= MH) return false;
  const wx = wrapX(x), c = MAZE[y][wx];
  if (c === '#') return false;
  if (isPenTile(wx, y) && g && g.state === 'out') return false;
  return true;
}
function validDirs(tx, ty, walkFn, g) {
  const out = [];
  for (const d of DIRS) if (walkFn(tx + d.x, ty + d.y, g)) out.push(d);
  return out;
}
// BFS from (sx,sy); returns first-step direction toward nearest tile matching isTarget
function bfsDir(sx, sy, walkFn, isTarget, g) {
  const sk = key2(sx, sy);
  const prev = new Map(); prev.set(sk, null);
  const q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const d of DIRS) {
      const wx = wrapX(x + d.x), ny = y + d.y;
      if (ny < 0 || ny >= MH || !walkFn(wx, ny, g)) continue;
      const k = key2(wx, ny);
      if (prev.has(k)) continue;
      prev.set(k, [x, y]);
      if (isTarget(wx, ny)) {
        let cx = wx, cy = ny;
        for (;;) {
          const p = prev.get(key2(cx, cy));
          if (p[0] === sx && p[1] === sy) {
            let dx = cx - sx, dy = cy - sy;
            if (dx > 1) dx = -1; else if (dx < -1) dx = 1;
            return { x: dx, y: dy };
          }
          cx = p[0]; cy = p[1];
        }
      }
      q.push([wx, ny]);
    }
  }
  return null;
}

/* ---------- state ---------- */
let state = 'menu';       // menu | howto | serve | play | roundEnd | levelClear | matchEnd | gameOver
let howtoMode = 'haunt';
let mode = 'haunt';
let stateT = 0, serveT = 0, paused = false, time = 0;
let eater = null, ghosts = [];
let dotSet = new Set(), relicSet = new Set(), dotsLeft = 0, dotsTotal = 0;
let score = 0, level = 1, lives = 3;
let catches = 0, catchesNeed = 3, hauntT = 0, levelT = 0, chainN = 0, chainT = 0;
let hexT = 0, driftHunt = 0;
let round = 1, roundT = 90, wins = { eater: 0, ghost: 0 };
let eaterScore = 0, ghostScore = 0, roundWinner = null;
let selectedIdx = 0;
let banner = '', bannerT = 0, bannerSub = '';
let splashT = 0;
let particles = [], popups = [], feed = [];
let trauma = 0, slowT = 0;
let gameOverReason = '';   // 'escaped' | 'caught' | ''
let newBest = false;
let buttons = [];
const bests = {
  hauntScore: +(localStorage.getItem('haunt_best_score') || 0),
  hauntLevel: +(localStorage.getItem('haunt_best_level') || 0),
  eaterScore: +(localStorage.getItem('haunt_best') || 0),
  vsEater: +(localStorage.getItem('haunt_vs_eater') || 0),
  vsPack: +(localStorage.getItem('haunt_vs_pack') || 0),
};
function saveBests() {
  localStorage.setItem('haunt_best_score', bests.hauntScore);
  localStorage.setItem('haunt_best_level', bests.hauntLevel);
  localStorage.setItem('haunt_best', bests.eaterScore);
  localStorage.setItem('haunt_vs_eater', bests.vsEater);
  localStorage.setItem('haunt_vs_pack', bests.vsPack);
}

/* ---------- entities ---------- */
function resetDots() {
  dotSet = new Set(); relicSet = new Set();
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const c = MAZE[y][x];
    if (c === '.') dotSet.add(key2(x, y));
    else if (c === 'o') relicSet.add(key2(x, y));
  }
  dotsLeft = dotSet.size; dotsTotal = dotSet.size;
}
function makeEater() {
  return { tx: EATER_START.x, ty: EATER_START.y,
           px: tileCX(EATER_START.x), py: tileCY(EATER_START.y),
           dir: { x: -1, y: 0 }, want: { x: -1, y: 0 }, mouth: 0 };
}
function makeGhost(i, exitDelay) {
  const def = GHOST_DEFS[i], s = PEN_SPAWNS[i];
  return { idx: i, name: def.name, ai: def.ai, color: def.color, shape: def.shape,
           tx: s.x, ty: s.y, px: tileCX(s.x), py: tileCY(s.y),
           dir: { x: 0, y: -1 }, want: { x: 0, y: -1 }, bufWant: null,
           state: 'inPen', exitT: exitDelay,
           waypoints: [[9, 10], [DOOR.x, DOOR.y], [DOOR.x, DOOR.y - 1]], wpIdx: 0,
           respawnT: 0, bob: Math.random() * TAU };
}
function resetPositions() {
  eater = makeEater();
  ghosts = GHOST_DEFS.map((_, i) => makeGhost(i, PEN_EXIT_DELAY[i]));
  hexT = 0; driftHunt = 0; selectedIdx = 0;
  dotPitch = 0; particles = []; popups = [];
}
function snapEntitiesToTiles() {
  if (eater) { eater.px = tileCX(eater.tx); eater.py = tileCY(eater.ty); }
  for (const g of ghosts || []) { g.px = tileCX(g.tx); g.py = tileCY(g.ty); }
}
function eaterSpeed() {
  if (hexT > 0) return EATER_HEX;
  if (mode === 'haunt') return Math.min(EATER_BASE + 0.5 * (level - 1), 9.8);
  return EATER_BASE + Math.min((level - 1) * 0.3, 1.5);
}
function ghostSpeed() {
  if (hexT > 0) return GHOST_HEX;
  const bonus = mode === 'eater' ? Math.min((level - 1) * 0.35, 1.6) : 0;
  return GHOST_BASE + bonus;
}

/* ---------- movement: tile-based, smooth, tunnel wrap ---------- */
function stepMover(e, spd, dt, decideFn) {
  const move = spd * TS * dt;
  const nx = e.tx + e.dir.x, ny = e.ty + e.dir.y;
  const wx = wrapX(nx);
  const gx = (nx < 0) ? -TS / 2 : (nx >= MW) ? MAZE_X + MW * TS + TS / 2 : tileCX(nx);
  const gy = tileCY(ny);
  const dx = gx - e.px, dy = gy - e.py;
  const d = Math.hypot(dx, dy);
  if (d <= move + 0.01) {
    if (nx < 0 || nx >= MW) {
      e.tx = wx; e.ty = ny;
      e.px = (nx < 0) ? MAZE_X + MW * TS + TS / 2 : MAZE_X - TS / 2;
      e.py = gy;
    } else {
      e.tx = nx; e.ty = ny; e.px = gx; e.py = gy;
      decideFn(e);
    }
  } else {
    e.px += dx / d * move; e.py += dy / d * move;
  }
}
function decideEaterHuman(e) {
  for (const d of [e.want, e.dir]) {
    if ((d.x || d.y) && walkE(e.tx + d.x, e.ty + d.y)) { e.dir = { x: d.x, y: d.y }; return; }
  }
  e.dir = { x: 0, y: 0 };
}
function decideGhostHuman(g) {
  const w = g.want;
  if ((w.x || w.y) && walkG(g.tx + w.x, g.ty + w.y, g)) { g.dir = { x: w.x, y: w.y }; return; }
  if ((g.dir.x || g.dir.y) && walkG(g.tx + g.dir.x, g.ty + g.dir.y, g)) return;
  decideGhostAI(g);
}
function bestDirToward(opts, g, tx, ty) {
  let best = opts[0], bd = 1e9;
  for (const d of opts) {
    const dd = manhattanW(wrapX(g.tx + d.x), g.ty + d.y, tx, ty);
    if (dd < bd) { bd = dd; best = d; }
  }
  return best;
}
function bestDirAway(opts, g, tx, ty) {
  let best = opts[0], bs = -1e9;
  for (const d of opts) {
    const dd = manhattanW(wrapX(g.tx + d.x), g.ty + d.y, tx, ty);
    const jitter = (d.x === g.dir.x && d.y === g.dir.y) ? 0.4 : 0;
    if (dd + jitter > bs) { bs = dd + jitter; best = d; }
  }
  return best;
}
function ghostTargetTile(g) {
  // where this ghost WANTS to be — used for eye direction + status
  if (hexT > 0) return null; // fleeing
  if (g.ai === 'ruin') return { x: eater.tx, y: eater.ty };
  if (g.ai === 'ambush') return { x: wrapX(eater.tx + eater.dir.x * 4), y: clamp(eater.ty + eater.dir.y * 4, 0, MH - 1) };
  return { x: eater.tx, y: eater.ty };
}
function decideGhostAI(g) {
  const optsAll = validDirs(g.tx, g.ty, walkG, g);
  const opts = optsAll.filter(d => !(d.x === -g.dir.x && d.y === -g.dir.y));
  const use = opts.length ? opts : optsAll;
  if (!use.length) { g.dir = { x: 0, y: 0 }; return; }
  let pick;
  if (hexT > 0) {
    pick = bestDirAway(use, g, eater.tx, eater.ty);   // FLEE!
  } else if (g.ai === 'ruin') {
    pick = bestDirToward(use, g, eater.tx, eater.ty);
  } else if (g.ai === 'ambush') {
    pick = bestDirToward(use, g, wrapX(eater.tx + eater.dir.x * 4), clamp(eater.ty + eater.dir.y * 4, 0, MH - 1));
  } else if (g.ai === 'shade') {
    pick = Math.random() < 0.68
      ? bestDirToward(use, g, eater.tx, eater.ty)
      : use[(Math.random() * use.length) | 0];
  } else { // drift: patrols, pounces when close or inspired
    pick = (driftHunt > 0 || manhattanW(g.tx, g.ty, eater.tx, eater.ty) <= 5 || Math.random() < 0.1)
      ? bestDirToward(use, g, eater.tx, eater.ty)
      : use[(Math.random() * use.length) | 0];
  }
  g.dir = { x: pick.x, y: pick.y };
}
// Eater brain for HAUNT mode — escalates with level
function decideEaterAI(e) {
  const active = ghosts.filter(g => g.state === 'out');
  const threatR = Math.min(4 + level, 8);
  const near = active.filter(g => manhattanW(e.tx, e.ty, g.tx, g.ty) <= threatR);
  const threat = near.filter(() => hexT <= 0);
  const prey = near.filter(() => hexT > 0);
  const opts = validDirs(e.tx, e.ty, walkE);
  if (!opts.length) { e.dir = { x: 0, y: 0 }; return; }
  if (hexT > 1.0 && active.length) {
    // THE HUNT: chase the nearest ghost, near or far — this is the terror
    const pool = prey.length ? prey : active;
    let t = pool[0], bd = 1e9;
    for (const g of pool) { const d = manhattanW(e.tx, e.ty, g.tx, g.ty); if (d < bd) { bd = d; t = g; } }
    e.dir = bestDirToward(opts, e, t.tx, t.ty);
    return;
  }
  if (threat.length) {
    let best = opts[0], bs = -1e9;
    for (const d of opts) {
      const nx = wrapX(e.tx + d.x), ny = e.ty + d.y;
      let m = 1e9;
      for (const g of threat) m = Math.min(m, manhattanW(nx, ny, g.tx, g.ty));
      if (d.x === e.dir.x && d.y === e.dir.y) m += 0.6;
      if (m > bs) { bs = m; best = d; }
    }
    // L3+: juke — sometimes reverse when a ghost is right behind
    if (level >= 3 && Math.random() < 0.3) {
      const behind = threat.some(g => manhattanW(e.tx, e.ty, g.tx, g.ty) <= 2.5);
      if (behind) {
        const rev = opts.find(d => d.x === -e.dir.x && d.y === -e.dir.y);
        if (rev) { e.dir = { x: rev.x, y: rev.y }; return; }
      }
    }
    e.dir = { x: best.x, y: best.y };
    return;
  }
  // L2+: detour for a relic when the pack is closing in (bait the reversal)
  if (level >= 2 && relicSet.size && active.some(g => manhattanW(e.tx, e.ty, g.tx, g.ty) <= 6)) {
    const d = bfsDir(e.tx, e.ty, walkE, (x, y) => relicSet.has(key2(x, y)));
    if (d) { e.dir = d; return; }
  }
  const d = bfsDir(e.tx, e.ty, walkE, (x, y) => dotSet.has(key2(x, y)));
  e.dir = d || opts[(Math.random() * opts.length) | 0];
}
/* ---------- flow ---------- */
function startMode(m) {
  mode = m; paused = false; newBest = false;
  score = 0; level = 1; lives = 3;
  catches = 0; hauntT = 0; levelT = 0; chainN = 0; chainT = 0;
  round = 1; wins = { eater: 0, ghost: 0 };
  eaterScore = 0; ghostScore = 0; roundT = 90; feed = [];
  catchesNeed = 3;
  resetDots(); resetPositions();
  showBanner(m === 'haunt' ? 'COMMAND THE PACK' : m === 'eater' ? 'RUN THE MAZE' : 'EATER VS PACK',

  const isSel = (mode === 'haunt' || mode === 'versus') && ghosts[selectedIdx] === g && g.state === 'out';
  ctx.save(); ctx.translate(g.px, g.py + bob);
  if (isSel) {
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]); ctx.lineDashOffset = -time * 20;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(0, 0, r + 7, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.shadowBlur = 0;
  }
  ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.fillStyle = col;
  ctx.beginPath();
  if (g.shape === 'diamond') {
    ctx.moveTo(0, -r); ctx.lineTo(r * 0.8, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.8, 0);
  } else if (g.shape === 'triangle') {
    const a = (g.dir.x || g.dir.y) ? Math.atan2(g.dir.y, g.dir.x) : -Math.PI / 2;
    for (let i = 0; i < 3; i++) {
      const ta = a + i * TAU / 3;
      i ? ctx.lineTo(Math.cos(ta) * r, Math.sin(ta) * r) : ctx.moveTo(Math.cos(ta) * r, Math.sin(ta) * r);
    }
  } else if (g.shape === 'hex') {
    for (let i = 0; i < 6; i++) {
      const ha = Math.PI / 6 + i * TAU / 6;
      i ? ctx.lineTo(Math.cos(ha) * r, Math.sin(ha) * r) : ctx.moveTo(Math.cos(ha) * r, Math.sin(ha) * r);
    }

    const s = r * 0.82;
    ctx.rect(-s, -s, 2 * s, 2 * s);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  // eyes look toward their target (personality!)
  let lx = g.dir.x, ly = g.dir.y;
  if (!isSel) {
    const t = ghostTargetTile(g);
    if (t) { lx = t.x - g.tx; ly = t.y - g.ty; }
    else { lx = eater.tx - g.tx; ly = eater.ty - g.ty; } // fleeing: eyes on the threat
  }
  const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
  const eo = r * 0.3, er = r * 0.21;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-eo + lx * 2.4, -r * 0.08 + ly * 2.4, er, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(eo + lx * 2.4, -r * 0.08 + ly * 2.4, er, 0, TAU); ctx.fill();
  ctx.fillStyle = hex ? '#ff9a3c' : '#0a0a14';
  ctx.beginPath(); ctx.arc(-eo + lx * 4.4, -r * 0.08 + ly * 4.4, er * 0.55, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(eo + lx * 4.4, -r * 0.08 + ly * 4.4, er * 0.55, 0, TAU); ctx.fill();
  ctx.restore();
}

  ctx.fillText('catches ' + catchesNeed + ' · score ' + score, cx, by + 96);
  ctx.fillText('the eater comes back meaner…', cx, by + 122);
  ctx.fillStyle = '#5a636e'; ctx.font = '13px "Courier New", monospace';
  ctx.fillText('tap to continue', cx, by + 190);
  ctx.textAlign = 'left';
}
function drawMatchEnd() {
  const ew = wins.eater > wins.ghost;
  const [bx, by] = overlayBox(LAND ? 420 : 360, 340);
  const cx = bx + (LAND ? 210 : 180);
  ctx.textAlign = 'center';
  ctx.fillStyle = ew ? '#ffb02e' : '#ff4d5e';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18;
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillText(ew ? 'EATER WINS THE NIGHT' : 'THE PACK FEASTS', cx, by + 58);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#aab4c2'; ctx.font = '15px "Courier New", monospace';
  ctx.fillText('rounds  eater ' + wins.eater + ' — ' + wins.ghost + ' pack', cx, by + 100);
  ctx.textAlign = 'left';
  let y = by + 130;
  y = menuButton(cx, y, 240, 'REMATCH', '#7dff9a', () => startMode('versus'));
  menuButton(cx, y + 14, 240, 'MENU', '#8a93a0', () => { state = 'menu'; sUI(); });
}
function drawGameOver() {
  const escaped = gameOverReason === 'escaped';
  const [bx, by] = overlayBox(LAND ? 440 : 380, 360);
  const cx = bx + (LAND ? 220 : 190);
  ctx.textAlign = 'center';
  ctx.fillStyle = escaped ? '#ffb02e' : '#ff4d5e';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 18;
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillText(escaped ? 'THE EATER ESCAPED' : 'GAME OVER', cx, by + 58);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#aab4c2'; ctx.font = '14px "Courier New", monospace';
  ctx.fillText(escaped ? 'it cleared the maze on level ' + level : mode === 'eater' ? 'the pack got you on level ' + level : '', cx, by + 94);
  const bs = mode === 'haunt' ? bests.hauntScore : bests.eaterScore;
  ctx.fillStyle = '#e8f4ff'; ctx.font = 'bold 17px "Courier New", monospace';
  ctx.fillText('score ' + score + ' · best ' + bs, cx, by + 126);
  if (newBest) {
    ctx.fillStyle = '#ffd75a'; ctx.font = 'bold 16px "Courier New", monospace';
    const fl = Math.floor(time * 3) % 2 === 0;
    if (fl) ctx.fillText('★ NEW BEST! ★', cx, by + 154);
  }
  ctx.textAlign = 'left';
  let y = by + 180;
  y = menuButton(cx, y, 240, 'RETRY', '#7dff9a', () => startMode(mode));
  menuButton(cx, y + 14, 240, 'MENU', '#8a93a0', () => { state = 'menu'; sUI(); });
}
function drawServeText() {
  if (state !== 'serve') return;
  const cx = LAND ? (LW - PANEL_W) / 2 : LW / 2;
  const my = MAZE_Y + (MH * TS) / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8f4ff'; ctx.font = 'bold ' + Math.round(TS * 1.3) + 'px "Courier New", monospace';
  let main = 'READY!', sub = '';
  if (mode === 'haunt') { main = 'CATCH THE EATER'; sub = 'level ' + level + ' · ' + catchesNeed + ' catches before it clears the maze'; }
  else if (mode === 'eater') { main = 'READY!'; sub = 'level ' + level; }
  else { main = 'ROUND ' + round; sub = 'eater vs pack · 90 seconds'; }
  ctx.fillText(main, cx, my - 8);
  ctx.fillStyle = '#8a93a0'; ctx.font = Math.round(TS * 0.58) + 'px "Courier New", monospace';
  ctx.fillText(sub, cx, my + 24);
  ctx.textAlign = 'left';
}
function drawBanner() {
  if (bannerT <= 0) return;
  ctx.globalAlpha = clamp(bannerT, 0, 1);
  ctx.textAlign = 'center';
  const cx = LAND ? (LW - PANEL_W) / 2 : LW / 2;
  ctx.fillStyle = '#e8f4ff'; ctx.font = 'bold ' + Math.round(TS * 0.95) + 'px "Courier New", monospace';
  ctx.shadowColor = '#19e3ff'; ctx.shadowBlur = 10;
  ctx.fillText(banner, cx, MAZE_Y + 46);
  ctx.shadowBlur = 0;
  if (bannerSub) {
    ctx.font = Math.round(TS * 0.55) + 'px "Courier New", monospace';
    ctx.fillStyle = '#8a93a0';
    ctx.fillText(bannerSub, cx, MAZE_Y + 70);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

/* ---------- render root ---------- */
function render() {
  buttons = [];
  drawBG();
  if (state === 'menu') { drawMenu(); if (vigCv) ctx.drawImage(vigCv, 0, 0); return; }
  if (state === 'howto') { drawHowto(); if (vigCv) ctx.drawImage(vigCv, 0, 0); return; }

  ctx.save();
  if (trauma > 0) {
    const m = trauma * trauma * 9;
    ctx.translate(rnd(-m, m), rnd(-m, m));
  }
  drawMazeFrame();
  drawDots();
  if (eater) drawEater();
  for (const g of ghosts) if (g.state !== 'eaten') drawGhost(g);
  drawParticles();
  drawPopups();
  ctx.restore();

  if (LAND) drawRosterPanel(); else drawHUDPortrait();
  drawHints();
  drawBanner();
  drawServeText();

  if (state === 'roundEnd') {
    ctx.fillStyle = 'rgba(3,3,8,.45)'; ctx.fillRect(0, 0, LW, LH);
    centerText(roundWinner === 'eater' ? 'EATER TAKES IT' : 'PACK TAKES IT',
               'eater ' + eaterScore + ' — ' + ghostScore + ' pack',
               roundWinner === 'eater' ? '#ffb02e' : '#ff4d5e');
  }
  if (state === 'levelClear') drawLevelClear();
  if (paused && (state === 'play' || state === 'serve')) drawPause();
  if (state === 'matchEnd') drawMatchEnd();
  if (state === 'gameOver') drawGameOver();
  if (vigCv) ctx.drawImage(vigCv, 0, 0);
}

/* ---------- main loop ---------- */
let lastT = 0, acc = 0;
const DT = 1 / 60;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  const ft = Math.min(0.1, now - (lastT || now));
  lastT = now; acc += ft;
  while (acc >= DT) { update(DT); acc -= DT; }
  render();
}

/* ---------- debug hooks ---------- */
window.GAME = {
  get state() { return state; }, get mode() { return mode; },
  get score() { return score; }, get lives() { return lives; },
  get level() { return level; }, get dotsLeft() { return dotsLeft; },
  get catches() { return catches; }, get catchesNeed() { return catchesNeed; },
  get hexT() { return hexT; }, get paused() { return paused; },
  get wins() { return wins; }, get roundT() { return roundT; },
  get eaterScore() { return eaterScore; }, get ghostScore() { return ghostScore; },
  get selectedIdx() { return selectedIdx; },
  get layout() { return { LW, LH, LAND, TS, MAZE_X, MAZE_Y, PANEL_X, PANEL_W }; },
  get ghosts() { return ghosts.map(g => ({ name: g.name, tx: g.tx, ty: g.ty, state: g.state, want: { ...g.want }, dir: { ...g.dir }, px: Math.round(g.px), py: Math.round(g.py) })); },
  get eater() { return eater ? { tx: eater.tx, ty: eater.ty, px: Math.round(eater.px), py: Math.round(eater.py), dir: { ...eater.dir }, want: { ...eater.want } } : null; },
  startMode, showHowto, selectGhost, triggerHex,
  debug: {
    teleportEater(x, y) { eater.tx = x; eater.ty = y; eater.px = tileCX(x); eater.py = tileCY(y); },
    teleportGhost(i, x, y) { const g = ghosts[i]; g.tx = x; g.ty = y; g.px = tileCX(x); g.py = tileCY(y); g.state = 'out'; },
    setDots(n) { const arr = [...dotSet]; for (let i = 0; i < arr.length - n; i++) dotSet.delete(arr[i]); dotsLeft = dotSet.size; },
    clearRelics() { relicSet.clear(); },
    setHex(t) { hexT = t; },
    setRoundT(t) { roundT = t; },
    setCatches(n) { catches = n; },
    endServe() { serveT = 0; },
    tap(x, y) { handleTap(x, y); },
    swipe(x, y, dx, dy) { handleSwipe(x, y, { x: dx, y: dy }); },
    key(code) { window.dispatchEvent(new KeyboardEvent('keydown', { code })); },
  },
};
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
