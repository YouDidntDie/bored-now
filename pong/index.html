<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PONG</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05070c; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================================================
   PONG — built from the study.
   - Fixed-timestep simulation (120 Hz), decoupled from render.
   - Feel is engineered: trauma-based screen shake, hitstop,
     particles, paddle squash, ball trail, pitch-rising audio.
   - Collision is designed theater: angle from contact point,
     "english" from paddle motion, speed ramp per rally.
   ============================================================ */

// ---------- constants ----------
const W = 960, H = 600;
const PADDLE_W = 14, PADDLE_H = 112;
const BALL_R = 9;
const BASE_SPEED = 430, MAX_SPEED = 980;
const WIN_SCORE = 7;
const STEP = 1 / 120;               // fixed simulation step
const COL_L = '#5fd7ff', COL_R = '#ff6b8a', COL_BALL = '#ffffff';

// ---------- canvas ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1, viewScale = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  viewScale = s;
  canvas.width = Math.max(2, Math.round(W * s * dpr));
  canvas.height = Math.max(2, Math.round(H * s * dpr));
  canvas.style.width = Math.round(W * s) + 'px';
  canvas.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------- audio (synth, no assets) ----------
let AC = null, muted = false;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return;
  try {
    const ac = audio(), t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* audio unavailable — game still runs */ }
}
const sfx = {
  paddle(rally) { tone(300 + Math.min(rally, 24) * 26, 0.07, 'square', 0.13); },
  wall()        { tone(210, 0.045, 'triangle', 0.09); },
  score()       { tone(330, 0.12, 'sawtooth', 0.12, 110); tone(165, 0.2, 'sawtooth', 0.1, 70, 0.1); },
  launch()      { tone(880, 0.06, 'square', 0.1); },
  ready()       { tone(440, 0.08, 'square', 0.09); },
  rally10()     { tone(660, 0.06, 'square', 0.1); tone(880, 0.08, 'square', 0.1, 0, 0.06); },
  win()         { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.12, 0, i * 0.1)); },
  click()       { tone(520, 0.05, 'square', 0.08); }
};
window.addEventListener('pointerdown', () => { try { audio(); } catch (e) {} }, { passive: true });
window.addEventListener('keydown', () => { try { audio(); } catch (e) {} });

// ---------- input ----------
const keys = {};
let mouseSeen = false, mouseY = H / 2;
const touches = new Map(); // pointerId -> {x, y} (logical coords)

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointermove', (e) => {
  const p = toLogical(e);
  if (e.pointerType === 'mouse') { mouseSeen = true; mouseY = p.y; }
  else if (touches.has(e.pointerId)) touches.set(e.pointerId, p);
});
canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (e.pointerType !== 'mouse') touches.set(e.pointerId, p);
  else { mouseSeen = true; mouseY = p.y; }
  onTap(p.x, p.y);
});
const endTouch = (e) => { touches.delete(e.pointerId); };
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { keys[e.code] = true; handleKey(e.code); }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (G.state === 'play' || G.state === 'serve')) G.paused = true;
});

// ---------- game state ----------
const G = {
  mode: 'menu',          // 'menu' | '1P' | '2P'
  state: 'menu',         // 'menu' | 'serve' | 'play' | 'point' | 'over'
  paused: false,
  scoreL: 0, scoreR: 0,
  rally: 0,
  serveTimer: 0, serveDir: 1,
  pointTimer: 0,
  hitstop: 0,
  trauma: 0,
  flash: 0,
  winner: 0,             // 1 = left, 2 = right
  lastScorer: null,      // 'L' | 'R'
  time: 0
};
const ball = { x: W/2, y: H/2, vx: 0, vy: 0, r: BALL_R, trail: [], visible: true };
const padL = { x: 38, y: H/2, vy: 0, squash: 0, targetY: H/2 };
const padR = { x: W - 38, y: H/2, vy: 0, squash: 0, targetY: H/2 };
let aiClock = 0, aiTargetY = H / 2;
const parts = [];   // particles
const popups = [];  // floating text

// menu button hit-regions (filled in render)
const btn1P = { x: 0, y: 0, w: 0, h: 0 };
const btn2P = { x: 0, y: 0, w: 0, h: 0 };

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function resetPositions() {
  padL.y = padL.targetY = H / 2; padL.vy = 0; padL.squash = 0;
  padR.y = padR.targetY = H / 2; padR.vy = 0; padR.squash = 0;
  ball.x = W / 2; ball.y = H / 2; ball.vx = 0; ball.vy = 0;
  ball.trail.length = 0; ball.visible = true;
  parts.length = 0;
}

function startGame(mode) {
  G.mode = mode;
  G.scoreL = 0; G.scoreR = 0; G.rally = 0;
  G.winner = 0; G.paused = false; G.trauma = 0; G.hitstop = 0; G.flash = 0;
  popups.length = 0;
  resetPositions();
  serve(Math.random() < 0.5 ? -1 : 1);
  sfx.click();
}

function serve(dir) {
  resetPositions();
  ball.visible = false;
  G.state = 'serve';
  G.serveTimer = 1.1;
  G.serveDir = dir;
  sfx.ready();
}

function launch() {
  const ang = (Math.random() * 0.9 - 0.45); // ±26°
  const s = BASE_SPEED;
  ball.vx = G.serveDir * s * Math.cos(ang);
  ball.vy = s * Math.sin(ang);
  ball.visible = true;
  G.state = 'play';
  sfx.launch();
}

function burst(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = spd * (0.3 + Math.random() * 0.7);
    parts.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0.45 + Math.random() * 0.35, max: 0.8,
      size: 2 + Math.random() * 3, color
    });
  }
}

function addPopup(text, x, y, color, size) {
  popups.push({ text, x, y, color: color || '#fff', size: size || 30, life: 1.2, max: 1.2 });
}

function onPaddleHit(p, rel, dir) {
  // --- designed collision: angle from contact point, english from paddle motion
  const maxA = Math.PI / 3;               // 60° max deflection
  const ang = clamp(rel, -1, 1) * maxA;
  let speed = Math.hypot(ball.vx, ball.vy);
  speed = Math.min(speed * 1.045 + 14, MAX_SPEED);
  ball.vx = dir * speed * Math.cos(ang);
  ball.vy = speed * Math.sin(ang) + p.vy * 0.28;
  const maxVy = speed * 0.92;             // never near-vertical loops
  if (Math.abs(ball.vy) > maxVy) {
    ball.vy = Math.sign(ball.vy) * maxVy;
    ball.vx = dir * Math.sqrt(Math.max(speed * speed - ball.vy * ball.vy, speed * speed * 0.1));
  }
  if (Math.abs(ball.vy) < 50) ball.vy = 50 * (ball.vy >= 0 ? 1 : -1);
  const hw = PADDLE_W / 2;
  ball.x = p.x + dir * (hw + ball.r + 1);

  // --- feel: every action fires at least three
  G.rally++;
  G.hitstop = 0.028 + (speed / MAX_SPEED) * 0.035;
  G.trauma = Math.min(1, G.trauma + 0.30);
  p.squash = 1;
  burst(ball.x, ball.y, 12, dir === 1 ? COL_L : COL_R, 260);
  sfx.paddle(G.rally);
  if (G.rally % 10 === 0) {
    addPopup('RALLY ' + G.rally, W / 2, H / 2 - 120, '#ffd76b', 34);
    sfx.rally10();
  }
}

function onWall() {
  G.trauma = Math.min(1, G.trauma + 0.07);
  burst(ball.x, clamp(ball.y, 8, H - 8), 5, '#ffffff', 150);
  sfx.wall();
}

function onPoint(side) { // 'L' or 'R' scored
  if (side === 'L') G.scoreL++; else G.scoreR++;
  G.lastScorer = side;
  G.state = 'point';
  G.pointTimer = 1.5;
  G.rally = 0;
  G.trauma = 1;
  G.flash = 1;
  G.hitstop = 0.09;
  ball.visible = false;
  burst(clamp(ball.x, 20, W - 20), clamp(ball.y, 20, H - 20), 42, side === 'L' ? COL_L : COL_R, 420);
  sfx.score();
  if (G.scoreL >= WIN_SCORE || G.scoreR >= WIN_SCORE) {
    G.winner = G.scoreL >= WIN_SCORE ? 1 : 2;
  }
}

// ---------- update (fixed timestep) ----------
function movePaddlePlayer(p, upCode, downCode, touchSide) {
  const old = p.y;
  let v = 0;
  if (keys[upCode]) v -= 1;
  if (keys[downCode]) v += 1;
  // touch override for this side
  let ty = null;
  for (const t of touches.values()) {
    const s = t.x < W / 2 ? 'L' : 'R';
    if (s === touchSide) { ty = t.y; break; }
  }
  if (ty !== null) {
    p.y += (ty - p.y) * 0.35;
    p.targetY = p.y;
  } else if (v !== 0) {
    p.y += v * 660 * STEP;
    p.targetY = p.y;
  } else if (mouseSeen && touchSide === 'L' && G.mode === '1P') {
    p.y += (mouseY - p.y) * Math.min(1, STEP * 22);
    p.targetY = p.y;
  }
  p.y = clamp(p.y, PADDLE_H / 2 + 8, H - PADDLE_H / 2 - 8);
  p.vy = (p.y - old) / STEP;
}

function movePaddleAI(dt) {
  const old = padR.y;
  aiClock -= dt;
  if (aiClock <= 0) {
    aiClock = 0.12;
    const err = Math.max(16, 48 - G.rally * 2.2); // sharper as rally grows
    aiTargetY = ball.y + (Math.random() * 2 - 1) * err;
  }
  let tgt;
  if (ball.vx > 0 && ball.visible) tgt = clamp(aiTargetY, PADDLE_H / 2 + 8, H - PADDLE_H / 2 - 8);
  else tgt = H / 2 + Math.sin(G.time * 1.4) * 36;   // idle drift home
  const aiSpeed = Math.min(350 + G.rally * 9, 580);
  const d = tgt - padR.y, m = aiSpeed * dt;
  padR.y += clamp(d, -m, m);
  padR.y = clamp(padR.y, PADDLE_H / 2 + 8, H - PADDLE_H / 2 - 8);
  padR.vy = (padR.y - old) / dt;
  padR.targetY = padR.y;
}

function collidePaddle(p, dir) {
  // dir: +1 = left paddle (ball must travel left), -1 = right paddle
  if (dir === 1 && ball.vx >= 0) return;
  if (dir === -1 && ball.vx <= 0) return;
  const hw = PADDLE_W / 2, hh = PADDLE_H / 2;
  if (ball.x + ball.r > p.x - hw && ball.x - ball.r < p.x + hw &&
      ball.y + ball.r > p.y - hh && ball.y - ball.r < p.y + hh) {
    const rel = (ball.y - p.y) / hh;
    onPaddleHit(p, rel, dir);
  }
}

function update(dt) {
  G.time += dt;
  G.trauma = Math.max(0, G.trauma - dt * 1.7);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  padL.squash = Math.max(0, padL.squash - dt * 3.5);
  padR.squash = Math.max(0, padR.squash - dt * 3.5);

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= (1 - 3 * dt); q.vy *= (1 - 3 * dt);
    q.life -= dt;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i];
    q.y -= 42 * dt; q.life -= dt;
    if (q.life <= 0) popups.splice(i, 1);
  }

  if (G.state === 'serve') {
    if (G.mode === '1P') { movePaddlePlayer(padL, 'KeyW', 'KeyS', 'L'); movePaddleAI(dt); }
    else { movePaddlePlayer(padL, 'KeyW', 'KeyS', 'L'); movePaddlePlayer(padR, 'ArrowUp', 'ArrowDown', 'R'); }
    G.serveTimer -= dt;
    if (G.serveTimer <= 0) launch();
    return;
  }
  if (G.state === 'point') {
    if (G.mode === '1P') { movePaddlePlayer(padL, 'KeyW', 'KeyS', 'L'); movePaddleAI(dt); }
    else { movePaddlePlayer(padL, 'KeyW', 'KeyS', 'L'); movePaddlePlayer(padR, 'ArrowUp', 'ArrowDown', 'R'); }
    G.pointTimer -= dt;
    if (G.pointTimer <= 0) {
      if (G.winner) { G.state = 'over'; sfx.win(); }
      else serve(G.lastScorer === 'L' ? 1 : -1); // serve toward the player who conceded
    }
    return;
  }
  if (G.state !== 'play') return;

  // paddles
  if (G.mode === '1P') { movePaddlePlayer(padL, 'KeyW', 'KeyS', 'L'); movePaddleAI(dt); }
  else { movePaddlePlayer(padL, 'KeyW', 'KeyS', 'L'); movePaddlePlayer(padR, 'ArrowUp', 'ArrowDown', 'R'); }

  // ball
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 14) ball.trail.shift();

  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); onWall(); }
  else if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); onWall(); }

  collidePaddle(padL, 1);
  collidePaddle(padR, -1);

  if (ball.x < -40) onPoint('R');
  else if (ball.x > W + 40) onPoint('L');
}

// ---------- input actions ----------
function handleKey(code) {
  if (code === 'KeyM') { muted = !muted; return; }
  if (code === 'KeyP') {
    if (G.state === 'play' || G.state === 'serve') G.paused = !G.paused;
    return;
  }
  if (G.state === 'menu') {
    if (code === 'Digit1' || code === 'Numpad1') startGame('1P');
    if (code === 'Digit2' || code === 'Numpad2') startGame('2P');
    return;
  }
  if (code === 'Escape') {
    G.mode = 'menu'; G.state = 'menu'; G.paused = false;
    return;
  }
  if (G.state === 'over' && code === 'Space') startGame(G.mode);
}

function onTap(x, y) {
  if (G.state === 'menu') {
    if (x > btn1P.x && x < btn1P.x + btn1P.w && y > btn1P.y && y < btn1P.y + btn1P.h) startGame('1P');
    else if (x > btn2P.x && x < btn2P.x + btn2P.w && y > btn2P.y && y < btn2P.y + btn2P.h) startGame('2P');
  } else if (G.state === 'over') {
    startGame(G.mode);
  }
}

// ---------- render ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let vignette = null;
function drawField() {
  ctx.fillStyle = '#05070c';
  ctx.fillRect(-30, -30, W + 60, H + 60);
  // center dashed line
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  for (let y = 14; y < H; y += 34) ctx.fillRect(W / 2 - 3, y, 6, 18);
  // center ring
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 74, 0, Math.PI * 2); ctx.stroke();
}

function drawScores() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 76px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.shadowBlur = 22;
  ctx.shadowColor = COL_L; ctx.fillStyle = 'rgba(235,250,255,0.95)';
  ctx.fillText(String(G.scoreL), W / 2 - 84, 92);
  ctx.shadowColor = COL_R; ctx.fillStyle = 'rgba(255,240,244,0.95)';
  ctx.fillText(String(G.scoreR), W / 2 + 84, 92);
  ctx.shadowBlur = 0;
  ctx.font = '500 15px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.fillText('FIRST TO ' + WIN_SCORE, W / 2, 148);
}

function drawPaddle(p, color) {
  const hw = PADDLE_W / 2, hh = PADDLE_H / 2;
  const sx = 1 + 0.38 * p.squash, sy = 1 - 0.26 * p.squash;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(sx, sy);
  ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.fillStyle = '#f2f6fb';
  rr(-hw, -hh, PADDLE_W, PADDLE_H, 7);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  rr(-hw, -hh, PADDLE_W, 5, 3); ctx.fill(); // colored cap
  ctx.restore();
}

function drawBall() {
  if (!ball.visible) return;
  const n = ball.trail.length;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const t = ball.trail[i], k = (i + 1) / n;
    ctx.globalAlpha = k * 0.28;
    ctx.fillStyle = COL_BALL;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * k * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // hot tint at high speed
  const sp = Math.hypot(ball.vx, ball.vy);
  const heat = clamp((sp - BASE_SPEED) / (MAX_SPEED - BASE_SPEED), 0, 1);
  ctx.save();
  ctx.shadowColor = heat > 0.55 ? '#ffb35c' : '#ffffff';
  ctx.shadowBlur = 26;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  if (heat > 0.02) {
    ctx.globalAlpha = heat * 0.55;
    ctx.fillStyle = '#ff9a3c';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 0.62, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawParts() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const q of parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.restore();
}

function drawPopups() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const q of popups) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.font = '700 ' + q.size + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.shadowColor = q.color; ctx.shadowBlur = 14;
    ctx.fillStyle = q.color;
    ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

function drawMenu() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 34;
  ctx.fillStyle = '#f5f8fc';
  ctx.font = '800 120px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.fillText('PONG', W / 2, H / 2 - 130);
  ctx.shadowBlur = 0;
  ctx.font = '500 17px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('A STUDY IN FEEL', W / 2, H / 2 - 62);

  const bw = 340, bh = 64;
  const items = [
    { r: btn1P, label: '1 — ONE PLAYER', color: COL_L, y: H / 2 + 30 },
    { r: btn2P, label: '2 — TWO PLAYERS', color: COL_R, y: H / 2 + 116 }
  ];
  ctx.font = '700 24px ui-monospace, Menlo, Consolas, monospace';
  for (const it of items) {
    it.r.x = W / 2 - bw / 2; it.r.y = it.y - bh / 2; it.r.w = bw; it.r.h = bh;
    ctx.strokeStyle = it.color; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.85;
    rr(it.r.x, it.r.y, bw, bh, 10); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowColor = it.color; ctx.shadowBlur = 12;
    ctx.fillStyle = '#eef4fa';
    ctx.fillText(it.label, W / 2, it.y + 1);
    ctx.shadowBlur = 0;
  }
  ctx.font = '500 15px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.40)';
  const blink = (Math.sin(G.time * 4) + 1) / 2;
  ctx.globalAlpha = 0.35 + blink * 0.4;
  ctx.fillText('mouse · W/S or arrows · first to ' + WIN_SCORE, W / 2, H - 64);
  ctx.globalAlpha = 1;
}

function drawOverlays() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (G.state === 'serve') {
    const a = 0.45 + 0.35 * Math.sin(G.time * 10);
    ctx.globalAlpha = a;
    ctx.font = '700 44px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
    ctx.fillText('READY', W / 2, H / 2 - 150);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  } else if (G.state === 'over') {
    ctx.fillStyle = 'rgba(3,5,9,0.62)';
    ctx.fillRect(0, 0, W, H);
    const wcol = G.winner === 1 ? COL_L : COL_R;
    let label;
    if (G.mode === '1P') label = G.winner === 1 ? 'YOU WIN' : 'CPU WINS';
    else label = G.winner === 1 ? 'LEFT WINS' : 'RIGHT WINS';
    ctx.shadowColor = wcol; ctx.shadowBlur = 30;
    ctx.fillStyle = '#f5f8fc';
    ctx.font = '800 84px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText(label, W / 2, H / 2 - 60);
    ctx.shadowBlur = 0;
    ctx.font = '500 20px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    const blink = (Math.sin(G.time * 4) + 1) / 2;
    ctx.globalAlpha = 0.4 + blink * 0.45;
    ctx.fillText('SPACE or TAP — rematch      ESC — menu', W / 2, H / 2 + 40);
    ctx.globalAlpha = 1;
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(3,5,9,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '700 52px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('PAUSED', W / 2, H / 2 - 10);
    ctx.font = '500 18px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('P to resume', W / 2, H / 2 + 44);
  }
  if (muted) {
    ctx.textAlign = 'right';
    ctx.font = '500 14px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText('MUTED (M)', W - 18, 26);
  }
}

function render() {
  ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
  // trauma-based shake: shake = trauma^2
  const sh = G.trauma * G.trauma * 15;
  const sx = (Math.random() * 2 - 1) * sh;
  const sy = (Math.random() * 2 - 1) * sh;
  ctx.save();
  ctx.translate(sx, sy);
  drawField();
  if (G.state !== 'menu') {
    drawScores();
    drawPaddle(padL, COL_L);
    drawPaddle(padR, COL_R);
    drawParts();
    drawBall();
    drawPopups();
  }
  ctx.restore();
  // score flash (no shake)
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.16).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // vignette
  if (!vignette) {
    vignette = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.95);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.42)');
  }
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);

  if (G.state === 'menu') drawMenu();
  else drawOverlays();
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (G.paused) { render(); return; }
  if (G.hitstop > 0) {           // hitstop: freeze sim, keep rendering
    G.hitstop -= rdt;
    G.trauma = Math.max(0, G.trauma - rdt * 1.1);
    render();
    return;
  }
  acc += rdt;
  let n = 0;
  while (acc >= STEP && n < 10) { update(STEP); acc -= STEP; n++; }
  if (n === 10) acc = 0;         // spiral-of-death guard
  render();
}
canvas.style.cursor = 'default';
requestAnimationFrame(frame);

// hook for automated playtesting
window.__pong = { G, ball, padL, padR, start: startGame };
</script>
