<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RALLY</title>
<style>
  html, body { margin:0; padding:0; background:#04060b; overflow:hidden; height:100%; }
  html {
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; overscroll-behavior:none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing:border-box;
  }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================================================
   RALLY — 1972. The definitive edition.
   Fixed-timestep sim (120 Hz). Trauma shake, hitstop, particles,
   paddle squash, ball trail, pitch-rising synth audio, crowd bed.
   Ladder campaign (5 AI personalities), quick match, 2P versus.
   Touch-first: 1:1 drag, visualViewport sizing, safe areas.
   ============================================================ */

// ---------- constants ----------
const W = 960, H = 600;
const BALL_R = 9;
const BASE_SPEED = 430, MAX_SPEED = 1000;
const WIN_SCORE = 7;
const STEP = 1 / 120;
const COL_L = '#5fd7ff', COL_R = '#ff6b8a', COL_BALL = '#ffb43c', COL_GOLD = '#ffd76b';

// AI personalities — the ladder
const LADDER = [
  { name:'SPARK', title:'THE ROOKIE',    color:'#5fd7ff', speed:330, err:66, react:0.20, predict:false, aggro:0.0, tag:'still learning the angles' },
  { name:'VOLT',  title:'THE REGULar',   color:'#7cffb2', speed:430, err:44, react:0.15, predict:true,  aggro:0.25, tag:'steady hands, steady game' },
  { name:'ARC',   title:'THE TRICKSTER', color:'#c792ff', speed:520, err:30, react:0.12, predict:true,  aggro:0.6, tag:'aims for the corners' },
  { name:'SURGE', title:'THE MACHINE',   color:'#ff9a3c', speed:610, err:18, react:0.09, predict:true,  aggro:0.8, tag:'it does not blink' },
  { name:'NOVA',  title:'THE CHAMPION',  color:'#ffd76b', speed:690, err:10, react:0.07, predict:true,  aggro:1.0, tag:'the last wall. break it.' }
];
const QUICK_DIFF = {
  easy:   { label:'EASY',   color:'#7cffb2', speed:340, err:62, react:0.20, predict:false, aggro:0.0 },
  normal: { label:'NORMAL', color:'#5fd7ff', speed:480, err:36, react:0.13, predict:true,  aggro:0.4 },
  hard:   { label:'HARD',   color:'#ff6b8a', speed:620, err:18, react:0.09, predict:true,  aggro:0.8 }
};

// ---------- canvas: visualViewport sizing (never overflow) ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1, viewScale = 1;
function fit() {
  const vv = window.visualViewport;
  const iw = vv ? vv.width : window.innerWidth;
  const ih = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(iw / W, ih / H);   // contain-fit: never overflow
  viewScale = s;
  canvas.width = Math.max(2, Math.round(W * s * dpr));
  canvas.height = Math.max(2, Math.round(H * s * dpr));
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  G.view = { iw: iw, ih: ih, s: s, cw: W * s, ch: H * s };
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => { fit(); setTimeout(fit, 120); setTimeout(fit, 500); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

// ---------- audio: all synth ----------
let AC = null, muted = false, crowdGain = null;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return;
  try {
    const ac = audio(), t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { /* audio unavailable — game still runs */ }
}
function ensureCrowd() {
  if (crowdGain || muted) return;
  try {
    const ac = audio();
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 750; bp.Q.value = 0.5;
    crowdGain = ac.createGain(); crowdGain.gain.value = 0;
    src.connect(bp); bp.connect(crowdGain); crowdGain.connect(ac.destination);
    src.start();
  } catch (e) { /* no crowd — fine */ }
}
const sfx = {
  paddle(rally) {
    const f = 280 + Math.min(rally, 26) * 26;
    tone(f, 0.07, 'square', 0.13);
    tone(f * 2, 0.045, 'triangle', 0.07);
  },
  wall()        { tone(210, 0.045, 'triangle', 0.09); },
  scoreGood()   { [523, 659, 784].forEach((f, i) => tone(f, 0.11, 'square', 0.11, 0, i * 0.07)); },
  scoreBad()    { [392, 311, 262].forEach((f, i) => tone(f, 0.11, 'sawtooth', 0.09, 0, i * 0.07)); },
  launch()      { tone(880, 0.06, 'square', 0.1); },
  ready()       { tone(440, 0.08, 'square', 0.09); tone(660, 0.08, 'square', 0.07, 0, 0.09); },
  rally10()     { tone(660, 0.06, 'square', 0.1); tone(880, 0.09, 'square', 0.1, 0, 0.06); },
  matchPoint()  { tone(988, 0.09, 'square', 0.11); tone(988, 0.09, 'square', 0.11, 0, 0.14); },
  win()         { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'square', 0.12, 0, i * 0.11)); },
  lose()        { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.18, 'sawtooth', 0.1, 0, i * 0.13)); },
  click()       { tone(520, 0.05, 'square', 0.08); }
};
function unlockAudio() { try { audio(); ensureCrowd(); } catch (e) {} }
window.addEventListener('pointerdown', unlockAudio, { passive: true });
window.addEventListener('keydown', unlockAudio);
window.addEventListener('touchstart', unlockAudio, { passive: true });

// ---------- records ----------
const REC_KEY = 'rally_v1';
let rec = { bestRally: 0, ladderBest: 0, quickWins: 0, versusL: 0, versusR: 0 };
try {
  const raw = localStorage.getItem(REC_KEY);
  if (raw) rec = Object.assign(rec, JSON.parse(raw));
} catch (e) {}
function saveRec() { try { localStorage.setItem(REC_KEY, JSON.stringify(rec)); } catch (e) {} }

// ---------- game state ----------
const G = {
  state: 'menu',   // menu|howto|diff|ladderIntro|serve|play|point|over|champion
  match: null,     // null | 'ladder' | 'quick' | 'versus'
  paused: false,
  scoreL: 0, scoreR: 0,
  rally: 0, bestRallyMatch: 0,
  serveTimer: 0, serveDir: 1,
  pointTimer: 0,
  hitstop: 0, trauma: 0, flash: 0,
  slowT: 0, matchPoint: false,
  winner: 0, lastScorer: null,
  time: 0,
  ladderIdx: 0, ai: null,          // ai = active profile object
  quickLabel: '',
  view: { iw: 0, ih: 0, s: 1, cw: 0, ch: 0 },
  wallGlow: 0
};
const ball = { x: W/2, y: H/2, vx: 0, vy: 0, r: BALL_R, trail: [], visible: true };
const padL = { x: 38, y: H/2, vy: 0, squash: 0, w: 10, h: 142 };
const padR = { x: W - 38, y: H/2, vy: 0, squash: 0, w: 18, h: 96 };
let aiClock = 0, aiTargetY = H / 2;
const parts = [], popups = [];
const hot = [];   // tap hit-regions, rebuilt each render
let isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function inMatch() { return G.match !== null && (G.state === 'serve' || G.state === 'play' || G.state === 'point'); }

// ---------- flow ----------
function resetPositions() {
  padL.y = H / 2; padL.vy = 0; padL.squash = 0;
  padR.y = H / 2; padR.vy = 0; padR.squash = 0;
  ball.x = W / 2; ball.y = H / 2; ball.vx = 0; ball.vy = 0;
  ball.trail.length = 0; ball.visible = true;
  parts.length = 0;
}
function toMenu() {
  G.state = 'menu'; G.match = null; G.paused = false;
  G.trauma = 0; G.hitstop = 0; G.flash = 0; G.slowT = 0;
  popups.length = 0;
}
function startMatch() {
  G.scoreL = 0; G.scoreR = 0; G.rally = 0; G.bestRallyMatch = 0;
  G.winner = 0; G.paused = false; G.trauma = 0; G.hitstop = 0; G.flash = 0; G.slowT = 0;
  popups.length = 0;
  resetPositions();
  serve(Math.random() < 0.5 ? -1 : 1);
}
function startLadder() {
  G.match = 'ladder'; G.ladderIdx = 0; G.ai = LADDER[0];
  G.state = 'ladderIntro'; sfx.click();
}
function startQuick(diffKey) {
  G.match = 'quick'; G.ai = QUICK_DIFF[diffKey]; G.quickLabel = QUICK_DIFF[diffKey].label;
  G.state = 'serve'; sfx.click();
  startMatch();
}
function startVersus() {
  G.match = 'versus'; G.ai = null;
  sfx.click();
  startMatch();
}
function serve(dir) {
  resetPositions();
  ball.visible = false;
  G.state = 'serve';
  G.serveTimer = 1.15;
  G.serveDir = dir;
  G.matchPoint = (G.scoreL === WIN_SCORE - 1 || G.scoreR === WIN_SCORE - 1);
  if (G.matchPoint) sfx.matchPoint(); else sfx.ready();
}
function launch() {
  const ang = (Math.random() * 0.9 - 0.45);
  const s = BASE_SPEED;
  ball.vx = G.serveDir * s * Math.cos(ang);
  ball.vy = s * Math.sin(ang);
  ball.visible = true;
  G.state = 'play';
  sfx.launch();
}
function burst(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = spd * (0.3 + Math.random() * 0.7);
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0.45 + Math.random() * 0.35, max: 0.8, size: 2 + Math.random() * 3, color: color });
  }
}
function addPopup(text, x, y, color, size) {
  popups.push({ text: text, x: x, y: y, color: color || '#fff', size: size || 30, life: 1.2, max: 1.2 });
}
function onPaddleHit(p, rel, dir) {
  const maxA = Math.PI / 3;
  const ang = clamp(rel, -1, 1) * maxA;
  let speed = Math.hypot(ball.vx, ball.vy);
  speed = Math.min(speed * 1.045 + 14, MAX_SPEED);
  ball.vx = dir * speed * Math.cos(ang);
  ball.vy = speed * Math.sin(ang) + clamp(p.vy, -1200, 1200) * 0.28;
  const maxVy = speed * 0.92;
  if (Math.abs(ball.vy) > maxVy) {
    ball.vy = Math.sign(ball.vy) * maxVy;
    ball.vx = dir * Math.sqrt(Math.max(speed * speed - ball.vy * ball.vy, speed * speed * 0.1));
  }
  if (Math.abs(ball.vy) < 50) ball.vy = 50 * (ball.vy >= 0 ? 1 : -1);
  ball.x = p.x + dir * (p.w / 2 + ball.r + 1);
  G.rally++;
  G.bestRallyMatch = Math.max(G.bestRallyMatch, G.rally);
  G.hitstop = 0.028 + (speed / MAX_SPEED) * 0.035;
  G.trauma = Math.min(1, G.trauma + 0.30);
  p.squash = 1;
  burst(ball.x, ball.y, 12, dir === 1 ? COL_L : COL_R, 260);
  sfx.paddle(G.rally);
  if (G.rally % 10 === 0) {
    addPopup('RALLY ' + G.rally, W / 2, H / 2 - 120, COL_GOLD, 34);
    sfx.rally10();
  }
}
function onWall(top) {
  G.trauma = Math.min(1, G.trauma + 0.07);
  G.wallGlow = 1;
  burst(ball.x, clamp(ball.y, 8, H - 8), 5, '#ffffff', 150);
  sfx.wall();
}
function playerWonPoint() {
  // in ladder/quick the player is always left
  if (G.match === 'versus') return G.lastScorer === 'L' ? 'L' : 'R';
  return G.lastScorer === 'L';
}
function onPoint(side) {
  if (side === 'L') G.scoreL++; else G.scoreR++;
  G.lastScorer = side;
  G.state = 'point';
  G.pointTimer = 1.5;
  G.rally = 0;
  G.trauma = 1;
  G.flash = 1;
  G.hitstop = 0.09;
  ball.visible = false;
  burst(clamp(ball.x, 20, W - 20), clamp(ball.y, 20, H - 20), 42, side === 'L' ? COL_L : COL_R, 420);
  if (G.match === 'versus') { sfx.scoreGood(); }
  else if (side === 'L') sfx.scoreGood(); else sfx.scoreBad();
  if (G.scoreL >= WIN_SCORE || G.scoreR >= WIN_SCORE) {
    G.winner = G.scoreL >= WIN_SCORE ? 1 : 2;
    G.slowT = 0.9;   // dramatic slow-mo on the winning point
  }
}
function finishMatch() {
  G.state = 'over';
  const won = G.match === 'versus' ? true : (G.winner === 1);
  if (G.bestRallyMatch > rec.bestRally) rec.bestRally = G.bestRallyMatch;
  if (G.match === 'ladder' && won) rec.ladderBest = Math.max(rec.ladderBest, G.ladderIdx + 1);
  if (G.match === 'quick' && won) rec.quickWins++;
  if (G.match === 'versus') { if (G.winner === 1) rec.versusL++; else rec.versusR++; }
  saveRec();
  if (won) sfx.win(); else sfx.lose();
}
function primaryAction() {
  // what Space/Enter/tap-primary does per state
  if (G.state === 'ladderIntro') { sfx.click(); startMatch(); }
  else if (G.state === 'over') {
    if (G.match === 'ladder' && G.winner === 1) {
      if (G.ladderIdx < LADDER.length - 1) { G.ladderIdx++; G.ai = LADDER[G.ladderIdx]; G.state = 'ladderIntro'; sfx.click(); }
      else { G.state = 'champion'; sfx.click(); }
    } else if (G.match === 'ladder') { G.state = 'ladderIntro'; sfx.click(); }  // retry
    else if (G.match === 'quick') { sfx.click(); startMatch(); }
    else if (G.match === 'versus') { sfx.click(); startMatch(); }
  }
  else if (G.state === 'champion') toMenu();
}
function doButton(id) {
  switch (id) {
    case 'ladder': startLadder(); break;
    case 'quick': G.state = 'diff'; sfx.click(); break;
    case 'versus': startVersus(); break;
    case 'howto': G.state = 'howto'; sfx.click(); break;
    case 'back': toMenu(); sfx.click(); break;
    case 'diffEasy': startQuick('easy'); break;
    case 'diffNormal': startQuick('normal'); break;
    case 'diffHard': startQuick('hard'); break;
    case 'begin': primaryAction(); break;
    case 'primary': primaryAction(); break;
    case 'menu': toMenu(); sfx.click(); break;
    case 'resume': G.paused = false; sfx.click(); break;
    case 'restart': sfx.click(); startMatch(); break;
    case 'quit': toMenu(); sfx.click(); break;
  }
}

// ---------- input ----------
const keys = {};
let mouseSeen = false, mouseY = H / 2;
const touches = new Map(); // pointerId -> {x, y, side}

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function touchSideFor(x) {
  if (G.match === 'versus') return x < W / 2 ? 'L' : 'R';
  return 'L';
}
canvas.addEventListener('pointermove', (e) => {
  const p = toLogical(e);
  if (e.pointerType === 'mouse') { mouseSeen = true; mouseY = p.y; }
  else { const t = touches.get(e.pointerId); if (t) { t.x = p.x; t.y = p.y; } }
});
canvas.addEventListener('pointerdown', (e) => {
  const p = toLogical(e);
  if (e.pointerType === 'touch' || e.pointerType === 'pen') isTouch = true;
  if (e.pointerType === 'mouse') { mouseSeen = true; mouseY = p.y; }
  // pause button (touch, during play)
  if (isTouch && inMatch() && !G.paused && hitPauseBtn(p.x, p.y)) { togglePause(); return; }
  if (e.pointerType !== 'mouse') touches.set(e.pointerId, { x: p.x, y: p.y, side: touchSideFor(p.x) });
  onTap(p.x, p.y);
});
function endPointer(e) { touches.delete(e.pointerId); }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) { keys[e.code] = true; handleKey(e.code); }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && inMatch()) G.paused = true;
});

function togglePause() {
  if (inMatch()) { G.paused = !G.paused; sfx.click(); }
}
function pauseBtnRect() { return { x: W - 84, y: 12, w: 72, h: 72 }; }
function hitPauseBtn(x, y) {
  const r = pauseBtnRect();
  return x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h;
}
function handleKey(code) {
  if (code === 'KeyM') { muted = !muted; if (!muted) ensureCrowd(); return; }
  if (code === 'KeyP') { togglePause(); return; }
  if (code === 'Escape') {
    if (G.paused) { G.paused = false; return; }
    if (G.match) { toMenu(); sfx.click(); }
    return;
  }
  if (code === 'Space' || code === 'Enter') {
    if (G.paused) { G.paused = false; sfx.click(); return; }
    if (['ladderIntro', 'over', 'champion'].includes(G.state)) { primaryAction(); return; }
  }
  if (G.state === 'menu') {
    if (code === 'Digit1' || code === 'Numpad1') startLadder();
    else if (code === 'Digit2' || code === 'Numpad2') { G.state = 'diff'; sfx.click(); }
    else if (code === 'Digit3' || code === 'Numpad3') startVersus();
    else if (code === 'Digit4' || code === 'Numpad4') { G.state = 'howto'; sfx.click(); }
    return;
  }
  if (G.state === 'diff') {
    if (code === 'Digit1' || code === 'Numpad1') startQuick('easy');
    else if (code === 'Digit2' || code === 'Numpad2') startQuick('normal');
    else if (code === 'Digit3' || code === 'Numpad3') startQuick('hard');
    else if (code === 'Escape') { G.state = 'menu'; sfx.click(); }
    return;
  }
  if ((G.state === 'howto' || G.state === 'ladderIntro') && code === 'Escape') { toMenu(); sfx.click(); }
}
function onTap(x, y) {
  if (G.paused) {
    for (const b of hot) {
      if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { doButton(b.id); return; }
    }
    return;
  }
  for (const b of hot) {
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { doButton(b.id); return; }
  }
}

// ---------- update (fixed timestep) ----------
function playerPaddle(p, side, upCode, downCode) {
  const old = p.y;
  let t = null;
  for (const o of touches.values()) { if (o.side === side) { t = o; break; } }
  if (t) {
    // touch: 1:1 direct drag — paddle follows the finger exactly
    p.y = clamp(t.y, p.h / 2 + 8, H - p.h / 2 - 8);
  } else {
    let v = 0;
    if (keys[upCode]) v -= 1;
    if (keys[downCode]) v += 1;
    if (v !== 0) {
      p.y += v * 660 * STEP;
    } else if (mouseSeen && side === 'L' && G.match !== 'versus') {
      p.y += (mouseY - p.y) * Math.min(1, STEP * 22);
    }
    p.y = clamp(p.y, p.h / 2 + 8, H - p.h / 2 - 8);
  }
  p.vy = (p.y - old) / STEP;
}
function predictY(tx) {
  // project ball y at plane tx, reflecting off walls (AI lookahead)
  let x = ball.x, y = ball.y;
  const vx = ball.vx, vy = ball.vy;
  if (vx <= 0) return y;
  const t = (tx - x) / vx;
  if (t < 0) return y;
  y += vy * t;
  const r = BALL_R, h = H - 2 * r;
  let yy = (y - r) % (2 * h);
  if (yy < 0) yy += 2 * h;
  if (yy > h) yy = 2 * h - yy;
  return yy + r;
}
function aiUpdate(p, prof, dt) {
  const old = p.y;
  aiClock -= dt;
  if (aiClock <= 0) {
    aiClock = prof.react;
    let tgt;
    const tx = p.x - p.w / 2 - BALL_R;
    if (ball.vx > 0 && ball.visible) {
      tgt = prof.predict ? predictY(tx) : ball.y;
      tgt += (Math.random() * 2 - 1) * prof.err;
      if (prof.aggro > 0 && ball.x > W * 0.55) {
        // aim returns: offset paddle so contact lands off-center toward a corner
        tgt += (ball.y < H / 2 ? -1 : 1) * prof.aggro * 30;
      }
    } else {
      tgt = H / 2 + Math.sin(G.time * 1.3) * 40;   // idle drift home
    }
    aiTargetY = clamp(tgt, p.h / 2 + 8, H - p.h / 2 - 8);
  }
  const d = aiTargetY - p.y, m = prof.speed * dt;
  p.y += clamp(d, -m, m);
  p.y = clamp(p.y, p.h / 2 + 8, H - p.h / 2 - 8);
  p.vy = (p.y - old) / dt;
}
function collidePaddle(p, dir) {
  if (dir === 1 && ball.vx >= 0) return;
  if (dir === -1 && ball.vx <= 0) return;
  const hw = p.w / 2, hh = p.h / 2;
  if (ball.x + ball.r > p.x - hw && ball.x - ball.r < p.x + hw &&
      ball.y + ball.r > p.y - hh && ball.y - ball.r < p.y + hh) {
    onPaddleHit(p, (ball.y - p.y) / hh, dir);
  }
}
function update(dt) {
  G.time += dt;
  G.trauma = Math.max(0, G.trauma - dt * 1.7);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  G.wallGlow = Math.max(0, G.wallGlow - dt * 3);
  padL.squash = Math.max(0, padL.squash - dt * 3.5);
  padR.squash = Math.max(0, padR.squash - dt * 3.5);

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vx *= (1 - 3 * dt); q.vy *= (1 - 3 * dt);
    q.life -= dt;
    if (q.life <= 0) parts.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i];
    q.y -= 42 * dt; q.life -= dt;
    if (q.life <= 0) popups.splice(i, 1);
  }

  // crowd bed follows rally heat
  if (crowdGain && !muted) {
    const target = G.state === 'play' ? Math.min(0.06, G.rally * 0.005) : 0;
    const g = crowdGain.gain;
    g.value += (target - g.value) * Math.min(1, dt * 4);
  }

  if (G.state === 'serve' || G.state === 'point') {
    movePaddlesIdle(dt);
    if (G.state === 'serve') {
      G.serveTimer -= dt;
      if (G.serveTimer <= 0) launch();
    } else {
      G.pointTimer -= dt;
      if (G.pointTimer <= 0) {
        if (G.winner) finishMatch();
        else serve(G.lastScorer === 'L' ? 1 : -1);
      }
    }
    return;
  }
  if (G.state !== 'play') return;

  movePaddlesIdle(dt);

  // ball
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > 16) ball.trail.shift();

  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); onWall(true); }
  else if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); onWall(false); }

  collidePaddle(padL, 1);
  collidePaddle(padR, -1);

  if (ball.x < -40) onPoint('R');
  else if (ball.x > W + 40) onPoint('L');
}
function movePaddlesIdle(dt) {
  if (G.match === 'versus') {
    playerPaddle(padL, 'L', 'KeyW', 'KeyS');
    playerPaddle(padR, 'R', 'ArrowUp', 'ArrowDown');
  } else {
    playerPaddle(padL, 'L', 'KeyW', 'KeyS');
    aiUpdate(padR, G.ai || QUICK_DIFF.normal, dt);
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath();

  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(str, x, y, font, color, glow, glowBlur, align) {

}

// animated aurora background blobs
const blobs = [
  { cx: 0.22, cy: 0.30, r: 0.42, c1: '22,38,94',  c2: '22,38,94',  sp: 0.11, ph: 0.0, ax: 0.10, ay: 0.07 },
  { cx: 0.80, cy: 0.72, r: 0.46, c1: '11,59,70',  c2: '11,59,70',  sp: 0.08, ph: 2.1, ax: 0.08, ay: 0.10 },
  { cx: 0.62, cy: 0.18, r: 0.36, c1: '61,16,48',  c2: '61,16,48',  sp: 0.13, ph: 4.2, ax: 0.12, ay: 0.06 }
];
const dots = [];
for (let gy = 24; gy < H; gy += 48) for (let gx = 24; gx < W; gx += 48) dots.push({ x: gx, y: gy });

function drawBackground() {
  ctx.fillStyle = '#04060b';
  ctx.fillRect(-40, -40, W + 80, H + 80);
  const t = G.time;
  ctx.save();
  for (const b of blobs) {
    const x = (b.cx + Math.sin(t * b.sp + b.ph) * b.ax) * W;
    const y = (b.cy + Math.cos(t * b.sp * 0.8 + b.ph) * b.ay) * H;
    const r = b.r * H;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + b.c1 + ',0.55)');
    g.addColorStop(1, 'rgba(' + b.c2 + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.restore();
  // rally heat: warm glow rising from the floor of the arena
  const heat = clamp(G.rally / 24, 0, 1);
  if (heat > 0.01) {
    const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, H * 0.7);
    g.addColorStop(0, 'rgba(255,150,60,' + (heat * 0.10).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // dot grid, slow drift
  ctx.fillStyle = 'rgba(140,170,220,0.055)';
  const ox = (t * 6) % 48, oy = (t * 4) % 48;
  for (const d of dots) ctx.fillRect(d.x + ox - 24, d.y + oy - 24, 2, 2);
  // speed lines when the ball is screaming
  if (G.state === 'play' && ball.visible) {
    const sp = Math.hypot(ball.vx, ball.vy);
    if (sp > 720) {
      const k = clamp((sp - 720) / 500, 0, 1);
      const ang = Math.atan2(ball.vy, ball.vx);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,200,120,' + (k * 0.35).toFixed(3) + ')';
      ctx.lineWidth = 2;
      for (let i = 0; i < 9; i++) {
        const off = (Math.random() - 0.5) * 160;
        const back = 40 + Math.random() * 130;
        const px = ball.x - Math.cos(ang) * back, py = ball.y - Math.sin(ang) * back;
        const nx = -Math.sin(ang), ny = Math.cos(ang);
        ctx.beginPath();
        ctx.moveTo(px + nx * off, py + ny * off);
        ctx.lineTo(px + nx * off - Math.cos(ang) * (30 + Math.random() * 60),
                   py + ny * off - Math.sin(ang) * (30 + Math.random() * 60));
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}
function drawFrame() {

function drawPaddle(p, color) {
  const hw = p.w / 2, hh = p.h / 2;
  const sx = 1 + 0.38 * p.squash, sy = 1 - 0.26 * p.squash;
  // motion streak
  if (Math.abs(p.vy) > 500) {
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = color;
    const len = clamp(Math.abs(p.vy) * 0.05, 0, 60);
    const dir = p.vy > 0 ? -1 : 1;
    rr(p.x - hw, dir > 0 ? p.y - hh : p.y + hh - len, p.w, len, 4);
    ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(sx, sy);
  ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.fillStyle = '#f2f6fb';
  rr(-hw, -hh, p.w, p.h, 7);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  rr(-hw, -hh, p.w, 5, 3); ctx.fill();
  rr(-hw, hh - 5, p.w, 5, 3); ctx.fill();

}
function drawBall() {
  if (!ball.visible) return;
  const n = ball.trail.length;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const t = ball.trail[i], k = (i + 1) / n;
    ctx.globalAlpha = k * 0.30;
    ctx.fillStyle = COL_BALL;
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * k * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  const sp = Math.hypot(ball.vx, ball.vy);
  const heat = clamp((sp - BASE_SPEED) / (MAX_SPEED - BASE_SPEED), 0, 1);
  const stretch = 1 + Math.min(sp / 4000, 0.28);
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(Math.atan2(ball.vy, ball.vx));
  ctx.scale(stretch, 1 / Math.sqrt(stretch));
  ctx.shadowColor = heat > 0.55 ? '#ffb35c' : '#ffb43c';
  ctx.shadowBlur = 28;
  ctx.fillStyle = COL_BALL;
  ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fill();
  if (heat > 0.02) {
    ctx.globalAlpha = heat * 0.6;
    ctx.fillStyle = '#fff3d6';
    ctx.beginPath(); ctx.arc(0, 0, ball.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawParts() {

    if (isTouch && inMatch() && !G.paused) drawPauseBtn();
  }
  ctx.restore();
  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.16).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (!vignette) {
    vignette = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.95);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.42)');
  }
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
  if (G.paused && inMatch()) drawPaused();
  // state-change fade
  if (st !== lastState) { fadeT = 0.22; lastState = st; }
  if (fadeT > 0) {
    fadeT -= 1 / 60;
    ctx.fillStyle = 'rgba(2,3,6,' + clamp(fadeT / 0.22, 0, 1).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (muted) text('MUTED (M)', W - 18, 26, '500 14px ' + FONT, 'rgba(255,255,255,0.4)', null, 0, 'right');
}

let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (G.paused) { render(); return; }
  if (G.slowT > 0) {   // match-point slow-mo
    G.slowT -= rdt;
    const k = Math.max(0, G.slowT / 0.9);
    rdt *= 0.25 + 0.75 * (1 - k * k);
  }
  if (G.hitstop > 0) {
    G.hitstop -= rdt;
    G.trauma = Math.max(0, G.trauma - rdt * 1.1);
    render();
    return;
  }
  acc += rdt;
  let n = 0;
  while (acc >= STEP && n < 10) { update(STEP); acc -= STEP; n++; }
  if (n === 10) acc = 0;
  render();
}
fit();
requestAnimationFrame(frame);

// hook for automated playtesting
window.__pong = { G: G, ball: ball, padL: padL, padR: padR, LADDER: LADDER,
  startLadder: startLadder, startQuick: startQuick, startVersus: startVersus,
  doButton: doButton, toMenu: toMenu, rec: rec };
</script>
