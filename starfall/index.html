/* ================= utils ================= */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circleHit(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by, r = ar + br;
  return dx * dx + dy * dy < r * r;
}
function makeSprite(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h); return c;
}

function drawPixText(str, dx, y0, u) {
  let cx = dx;
  for (const ch of str) {
    const gl = ch === ' ' ? null : (FONT5X7[ch] || FONT5X7['?']);
    if (gl) for (let r = 0; r < gl.length; r++) {
      const row = gl[r];
      for (let c = 0; c < 5; c++)
        if (row[c] === '1') ctx.fillRect(cx + c * u, y0 + r * u, u, u);
    }
    cx += ch === ' ' ? 4 * u : 6 * u;
  }
}
// texte pixel : 'font' garde la forme '700 23px ...' — on n'en lit que la taille.
// u = unité de police en px logiques, multiple de PX pour tomber sur la grille.
function text(str, x, y, font, color, glow, glowBlur, align) {
  str = String(str).toUpperCase();
  ctx.shadowBlur = 0;   // pas de halo doux hérité : le glow est pixel, dessiné à la main
  const m = /(\d+)px/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of str) w += ch === ' ' ? 4 * u : 6 * u;
  let dx = align === 'right' ? x - w : align === 'left' ? x : x - w / 2;
  dx = Math.round(dx / PX) * PX;
  const y0 = Math.round((y - 3.5 * u) / PX) * PX;
  if (glow) {  // halo pixel : 8 voisins, d'autant plus doux que le texte est petit
    ctx.fillStyle = glow;
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * Math.min(1, Math.max(0.32, u / 18));
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      if (!ox && !oy) continue;
      drawPixText(str, dx + ox * u, y0 + oy * u, u);
    }
    ctx.globalAlpha = ga;
  }
  ctx.fillStyle = color;
  drawPixText(str, dx, y0, u);
}
// largeur d'un texte pixel (pour les pastilles qui s'ajustent au contenu)
function pixW(str, font) {
  const m = /(\d+)px/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of String(str).toUpperCase()) w += ch === ' ' ? 4 * u : 6 * u;
  return w;
}

// animated aurora background blobs

/* ================= adaptive layout ================= */
const canvas = document.getElementById('c');
const PX = 2;                                  // 1 "pixel" = 2px logiques
const pbuf = document.createElement('canvas'); // tout le jeu dessine ici,
const ctx = pbuf.getContext('2d');             // en unités logiques
const dctx = canvas.getContext('2d');          // affichage (composite)
ctx.imageSmoothingEnabled = false;             // sprites chunky
let W = 480, H = 720;               // logical playfield, set by layout()
let DEF_LINE = 560, BASE_Y = 668;  // derived
let FORM_SX = 62, FORM_SY = 46;    // formation spacing
function layout() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth;
  const vh = vv ? vv.height : window.innerHeight;
  if (vw / vh >= 1) { W = 800; H = 480; }   // landscape-first
  else { W = 480; H = 720; }                // portrait
  DEF_LINE = H * 0.78;
  BASE_Y = H - 52;
  FORM_SX = W / 7.6; FORM_SY = H / 15;
  pbuf.width = W / PX; pbuf.height = H / PX;   // buffer pixel suit le layout
}
function fit() {
  const oldW = W, oldH = H;
  layout();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth;
  const vh = vv ? vv.height : window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  canvas.width = Math.round(W * s * dpr);
  canvas.height = Math.round(H * s * dpr);
  dctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  // preserve relative positions across orientation/size change so nothing
  // teleports when the player rotates mid-game
  const sx = W / oldW, sy = H / oldH;
  const remap = (o) => { if (o) { if ('x' in o) o.x *= sx; if ('y' in o) o.y *= sy; } };
  if (typeof cannon !== 'undefined' && cannon) cannon.x = clamp(cannon.x * sx, 34, W - 34);
  if (typeof swarm !== 'undefined' && swarm) {
    swarm.cx = clamp(swarm.cx * sx, 30, W - 30);
    swarm.cy = Math.min(swarm.cy * sy, DEF_LINE - 60);
  }
  if (typeof divers !== 'undefined') divers.forEach(remap);
  if (typeof shots !== 'undefined') shots.forEach(remap);
  if (typeof frags !== 'undefined') frags.forEach(remap);
  if (typeof mothership !== 'undefined') remap(mothership);
  buildNebula();
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

/* ================= audio (all synthesized) ================= */
let AC = null, muted = false, noiseBuf = null;
function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol, delay) {
  if (muted) return;
  try {
    const ac = audio(), t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(Math.max(f0, 1), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noiseHit(dur, vol, fc, delay) {
  if (muted) return;
  try {
    const ac = audio(), t = ac.currentTime + (delay || 0);
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 1200;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(t); s.stop(t + dur + 0.03);
  } catch (e) {}
}
// iconic tension: descending 4-note bass pulse, quickens as the swarm descends
const PULSE_NOTES = [58, 55, 52, 49];
let pulseT = 0, pulseStep = 0;
function bassPulse(progress) {
  const interval = lerp(1.15, 0.26, clamp(progress, 0, 1));
  return interval;
}
const sShoot = () => tone(920, 240, 0.1, 'square', 0.06);
const sBolt  = () => tone(320, 95, 0.13, 'sawtooth', 0.045);
const sKill  = () => { noiseHit(0.22, 0.2, 900); tone(230, 42, 0.22, 'triangle', 0.13); };
const sBrute = () => { noiseHit(0.3, 0.26, 600); tone(150, 36, 0.3, 'sawtooth', 0.16); };
const sDive  = () => tone(1250, 280, 0.5, 'sine', 0.075);
const sHit   = () => { noiseHit(0.32, 0.3, 480); tone(140, 30, 0.32, 'sawtooth', 0.17); };
const sRing  = () => tone(540, 190, 0.12, 'triangle', 0.11);
const sUI    = () => tone(660, 660, 0.06, 'square', 0.055);
const sOver  = () => tone(420, 1250, 0.18, 'square', 0.07);
const sMothership = () => { for (let i = 0; i < 6; i++) tone(700 + (i % 2) * 220, 700 + (i % 2) * 220, 0.09, 'triangle', 0.06, i * 0.11); };
const sWin   = () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.14, 'square', 0.09, i * 0.11)); };
const sLose  = () => { [392, 311, 233, 155].forEach((f, i) => tone(f, f * 0.94, 0.2, 'sawtooth', 0.09, i * 0.16)); };
const sCombo = (m) => tone(500 + m * 120, 900 + m * 120, 0.12, 'square', 0.07);

/* ================= input ================= */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM') { muted = !muted; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); }
  if (e.code === 'KeyR' && (state === 'matchEnd' || state === 'gameOver' || state === 'victory')) { toMenu(); }
  if (e.code === 'Enter' && state === 'menu') { startMode('defend'); }
  audio();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
window.addEventListener('blur', () => { if (state === 'play') paused = true; });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

// pointers -> game coords; drag on bottom half steers cannon, top half steers swarm
const pointers = new Map();
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toGame(e);
  pointers.set(e.pointerId, { x: p.x, y: p.y, sx: p.x, sy: p.y, t: performance.now(), moved: false });
  handleTap(p.x, p.y);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  const pt = pointers.get(e.pointerId); if (!pt) return;
  const p = toGame(e);
  if (Math.hypot(p.x - pt.sx, p.y - pt.sy) > 10) pt.moved = true;
  pt.x = p.x; pt.y = p.y;
});
function endPointer(e) { pointers.delete(e.pointerId); }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ================= pre-rendered sprites (glow baked in, cheap at runtime) ================= */
function glowSprite(w, h, color, draw) {
  return makeSprite(w, h, (g) => {
    g.shadowColor = color; g.shadowBlur = 9;
    g.fillStyle = color; g.strokeStyle = color;
    draw(g, w, h);
  });
}
// invader silhouettes: 3 distinct types x 2 animation frames
const SPR = {};
function buildSprites() {
  const defs = {
    drifter: { c: '#ff5a3c', s: 30 },
    stinger: { c: '#ffd166', s: 26 },
    brute:   { c: '#c724b1', s: 40 },
  };
  for (const k of Object.keys(defs)) {
    const { c, s } = defs[k];
    SPR[k] = [0, 1].map(f => glowSprite(s + 22, s + 22, c, (g, w, h) => {
      const cx = w / 2, cy = h / 2, r = s / 2;
      g.beginPath();
      if (k === 'drifter') {          // classic dome + claws
        g.arc(cx, cy - 2, r * 0.72, Math.PI, 0); g.lineTo(cx + r * 0.72, cy + r * 0.4);
        g.lineTo(cx - r * 0.72, cy + r * 0.4); g.closePath(); g.fill();
        g.fillRect(cx - r * 0.95, cy + r * (f ? 0.1 : 0.45), r * 0.3, r * 0.5);
        g.fillRect(cx + r * 0.65, cy + r * (f ? 0.1 : 0.45), r * 0.3, r * 0.5);
      } else if (k === 'stinger') {   // sleek dart
        g.moveTo(cx, cy - r); g.lineTo(cx + r * 0.62, cy + r * 0.55);
        g.lineTo(cx, cy + r * 0.2); g.lineTo(cx - r * 0.62, cy + r * 0.55);
        g.closePath(); g.fill();
        g.fillRect(cx - r * 0.5, cy + r * (f ? 0.35 : 0.6), r * 0.22, r * 0.42);
        g.fillRect(cx + r * 0.28, cy + r * (f ? 0.35 : 0.6), r * 0.22, r * 0.42);
      } else {                        // brute: heavy hex hull
        for (let i = 0; i < 6; i++) {
          const a = Math.PI / 3 * i + Math.PI / 6;
          const px = cx + Math.cos(a) * r * 0.85, py = cy + Math.sin(a) * r * 0.85;
          i ? g.lineTo(px, py) : g.moveTo(px, py);
        }
        g.closePath(); g.fill();
        g.fillRect(cx - r * 0.7, cy + r * (f ? 0.5 : 0.75), r * 0.34, r * 0.4);
        g.fillRect(cx + r * 0.36, cy + r * (f ? 0.5 : 0.75), r * 0.34, r * 0.4);
      }
      // eyes (dark cutouts)
      g.shadowBlur = 0; g.fillStyle = '#04060b';
      g.fillRect(cx - r * 0.42, cy - r * 0.32, r * 0.24, r * 0.3);
      g.fillRect(cx + r * 0.18, cy - r * 0.32, r * 0.24, r * 0.3);
    }));
  }
  // cannon
  SPR.cannon = glowSprite(72, 56, '#00e5ff', (g, w, h) => {
    g.fillRect(8, h - 26, w - 16, 16);            // hull
    g.fillRect(w / 2 - 9, h - 40, 18, 16);        // turret
    g.fillRect(w / 2 - 3.5, 4, 7, 22);            // barrel
  });
  SPR.muzzle = glowSprite(40, 40, '#aef7ff', (g, w, h) => {
    g.beginPath(); g.arc(w / 2, h / 2, 13, 0, 6.283); g.fill();
  });
  // mothership: structured saucer — dark hull, lit rim, glowing dome
  SPR.mothership = makeSprite(132, 60, (g, w, h) => {
    const cx = w / 2, cy = h / 2 + 8;
    // hull body
    g.shadowColor = '#7df9ff'; g.shadowBlur = 12; g.fillStyle = '#0d3547';
    g.beginPath(); g.ellipse(cx, cy, 58, 15, 0, 0, 6.283); g.fill();
    // bright lower rim crescent
    g.shadowBlur = 6; g.strokeStyle = '#9ffbff'; g.lineWidth = 2.5;
    g.beginPath(); g.ellipse(cx, cy, 58, 15, 0, 0.12 * Math.PI, 0.88 * Math.PI); g.stroke();
    // window lights along the hull
    g.fillStyle = '#eafdff'; g.shadowColor = '#eafdff'; g.shadowBlur = 8;
    for (let i = -3; i <= 3; i++) { g.beginPath(); g.arc(cx + i * 14, cy - 1, 3, 0, 6.283); g.fill(); }
    // command dome with gradient
    const dg = g.createLinearGradient(0, cy - 28, 0, cy - 4);
    dg.addColorStop(0, '#f2feff'); dg.addColorStop(1, '#2aa8c4');
    g.fillStyle = dg; g.shadowColor = '#7df9ff'; g.shadowBlur = 10;
    g.beginPath(); g.arc(cx, cy - 6, 15, Math.PI, 0); g.closePath(); g.fill();
    // dome highlight
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,0.85)';
    g.beginPath(); g.arc(cx - 5, cy - 16, 3.5, 0, 6.283); g.fill();
  });
  // soft particle dot
  SPR.dot = makeSprite(16, 16, (g, w, h) => {
    const gr = g.createRadialGradient(8, 8, 0, 8, 8, 8);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 16, 16);
  });
}
buildSprites();

/* ================= background: parallax stars + nebula ================= */
let stars = [], shootStar = null, shootT = 8;
let nebula = null;
function mkStars() {
  stars = [];
  const n = Math.round(W * H / 5200);
  for (let i = 0; i < n; i++)
    stars.push({ x: Math.random() * W, y: Math.random() * H,
                 layer: (Math.random() * 3) | 0, tw: Math.random() * 6.28 });
}
function buildNebula() {
  nebula = makeSprite(Math.max(W, 480), Math.max(H, 480), (g, w, h) => {
    const blobs = [
      [0.22, 0.3, 0.42, 'rgba(64,32,128,0.5)'],
      [0.78, 0.62, 0.5, 'rgba(16,84,120,0.45)'],
      [0.55, 0.12, 0.34, 'rgba(128,32,88,0.32)'],
    ];
    for (const [fx, fy, fr, col] of blobs) {
      const gr = g.createRadialGradient(w * fx, h * fy, 0, w * fx, h * fy, w * fr);
      gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
  });
}
const STAR_V = [9, 22, 48], STAR_S = [1, 1.7, 2.6];
function updateBg(dt) {
  for (const s of stars) {
    s.y += STAR_V[s.layer] * dt;
    s.tw += dt * 2;
    if (s.y > H) { s.y = -4; s.x = Math.random() * W; }
  }
  shootT -= dt;
  if (shootT <= 0 && !shootStar) {
    shootT = rand(6, 16);
    shootStar = { x: rand(0, W), y: -10, vx: rand(-160, -60), vy: rand(220, 320), t: 0 };
  }
  if (shootStar) {
    shootStar.t += dt;
    shootStar.x += shootStar.vx * dt; shootStar.y += shootStar.vy * dt;
    if (shootStar.t > 1.4) shootStar = null;
  }
}
function drawBg() {
  ctx.fillStyle = '#04060b';
  ctx.fillRect(-24, -24, W + 48, H + 48);
  if (nebula) { ctx.globalAlpha = 0.8; ctx.drawImage(nebula, 0, 0, W, H); ctx.globalAlpha = 1; }
  for (const s of stars) {
    const a = 0.35 + 0.3 * Math.sin(s.tw) + s.layer * 0.12;
    ctx.fillStyle = 'rgba(170,210,235,' + clamp(a, 0.15, 0.9).toFixed(2) + ')';
    const sz = (s.layer + 1) * PX;   // 1/2/3 px buffer, sur la grille
    ctx.fillRect(Math.round(s.x / PX) * PX, Math.round(s.y / PX) * PX, sz, sz * 2);
  }
  if (shootStar) {
    // proper meteor: bright head + gradient tail, reads as a meteor not a scratch
    const t = shootStar.t / 1.4, a = 1 - t;
    const tx = shootStar.x - shootStar.vx * 0.22, ty = shootStar.y - shootStar.vy * 0.22;
    const gr = ctx.createLinearGradient(shootStar.x, shootStar.y, tx, ty);
    gr.addColorStop(0, 'rgba(235,250,255,' + (a * 0.95).toFixed(2) + ')');
    gr.addColorStop(1, 'rgba(235,250,255,0)');
    ctx.strokeStyle = gr; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(shootStar.x, shootStar.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.95).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(shootStar.x, shootStar.y, 2.2, 0, 6.283); ctx.fill();
  }
}

/* ================= state ================= */
let state = 'menu';       // menu | howto | serve | play | roundEnd | victory | gameOver | matchEnd

let banner = '', bannerT = 0, bannerSub = '', stateT = 0;

let feed = [];            // versus kill feed

let cannon, ring, units, divers, shots, bolts, frags, parts, rings /*shockwaves*/, mothership;

function resetEntities() {
  cannon = { x: W / 2, vx: 0, hp: 3, maxHp: 3, heat: 0, locked: 0, fireT: 0, inv: 0, recoil: 0 };
  ring = { ang: -Math.PI / 2, rx: Math.min(52, W * 0.09), ry: 58, hp: 4, maxHp: 4, broken: false, flash: 0 };
  units = []; divers = []; shots = []; bolts = []; frags = []; parts = []; rings = []; popups = [];

function popup(x, y, txt, color) { popups.push({ x, y, txt, color: color || '#e8f5ee', t: 0 }); }

/* ================= formations ================= */
function formationSlots(n, phase) {
  const sx = FORM_SX, sy = FORM_SY;
  const grid = (counts) => {
    const arr = [];
    counts.forEach((cn, r) => {
      for (let c = 0; c < cn; c++) arr.push({ x: (c - (cn - 1) / 2) * sx, y: r * sy });
    });
    return arr;
  };
  if (phase === 1) {
    const counts = []; let rem = n, c = 2;
    while (rem > 0) { const k = Math.min(c, rem); counts.push(k); rem -= k; c += 2; }
    return grid(counts);
  }
  if (phase === 2) {
    const half = []; let rem = n, c = 1;
    while (rem > 0) { const k = Math.min(c, rem); half.push(k); rem -= k; c += 2; }
    return grid(half.concat(half.slice(0, -1).reverse()));
  }
  if (phase === 3) {
    const arr = [];
    for (let i = 0; i < n; i++)
      arr.push({ x: rand(-1, 1) * W * 0.32, y: rand(-1, 1) * H * 0.1 });
    return arr;
  }
  // Block formation: keep it narrower than the playfield. If any |ox| exceeds
  // W*0.44 (the bound shiftFormation enforces), the edge-clamp below ping-pongs
  // every frame and the swarm plummets past DEF_LINE, ending the round instantly.
  const fitCols = Math.max(4, Math.floor((W * 0.88) / sx));
  const cols = Math.max(4, Math.min(fitCols, Math.round(W / 78)));
  const rows = Math.ceil(n / cols);
  const counts = [];
  for (let r = 0; r < rows; r++) counts.push(Math.min(cols, n - r * cols));
  return grid(counts);
}
function setFormation(phase, quiet) {
  swarm.phase = phase;
  const order = units.slice().sort((a, b) => a.seed - b.seed);
  const slots = formationSlots(order.length, phase);
  order.forEach((u, i) => { u.tox = slots[i].x; u.toy = slots[i].y; });
  if (!quiet && state === 'play' && units.length && mode !== 'defend') {
    banner = 'SWARM: ' + ['BLOCK', 'WEDGE', 'DIAMOND', 'SCATTER'][phase];
    bannerSub = ''; bannerT = 1.1; sDive();
  }
}
const TYPES = {
  drifter: { hp: 1, score: 100, diveW: 1.0, r: 13 },
  stinger: { hp: 1, score: 150, diveW: 2.2, r: 11 },
  brute:   { hp: 2, score: 300, diveW: 0.5, r: 17 },
};
function spawnSwarm(count, opts) {
  opts = opts || {};
  units = [];
  const slots = formationSlots(count, 0);
  for (let n = 0; n < count; n++) {
    // type mix escalates with wave: stingers + brutes appear later
    const wv = wave, roll = Math.random();
    let type = 'drifter';
    if (wv >= 3 && roll < 0.1 + wv * 0.02) type = 'stinger';
    if (wv >= 5 && roll > 0.86 - wv * 0.008) type = 'brute';
    const T = TYPES[type];
    units.push({ x: 0, y: 0, ox: slots[n].x, oy: slots[n].y, tox: slots[n].x, toy: slots[n].y,
                 seed: n, r: T.r, wob: Math.random() * 6.28, type, hp: T.hp, maxHp: T.hp, flash: 0 });
  }
  swarm.dir = 1;
  swarm.cx = W / 2; swarm.cy = H * 0.14;
  swarm.total = count; swarm.phase = 0;
  const wv = wave;
  swarm.baseSpeed = (30 + wv * 5) * (opts.speedMul || 1);
  swarm.boltT = 1.2;
  swarm.diveT = 2.6;
  swarm.boltBase = Math.max(0.42, 1.3 - wv * 0.07);
  swarm.diveBase = Math.max(1.1, 3.0 - wv * 0.18);
  for (const u of units) { u.x = swarm.cx + u.ox; u.y = swarm.cy + u.oy; }
}
const swarm = { dir: 1, baseSpeed: 30, boltT: 1, diveT: 2, boltBase: 1.2, diveBase: 2.6, cx: 240, cy: 100, total: 0, phase: 0 };

/* ================= mode flow ================= */
function startMode(m) {

  wins = { def: 0, inv: 0 }; feed = [];

  if (m === 'defend') { banner = 'DEFEND THE STATION'; bannerSub = 'WAVE 1 — hold the line'; }
  else if (m === 'invade') { banner = 'LEAD THE SWARM'; bannerSub = 'WAVE 1 — bring the station down'; }
  else { banner = 'VERSUS'; bannerSub = 'FIRST TO 3 ROUNDS'; }
  bannerT = 1.8; state = 'serve'; stateT = 0; paused = false;
  sUI();
}
function nextRound() {
  round++;
  resetEntities();
  spawnSwarm(15);
  banner = 'ROUND ' + round; bannerSub = mode === 'versus' ? wins.def + ' — ' + wins.inv : '';
  bannerT = 1.5; state = 'serve'; stateT = 0; paused = false;
}

  wave++;
  resetEntities();
  const count = 12 + Math.min((wave - 1) * 2, 14);
  spawnSwarm(count);
  banner = 'WAVE ' + wave; bannerSub = wave % 4 === 0 ? '!! MOTHERSHIP DETECTED !!' : '';
  bannerT = 1.5; state = 'serve'; stateT = 0; paused = false;

/* ================= combat ================= */
function shockwave(x, y, color, maxR) {
  rings.push({ x, y, r: 6, maxR: maxR || 46, color: color || '#ffd166', t: 0 });
}
function explode(x, y, color, n, spd) {
  for (let i = 0; i < (n || 14); i++) {
    const a = Math.random() * 6.283, s = (spd || 160) * (0.3 + Math.random() * 0.9);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                 life: 0.5 + Math.random() * 0.45, t: 0, color: color || '#ffd166', r: 2 + Math.random() * 2.6 });
  }
  shockwave(x, y, color, 40);
}
function addTrauma(n) { trauma = Math.min(1, trauma + n); }
function addScore(base, x, y) {
  const pts = base * mult;
  score += pts;
  if (x !== undefined) popup(x, y, '+' + pts, mult > 1 ? '#ffd166' : '#e8f5ee');
  return pts;
}
function killUnit(i, byPlayer) {
  const u = units[i];
  if (!u) return;
  units.splice(i, 1);
  u.hp--;
  if (u.hp > 0) {
    // brute takes another hit: flash, knock back into formation
    units.splice(i, 0, u);
    u.flash = 0.18;
    explode(u.x, u.y, '#c724b1', 8, 130);
    sBrute(); addTrauma(0.14);
    return;
  }
  explode(u.x, u.y, u.type === 'stinger' ? '#ffd166' : u.type === 'brute' ? '#c724b1' : '#ff5a3c', 16, 195);
  for (let k = 0; k < 3; k++)
    frags.push({ x: u.x + rand(-5, 5), y: u.y, vx: rand(-85, 85), vy: rand(60, 180), r: 3.2, t: 0 });
  sKill(); addTrauma(0.26); hitstop = Math.max(hitstop, 0.05);
  if (byPlayer && (mode === 'defend' || mode === 'versus')) {
    streak++;
    chainT = 2.5;   // keep the chain alive with quick follow-up kills
    const nm = Math.min(5, 1 + Math.floor(streak / 4));
    if (nm > mult) { mult = nm; sCombo(mult); popup(u.x, u.y - 26, 'COMBO x' + mult, '#ffd166'); }
    const T = TYPES[u.type];
    addScore(T.score, u.x, u.y);
    if (mode === 'versus') feedAdd((humanDefSide() ? 'STATION' : 'SWARM') + ' +' + (T.score * mult), '#ffd166');
  }

}
function humanDefSide() { return true; } // versus feed labels the defender side
function diveUnit(i) {
  const u = units.splice(i, 1)[0];

}
function damageCannon(byDiver) {
  if (cannon.inv > 0) return;
  cannon.hp--; cannon.inv = 1.2;
  streak = 0; mult = 1;
  explode(cannon.x, BASE_Y, '#00e5ff', 24, 250);
  sHit(); addTrauma(0.65); hitstop = Math.max(hitstop, 0.09); flashT = 0.22;
  if (mode === 'versus') feedAdd(byDiver ? 'DIVER HIT!' : 'BOLT HIT!', '#ff5a3c');
}
function ringNode() {
  return { x: cannon.x + Math.cos(ring.ang) * ring.rx,
           y: BASE_Y + Math.sin(ring.ang) * ring.ry };
}
function damageRing() {
  if (ring.broken) return;
  ring.hp--; ring.flash = 0.2;
  const n = ringNode();
  explode(n.x, n.y, '#00e5ff', 8, 120);
  sRing();

}
function repairRing(n) {
  if (ring.broken) { ring.broken = false; ring.hp = Math.min(n, ring.maxHp); }
  else ring.hp = Math.min(ring.maxHp, ring.hp + n);
}
function damageMothership() {
  if (!mothership) return;
  mothership.hp--;
  explode(mothership.x, mothership.y, '#7df9ff', 10, 150);
  if (mothership.hp <= 0) {
    explode(mothership.x, mothership.y, '#7df9ff', 30, 280);
    sKill(); addTrauma(0.4);
    addScore(400, mothership.x, mothership.y);

    repairRing(1);

/* ================= update ================= */
function humanDef() { return mode === 'defend' || mode === 'versus'; }
function humanInv() { return mode === 'invade' || mode === 'versus'; }

function update(dt) {
  time += dt;
  updateBg(dt);
  if (bannerT > 0) bannerT -= dt;
  if (flashT > 0) flashT -= dt;
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 1.1);
  for (const f of feed) f.t += dt;
  trauma = Math.max(0, trauma - dt * 1.7);
  if (chainT > 0) { chainT -= dt; if (chainT <= 0) { streak = 0; mult = 1; } }
  if (slowT > 0) { slowT -= dt; timeScale = 0.3; }
  else timeScale = Math.min(1, timeScale + dt * 4);

  if (state !== 'play' || paused) return;
  stateT += dt;
  const sdt = dt * timeScale;   // world runs in slow-mo; timers below use real dt

  /* --- cannon --- */
  const c = cannon;
  let move = 0;
  if (humanDef()) {
    if (keys.ArrowLeft || keys.KeyA) move -= 1;
    if (keys.ArrowRight || keys.KeyD) move += 1;
    // touch: 1:1 drag on bottom half (finger = cannon)
    for (const p of pointers.values()) {
      if (p.y > H * 0.5) c.x = p.x;   // direct set, no lag
    }
  } else {
    move = aiCannon(dt);
  }
  c.vx = move * (W * 0.75);
  c.x = clamp(c.x + c.vx * sdt, 34, W - 34);
  if (c.inv > 0) c.inv -= sdt;
  if (c.recoil > 0) c.recoil -= sdt * 6;
  // heat + fire
  c.heat = Math.max(0, c.heat - 34 * sdt);
  if (c.locked > 0) { c.locked -= sdt; if (c.heat < 25) c.locked = 0; }
  c.fireT -= sdt;
  const wantFire = humanDef() ? true : aiWantsFire();
  if (wantFire && c.fireT <= 0 && c.locked <= 0) {
    c.fireT = 0.22;
    c.heat += 11;
    c.recoil = 1;
    shots.push({ x: c.x - 8, y: BASE_Y - 22, vx: 0, vy: -H * 0.92 });
    shots.push({ x: c.x + 8, y: BASE_Y - 22, vx: 0, vy: -H * 0.92 });
    parts.push({ x: c.x, y: BASE_Y - 26, vx: 0, vy: -70, life: 0.1, t: 0, color: '#aef7ff', r: 7 });
    sShoot();
    if (c.heat >= 100) { c.locked = 1; sOver(); popup(c.x, BASE_Y - 40, 'OVERHEAT', '#ff3b30'); }
  }
  if (!ring.broken) { ring.ang += sdt * 2.4; if (ring.flash > 0) ring.flash -= sdt; }

  /* --- the iconic pulse: bass quickens as the swarm descends --- */
  if ((mode === 'defend' || mode === 'versus') && units.length) {
    pulseT -= dt;
    if (pulseT <= 0) {
      pulseT = bassPulse(swarm.cy / DEF_LINE);
      tone(PULSE_NOTES[pulseStep % 4], PULSE_NOTES[pulseStep % 4] * 0.99, 0.16, 'square', 0.075);
      pulseStep++;
    }
  }

  /* --- swarm march --- */
  const alive = units.length;
  const spd = swarm.baseSpeed * swarm.dir;
  swarm.cx += spd * sdt;
  let minO = 1e9, maxO = -1e9;
  for (const u of units) { if (u.ox < minO) minO = u.ox; if (u.ox > maxO) maxO = u.ox; }
  let hitEdge = false;
  if (units.length) {
    if (maxO - minO > W - 52) {
      // pathological: formation wider than the field — center it and never
      // descend, instead of ping-ponging between edges every frame.
      swarm.cx = W / 2;
    }
    else if (swarm.cx + minO < 26) { swarm.cx = 26 - minO; if (swarm.dir < 0) { swarm.dir = 1; hitEdge = true; } }
    else if (swarm.cx + maxO > W - 26) { swarm.cx = W - 26 - maxO; if (swarm.dir > 0) { swarm.dir = -1; hitEdge = true; } }
  }
  if (hitEdge) swarm.cy += FORM_SY * 0.55;
  const frac = swarm.total ? alive / swarm.total : 1;
  const wantPhase = frac <= 0.2 ? 3 : frac <= 0.4 ? 2 : frac <= 0.66 ? 1 : 0;
  if (wantPhase !== swarm.phase) setFormation(wantPhase);
  for (const u of units) {
    u.wob += sdt * 3;
    if (u.flash > 0) u.flash -= sdt;
    const k = Math.min(1, sdt * 2.6);
    u.ox += (u.tox - u.ox) * k;
    u.oy += (u.toy - u.oy) * k;
    u.x = swarm.cx + u.ox;
    u.y = swarm.cy + u.oy;
  }
  for (const u of units) {
    if (u.y > DEF_LINE) { endRound('inv'); return; }
  }

  /* --- invader control --- */
  if (humanInv()) {
    if (keys.ArrowLeft || keys.KeyA) shiftFormation(-1, sdt);
    if (keys.ArrowRight || keys.KeyD) shiftFormation(1, sdt);
    // touch: drag on top half steers the swarm 1:1 with finger direction
    for (const p of pointers.values()) {
      if (p.y < H * 0.5 && p.moved) shiftFormation((p.x - W / 2) / (W / 2), sdt);
    }
  } else {
    aiSwarm(sdt);
  }
  if (humanInv() && diveKeyPressed()) {
    const idx = pickWeightedDiveUnit();
    if (idx >= 0) diveUnit(idx);
  }

  /* --- enemy bolts --- */
  swarm.boltT -= sdt;
  if (swarm.boltT <= 0 && units.length) {
    swarm.boltT = swarm.boltBase * rand(0.8, 1.2);
    const u = units[(Math.random() * units.length) | 0];
    const aim = c.x + rand(-65, 65);
    const dx = aim - u.x, dy = BASE_Y - u.y;
    const m = Math.hypot(dx, dy) || 1, sp = H * 0.37;
    bolts.push({ x: u.x, y: u.y + 10, vx: dx / m * sp, vy: dy / m * sp, r: 4.5 });
    sBolt();
  }

  /* --- dives --- */
  swarm.diveT -= sdt;
  if (swarm.diveT <= 0 && units.length > 3) {
    swarm.diveT = humanInv() ? 9999 : swarm.diveBase * rand(0.8, 1.3);
    if (!humanInv()) { const i = pickWeightedDiveUnit(); if (i >= 0) diveUnit(i); }
  }

  /* --- mothership --- */
  if (mothership) {
    const ms = mothership;
    ms.wob += sdt * 5;
    ms.x += ms.dir * W * 0.14 * sdt;
    if (ms.dir > 0 && ms.x > W + 80) mothership = null;
    if (ms.dir < 0 && ms.x < -80) mothership = null;
  }

  updateProjectiles(sdt);
  updateParticles(sdt);
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += sdt; r.r += sdt * 260;
    if (r.r >= r.maxR) rings.splice(i, 1);
  }

  /* --- round end checks --- */
  if (c.hp <= 0) { endRound('inv'); return; }
  if (units.length === 0 && divers.length === 0 && !mothership) { endRound('def'); return; }
}

let _diveKeyLatch = false;
function diveKeyPressed() {
  const down = !!(keys.Space || keys.KeyS || keys.ArrowDown);
  const p = down && !_diveKeyLatch;
  _diveKeyLatch = down;
  return p;
}
function shiftFormation(dir, dt) {
  for (const u of units) {
    u.ox = clamp(u.ox + dir * W * 0.4 * dt, -W * 0.44, W * 0.44);
    u.tox = u.ox;
  }
}
function pickWeightedDiveUnit() {
  // front-most units dive; stingers are eager
  let bi = -1, bs = -1;
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    const s = u.y * TYPES[u.type].diveW + Math.random() * 30;
    if (s > bs) { bs = s; bi = i; }
  }
  return bi;
}

/* ================= AI ================= */
function aiCannon(dt) {
  const c = cannon;
  const lvl = mode === 'invade' ? wave : 1;
  let tx = W / 2, urgent = false, bestD = 1e9;
  for (const d of divers) {
    const dd = Math.abs(d.x - c.x) + (BASE_Y - d.y) * 0.4;
    if (dd < bestD) { bestD = dd; tx = d.x; }
  }
  if (divers.length) urgent = true;
  else {
    for (const b of bolts) {
      if (b.vy > 0 && b.y < BASE_Y && Math.abs(b.x - c.x) < 190) { tx = c.x + (c.x - b.x); urgent = true; break; }
    }
    if (!urgent && units.length) {
      let bu = units[0]; bestD = 1e9;
      for (const u of units) { const dd = Math.abs(u.x - c.x); if (dd < bestD) { bestD = dd; bu = u; } }
      tx = bu.x;
    }
  }
  const err = Math.sin(time * 0.9) * Math.max(8, 36 - lvl * 5);
  const diff = (tx + err) - c.x;
  if (Math.abs(diff) < 8) return 0;
  return Math.sign(diff);
}
function aiWantsFire() {
  if (!units.length && !divers.length) return false;
  for (const u of units) if (Math.abs(u.x - cannon.x) < 60) return true;
  for (const d of divers) if (Math.abs(d.x - cannon.x) < 60) return true;
  return Math.random() < 0.02;
}
function aiSwarm(dt) {
  let avg = 0;
  for (const u of units) avg += u.x;
  if (units.length) avg /= units.length;
  const diff = cannon.x - avg;
  if (Math.abs(diff) > 30) shiftFormation(Math.sign(diff) * 0.7, dt);
}

/* ================= projectiles & collisions ================= */
function updateProjectiles(dt) {
  const c = cannon;
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y < -20) {
      shots.splice(i, 1);
      continue;   // misses don't break the chain — only damage does
    }
    let hit = false;
    if (mothership && circleHit(s.x, s.y, 6, mothership.x, mothership.y, 44)) {
      damageMothership(); hit = true;
    }
    if (!hit) for (let j = units.length - 1; j >= 0; j--) {
      if (circleHit(s.x, s.y, 5, units[j].x, units[j].y, units[j].r)) {
        killUnit(j, true); hit = true; break;
      }
    }
    if (!hit) for (let j = divers.length - 1; j >= 0; j--) {
      const d = divers[j];
      if (circleHit(s.x, s.y, 5, d.x, d.y, d.r)) {
        explode(d.x, d.y, '#ff5a3c', 14, 180);
        divers.splice(j, 1); sKill(); addTrauma(0.2);
        if (mode === 'defend' || mode === 'versus') {
          streak++;
          chainT = 2.5;
          const nm = Math.min(5, 1 + Math.floor(streak / 4));
          if (nm > mult) { mult = nm; sCombo(mult); }
          addScore(150, d.x, d.y);
          if (mode === 'versus') feedAdd('DIVER DOWN +' + (150 * mult), '#ffd166');
        }
        hit = true; break;
      }
    }
    if (hit) shots.splice(i, 1);
  }

  // divers: screaming run at the cannon, with trails
  for (let i = divers.length - 1; i >= 0; i--) {
    const d = divers[i];
    d.wob += dt * 6;
    d.trailT -= dt;
    if (d.trailT <= 0) {
      d.trailT = 0.03;
      parts.push({ x: d.x + rand(-4, 4), y: d.y - 8, vx: rand(-20, 20), vy: rand(-40, 0),
                   life: 0.35, t: 0, color: '#ff7a4d', r: 3 });
    }
    const tx = c.x + c.vx * 0.25, ty = BASE_Y;
    const dx = tx - d.x, dy = ty - d.y, m = Math.hypot(dx, dy) || 1;
    const sp = H * 0.6;
    d.vx += ((dx / m * sp) - d.vx) * Math.min(1, dt * 3.2);
    d.vy += ((dy / m * sp) - d.vy) * Math.min(1, dt * 3.2);
    d.x += d.vx * dt; d.y += d.vy * dt;
    let dead = false;
    if (!ring.broken) {
      const n = ringNode();
      if (circleHit(d.x, d.y, d.r, n.x, n.y, 12)) {
        damageRing(); explode(d.x, d.y, '#ff5a3c', 10, 150); divers.splice(i, 1); dead = true;
      }
    }
    if (dead) continue;
    if (circleHit(d.x, d.y, d.r - 2, c.x, BASE_Y, 20)) {
      damageCannon(true); divers.splice(i, 1); continue;
    }
    if (d.y > H - 12) { explode(d.x, H - 14, '#ff5a3c', 12, 160); divers.splice(i, 1); }
  }

  // enemy bolts
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 10 || b.x < -10 || b.x > W + 10) { bolts.splice(i, 1); continue; }
    if (!ring.broken) {
      const n = ringNode();
      if (circleHit(b.x, b.y, b.r, n.x, n.y, 12)) { damageRing(); bolts.splice(i, 1); continue; }
    }
    if (circleHit(b.x, b.y, b.r, c.x, BASE_Y, 18)) { damageCannon(false); bolts.splice(i, 1); }
  }

  // fragments: falling debris, dangerous to the station
  for (let i = frags.length - 1; i >= 0; i--) {
    const f = frags[i];
    f.t += dt; f.vy += H * 0.45 * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.y > H - 8 || f.t > 4) { frags.splice(i, 1); continue; }
    if (!ring.broken) {
      const n = ringNode();
      if (circleHit(f.x, f.y, f.r, n.x, n.y, 12)) { damageRing(); frags.splice(i, 1); continue; }
    }
    if (circleHit(f.x, f.y, f.r, c.x, BASE_Y, 16)) { damageCannon(false); frags.splice(i, 1); }
  }
}
function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt * 2); p.vy *= (1 - dt * 2);
  }
}

/* ================= round / match flow ================= */
function saveBest() {
  try {
    if (mode === 'defend' && score > best.defend) { best.defend = score; localStorage.setItem('starfall_best_defend', String(score)); }
    if (mode === 'invade' && score > best.invade) { best.invade = score; localStorage.setItem('starfall_best_invade', String(score)); }
  } catch (e) {}
}
function endRound(winner) {
  state = 'roundEnd'; stateT = 0;
  addTrauma(0.5);
  streak = 0; mult = 1;
  if (mode === 'versus') {
    wins[winner === 'def' ? 'def' : 'inv']++;
    banner = winner === 'def' ? 'STATION HOLDS' : 'SWARM PREVAILS';
    bannerSub = wins.def + ' — ' + wins.inv;
    feedAdd(banner, winner === 'def' ? '#00e5ff' : '#ff5a3c');
    sWin(); bannerT = 2.2;
  } else if (mode === 'defend') {
    if (winner === 'def') {
      const bonus = 250 * wave;
      score += bonus; sWin();
      banner = 'WAVE ' + wave + ' CLEARED'; bannerSub = '+' + bonus;
      bannerT = 2.0;
      // small repairs between waves
      cannon.hp = Math.min(cannon.maxHp, cannon.hp + 1);
      repairRing(1);
      saveBest();
      if (wave >= 10 && !endless) { victory('defend'); return; }
    } else {
      sLose(); saveBest(); gameOver('defend'); return;
    }
  } else { // invade 1P
    if (winner === 'inv') {
      const bonus = 500 + units.length * 100;
      score += bonus; sWin();
      banner = 'STATION DOWN'; bannerSub = '+' + bonus + '  ·  ROUND ' + (wins.inv + 1) + '/3';
      bannerT = 2.0;
      wins.inv++;
      saveBest();
      if (wins.inv >= 3) { victory('invade'); return; }
    } else {
      lives--; sLose(); saveBest();
      if (lives <= 0) { gameOver('invade'); return; }
      banner = 'SWARM BROKEN'; bannerSub = lives + (lives === 1 ? ' LIFE' : ' LIVES') + ' LEFT';
      bannerT = 2.0;
    }
  }
}
function victory(which) {
  state = 'victory'; stateT = 0; bannerT = 0;
  banner = which === 'defend' ? 'SECTOR CLEARED' : 'THE SWARM FEASTS';
  bannerSub = 'SCORE ' + score;
  saveBest();
  sWin();
}
function gameOver(which) {
  state = 'gameOver'; stateT = 0; bannerT = 0;
  banner = 'GAME OVER';
  bannerSub = 'SCORE ' + score + '   ·   BEST ' + best[which === 'defend' ? 'defend' : 'invade'];
  saveBest();
  if (score >= best[which === 'defend' ? 'defend' : 'invade'] && score > 0) banner = 'NEW BEST!';
  sLose();
}
function advanceAfterBanner() {
  if (mode === 'versus') {
    if (wins.def >= 3 || wins.inv >= 3) {
      state = 'matchEnd'; stateT = 0;
      banner = wins.def >= 3 ? 'THE STATION STANDS' : 'THE SWARM FEASTS';
      bannerSub = 'STATION ' + wins.def + ' — ' + wins.inv + ' SWARM';
      wins.def >= 3 ? sWin() : sLose();
    } else nextRound();
  } else if (mode === 'defend') {
    if (state === 'roundEnd' && cannon.hp > 0) nextWave();
  } else {
    if (state === 'roundEnd') nextWave();
  }
}

/* ================= UI buttons ================= */

/* ================= render ================= */

  const subY = logoY + 4.5 * logoU + 4 + 4.5 * subU; // sous le halo du logo
  text('a 1978 arcade tale', W / 2, subY, subFont + 'px', '#ff5a3c', '#ff5a3c');
  const bw = Math.min(320, W * 0.66);
  const bh = isLand ? 52 : Math.max(56, H * 0.085), gap = isLand ? 12 : 16;
  const bx = W / 2 - bw / 2;
  let by = subY + 4.5 * subU + 20;
  drawButton('defend', bx, by, bw, bh, 'DEFEND', '1P — hold the station'); by += bh + gap;
  drawButton('invade', bx, by, bw, bh, 'INVADE', '1P — lead the swarm', '#ff5a3c'); by += bh + gap;
  drawButton('versus', bx, by, bw, bh, 'VERSUS', '2P — same screen', '#ffd166'); by += bh + gap;
  drawButton('howto', bx, by, bw, isLand ? 44 : 48, 'HOW TO PLAY', null, '#7d97a3');
  // bests — clear of the buttons
  text('BEST — DEFEND ' + best.defend + ' · INVADE ' + best.invade + ' · WAVE ' + best.wave,
       W / 2, H - 20, '13px', '#54655c');
  // mute is a touch button (no M key on phones)
  drawIconButton('mute', W - 40, 38, 52, 44, muted ? '✕' : '♪');
}
function renderHowto() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  text('HOW TO PLAY', W / 2, H * 0.1, 'bold ' + Math.round(W * 0.07) + 'px', '#00e5ff', '#00e5ff');
  const lines = [
    ['#00e5ff', 'DEFEND — you are the cannon.',
     'Move: drag / ← → / A D.',
     'Fire is auto. Chain kills: COMBO x5.',
     "Don't overheat your guns.",
     'Mothership every 4th wave = repairs.',
     'Clear 10 waves to win the sector.'],
    ['#ff5a3c', 'INVADE — you are the swarm.',
     'Steer: drag / ← → / A D.',
     'Tap a unit (or Space) to dive-bomb.',
     'Break the station 3 rounds to win.'],
    ['#ffd166', 'VERSUS — 2 players, one screen.',
     'P1 cannon: drag / A D.',
     'P2 swarm: drag / ← →, tap to dive.'],
  ];
  let y = H * 0.18;
  for (const [col, title, ...rows] of lines) {
    text(title, W * 0.08, y, 'bold 16px', col, col, null, 'left'); y += 22;
    for (const r of rows) { text(r, W * 0.08, y, '13px', '#9fb3bd', null, null, 'left'); y += 19; }
    y += 10;
  }
  ctx.textAlign = 'center';
  drawButton('back', W / 2 - 130, H - 96, 260, 56, 'BACK', null, '#7d97a3');
}
function drawPaused() {
  ctx.fillStyle = 'rgba(4,6,11,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  text('PAUSED', W / 2, H * 0.3, 'bold ' + Math.round(W * 0.07) + 'px', '#e8f5ee', '#e8f5ee');
  const bw = 260, bh = 58, bx = W / 2 - bw / 2;
  let by = H * 0.42;
  drawButton('resume', bx, by, bw, bh, 'RESUME'); by += bh + 14;
  drawButton('restart', bx, by, bw, bh, 'RESTART', null, '#ffd166'); by += bh + 14;
  drawButton('quit', bx, by, bw, bh, 'QUIT', null, '#7d97a3');
}
function drawEndScreen() {
  ctx.fillStyle = 'rgba(4,6,11,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const col = state === 'gameOver' ? '#ff5a3c' : '#00e5ff';
  text(banner, W / 2, H * 0.3, 'bold ' + Math.round(W * 0.06) + 'px', col, col);
  text(bannerSub || '', W / 2, H * 0.3 + W * 0.075, Math.round(W * 0.04) + 'px', '#e8f5ee', '#e8f5ee');
  const bw = 280, bh = 58, bx = W / 2 - bw / 2;
  let by = H * 0.52;
  if (state === 'victory' && mode === 'defend' && !endless) {
    drawButton('continue', bx, by, bw, bh, 'CONTINUE', 'endless waves', '#ffd166'); by += bh + 14;
    drawButton('menu', bx, by, bw, bh, 'MENU', null, '#7d97a3');
  } else if (state === 'victory' || state === 'matchEnd') {
    drawButton('rematch', bx, by, bw, bh, state === 'matchEnd' ? 'REMATCH' : 'PLAY AGAIN'); by += bh + 14;
    drawButton('menu', bx, by, bw, bh, 'MENU', null, '#7d97a3');
  } else {
    drawButton('retry', bx, by, bw, bh, 'RETRY'); by += bh + 14;
    drawButton('menu', bx, by, bw, bh, 'MENU', null, '#7d97a3');
  }
  if (!('ontouchstart' in window)) text('or press R for menu', W / 2, H - 40, '13px', '#54655c');
}

/* ================= main loop (fixed timestep + slow-mo + hitstop) ================= */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;
  if (hitstop > 0) { hitstop -= dt; render(); return; }
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 10) { update(STEP); acc -= STEP; n++; }
  if (state === 'serve' || state === 'roundEnd') {
    stateT += dt;
    const need = state === 'serve' ? 1.6 : 2.2;
    if (stateT >= need && bannerT <= 0) {
      if (state === 'serve') { state = 'play'; }
      else advanceAfterBanner();
    }
  }
  render();
}

/* ================= boot ================= */
layout();
mkStars();
buildNebula();
fit();
requestAnimationFrame(frame);

/* debug hooks for automated playtesting */
window.GAME = {
  get state() { return state; }, get mode() { return mode; },
  get wave() { return wave; }, get round() { return round; },
  get score() { return score; }, get lives() { return lives; },
  get mult() { return mult; }, get wins() { return wins; },
  get best() { return best; },
  get units() { return units; }, get cannon() { return cannon; },
  get divers() { return divers; }, get shots() { return shots; },
  get ring() { return ring; }, get mothership() { return mothership; },
  get buttons() { return uiButtons; }, get paused() { return paused; },
  get W() { return W; }, get H() { return H; },
  get swarmInfo() { return { phase: swarm.phase, total: swarm.total, cx: swarm.cx, cy: swarm.cy }; },
  get dbg() { return { state, mode, nPointers: pointers.size, keys: Object.keys(keys).filter(k => keys[k]) }; },
  startMode, diveUnit, killUnit, damageCannon, endRound, nextWave, nextRound, spawnMothership, damageMothership, pressButton,
};
</script>
