<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BREACH — 1993</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    font-family:'Courier New',ui-monospace,monospace;-webkit-user-select:none;user-select:none;
    touch-action:none;overscroll-behavior:none;}
  body{display:flex;align-items:center;justify-content:center;position:fixed;inset:0;width:100%;}
  #c{display:block;background:#05060a;touch-action:none;image-rendering:pixelated;cursor:crosshair;
    width:min(100vw,66.67vh,66.67dvh);height:min(150vw,100vh,100dvh);}
  /* ---- touch controls (touch devices only) ---- */
  #touchUI{position:fixed;inset:0;z-index:10;pointer-events:none;display:none;touch-action:none;}
  #touchUI .stick{position:absolute;width:132px;height:132px;border-radius:50%;pointer-events:auto;touch-action:none;
    border:2px solid rgba(0,255,157,0.35);background:rgba(10,14,20,0.28);}
  #touchUI .nub{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:rgba(0,255,157,0.30);border:2px solid rgba(0,255,157,0.75);pointer-events:none;}
  #touchUI .tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier New',ui-monospace,monospace;font-weight:bold;
    border:2px solid;background:rgba(10,14,20,0.5);color:#e8f5ee;
    -webkit-tap-highlight-color:transparent;}
  #touchUI .tbtn.on{background:rgba(192,57,43,0.55);}
  #stickL{left:calc(18px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));}
  #stickR{right:calc(18px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));}
  #btnFire{right:calc(26px + env(safe-area-inset-right));bottom:calc(182px + env(safe-area-inset-bottom));
    width:88px;height:88px;font-size:16px;border-color:#c0392b;color:#ffb3a7;}
  #btnWeapon{right:calc(132px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));
    width:60px;height:60px;font-size:11px;border-color:#ffd94d;color:#ffd94d;}
  #btnPause{right:calc(14px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));
    width:52px;height:52px;font-size:15px;border-color:#8fa89b;color:#8fa89b;}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<div id="touchUI" aria-hidden="true">
  <div class="stick" id="stickL"><div class="nub" id="nubL"></div></div>
  <div class="stick" id="stickR"><div class="nub" id="nubR"></div></div>
  <div class="tbtn" id="btnFire">FIRE</div>
  <div class="tbtn" id="btnWeapon">WPN</div>
  <div class="tbtn" id="btnPause">I I</div>
</div>
<script>
'use strict';
/* BREACH — 1993. A single-file raycaster. Breach the sectors. Original in every way. */
const W=480,H=720;
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;

/* ================= utils ================= */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);};
function angDiff(a,b){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}
function fmtTime(s){s=Math.floor(s);const m=Math.floor(s/60);return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60);}
function shade(hex,f){ // hex '#rrggbb' * f -> rgb string
  const r=parseInt(hex.slice(1,3),16),gg=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.floor(r*f)+','+Math.floor(gg*f)+','+Math.floor(b*f)+')';
}

/* ================= audio — all procedural ================= */
const SFX=(()=>{
  let ac=null,on=true,noiseBuf=null,master=null;
  try{const v=localStorage.getItem('breach_sound');if(v==='0')on=false;}catch(e){}
  function ctx(){
    try{
      if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);}
      if(ac.state==='suspended')ac.resume();
      return ac;
    }catch(e){return null;}
  }
  function noise(){const c=ctx();if(!c)return null;
    if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate*0.6,c.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    return noiseBuf;}
  function tone(f0,f1,dur,type,vol,when,curve){
    const c=ctx();if(!c||!on)return;const t=c.currentTime+(when||0);
    const o=c.createOscillator(),gn=c.createGain();
    o.type=type;o.frequency.setValueAtTime(Math.max(f0,1),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+0.03);}
  function burst(dur,vol,fc,type,when){
    const c=ctx();if(!c||!on)return;const t=c.currentTime+(when||0);
    const s=c.createBufferSource();s.buffer=noise();s.loop=true;
    const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc;
    const gn=c.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f);f.connect(gn);gn.connect(master);s.start(t);s.stop(t+dur+0.03);}
  return {
    get on(){return on;},
    toggle(){on=!on;try{localStorage.setItem('breach_sound',on?'1':'0');}catch(e){}return on;},
    unlock(){ctx();},
    ui(){tone(700,700,0.05,'square',0.07);},
    select(){tone(520,880,0.09,'square',0.1);tone(880,1320,0.08,'square',0.08,0.07);},
    back(){tone(660,330,0.1,'square',0.09);},
    shootPellet(){burst(0.09,0.28,3200,'highpass');tone(880,220,0.09,'square',0.16);},
    shootScatter(){burst(0.3,0.5,900);tone(150,40,0.28,'sine',0.4);},
    shootLance(){tone(180,2400,0.28,'sawtooth',0.22);burst(0.2,0.2,4000,'highpass',0.05);},
    dryFire(){tone(1200,900,0.05,'square',0.08);},
    hitFlesh(){burst(0.08,0.3,1400);tone(320,140,0.08,'triangle',0.2);},
    hitmark(){tone(1500,1500,0.04,'square',0.09);},
    demonDie(big){burst(0.3,0.4,700);tone(140,45,0.35,'sawtooth',0.3);if(big){tone(90,30,0.5,'sawtooth',0.35,0.05);burst(0.5,0.4,400,0,0.05);}},
    spit(){tone(420,120,0.14,'sawtooth',0.12);},
    telegraph(){tone(160,160,0.12,'square',0.12);tone(160,160,0.12,'square',0.12,0.16);},
    roar(){tone(70,38,0.6,'sawtooth',0.34);burst(0.5,0.25,500,0,0.05);},
    chitter(){for(let i=0;i<4;i++)tone(1800-i*200,2400-i*200,0.04,'square',0.06,i*0.05);},
    hurt(){tone(110,50,0.2,'sine',0.4);burst(0.15,0.25,600);},
    heartbeat(){tone(55,40,0.12,'sine',0.4);tone(50,38,0.1,'sine',0.32,0.18);},
    pickup(){tone(660,660,0.08,'sine',0.14);tone(990,990,0.12,'sine',0.14,0.08);},
    weaponGet(){tone(440,440,0.08,'square',0.12);tone(660,660,0.08,'square',0.12,0.08);tone(880,880,0.14,'square',0.12,0.16);},
    keyGet(){[523,659,784,1046].forEach((f,i)=>tone(f,f,0.1,'triangle',0.14,i*0.08));},
    door(){burst(0.35,0.2,500);tone(90,180,0.3,'sine',0.12);},
    locked(){tone(140,110,0.12,'square',0.14);tone(110,90,0.14,'square',0.14,0.13);},
    exitOpen(){tone(330,660,0.25,'sine',0.16);tone(660,990,0.3,'sine',0.14,0.15);},
    countBeep(fin){tone(fin?880:440,fin?880:440,fin?0.3:0.12,'square',0.16);},
    victory(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,0.22,'triangle',0.16,i*0.13));},
    defeat(){[330,262,196,131].forEach((f,i)=>tone(f,f*0.94,0.3,'sawtooth',0.16,i*0.2));},
    boom(){burst(0.4,0.5,800);tone(120,35,0.35,'sine',0.42);}
  };
})();

/* ================= input ================= */
const keys={},pressedEdge={};
const GAMEKEYS=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyF','KeyM','KeyP','KeyR','Enter','Comma','Period','Digit1','Digit2','Digit3','Digit4','Escape','Tab']);
addEventListener('keydown',e=>{
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(!e.repeat){keys[e.code]=true;pressedEdge[e.code]=true;onKeyPress(e.code);}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const mouse={x:W/2,y:H/2,down:false,clicked:false,locked:false};
function canvasPos(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)*W/r.width,y:(cy-r.top)*H/r.height};}
cv.addEventListener('mousemove',e=>{const p=canvasPos(e.clientX,e.clientY);mouse.x=p.x;mouse.y=p.y;});
cv.addEventListener('mousedown',e=>{
  SFX.unlock();
  const p=canvasPos(e.clientX,e.clientY);mouse.x=p.x;mouse.y=p.y;
  if(UI.handleClick(p.x,p.y))return;
  mouse.clicked=true;
  if(G.screen==='play'&&!G.paused&&!mouse.locked){requestLock();return;} // lock click: no fire
  mouse.down=true;
});
addEventListener('mouseup',()=>{mouse.down=false;});
document.addEventListener('pointerlockchange',()=>{
  mouse.locked=(document.pointerLockElement===cv);
  if(!mouse.locked&&(G.screen==='play')&&!G.paused&&G.mode==='campaign')pauseGame();
});
document.addEventListener('mousemove',e=>{
  if(mouse.locked&&(G.screen==='play')&&!G.paused){
    const p=activePlayer();
    if(p)p.angle+= (e.movementX||0)*0.0026;
  }
});
function requestLock(){
  if(touch.active)return; // touch devices: no pointer lock, sticks do the looking
  try{const r=cv.requestPointerLock&&cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}
}
function exitLock(){try{if(document.pointerLockElement)document.exitPointerLock();}catch(e){}}
/* ================= touch controls ================= */
const touch={active:false,moveX:0,moveY:0,lookX:0,lookY:0,firing:false,tapped:false};
const touchUI=document.getElementById('touchUI'),
  stickL=document.getElementById('stickL'),stickR=document.getElementById('stickR'),
  nubL=document.getElementById('nubL'),nubR=document.getElementById('nubR'),
  btnFire=document.getElementById('btnFire'),btnWeapon=document.getElementById('btnWeapon'),
  btnPause=document.getElementById('btnPause');
function enableTouchUI(){
  if(touch.active)return;touch.active=true;touchUI.style.display='block';
}
if(('ontouchstart' in window)||navigator.maxTouchPoints>0)enableTouchUI();
addEventListener('touchstart',()=>enableTouchUI(),{passive:true});
function bindStick(el,nub,onMove){
  let pid=null,cx=0,cy=0;const R=52;
  function mv(e){
    if(e.pointerId!==pid)return;
    let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);
    if(l>R){dx=dx/l*R;dy=dy/l*R;}
    nub.style.transform='translate('+dx+'px,'+dy+'px)';
    onMove(Math.abs(dx)<8?0:dx/R,Math.abs(dy)<8?0:dy/R);
  }
  function end(e){if(e.pointerId!==pid)return;pid=null;nub.style.transform='';onMove(0,0);}
  el.addEventListener('pointerdown',e=>{
    if(pid!==null)return;pid=e.pointerId;
    try{el.setPointerCapture(pid);}catch(err){}
    const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;
    e.preventDefault();mv(e);
  });
  el.addEventListener('pointermove',mv);
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
bindStick(stickL,nubL,(x,y)=>{touch.moveX=x;touch.moveY=y;});
bindStick(stickR,nubR,(x,y)=>{touch.lookX=x;touch.lookY=y;});
btnFire.addEventListener('pointerdown',e=>{e.preventDefault();SFX.unlock();touch.firing=true;btnFire.classList.add('on');});
['pointerup','pointercancel','pointerleave'].forEach(t=>btnFire.addEventListener(t,()=>{touch.firing=false;btnFire.classList.remove('on');}));
function cycleWeapon(){
  const p=activePlayer();if(!p||G.screen!=='play'||G.paused)return;
  const owned=[0,1,2].filter(i=>p.weapons.indexOf(i)>=0);
  if(owned.length<2)return;
  setWeapon(owned[(owned.indexOf(p.weapon)+1)%owned.length]);SFX.ui();
}
btnWeapon.addEventListener('pointerdown',e=>{e.preventDefault();SFX.unlock();cycleWeapon();});
btnPause.addEventListener('pointerdown',e=>{e.preventDefault();SFX.unlock();
  if(G.screen==='play')pauseGame();else if(G.screen==='pause')resumeGame();});
touchUI.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{e.preventDefault();SFX.unlock();enableTouchUI();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];if(!t)return;
  const p=canvasPos(t.clientX,t.clientY);mouse.x=p.x;mouse.y=p.y;
  if(UI.handleClick(p.x,p.y))return;
  if(G.screen==='intro')touch.tapped=true;
},{passive:false});
document.addEventListener('touchmove',e=>{if(touch.active)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
function fitCanvas(){
  // size the canvas to the ACTUAL visible viewport (mobile browser chrome
  // makes 100vh lie) using contain-fit: play area never overflows.
  const vv=window.visualViewport;
  const vw=vv?vv.width:window.innerWidth, vh=vv?vv.height:window.innerHeight;
  const k=Math.min(vw/W,vh/H);
  cv.style.width=(W*k)+'px';cv.style.height=(H*k)+'px';
}
fitCanvas();
addEventListener('resize',fitCanvas);
addEventListener('orientationchange',fitCanvas);
if(window.visualViewport)visualViewport.addEventListener('resize',fitCanvas);
function updateTouchVisibility(){
  if(!touch.active)return;
  const s=G.screen,inGame=(s==='play'||s==='countdown'),d=inGame?'block':'none';
  stickL.style.display=d;stickR.style.display=d;
  btnFire.style.display=inGame?'flex':'none';
  btnWeapon.style.display=inGame?'flex':'none';
  btnPause.style.display=(s==='play'||s==='pause')?'flex':'none';
  if(inGame){const p=activePlayer();if(p)btnWeapon.textContent=['PLT','SCT','LNC'][p.weapon]||'WPN';}
}

/* ================= procedural textures ================= */
function makeTex(draw){const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');draw(x);return c;}
function wallTexture(base,dark,accent){
  return makeTex(x=>{
    x.fillStyle=base;x.fillRect(0,0,64,64);
    for(let i=0;i<380;i++){x.fillStyle='rgba(0,0,0,'+(Math.random()*0.14)+')';x.fillRect(Math.random()*64|0,Math.random()*64|0,2,2);}
    for(let i=0;i<60;i++){x.fillStyle='rgba(255,255,255,'+(Math.random()*0.05)+')';x.fillRect(Math.random()*64|0,Math.random()*64|0,2,1);}
    x.strokeStyle='rgba(0,0,0,0.55)';x.lineWidth=2;
    x.strokeRect(1,1,62,62);
    x.beginPath();x.moveTo(0,32);x.lineTo(64,32);x.stroke();
    x.fillStyle=dark;
    [[6,6],[58,6],[6,58],[58,58],[6,32],[58,32]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],2.4,0,7);x.fill();});
    x.fillStyle=accent;x.fillRect(0,4,64,3);
    const gr=x.createLinearGradient(0,0,0,64);gr.addColorStop(0,'rgba(255,255,255,0.10)');gr.addColorStop(1,'rgba(0,0,0,0.25)');
    x.fillStyle=gr;x.fillRect(0,0,64,64);
  });
}
function doorTexture(){
  return makeTex(x=>{
    x.fillStyle='#3d2f1e';x.fillRect(0,0,64,64);
    for(let i=0;i<200;i++){x.fillStyle='rgba(0,0,0,'+(Math.random()*0.18)+')';x.fillRect(Math.random()*64|0,Math.random()*64|0,2,2);}
    x.fillStyle='#241a10';x.fillRect(30,0,4,64);
    x.fillStyle='#c9a227';x.fillRect(0,28,64,8);
    x.fillStyle='#7a5f16';x.fillRect(0,28,64,2);x.fillRect(0,34,64,2);
    x.strokeStyle='rgba(0,0,0,0.6)';x.lineWidth=3;x.strokeRect(2,2,60,60);
    x.fillStyle='rgba(201,162,39,0.25)';x.fillRect(4,4,56,56);
  });
}
function exitTexture(){
  return makeTex(x=>{
    x.fillStyle='#0d2b1a';x.fillRect(0,0,64,64);
    for(let i=0;i<160;i++){x.fillStyle='rgba(0,0,0,'+(Math.random()*0.2)+')';x.fillRect(Math.random()*64|0,Math.random()*64|0,2,2);}
    x.fillStyle='#1d5c36';for(let i=0;i<4;i++)x.fillRect(8+i*14,6,8,52);
    x.fillStyle='#39ff7a';for(let i=0;i<4;i++)x.fillRect(10+i*14,8,4,48);
    x.fillStyle='rgba(57,255,122,0.35)';x.fillRect(0,0,64,64);
    x.strokeStyle='rgba(0,0,0,0.6)';x.lineWidth=3;x.strokeRect(2,2,60,60);
  });
}
const TEX={
  wall:[wallTexture('#4a5266','#2c3242','#8a94ad'),wallTexture('#5c4a38','#3a2e22','#c9a227'),wallTexture('#33242e','#1d141b','#c0392b')],
  door:doorTexture(), exit:exitTexture()
};

/* map collision — doors consult world.doors */
function doorAt(tx,ty){for(const d of world.doors)if(d.tx===tx&&d.ty===ty)return d;return null;}
function solidTile(tx,ty){
  const t=tileAt(tx,ty,world.map);
  if(t==='#')return true;
  if(t==='D'||t==='L'||t==='X'){const d=doorAt(tx,ty);return !d||d.open<0.9;}
  return false;
}
function solidAt(x,y){
  const tx=Math.floor(x),ty=Math.floor(y);
  return solidTile(tx,ty);
}
function losClear(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);
  if(d<0.001)return true;
  const r=castRay(ax,ay,dx/d,dy/d,d);
  return !r.hit||r.dist>=d-0.08;
}
/* DDA raycast -> {dist, side, hit, mapX, mapY, ch} */
function castRay(px,py,rdx,rdy,maxDist){
  let mapX=Math.floor(px),mapY=Math.floor(py);
  const ddx=Math.abs(1/(rdx===0?1e-9:rdx)),ddy=Math.abs(1/(rdy===0?1e-9:rdy));
  let stepX,stepY,sdx,sdy;
  if(rdx<0){stepX=-1;sdx=(px-mapX)*ddx;}else{stepX=1;sdx=(mapX+1-px)*ddx;}
  if(rdy<0){stepY=-1;sdy=(py-mapY)*ddy;}else{stepY=1;sdy=(mapY+1-py)*ddy;}
  let side=0,dist=maxDist;
  for(let i=0;i<64;i++){
    if(sdx<sdy){dist=sdx;sdx+=ddx;mapX+=stepX;side=0;}
    else{dist=sdy;sdy+=ddy;mapY+=stepY;side=1;}
    if(dist>maxDist)return{dist:maxDist,side,hit:false,mapX,mapY,ch:'#'};
    const t=tileAt(mapX,mapY,world.map);
    if(t==='#')return{dist,side,hit:true,mapX,mapY,ch:'#'};
    if(t==='D'||t==='L'||t==='X'){const d=doorAt(mapX,mapY);if(!d||d.open<0.9)return{dist,side,hit:true,mapX,mapY,ch:t};}
  }
  return{dist:maxDist,side,hit:false,mapX,mapY,ch:'#'};
}
function moveEntity(e,dx,dy,dt,r){
  r=r||0.22;
  const nx=e.x+dx*dt;
  if(!solidAt(nx+Math.sign(dx)*r,e.y)&&!solidAt(nx-Math.sign(dx)*r,e.y))e.x=nx;
  const ny=e.y+dy*dt;
  if(!solidAt(e.x,ny+Math.sign(dy)*r)&&!solidAt(e.x,ny-Math.sign(dy)*r))e.y=ny;
}
function playerVec(p){return{dx:Math.cos(p.angle),dy:Math.sin(p.angle)};}
function planeVec(p){const v=playerVec(p);return{px:-v.dy*0.66,py:v.dx*0.66};}
function activePlayer(){return world.players[0]||null;}
const UI={
  list:[],
  begin(){this.list=[];},
  button(x,y,w,h,label,opts){
    opts=opts||{};
    const b={x,y,w,h,label,hotkey:opts.hotkey,cb:opts.cb,style:opts.style||'red',
      small:opts.small,disabled:!!opts.disabled};
    this.list.push(b);return b;
  },
  draw(){
    for(const b of this.list){
      const hov=!b.disabled&&mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h;
      const c=b.style==='green'?'0,255,157':b.style==='amber'?'255,209,77':'192,57,43';
      g.fillStyle=b.disabled?'#0a0c10':'rgba(10,14,20,'+(hov?'0.95':'0.8')+')';
      g.fillRect(b.x,b.y,b.w,b.h);
      g.strokeStyle='rgba('+c+','+(hov?'1':'0.55')+')';g.lineWidth=hov?3:2;
      g.strokeRect(b.x,b.y,b.w,b.h);
      g.fillStyle=b.disabled?'#3a4149':hov?'#ffffff':'rgba(232,245,238,0.92)';
      g.font='bold '+(b.small?14:18)+'px monospace';g.textAlign='center';g.textBaseline='middle';
      g.fillText(b.label,b.x+b.w/2,b.y+b.h/2+1);
      if(b.hotkey&&!b.disabled){g.fillStyle='rgba(143,168,155,0.8)';g.font='11px monospace';g.fillText('['+b.hotkey+']',b.x+b.w/2,b.y+b.h-9);}
    }
    g.textBaseline='alphabetic';
  },
  handleClick(x,y){
    for(const b of this.list){
      if(!b.disabled&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
        SFX.select();b.cb&&b.cb();this.begin();return true;
      }
    }
    return false;
  },
  hotkey(code){
    for(const b of this.list){if(!b.disabled&&b.hotkey===code){SFX.select();b.cb&&b.cb();this.begin();return true;}}
    return false;
  }
};
function onKeyPress(code){
  if(code==='KeyM'){SFX.toggle();return;}
  if(UI.hotkey(code))return;
  if(code==='KeyP'||code==='Escape'){
    if(G.screen==='play'){pauseGame();}
    else if(G.screen==='pause'){resumeGame();}
    else if(G.screen==='howto'){toMenu();}
    return;
  }

let RAYS=160;
const RAYQ=[160,120,96];
function renderView(vx,vy,vw,vh,p,world){
  const v=playerVec(p),pl=planeVec(p);
  vx+=G.shakeX;vy+=G.shakeY;
  // ceiling / floor
  const grd=g.createLinearGradient(0,vy,0,vy+vh);
  grd.addColorStop(0,'#070912');grd.addColorStop(0.48,'#04050a');
  grd.addColorStop(0.52,'#0a0c11');grd.addColorStop(1,'#020306');
  g.fillStyle=grd;g.fillRect(vx,vy,vw,vh);
  const horizon=vy+vh/2;
  // subtle floor glow line at horizon
  g.fillStyle='rgba(90,110,150,0.10)';g.fillRect(vx,horizon-1,vw,2);
  const zbuf=new Float32Array(RAYS);
  const cw=vw/RAYS;
  const texSet=TEX.wall[G.sectorTex||0];
  for(let i=0;i<RAYS;i++){
    const cam=2*i/RAYS-1;
    const rdx=v.dx+pl.px*cam,rdy=v.dy+pl.py*cam;
    const r=castRay(p.x,p.y,rdx,rdy,20);
    const d=Math.max(r.dist,0.08);
    zbuf[i]=d;
    const wallH=vh/d;
    let tex=texSet;
    if(r.ch==='D'||r.ch==='L')tex=TEX.door;else if(r.ch==='X')tex=TEX.exit;
    else{const ai=AI_WALLS[G.sectorTex||0];if(ai&&ai.complete&&ai.naturalWidth)tex=ai;}
    let wallX=r.side===0?p.y+d*rdy:p.x+d*rdx;
    wallX-=Math.floor(wallX);
    const texX=Math.floor(wallX*63.99);
    const x=vx+i*cw,y0=horizon-wallH/2;
    g.drawImage(tex,texX,0,1,64,x,y0,cw+1,wallH);
    if(r.side===1){g.fillStyle='rgba(0,0,10,0.28)';g.fillRect(x,y0,cw+1,wallH);}
    const fog=clamp(1-d/14,0,1);
    if(fog<1){g.fillStyle='rgba(2,3,8,'+((1-fog)*0.85).toFixed(3)+')';g.fillRect(x,y0,cw+1,wallH);}
  }
  drawWorldSprites(vx,vy,vw,vh,p,world,zbuf,horizon);
  drawWeaponView(vx,vy,vw,vh,p);
  // muzzle light
  if(p.muzzleT>0){
    g.fillStyle='rgba(255,210,130,'+(p.muzzleT*2.2).toFixed(3)+')';
    g.fillRect(vx,vy,vw,vh);
  }
  // hurt vignette
  if(p.hurtT>0){
    const a=clamp(p.hurtT*1.6,0,0.55);
    const rg=g.createRadialGradient(vx+vw/2,vy+vh/2,vh*0.28,vx+vw/2,vy+vh/2,vh*0.72);
    rg.addColorStop(0,'rgba(190,10,10,0)');rg.addColorStop(1,'rgba(190,10,10,'+a.toFixed(3)+')');
    g.fillStyle=rg;g.fillRect(vx,vy,vw,vh);
  }
  // low hp pulse
  if(!p.dead&&p.hp<=30&&p.hp>0){
    const a=0.22+0.18*Math.sin(G.time*6);
    const rg=g.createRadialGradient(vx+vw/2,vy+vh/2,vh*0.3,vx+vw/2,vy+vh/2,vh*0.75);
    rg.addColorStop(0,'rgba(160,0,0,0)');rg.addColorStop(1,'rgba(160,0,0,'+a.toFixed(3)+')');
    g.fillStyle=rg;g.fillRect(vx,vy,vw,vh);
  }
  // directional damage indicator
  if(G.dmgDirT>0&&G.dmgDir!==null){
    const cx=vx+vw/2,cy=vy+vh/2,R=Math.min(vw,vh)*0.36;
    const rel=angDiff(p.angle,G.dmgDir);
    g.save();g.translate(cx,cy);g.rotate(rel);
    g.strokeStyle='rgba(255,40,40,'+clamp(G.dmgDirT*1.4,0,0.9).toFixed(3)+')';
    g.lineWidth=7;g.beginPath();g.arc(0,0,R,-0.5,0.5);g.stroke();
    g.restore();
  }
  // hitmarker
  if(G.hitmarkT>0){
    const cx=vx+vw/2,cy=vy+vh/2,s=10+4*(1-G.hitmarkT*3);
    g.strokeStyle=G.hitmarkKill?'rgba(255,60,60,0.95)':'rgba(255,255,255,0.9)';
    g.lineWidth=2.5;
    g.beginPath();
    g.moveTo(cx-s,cy-s);g.lineTo(cx-s*0.4,cy-s*0.4);g.moveTo(cx+s,cy-s);g.lineTo(cx+s*0.4,cy-s*0.4);
    g.moveTo(cx-s,cy+s);g.lineTo(cx-s*0.4,cy+s*0.4);g.moveTo(cx+s,cy+s);g.lineTo(cx+s*0.4,cy+s*0.4);
    g.stroke();
  }
  g.strokeStyle='rgba(120,140,180,0.3)';g.lineWidth=2;g.strokeRect(vx-G.shakeX,vy-G.shakeY,vw,vh);
}
function projSprite(vx,vw,p,sx,sy){
  const v=playerVec(p),pl=planeVec(p);
  const rx=sx-p.x,ry=sy-p.y;
  const inv=1/(pl.px*v.dy-v.dx*pl.py);
  const tx=inv*(v.dy*rx-v.dx*ry),ty=inv*(-pl.py*rx+pl.px*ry);
  return{camX:tx/ty,depth:ty};
}
function drawWorldSprites(vx,vy,vw,vh,p,world,zbuf,horizon){
  const items=[];
  const push=(o)=>{const t=projSprite(vx,vw,p,o.x,o.y);if(t.depth>0.12&&t.depth<18)items.push({o,camX:t.camX,depth:t.depth});};
  for(const d of world.demons)if(!d.dead&&d.spawnT<=0)push({spr:'demon',d,x:d.x,y:d.y});
  for(const pk of world.pickups)if(!pk.taken)push({spr:'pickup',pk,x:pk.x,y:pk.y});
  for(const b of world.bolts)push({spr:'bolt',b,x:b.x,y:b.y});
  for(const pt of world.parts)push({spr:'part',pt,x:pt.x,y:pt.y});
  for(const pu of G.popups)push({spr:'popup',pu,x:pu.x,y:pu.y});
  if(world.foe&&!world.foe.dead)push({spr:'foe',f:world.foe,x:world.foe.x,y:world.foe.y});
  items.sort((a,b)=>b.depth-a.depth);
  for(const it of items){
    const sx=vx+vw/2*(1+it.camX);
    if(sx<vx-80||sx>vx+vw+80)continue;
    const col=clamp(Math.floor((it.camX+1)/2*RAYS),0,RAYS-1);
    if(zbuf[col]<it.depth*0.9)continue;
    const fog=clamp(1-it.depth/14,0.12,1);
    const o=it.o;
    if(o.spr==='demon')drawDemon(o.d,sx,horizon,vh,it.depth,fog);
    else if(o.spr==='pickup')drawPickup(o.pk,sx,horizon,vh,it.depth,fog);
    else if(o.spr==='bolt')drawBolt(o.b,sx,horizon,vh,it.depth,fog);
    else if(o.spr==='part')drawParticle(o.pt,sx,horizon,vh,it.depth,fog);
    else if(o.spr==='popup'){
      const rise=(1-o.pu.life/o.pu.max)*40;
      const sy=horizon-(vh/it.depth)*(o.pu.z-0.5)-rise;
      g.globalAlpha=clamp(o.pu.life*2,0,1)*fog;
      g.fillStyle=o.pu.color;g.font='bold '+Math.max(10,Math.floor(vh/it.depth*0.16))+'px monospace';
      g.textAlign='center';g.fillText(o.pu.text,sx,sy);g.globalAlpha=1;
    }
    else if(o.spr==='foe')drawFoe(o.f,sx,horizon,vh,it.depth,fog);
  }
}
function halo(sx,sy,r,color,alpha){
  g.save();g.globalCompositeOperation='lighter';
  const gr=g.createRadialGradient(sx,sy,0,sx,sy,r);
  gr.addColorStop(0,color.replace('A',alpha.toFixed(3)));gr.addColorStop(1,color.replace('A','0'));
  g.fillStyle=gr;g.beginPath();g.arc(sx,sy,r,0,7);g.fill();g.restore();
}
function drawDemon(d,sx,horizon,vh,depth,fog){
  const T=DEMON_TYPES[d.type];
  const size=vh/depth*T.scale;
  const groundY=horizon+(vh/depth)*0.5;
  const bob=Math.sin(d.anim*3)*size*0.03;
  const y=groundY-size*0.95+bob;
  g.save();g.globalAlpha=fog;
  // shadow
  g.fillStyle='rgba(0,0,0,0.4)';
  g.beginPath();g.ellipse(sx,groundY+2,size*0.3,size*0.08,0,0,7);g.fill();
  const flash=d.hitT>0;
  const tele=d.tele>0;
  const C=flash?'#ffffff':T.col, D=flash?'#dddddd':T.dark;
  if(tele){halo(sx,y+size*0.4,size*0.9,'rgba(255,60,40,A)',0.5);}
  // AI sprite billboard (2-frame walk cycle)
  const spr = DEMON_SPRITES[d.type];
  if(spr && spr.complete && spr.naturalWidth){
    const sw = size*1.1, sh = size*1.1;
    const wf = Math.floor(d.anim*4) % 2; // Doom-style walk cycle
    const sx0 = wf*64; // frame offset in sheet
    if(flash){
      g.save();
      g.globalAlpha = fog;
      g.drawImage(spr, sx0, 0, 64, 64, sx-sw/2, y+size*0.1-sh, sw, sh);
      g.restore();
      // white flash overlay
      g.save();
      g.globalAlpha = fog*0.7;
      g.fillStyle = '#ffffff';
      g.fillRect(sx-sw/2, y+size*0.1-sh, sw, sh);
      g.restore();
    } else {
      g.drawImage(spr, sx0, 0, 64, 64, sx-sw/2, y+size*0.1-sh, sw, sh);
    }
  }
  if(d.hp<d.maxhp&&!flash){
    const w=size*0.6;
    g.fillStyle='rgba(20,0,0,0.8)';g.fillRect(sx-w/2,y-size*0.2,w,Math.max(3,size*0.05));
    g.fillStyle='#e33';g.fillRect(sx-w/2,y-size*0.2,w*clamp(d.hp/d.maxhp,0,1),Math.max(3,size*0.05));
  }
  g.restore();
}

function drawWeaponView(vx,vy,vw,vh,p){

  dmg=Math.round(dmg*(G.mode==='versus'?1:dm.dmgm));
  p.hp-=dmg;p.hurtT=0.6;
  if(sx!==undefined){G.dmgDir=Math.atan2(sy-p.y,sx-p.x);G.dmgDirT=0.8;}
  G.trauma=Math.min(1,G.trauma+0.45);
  SFX.hurt();
  if(p.hp<=0){p.hp=0;p.dead=true;spawnGib(p.x,p.y,true);SFX.boom();
    if(G.mode==='campaign')onPlayerDeath();
  }
}
function hurtDemon(d,dmg,kx,ky){
  if(d.dead||d.spawnT>0)return false;
  d.hp-=dmg;d.hitT=0.1;d.aggro=true;
  if(kx!==undefined)moveEntity(d,kx*1.4,ky*1.4,0.09);
  SFX.hitFlesh();
  const p=activePlayer();
  if(d.hp<=0){
    d.hp=0;d.dead=true;
    const big=d.type==='brute';
    spawnGib(d.x,d.y,big);SFX.demonDie(big);
    G.hitmarkT=0.3;G.hitmarkKill=true;SFX.hitmark();
    G.stats.kills++;
    if(p)p.kills++;
    G.trauma=Math.min(1,G.trauma+(big?0.4:0.18));
    popup(d.x,d.y,'+1','#ff6b5e');
    maybeDrop(d);
    onDemonDown(d);
    return true;
  }
  G.hitmarkT=0.22;G.hitmarkKill=false;SFX.hitmark();
  return false;
}
function maybeDrop(d){
  const r=Math.random();
  const drop=(kind)=>{if(world.pickups.length<24)world.pickups.push({kind,x:d.x,y:d.y,taken:false,rt:0});};
  if(d.type==='brute'){drop('medkit');if(r<0.4)drop('shells');}
  else if(d.type==='spitter'){if(r<0.25)drop('slugs');}
  else if(d.type==='chaser'){if(r<0.2)drop('shells');}
  else if(d.type==='skitterer'){if(r<0.15)drop('slugs');}
}
function fireWeapon(p){
  const w=WEAPONS[p.weapon];
  if(w.ammo&&(p.ammo[w.ammo]||0)<=0){
    SFX.dryFire();popup(p.x+Math.cos(p.angle)*0.8,p.y+Math.sin(p.angle)*0.8,'NO AMMO','#ff6b5e');
    if(p.weapons.includes(0))setWeapon(0);
    p.cool=0.3;return;
  }
  if(w.ammo)p.ammo[w.ammo]--;
  p.cool=w.cool;p.muzzleT=0.09;p.kickT=w.kick;G.trauma=Math.min(1,G.trauma+w.kick*0.8);
  G.stats.shots++;
  SFX[w.snd]();
  const foe=(G.mode==='versus')?world.foe:null;
  const targets=w.pierce?null:null;
  // hitscan per pellet
  const hits=[];
  for(let k=0;k<w.pellets;k++){
    const a=p.angle+(Math.random()-0.5)*2*w.spread*3;
    const dx=Math.cos(a),dy=Math.sin(a);
    const wallD=castRay(p.x,p.y,dx,dy,14).dist;
    let bestD=null,bestT=Math.min(wallD,14);
    for(const d of world.demons){
      if(d.dead||d.spawnT>0)continue;
      const rx=d.x-p.x,ry=d.y-p.y,t=rx*dx+ry*dy;
      if(t<0.15||t>bestT)continue;
      if(Math.abs(rx*dy-ry*dx)<0.42){bestD=d;bestT=t;}
    }
    let foeT=1e9;
    if(foe&&!foe.dead){
      const rx=foe.x-p.x,ry=foe.y-p.y,t=rx*dx+ry*dy;
      if(t>0.15&&t<Math.min(wallD,14)&&Math.abs(rx*dy-ry*dx)<0.42)foeT=t;
    }
    if(w.pierce){
      // damage every demon along the ray
      const line=[];
      for(const d of world.demons){
        if(d.dead||d.spawnT>0)continue;
        const rx=d.x-p.x,ry=d.y-p.y,t=rx*dx+ry*dy;
        if(t>0.15&&t<Math.min(wallD,14)&&Math.abs(rx*dy-ry*dx)<0.5)line.push({d,t});
      }
      line.sort((a,b)=>a.t-b.t);
      for(const h of line)hits.push({d:h.d,t:h.t});
      if(foe&&foeT<1e8)hits.push({foe,t:foeT});
      if(line.length||foeT<1e8){
        const ex=p.x+dx*Math.min(wallD,14),ey=p.y+dy*Math.min(wallD,14);
        world.beams.push({x1:p.x,y1:p.y,x2:ex,y2:ey,life:0.16,max:0.16});
      }
    }else{
      if(bestD&&bestT<=foeT)hits.push({d:bestD,t:bestT});
      else if(foeT<1e8)hits.push({foe,t:foeT});
      else if(wallD<14){ // wall impact spark
        const hx=p.x+dx*wallD,hy=p.y+dy*wallD;
        spawnSparks(hx,hy,5,'#9fb2cc');
      }
    }
  }
  for(const h of hits){
    G.stats.hits++;
    if(h.d)hurtDemon(h.d,w.dmg,Math.cos(p.angle),Math.sin(p.angle));
    else if(h.foe){
      hurtPlayer(h.foe,w.dmg,p.x,p.y);
      popup(h.foe.x,h.foe.y,'HIT','#ffd97a');
      if(h.foe.dead)onFoeDown(p,h.foe);
    }
  }
}
/* ================= demon AI ================= */
function updateDemonAI(d,dt,target){
  const T=DEMON_TYPES[d.type],dm=DIFFS[G.difficulty];
  d.anim+=dt*6;
  if(d.hitT>0)d.hitT-=dt;
  if(d.spawnT>0){
    d.spawnT-=dt;
    if(Math.random()<dt*8)world.parts.push({x:d.x+(Math.random()-0.5)*0.5,y:d.y+(Math.random()-0.5)*0.5,
      z:0.1,vx:0,vy:0,vz:1.5,life:0.4,max:0.4,color:T.col,size:0.06});
    return;
  }
  d.cool-=dt;
  const dd=dist2(d.x,d.y,target.x,target.y);
  const seen=!target.dead&&dd<13&&losClear(d.x,d.y,target.x,target.y);
  if(seen){d.seenT=0;d.lx=target.x;d.ly=target.y;}else d.seenT+=dt;
  const tx=d.lx,ty=d.ly;
  const ang=Math.atan2(ty-d.y,tx-d.x);
  const sp=T.speed*dm.spdm;
  // separation
  for(const o of world.demons){
    if(o===d||o.dead)continue;
    const od=dist2(d.x,d.y,o.x,o.y);
    if(od<0.55&&od>0.001){const pa=Math.atan2(d.y-o.y,d.x-o.x);moveEntity(d,Math.cos(pa)*0.9,Math.sin(pa)*0.9,dt);}
  }
  if(d.windup>0){ // telegraphed attack windup
    d.windup-=dt;d.tele=d.windup;
    if(d.windup<=0){
      if(d.type==='brute'){d.chargeT=0.75;d.cdx=Math.cos(ang);d.cdy=Math.sin(ang);}
      else{d.lungeT=0.22;d.cdx=Math.cos(ang);d.cdy=Math.sin(ang);}
    }
    return;
  }
  if(d.lungeT>0){
    d.lungeT-=dt;moveEntity(d,d.cdx*7,d.cdy*7,dt);
    if(dd<0.65&&!target.dead){hurtPlayer(target,T.dmg,d.x,d.y);d.lungeT=0;d.cool=1.2*dm.coolm;}
    return;
  }
  if(d.chargeT>0){
    d.chargeT-=dt;
    const ox=d.x,oy=d.y;
    moveEntity(d,d.cdx*6.5,d.cdy*6.5,dt);
    if(dd<0.85&&!target.dead){hurtPlayer(target,18,d.x,d.y);d.chargeT=0;d.cool=2.6*dm.coolm;G.trauma=Math.min(1,G.trauma+0.3);}
    if(Math.hypot(d.x-ox,d.y-oy)<0.02){d.chargeT=0;d.cool=1.2*dm.coolm;} // slammed a wall
    return;
  }
  if(d.type==='chaser'){
    if(seen||d.seenT<2.5){
      if(dd>0.9)moveEntity(d,Math.cos(ang)*sp,Math.sin(ang)*sp,dt);
      else if(d.cool<=0&&seen){d.windup=0.35;d.tele=0.35;SFX.telegraph();}
    }
  }else if(d.type==='skitterer'){
    d.zig+=dt*6;
    if(seen||d.seenT<2.5){
      const pa=ang+Math.PI/2*Math.sin(d.zig);
      moveEntity(d,Math.cos(pa)*sp,Math.sin(pa)*sp,dt);
      if(dd<0.7&&d.cool<=0&&seen){hurtPlayer(target,T.dmg,d.x,d.y);d.cool=0.65*dm.coolm;
        moveEntity(d,-Math.cos(ang)*3,-Math.sin(ang)*3,0.12);}
    }
  }else if(d.type==='spitter'){
    d.strafeT-=dt;if(d.strafeT<=0){d.strafeT=1.5+Math.random()*1.5;d.strafeDir*=-1;}
    if(seen){
      if(dd>5.5)moveEntity(d,Math.cos(ang)*sp,Math.sin(ang)*sp,dt);
      else if(dd<3)moveEntity(d,-Math.cos(ang)*sp,-Math.sin(ang)*sp,dt);
      else{const sa=ang+Math.PI/2*d.strafeDir;moveEntity(d,Math.cos(sa)*sp*0.6,Math.sin(sa)*sp*0.6,dt);}
      if(d.cool<=0&&d.tele<=0&&dd<8.5){d.tele=0.5;SFX.telegraph();} // telegraph, then spit when tele ends
    }
    if(d.tele>0){
      const was=d.tele;d.tele-=dt;
      if(was>0&&d.tele<=0&&seen){
        const ta=Math.atan2(target.y-d.y,target.x-d.x);
        world.bolts.push({x:d.x,y:d.y,dx:Math.cos(ta)*5,dy:Math.sin(ta)*5,life:3,dmg:T.dmg});
        SFX.spit();d.cool=2.4*dm.coolm;
      }
    }
  }else{ // brute
    if(seen||d.seenT<2.5){
      if(dd>1.35)moveEntity(d,Math.cos(ang)*sp,Math.sin(ang)*sp,dt);
      if(dd<6&&dd>2.1&&d.cool<=0&&seen){d.windup=0.7;d.tele=0.7;SFX.roar();}
      else if(dd<=1.5&&d.cool<=0&&seen){hurtPlayer(target,T.dmg,d.x,d.y);d.cool=1.5*dm.coolm;}
    }
  }
}
function updateBolts(dt){
  const targets=world.players.filter(p=>!p.dead&&p.invuln<=0);
  for(const b of world.bolts){
    b.x+=b.dx*dt;b.y+=b.dy*dt;b.life-=dt;
    if(b.life<=0)continue;
    if(solidAt(b.x,b.y)){b.life=0;spawnSparks(b.x,b.y,6,'#7CFC90');continue;}
    for(const p of targets){
      if(dist2(b.x,b.y,p.x,p.y)<0.32){hurtPlayer(p,b.dmg,b.x-b.dx*0.1,b.y-b.dy*0.1);b.life=0;break;}
    }
  }
  world.bolts=world.bolts.filter(b=>b.life>0);
}
function updatePickups(dt){
  for(const pk of world.pickups){
    if(pk.taken){
      if(pk.rt>0){pk.rt-=dt;if(pk.rt<=0)pk.taken=false;}
      continue;
    }
    for(const p of world.players){
      if(p.dead)continue;
      if(dist2(pk.x,pk.y,p.x,p.y)<0.55){
        const k=pk.kind;let took=false;
        if(k==='medkit'&&p.hp<p.maxhp){p.hp=Math.min(p.maxhp,p.hp+40);took=true;SFX.pickup();popup(pk.x,pk.y,'+40 HP','#7CFC90');}
        else if(k==='shells'&&p.ammo.shells<WEAPONS[1].max){p.ammo.shells=Math.min(WEAPONS[1].max,p.ammo.shells+8);took=true;SFX.pickup();popup(pk.x,pk.y,'+8 SHELLS','#ffd97a');}
        else if(k==='slugs'&&p.ammo.slugs<WEAPONS[2].max){p.ammo.slugs=Math.min(WEAPONS[2].max,p.ammo.slugs+3);took=true;SFX.pickup();popup(pk.x,pk.y,'+3 SLUGS','#5fd4ff');}
        else if(k==='scatter'){if(!p.weapons.includes(1))p.weapons.push(1);p.ammo.shells=Math.min(WEAPONS[1].max,p.ammo.shells+8);p.weapon=1;p.raiseT=0.25;took=true;SFX.weaponGet();banner('SCATTERGUN ACQUIRED');}
        else if(k==='lance'){if(!p.weapons.includes(2))p.weapons.push(2);p.ammo.slugs=Math.min(WEAPONS[2].max,p.ammo.slugs+4);p.weapon=2;p.raiseT=0.25;took=true;SFX.weaponGet();banner('LANCE ACQUIRED');}
        else if(k==='key'&&G.mode==='campaign'){G.hasKey=true;took=true;SFX.keyGet();banner('KEYCARD ACQUIRED');G.objective='REACH THE EXIT';G.exitOpen=true;}
        if(took){
          if(k==='medkit'||k==='shells'||k==='slugs'){pk.taken=true;pk.rt=25;}
          else pk.taken=true,pk.rt=0; // weapon/key: gone for good (rt 0 = stays taken)
          if(pk.rt===0&&!pk.taken){/*noop*/}
          break;
        }
      }
    }
  }
  world.pickups=world.pickups.filter(pk=>!(pk.taken&&pk.rt===0&&(pk.kind==='scatter'||pk.kind==='lance'||pk.kind==='key')));
}
function updateDoors(dt){
  const ps=world.players.filter(p=>!p.dead);
  for(const dr of world.doors){
    const cx=dr.tx+0.5,cy=dr.ty+0.5;
    let near=null,nd=1e9;
    for(const p of ps){const d=dist2(p.x,p.y,cx,cy);if(d<nd){nd=d;near=p;}}
    if(dr.msgCool>0)dr.msgCool-=dt;
    let allowed=false,why='';
    if(dr.kind==='D')allowed=true;
    else if(dr.kind==='L'){allowed=G.hasKey;why='LOCKED — FIND THE KEYCARD';}
    else if(dr.kind==='X'){allowed=G.exitOpen;why=G.mode==='campaign'?'SEALED — COMPLETE THE OBJECTIVE':'SEALED';}
    if(nd<1.7&&allowed){
      if(dr.open<1){dr.open=Math.min(1,dr.open+dt*1.8);if(dr.open>=0.05&&!dr.snd){dr.snd=true;SFX.door();}}
    }else if(nd<1.7&&!allowed&&dr.msgCool<=0){
      dr.msgCool=2;SFX.locked();msg(why);
    }
    if(dr.kind==='X'&&dr.open>0.9&&G.mode==='campaign'&&near&&nd<1.15)onExitReached();
  }
}
function updateParticles(dt){
  for(const pt of world.parts){
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vz-=7*dt;pt.z+=pt.vz*dt;
    if(pt.z<0.02){pt.z=0.02;pt.vz*=-0.35;pt.vx*=0.7;pt.vy*=0.7;}
    pt.life-=dt;
  }
  world.parts=world.parts.filter(p=>p.life>0);
  for(const pu of G.popups){pu.life-=dt;}
  G.popups=G.popups.filter(p=>p.life>0);
  for(const b of world.beams){b.life-=dt;}
  world.beams=world.beams.filter(b=>b.life>0);
  for(const f of G.killfeed){f.t-=dt;}
  G.killfeed=G.killfeed.filter(f=>f.t>0);
}
function updateObjective(){
  if(G.mode!=='campaign')return;

  }
}

function showVsOver(){

  const w=p1.takedowns>=5?0:1,l=1-w;
  const wp=world.players[w],lp=world.players[l];
  let margin=wp.takedowns+'-'+lp.takedowns,bestM=null;
  try{
    bestM=localStorage.getItem('breach_vsbest');
    const cur=wp.takedowns-lp.takedowns,prev=bestM?parseInt(bestM.split('-')[0])-parseInt(bestM.split('-')[1]):-99;

  }catch(e){}

/* ================= per-frame update ================= */
function playerMove(p,pi,dt){
  let f=0,b=0,sl=0,sr=0,tl=0,tr=0,fire=false,af=0,as=0;
  if(pi===0){
    if(keys['KeyW']||keys['ArrowUp'])f=1; if(keys['KeyS']||keys['ArrowDown'])b=1;
    if(keys['KeyA'])sl=1; if(keys['KeyD'])sr=1;
    if(keys['KeyQ'])tl=1; if(keys['KeyE'])tr=1;
    if(keys['Space']||mouse.down)fire=true;
    if(touch.active){af+=-touch.moveY;as+=touch.moveX;if(touch.firing)fire=true;}
  }else{
    if(keys['ArrowUp'])f=1; if(keys['ArrowDown'])b=1;
    if(keys['ArrowLeft'])tl=1; if(keys['ArrowRight'])tr=1;
    if(keys['Comma'])sl=1; if(keys['Period'])sr=1;
    if(keys['Enter'])fire=true;
  }
  const v=playerVec(p),sp=3.4;
  const mx=v.dx*((f-b)+af)+(-v.dy)*((sr-sl)+as),my=v.dy*((f-b)+af)+(v.dx)*((sr-sl)+as);
  const l=Math.hypot(mx,my);
  if(l>0.01){moveEntity(p,mx/l*Math.min(l,1)*sp,my/l*Math.min(l,1)*sp,dt);p.bob+=dt*10;}
  p.angle+=((tr-tl)*2.7+touch.lookX*3.6)*dt;
  p.cool-=dt;
  if(fire&&p.cool<=0&&!p.dead){world.foe=(G.mode==='versus')?world.players[1-pi]:null;fireWeapon(p);}
  if(p.muzzleT>0)p.muzzleT-=dt; if(p.kickT>0)p.kickT-=dt; if(p.raiseT>0)p.raiseT-=dt;
  if(p.hurtT>0)p.hurtT-=dt; if(p.invuln>0)p.invuln-=dt;
}
function updateCampaign(dt){
  G.time+=dt;G.sectorTime+=dt;
  decayGlobals(dt);
  const p=world.players[0];
  if(p.dead){
    updateParticles(dt);G.deathT-=dt;
    if(G.deathT<=0)showOver(false,'YOU DIED','SECTOR '+(G.sector+1)+' OF 3 · '+G.stats.kills+' DEMONS DOWN · '+fmtTime(G.time));
    return;
  }
  playerMove(p,0,dt);
  for(const d of world.demons)if(!d.dead)updateDemonAI(d,dt,p);
  updateBolts(dt);updatePickups(dt);updateDoors(dt);updateParticles(dt);updateObjective();
  if(p.hp<=30&&p.hp>0){G.lowHpSnd-=dt;if(G.lowHpSnd<=0){SFX.heartbeat();G.lowHpSnd=1.05;}}
  if(G.clearT!==null&&G.clearT!==undefined){G.clearT-=dt;if(G.clearT<=0){G.clearT=null;advanceSector();}}
}
function updateVersus(dt){
  decayGlobals(dt);
  const p1=world.players[0],p2=world.players[1];
  playerMove(p1,0,dt);
  playerMove(p2,1,dt);
  [[p1,0],[p2,1]].forEach(([p,i])=>{
    if(p.dead){p.respawnT-=dt;
      if(p.respawnT<=0){const s=VS_SPAWNS[i];p.dead=false;p.hp=p.maxhp;p.x=s.x;p.y=s.y;p.angle=s.a;p.invuln=2;spawnSparks(s.x,s.y,10,'#ffffff');}}
  });
  updatePickups(dt);updateDoors(dt);updateParticles(dt);
  if(G.vsT!==null&&G.vsT!==undefined){G.vsT-=dt;if(G.vsT<=0){G.vsT=null;showVsOver();}}
}

function drawCrosshair(cx,cy){
  g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=2;
  const s=7;
  g.beginPath();
  g.moveTo(cx-s,cy);g.lineTo(cx-3,cy);g.moveTo(cx+3,cy);g.lineTo(cx+s,cy);
  g.moveTo(cx,cy-s);g.lineTo(cx,cy-3);g.moveTo(cx,cy+3);g.lineTo(cx,cy+s);
  g.stroke();
  g.fillStyle='rgba(255,255,255,0.9)';g.fillRect(cx-1,cy-1,2,2);
}
function drawMinimap(vx,vy,size){
  const s=size/MW;
  g.fillStyle='rgba(3,5,9,0.78)';g.fillRect(vx,vy,size,size);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const t=tileAt(x,y,world.map);
    if(t==='#'){g.fillStyle='#2b3346';g.fillRect(vx+x*s,vy+y*s,s,s);}
    else if(t==='D'){g.fillStyle='#6b5636';g.fillRect(vx+x*s,vy+y*s,s,s);}
    else if(t==='L'){g.fillStyle='#a8842c';g.fillRect(vx+x*s,vy+y*s,s,s);}
    else if(t==='X'){if(Math.sin(G.time*5)>0){g.fillStyle='#39ff7a';g.fillRect(vx+x*s,vy+y*s,s,s);}}
  }
  for(const pk of world.pickups)if(!pk.taken){g.fillStyle='#ffd97a';g.fillRect(vx+pk.x*s-1.5,vy+pk.y*s-1.5,3,3);}
  for(const d of world.demons)if(!d.dead){g.fillStyle='#ff5a4a';g.beginPath();g.arc(vx+d.x*s,vy+d.y*s,2.4,0,7);g.fill();}
  world.players.forEach((p,i)=>{
    if(p.dead)return;
    const px=vx+p.x*s,py=vy+p.y*s;
    g.fillStyle=i===0?'#ffffff':'#ff9ec6';
    g.beginPath();g.moveTo(px+Math.cos(p.angle)*5,py+Math.sin(p.angle)*5);
    g.lineTo(px+Math.cos(p.angle+2.6)*4,py+Math.sin(p.angle+2.6)*4);
    g.lineTo(px+Math.cos(p.angle-2.6)*4,py+Math.sin(p.angle-2.6)*4);g.fill();
  });
  g.strokeStyle='rgba(120,140,180,0.5)';g.lineWidth=1.5;g.strokeRect(vx,vy,size,size);
}

function drawBeams(vx,vw,vh,p,horizon){
  for(const b of world.beams){
    const a=projSprite(vx,vw,p,b.x1,b.y1),c=projSprite(vx,vw,p,b.x2,b.y2);
    if(a.depth<0.1||c.depth<0.1)continue;
    const ax=vx+vw/2*(1+a.camX),ay=horizon-(vh/a.depth)*(0.42-0.5);
    const cx=vx+vw/2*(1+c.camX),cy=horizon-(vh/c.depth)*(0.42-0.5);
    const al=clamp(b.life/b.max,0,1);
    g.save();g.globalCompositeOperation='lighter';
    g.strokeStyle='rgba(120,230,255,'+(al*0.85).toFixed(2)+')';g.lineWidth=Math.max(2,7*al);
    g.beginPath();g.moveTo(ax,ay);g.lineTo(cx,cy);g.stroke();
    g.strokeStyle='rgba(255,255,255,'+al.toFixed(2)+')';g.lineWidth=Math.max(1,2.5*al);
    g.beginPath();g.moveTo(ax,ay);g.lineTo(cx,cy);g.stroke();g.restore();
    halo(ax,ay,30,'rgba(120,230,255,A)',0.5*al);
  }

  g.fillText('ACCURACY  '+acc+'%',W/2,350);
  if(G.vicBest){
    g.fillStyle=G.vicIsBest?'#ffe14d':'#8fa89b';g.font='bold 16px monospace';
    g.fillText((G.vicIsBest?'★ NEW BEST  ':'BEST  ')+fmtTime(G.vicBest.time)+' ('+G.vicBest.diff+')',W/2,396);
  }
  UI.button(80,470,150,58,'PLAY AGAIN',{hotkey:'KeyR',cb:startCampaign});
  UI.button(250,470,150,58,'MENU',{hotkey:'Escape',cb:toMenu,style:'green'});
  UI.draw();
}
function renderVsOver(){
  emberBG();
  g.textAlign='center';
  const wcol=G.vsWinner===0?'#39c6ff':'#ff9ec6';
  g.fillStyle=wcol;g.font='bold 52px monospace';
  g.fillText('P'+(G.vsWinner+1)+' WINS',W/2,220);
  g.fillStyle='#e8f5ee';g.font='bold 22px monospace';
  g.fillText(G.vsScore,W/2,268);
  g.fillStyle='#8fa89b';g.font='14px monospace';
  g.fillText('BEST VERSUS MARGIN  '+(G.vsBest||'—'),W/2,310);
  g.fillText('last events:',W/2,352);
  g.font='12px monospace';
  G.killfeed.forEach((f,i)=>{g.fillStyle=f.color;g.fillText(f.text,W/2,376+i*18);});
  UI.button(80,470,150,58,'REMATCH',{hotkey:'KeyR',cb:startVersus});
  UI.button(250,470,150,58,'MENU',{hotkey:'Escape',cb:toMenu,style:'green'});
  UI.draw();
}
function render(){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  UI.begin();
  if(G.screen==='menu')renderMenu();
  else if(G.screen==='howto')renderHowto();
  else if(G.screen==='intro')renderIntro();
  else if(G.screen==='countdown')renderCountdown();
  else if(G.screen==='play'&&!G.paused)renderPlay();
  else if(G.screen==='pause'||(G.screen==='play'&&G.paused))renderPause();
  else if(G.screen==='over')renderOver();
  else if(G.screen==='victory')renderVictory();
  else if(G.screen==='vsover')renderVsOver();
  // mouse click consumed for intro handled inside renderIntro
  updateTouchVisibility();
}
/* ================= main loop ================= */
let lastT=0,acc=0,frames=0,fpsT=0;
function adaptQuality(dt){
  // adaptive render resolution: hold framerate on weak mobile GPUs
  if(G.qLevel===undefined){
    G.qLevel=(touch.active&&Math.min(window.screen.width||9999,window.screen.height||9999)<500)?1:0;
    RAYS=RAYQ[G.qLevel];G.qT=0;G.qGood=0;return;
  }
  G.qT+=dt;
  if(G.qT>=2){
    G.qT=0;const fps=G.fps||60;
    if(fps<45&&G.qLevel<2){G.qLevel++;RAYS=RAYQ[G.qLevel];G.qGood=0;}
    else if(fps>57&&G.qLevel>0){if(++G.qGood>=3){G.qLevel--;RAYS=RAYQ[G.qLevel];G.qGood=0;}}
    else G.qGood=0;
  }
}
function frame(t){
  requestAnimationFrame(frame);
  const now=t/1000;let dt=Math.min(0.1,now-(lastT||now));lastT=now;
  frames++;fpsT+=dt;if(fpsT>=1){G.fps=frames;frames=0;fpsT=0;}
  adaptQuality(dt);
  for(const k in pressedEdge)pressedEdge[k]=false;
  if(G.screen==='countdown'){
    const prev=Math.ceil(G.countT);
    G.countT-=dt;
    const n=Math.ceil(G.countT);
    if(n!==prev&&n>0){SFX.countBeep(false);}
    if(G.countT<=0){SFX.countBeep(true);G.screen='play';banner(G.mode==='versus'?'BREACH!':SECTORS[G.sector].title,1.6);}
  }
  else if(G.screen==='play'&&!G.paused){
    acc+=dt;let n=0;
    while(acc>=1/60&&n<5){if(G.mode==='versus')updateVersus(1/60);else updateCampaign(1/60);acc-=1/60;n++;}
    if(n===5)acc=0;
  }
  else if(G.screen==='menu'||G.screen==='intro'||G.screen==='howto'){G.time+=dt;}
  render();
}
/* ================= test hooks ================= */
window.GAME={
  get state(){return (G.screen==='play'&&G.paused)?'paused':G.screen;},
  get mode(){return G.mode;},
  get hp(){const p=world.players[0];return p?Math.max(0,Math.ceil(p.hp)):0;},
  get takedowns(){const p=world.players[0];return p?p.takedowns:0;},
  get sector(){return G.sector;},
  get difficulty(){return G.difficulty;},
  get fps(){return G.fps||0;},
  get touchActive(){return touch.active;},
  get quality(){return G.qLevel||0;},
  get rays(){return RAYS;},
  get objective(){return G.objective;},
  get exitOpen(){return G.exitOpen;},
  startCampaign,startVersus,beginSectorCountdown,toMenu,
  _debug:{
    G,world,SECTORS,touch,
    demonsLeft(){return world.demons.filter(d=>!d.dead).length;},
    killAll(){for(const d of world.demons){d.spawnT=0;}for(const d of world.demons)hurtDemon(d,99999);},
    hurtPlayer(n){const p=world.players[0];if(p){p.invuln=0;hurtPlayer(p,n,p.x+1,p.y);}},
    giveAll(){const p=world.players[0];if(p){p.weapons=[0,1,2];p.ammo.shells=30;p.ammo.slugs=14;}},
    gotoExit(){const p=world.players[0];const dr=world.doors.find(d=>d.kind==='X');if(p&&dr){p.x=dr.tx+0.5;p.y=dr.ty+0.5;}},
    takedown(i){const v=world.players[1-i],k=world.players[i];if(v&&k&&!v.dead){v.invuln=0;hurtPlayer(v,9999,k.x,k.y);if(v.dead)onFoeDown(k,v);}},
    demons(){return world.demons.map(d=>({type:d.type,hp:d.hp,dead:d.dead,x:+d.x.toFixed(2),y:+d.y.toFixed(2)}));},
    shootAt(){const p=world.players[0];const d=world.demons.find(d=>!d.dead);if(p&&d){p.angle=Math.atan2(d.y-p.y,d.x-p.x);p.cool=0;fireWeapon(p);return true;}return false;}
  }
};
requestAnimationFrame(frame);

</script>
