  const drawH = h * scale;
  const drawW = drawH * (img.naturalWidth/img.naturalHeight);
  ctx.save();
  ctx.translate(x + dx, y + dy);
  if(anim.alpha !== undefined) ctx.globalAlpha = anim.alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, -drawW/2, -drawH/2, drawW, drawH);
  ctx.imageSmoothingEnabled = true;
  // Hurt flash (white)
  if(anim.flash){
    ctx.globalAlpha = anim.flash * 0.6;
    ctx.drawImage(img, -drawW/2, -drawH/2, drawW, drawH);
    ctx.globalAlpha = anim.alpha!==undefined?anim.alpha:1;
  }
  ctx.restore();
}

let AC = null, muted = false;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f0, f1, dur, type, vol, delay){
  if(muted) return; const c = ac(); if(!c) return;
  const t = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f0, t);
  if(f1 && f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol||0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}

// battle mon: {base, name, type, maxhp, hp, atk, def, spd, moves, status:null|'bleed'|'dazed', alive:true}
function inst(base){ return { base, name:base.name, type:base.type, maxhp:base.hp, hp:base.hp,
  atk:base.atk, def:base.def, spd:base.spd, moves:base.moves.map(m=>({...m})), status:null, alive:true }; }
function mkTeam(ids){ return ids.map(id=>inst(WRESTLERS.find(m=>m.id===id))); }
function randTeam(){ const ids = WRESTLERS.map(m=>m.id);
  for(let i=ids.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [ids[i],ids[j]]=[ids[j],ids[i]]; }
  return mkTeam(ids.slice(0,5)); }

// ---------- BATTLE ENGINE ----------
function effOf(moveType, defType){ return (CHART[moveType] && CHART[moveType][defType]) || 1; }
function calcDmg(user, move, target){
  const eff = effOf(move.t, target.type);
  const stab = move.t === user.type ? 1.5 : 1;
  const rand = 0.85 + Math.random()*0.15;
  const dmg = Math.max(1, Math.floor(move.p * (user.atk/target.def) * 0.45 * eff * stab * rand));
  return {dmg, eff};
}
function startBattle(teamA, teamB, controllers){
  startBattleAnim(); // controllers: {a:'human'|'ai'|'p1'|'p2', b:...}
  S.battle = { a:{team:teamA, active:0}, b:{team:teamB, active:0}, ctrl:controllers, over:false, winner:null, turn:1 };
  S.log = []; S.ui='main'; S.chooser='a'; S.pending={a:null,b:null};
  log('Battle start!');
}
function activeMon(side){ const s=S.battle[side]; return s.team[s.active]; }
function foe(side){ return side==='a'?'b':'a'; }
function aliveCount(side){ return S.battle[side].team.filter(m=>m.alive).length; }

// execute one full turn once both actions chosen. action: {kind:'move',i} | {kind:'switch',i}
function resolveTurn(){
  const B=S.battle, A=S.pending.a, Bp=S.pending.b;
  S.pending={a:null,b:null}; S.ui='busy'; B.turn++;
  const order=[];
  // switches go first
  [['a',A],['b',Bp]].forEach(([s,act])=>{ if(act && act.kind==='switch') order.push([s,act,Infinity]); });
  [['a',A],['b',Bp]].forEach(([s,act])=>{
    if(act && act.kind==='move') order.push([s,act, activeMon(s).spd + (activeMon(s).status==='dazed'?0:0)]);
  });
  order.sort((x,y)=> y[2]-x[2] || (Math.random()-0.5));
  // queue animation steps
  const steps=[];
  order.forEach(([s,act])=>{
    const me=activeMon(s), f=foe(s), foeM=activeMon(f);
    if(!me.alive) return;
    if(act.kind==='switch'){
      steps.push(()=>{ B[s].active=act.i; const m=activeMon(s);
        log(m.name+' enters the fray!');
        SFX.pick(); pushAnim({k:'send', side:s}); });
      return;
    }
    // paralyze check
    if(me.status==='dazed' && Math.random()<0.25){
      steps.push(()=>{ log(me.name+' is dazed! They can\'t move!'); SFX.status(); pushAnim({k:'dazed', side:s}); });
      return;
    }
    const mv=me.moves[act.i];
    steps.push(()=>{
      if(Math.random()*100 >= mv.a){ log(me.name+' used '+mv.n+'... went wide!'); SFX.miss(); pushAnim({k:'miss', side:f}); return; }
      const {dmg, eff} = calcDmg(me, mv, foeM);
      foeM.hp = Math.max(0, foeM.hp - dmg);
      pushAnim({k:'hit', side:f, big:eff>1});
      if(eff>1){ log(me.name+' used '+mv.n+'! A crushing hit! ('+dmg+')'); SFX.super(); }
      else if(eff<1){ log(me.name+' used '+mv.n+'. It barely dents it... ('+dmg+')'); SFX.weak(); }
      else { log(me.name+' used '+mv.n+'! ('+dmg+')'); SFX.hit(); }
      if(mv.e && foeM.alive && !foeM.status && Math.random()<mv.e.ch){
        foeM.status = mv.e.k;
        log(foeM.name+(mv.e.k==='bleed'?' is bleeding!':' is dazed!')); SFX.status();
      }
      if(foeM.hp<=0 && foeM.alive){
        foeM.alive=false; foeM.hp=0;
        log(foeM.name+' went down!'); SFX.faint(); pushAnim({k:'faint', side:f});
      }
    });
  });
  // end-of-turn burn
  steps.push(()=>{
    ['a','b'].forEach(s=>{ const m=activeMon(s);
      if(m.alive && m.status==='bleed'){ const d=Math.max(1,Math.floor(m.maxhp/16)); m.hp=Math.max(0,m.hp-d);
        log(m.name+' is hurt by bleeding! ('+d+')');
        if(m.hp<=0){ m.alive=false; log(m.name+' went down!'); SFX.faint(); pushAnim({k:'faint', side:s}); }
      }});
  });
  runSteps(steps, afterTurn);
}
function afterTurn(){
  const B=S.battle;
  if(!B) return;
  // check battle over
  const aAlive=aliveCount('a')>0, bAlive=aliveCount('b')>0;
  if(!aAlive || !bAlive){
    B.over=true; B.winner = aAlive?'a':'b';
    const w = B.winner;
    if(S.mode==='versus') log((w==='a'?'P1':'P2')+' wins the battle!');
    else log((w==='a'?'You win':'You lose')+' the battle!');
    if(w==='a'){ SFX.fanfare(); } else { SFX.lose(); }
    setTimeout(()=>onBattleEnd(), 1400);
    S.ui='busy'; drawBattle(); return;
  }
  // fainted actives must be replaced
  const need = ['a','b'].filter(s=>!activeMon(s).alive);
  if(need.length){ S.ui='faintpick'; S.faintSide=need[0]; S.faintQueue=need.slice(1); maybeAIFaint(); }
  else { S.ui='main'; S.chooser='a'; maybeAI('a'); }
  drawBattle();
}
// AI must auto-replace a fainted mon (it can't click buttons)
function maybeAIFaint(){
  const s=S.faintSide;
  if(!s || !S.battle || S.battle.ctrl[s]!=='ai') return;
  setTimeout(()=>{
    if(!S.battle || S.battle.over || S.ui!=='faintpick' || S.faintSide!==s) return;
    const B=S.battle, foeM=activeMon(foe(s));
    const benched=B[s].team.map((m,i)=>({m,i})).filter(o=>o.i!==B[s].active && o.m.alive);
    if(!benched.length) return;
    let bi=0, bs=-1;
    benched.forEach((o,i)=>{ const sc=Math.max(...o.m.moves.map(mv=>mv.p*effOf(mv.t,foeM.type)));
      if(sc>bs){ bs=sc; bi=i; } });
    doSwitchPick(bi);
  }, 700);
}
function onBattleEnd(){
  const B=S.battle, w=B.winner;
  if(S.mode==='ladder'){
    if(w==='a'){ S.ladderIdx++;
      if(S.ladderIdx>=3){ S.screen='over'; S.overText='CHAMPION OF THE LADDER!'; S.overWin=true; }
      else {
        // post-fight recruitment: a random foe wrestler is impressed
        const foeTeam = S.battle.b.team;
        const candidate = foeTeam[(Math.random()*foeTeam.length)|0];
        const remaining = S.battle.a.team.filter(m=>m.alive).length;
        const chance = Math.min(0.95, 0.55 + remaining*0.08);
        S.recruit = { base:candidate.base, chance };
        S.screen='recruit';
      }
    } else { S.screen='over'; S.overText='LADDER FAILED vs '+LADDER_NAMES[S.ladderIdx]; S.overWin=false; }
  } else if(S.mode==='quick'){
    S.screen='over'; S.overText = w==='a'?'VICTORY!':'DEFEAT'; S.overWin = w==='a';
  } else { // versus
    if(w==='a') S.wins.a++; else S.wins.b++;
    S.screen='over';
    S.overText = (w==='a'?'P1':'P2')+' WINS THE BATTLE!';
    S.overWin = true; S.overVersus = true;
  }
  drawAll();
}
function sideName(s){ const c=S.battle.ctrl[s]; return c==='p1'?'P1':c==='p2'?'P2':(s==='a'?'You':'Foe'); }

// ---------- AI ----------
function aiChoose(side){
  const B=S.battle, me=activeMon(side), f=foe(side), foeM=activeMon(f);
  // switch if in trouble and a better option exists
  const benched = B[side].team.map((m,i)=>({m,i})).filter(o=>o.i!==B[side].active && o.m.alive);
  if(me.hp < me.maxhp*0.35 && benched.length && Math.random()<0.35){
    let best=null, bestScore=-1;
    benched.forEach(o=>{ const off=Math.max(...o.m.moves.map(mv=>mv.p*effOf(mv.t,foeM.type)));
      const def=effOf(foeM.moves[0].t, o.m.type); const score=off/(def||1);
      if(score>bestScore){bestScore=score;best=o;} });
    if(best && bestScore>1.2){ S.pending[side]={kind:'switch', i:best.i}; aiDone(side); return; }
  }
  // pick move: score by power * effectiveness * stab
  let bi=0, bs=-1;
  me.moves.forEach((mv,i)=>{ const s = mv.p * effOf(mv.t, foeM.type) * (mv.t===me.type?1.3:1) * (0.9+Math.random()*0.2);
    if(s>bs){bs=s;bi=i;} });
  S.pending[side]={kind:'move', i:bi};
  aiDone(side);
}
function aiDone(side){
  const other=foe(side);
  if(S.pending[other] || S.battle.ctrl[other]==='ai'){ /* both in eventually */ }
  if(S.pending.a && S.pending.b){ resolveTurn(); }
  else if(S.battle.ctrl[other]==='ai' && !S.pending[other]){ setTimeout(()=>{ if(S.battle&&!S.battle.over) aiChoose(other); }, 450); }
  else { // other side is human: prompt them
    S.chooser=other; S.ui = (S.battle.ctrl[other]==='p2') ? 'main-p2' : 'main';
    drawBattle();
  }
}
function maybeAI(side){
  if(!S.battle || S.battle.over) return;
  if(S.battle.ctrl[side]==='ai'){ S.ui='busy'; drawBattle(); setTimeout(()=>{ if(S.battle&&!S.battle.over) aiChoose(side); }, 500); }
  else { S.ui = (S.battle.ctrl[side]==='p2') ? 'main-p2' : 'main'; S.chooser=side; drawBattle(); }
}
function humanAct(side, act){
  if(!S.battle || S.battle.over) return;
  S.pending[side]=act;
  const other=foe(side);
  if(S.pending[other]){ resolveTurn(); return; }
  if(S.battle.ctrl[other]==='ai'){ S.ui='busy'; drawBattle(); setTimeout(()=>{ if(S.battle&&!S.battle.over) aiChoose(other); }, 450); }
  else { S.chooser=other; S.ui = (S.battle.ctrl[other]==='p2') ? 'main-p2' : 'main'; drawBattle(); }
}

// ---------- STEP RUNNER (simple sequential animations) ----------
let stepTimer=null;
function runSteps(steps, done){
  let i=0;
  function next(){
    if(i>=steps.length){ stepTimer=null; done(); return; }
    try{ steps[i](); }catch(e){ console.error(e); }
    i++; drawBattle();
    stepTimer=setTimeout(next, 750);
  }
  next();
}
function pushAnim(a){ a.t0=performance.now(); S.anims.push(a); }

// ---------- DRAFT ----------
function startDraft(mode){

  S.ladderIdx=0;

}
function draftPick(id){

  S.draftPool=S.draftPool.filter(x=>x!==id);
  if(who==='human'||who==='p1') S.draftTeams.a.push(id); else S.draftTeams.b.push(id);

  if(nxt==='ai'){ setTimeout(()=>{ // AI draft: prefer type coverage, slight random
    const pool=S.draftPool;
    const pick = pool[(Math.random()*pool.length)|0];
    draftPick(pick);
  }, 600); }
}
function finishDraft(){
  const teamA=mkTeam(S.draftTeams.a), teamB=mkTeam(S.draftTeams.b);

  else if(S.mode==='quick'){ startBattle(teamA, teamB, {a:'human',b:'ai'}); }

function startMode(mode){

let ptrX=0, ptrY=0;

addEventListener('keydown', e=>{

  }
  if(S.screen!=='battle'||!S.battle||S.battle.over) {
    if(k==='Enter'){ const b=S.buttons[S.focus]; if(b&&!b.disabled){b.fn();} }
    if(k==='ArrowDown'||k==='ArrowRight'){ S.focus=(S.focus+1)%Math.max(1,S.buttons.length); drawAll(); }
    if(k==='ArrowUp'||k==='ArrowLeft'){ S.focus=(S.focus-1+S.buttons.length)%Math.max(1,S.buttons.length); drawAll(); }
    return;
  }
  const ui=S.ui;
  if(ui==='main'||ui==='main-p2'){ if(k==='f'||k==='F'||k==='1'){ S.ui = ui==='main-p2'?'moves-p2':'moves'; SFX.click(); drawBattle(); }
    if(k==='s'||k==='S'||k==='2'){ S.ui = ui==='main-p2'?'switch-p2':'switch'; SFX.click(); drawBattle(); } }
  else if(ui==='moves'||ui==='moves-p2'){ const n=parseInt(k);
    if(n>=1&&n<=4){ const m=activeMon(S.chooser); if(m.moves[n-1]){ S.ui='busy'; humanAct(S.chooser,{kind:'move',i:n-1}); } }
    if(k==='Escape'){ S.ui = ui==='moves-p2'?'main-p2':'main'; drawBattle(); } }
  else if(ui==='switch'||ui==='switch-p2'){ const n=parseInt(k);
    if(n>=1&&n<=3){ doSwitchPick(n-1); }
    if(k==='Escape'){ S.ui = ui.endsWith('p2')?'main-p2':'main'; drawBattle(); } }
  if(k==='ArrowDown'||k==='ArrowRight'){ S.focus=(S.focus+1)%Math.max(1,S.buttons.length); drawBattle(); }
  if(k==='ArrowUp'||k==='ArrowLeft'){ S.focus=(S.focus-1+S.buttons.length)%Math.max(1,S.buttons.length); drawBattle(); }
  if(k==='Enter'){ const b=S.buttons[S.focus]; if(b&&!b.disabled){ SFX.click(); b.fn(); } }
});
function doSwitchPick(idx){
  const B=S.battle, side=S.faintSide||S.chooser;
  const benched=B[side].team.map((m,i)=>({m,i})).filter(o=>o.i!==B[side].active&&o.m.alive);
  if(idx<0||idx>=benched.length) return;
  const pick=benched[idx].i;
  if(S.ui==='faintpick'){
    B[side].active=pick; const m=activeMon(side);
    log(m.name+' enters the fray!'); SFX.pick();
    if(S.faintQueue&&S.faintQueue.length){ S.faintSide=S.faintQueue.shift(); maybeAIFaint(); }
    else { S.faintSide=null; S.faintQueue=null; S.ui='main'; S.chooser='a'; }
    drawBattle(); if(S.ui==='main') maybeAI('a');
  } else {
    const p2 = (S.ui==='switch-p2');
    S.ui='busy'; humanAct(side,{kind:'switch', i:pick});
  }
}

function _getPixelSprite(shape,color){
  const key=shape+'|'+color;

  const g=c.getContext('2d');

}
function drawCritter(shape, x, y, r, color, o){
  o=o||{};

}

// ---------- RENDER HELPERS ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(str,x,y,size,color,align,font){ ctx.fillStyle=color||'#e8f5ee'; ctx.font=(font||'')+size+'px "Courier New",monospace';
  ctx.textAlign=align||'left'; ctx.textBaseline='top'; ctx.fillText(str,x,y); }
function drawButton(b, focused){
  ctx.fillStyle=b.disabled?'#141a24':(focused?'#0f2b22':'#0d1420');
  rr(b.x,b.y,b.w,b.h,10); ctx.fill();
  ctx.strokeStyle=b.disabled?'#2a3444':'#00ff9d'; ctx.lineWidth=focused?3:1.5; rr(b.x,b.y,b.w,b.h,10); ctx.stroke();
  text(b.label, b.x+b.w/2, b.y+b.h/2-9, b.big?20:15, b.disabled?'#4a5a6c':'#e8f5ee','center','bold ');
  if(b.sub) text(b.sub, b.x+b.w/2, b.y+b.h/2+10, 11, '#8fa89b','center');
}
function drawButtons(){ S.buttons.forEach((b,i)=>drawButton(b, i===S.focus)); }
function hpBar(x,y,w,h,frac){
  ctx.fillStyle='#141a24'; rr(x,y,w,h,5); ctx.fill();
  const f=Math.max(0,Math.min(1,frac));
  ctx.fillStyle=f>0.5?'#3ddc84':f>0.25?'#ffd93f':'#ff5a5a';
  if(f>0){ rr(x+2,y+2,(w-4)*f,h-4,4); ctx.fill(); }
}
function typeBadge(t,x,y){ ctx.fillStyle=TCOL[t]; rr(x,y,64,20,5); ctx.fill();
  text(t,x+32,y+3,11,'#0a0d13','center','bold '); }
function drawPlate(mon,x,y,w,align){ // name + type + hp
  text(mon.name,x,y,16,'#e8f5ee',align,'bold ');
  typeBadge(mon.type, align==='left'?x:x-w+56, y+22);
  hpBar(x+(align==='left'?0:w-160),y+46,160,12,mon.hp/mon.maxhp);
  text(mon.hp+'/'+mon.maxhp, x+(align==='left'?165:w-165), y+44, 12, '#8fa89b', align==='left'?'left':'right');
  if(mon.status) text(mon.status==='bleed'?'BLEED':'DAZED', x+(align==='left'?w-34:0), y+22, 11, mon.status==='bleed'?'#ff5252':'#ffd93f', align==='left'?'right':'left','bold ');
}
function animState(side){
  const now=performance.now(); let dx=0,dy=0,flash=0,alpha=1,scale=1;
  S.anims=S.anims.filter(a=>now-a.t0<900);
  S.anims.forEach(a=>{ if(a.side!==side) return; const t=(now-a.t0)/450;
    if(a.k==='hit'){ dx = side==='a'?Math.sin(t*20)*6:-Math.sin(t*20)*6; flash=Math.max(0,1-t); }
    else if(a.k==='faint'){ dy=t*40; alpha=1-t; }
    else if(a.k==='send'){ scale=0.3+0.7*Math.min(1,t*2); }
    else if(a.k==='dazed'){ dx=Math.sin(t*30)*4; }
  });
  return {dx,dy,flash,alpha,scale};
}

// Continuous animation loop for battle idle animations
let battleAnimId=null;
function startBattleAnim(){
  if(battleAnimId) return;
  const loop=()=>{
    if(S.screen==='battle' && S.battle){
      S.t=(S.t||0)+0.016;
      drawBattle();
      battleAnimId=requestAnimationFrame(loop);
    } else {
      battleAnimId=null;
    }
  };
  battleAnimId=requestAnimationFrame(loop);
}
function drawBattle(){
  const B=S.battle; if(!B) return;
  S.buttons=[];
  // ARENA BACKGROUND
  // dark arena
  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#0a0a12');
  bgGrad.addColorStop(0.6,'#12121e');
  bgGrad.addColorStop(1,'#0a0a12');
  ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H);
  // crowd (dark silhouettes with tiny lights)
  ctx.fillStyle='#080810';
  for(let i=0;i<40;i++){
    const cx=(i*47)%W, cy=20+((i*31)%80);
    ctx.fillRect(cx,cy,8,12);
    if(i%7===0){ ctx.fillStyle='#ffdd44'; ctx.fillRect(cx+2,cy+2,2,2); ctx.fillStyle='#080810'; }
  }
  // spotlights
  ctx.save(); ctx.globalAlpha=0.08;
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.moveTo(100,0); ctx.lineTo(200,0); ctx.lineTo(350,400); ctx.lineTo(150,400); ctx.fill();
  ctx.beginPath(); ctx.moveTo(300,0); ctx.lineTo(400,0); ctx.lineTo(250,400); ctx.lineTo(50,400); ctx.fill();
  ctx.restore();
  // WRESTLING RING
  // mat
  ctx.fillStyle='#2a2d3a'; 
  ctx.beginPath(); ctx.ellipse(240,340,200,90,0,0,7); ctx.fill();
  ctx.fillStyle='#323544';
  ctx.beginPath(); ctx.ellipse(240,335,190,82,0,0,7); ctx.fill();
  // mat texture (canvas lines)
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(240,335,190-i*35,82-i*16,0,0,7); ctx.stroke(); }
  // apron (ring skirt)
  ctx.fillStyle='#1a1c26';
  ctx.fillRect(40,335,400,25);
  ctx.fillStyle='#c0392b'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
  ctx.fillText('★ TAMERS ★', 240, 352);
  // posts
  const posts=[[70,250],[410,250],[70,420],[410,420]];
  posts.forEach(([px,py])=>{
    ctx.fillStyle='#555'; ctx.fillRect(px-4,py-60,8,60);
    ctx.fillStyle='#c0392b'; ctx.fillRect(px-6,py-65,12,8);
  });
  // ropes (3 levels)
  ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=3;
  [280,310,340].forEach(ry=>{
    ctx.beginPath(); ctx.moveTo(70,ry-30); ctx.lineTo(410,ry-30); ctx.stroke();
  });
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2;
  [280,310,340].forEach(ry=>{
    ctx.beginPath(); ctx.moveTo(70,ry-30); ctx.lineTo(410,ry-30); ctx.stroke();
  });
  // shadows under wrestlers
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(330,340,60,14,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(150,430,60,14,0,0,7); ctx.fill();
  const A=activeMon('a'), F=activeMon('b');
  const bobA=Math.sin(S.t*3)*4, bobF=Math.sin(S.t*3+1.5)*4;
  drawPlate(F,16,12,220,'left');
  drawPlate(A,244,300,220,'right');
  // sprites with anims
  let st=animState('b');
  ctx.save(); ctx.globalAlpha=st.alpha;
  drawWrestlerSprite(ctx, F.base.id, 330, 290, 150, false, {dx:st.dx, dy:st.dy+bobF, scale:st.scale, flash:st.flash, alpha:st.alpha});
  ctx.restore();
  st=animState('a');
  ctx.save(); ctx.globalAlpha=st.alpha;
  drawWrestlerSprite(ctx, A.base.id, 150, 380, 170, true, {dx:st.dx, dy:st.dy+bobA, scale:st.scale, flash:st.flash, alpha:st.alpha});
  ctx.restore();
  // team pips
  B.a.team.forEach((m,i)=>{ ctx.fillStyle=m.alive?'#3ddc84':'#333'; ctx.beginPath(); ctx.arc(250+i*18,392,6,0,7); ctx.fill(); });
  B.b.team.forEach((m,i)=>{ ctx.fillStyle=m.alive?'#ff5a5a':'#333'; ctx.beginPath(); ctx.arc(16+i*18,80,6,0,7); ctx.fill(); });
  // log
  ctx.fillStyle='#0d1420'; rr(16,500,448,88,8); ctx.fill();
  const lines=S.log.slice(-3);
  lines.forEach((l,i)=>text(l,28,512+i*26,13,'#cfe3d8'));
  // menu
  const ui=S.ui, chooser=S.chooser;

  if(ui==='main'||ui==='main-p2'){
    if(whoLabel) text(whoLabel+' — choose',W/2,604,14,'#8fa89b','center');

    });
    btn(196,662,88,30,'BACK',()=>{ S.ui=p2?'main-p2':'main'; drawBattle(); },{});
  } else if(ui==='switch'||ui==='switch-p2'){
    const B2=S.battle, benched=B2[chooser].team.map((m,i)=>({m,i})).filter(o=>o.i!==B2[chooser].active&&o.m.alive);
    benched.forEach((o,i)=>{ btn(24+i*150,624,140,72,(i+1)+'. '+o.m.name,()=>doSwitchPick(i),{sub:o.m.hp+'/'+o.m.maxhp+' HP'}); });
    if(!benched.length) text('no one left!',W/2,650,14,'#8fa89b','center');
    btn(196,662,88,30,'BACK',()=>{ S.ui=p2?'main-p2':'main'; drawBattle(); },{});
  } else if(ui==='faintpick'){
    const s=S.faintSide, c=B.ctrl[s];
    const label = c==='p1'?'P1':c==='p2'?'P2':c==='ai'?'FOE':'YOU';
    text(label+' — choose your next wrestler!',W/2,604,15,'#ffd93f','center','bold ');
    const benched=B[s].team.map((m,i)=>({m,i})).filter(o=>o.i!==B[s].active&&o.m.alive);
    benched.forEach((o,i)=>{ btn(24+i*150,628,140,64,(i+1)+'. '+o.m.name,()=>doSwitchPick(i),{sub:o.m.hp+'/'+o.m.maxhp+' HP'}); });
  } else {
    text('...',W/2,650,16,'#54655c','center');
  }
  drawButtons();
  // tint move buttons by type
  S.buttons.forEach(b=>{ if(b.tcol){ ctx.strokeStyle=b.tcol; ctx.lineWidth=2; rr(b.x,b.y,b.w,b.h,10); ctx.stroke(); } });
  text('P pause · M mute'+(muted?' (muted)':''),W/2,700,11,'#54655c','center');
}

    text('JOINS YOUR STABLE!', W/2, 290, 24, '#ffd93f', 'center', 'bold ');

  S.recruit=null;

  startBattle(S.battle.a.team, foeTeam, {a:'human', b:'ai'});
  log('Next challenger: '+LADDER_NAMES[S.ladderIdx]+'!');
  S.screen='battle'; drawAll();
}

function owTile(x,y){ if(x<0||y<0||x>=OW_W||y>=OW_H) return 2; return OW_MAP[y][x]; }
function owBlocked(x,y){ const t=owTile(x,y); return t===2||t===3; }
function startOverworld(){
  S.ow = { px:3, py:6, dir:'down', moving:false, mt:0,
    npcs:[
      {x:8, y:7, id:'titan', beaten:false, name:'TITAN CRUSH'},
      {x:14, y:8, id:'velvet', beaten:false, name:'"VELVET" VERA STORM'},
      {x:5, y:10, id:'brutus', beaten:false, name:'BRUTUS "THE BUTCHER"'},
    ]};

function drawOverworld(){
  ctx.fillStyle='#0e1420'; ctx.fillRect(0,0,W,H);
  const ox = W/2 - (S.ow.px*OW_T+OW_T/2), oy = 120 - (S.ow.py*OW_T+OW_T/2);
  // tiles - detailed pixel art
  for(let y=0;y<OW_H;y++) for(let x=0;x<OW_W;x++){
    const t=OW_MAP[y][x], sx=x*OW_T+ox, sy=y*OW_T+oy;
    if(sx<-OW_T||sy<-OW_T||sx>W+OW_T||sy>H+OW_T) continue;
    const px=(x*7+y*13)%16; // deterministic detail seed
    if(t===0||t===5||t===6){
      ctx.fillStyle='#3f9e4d'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#358a42';
      ctx.fillRect(sx+px%12,sy+2,2,2); ctx.fillRect(sx+(px+7)%12,sy+10,2,2);
      ctx.fillStyle='#4db45e'; ctx.fillRect(sx+(px+3)%12,sy+6,2,1);
      if(t===5){ // tall grass tufts
        ctx.fillStyle='#2a6e35';
        for(let i=0;i<4;i++){ const gx=sx+2+i*4; ctx.fillRect(gx,sy+5,2,9); ctx.fillRect(gx+1,sy+3,1,3); }
        ctx.fillStyle='#3f9e4d'; for(let i=0;i<4;i++){ const gx=sx+2+i*4; ctx.fillRect(gx,sy+5,1,9); }
      }
      if(t===6){ ctx.fillStyle='#ff6b9d'; ctx.fillRect(sx+6,sy+5,4,4);
        ctx.fillStyle='#ff9ec7'; ctx.fillRect(sx+6,sy+5,4,1); ctx.fillStyle='#c94a75'; ctx.fillRect(sx+6,sy+8,4,1); }
    }
    else if(t===1){ // path with stones
      ctx.fillStyle='#d4b48a'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#b8936a'; ctx.fillRect(sx,sy+14,OW_T,2);
      ctx.fillStyle='#c4a075';
      ctx.fillRect(sx+2+(px%8),sy+3,3,2); ctx.fillRect(sx+8+(px%4),sy+9,3,2);
      ctx.fillStyle='#e0c49a'; ctx.fillRect(sx+2+(px%8),sy+3,3,1);
    }
    else if(t===2){ // water with waves
      ctx.fillStyle='#3d8bff'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#5da2ff';
      const wy=(x*3+y*5)%10;
      ctx.fillRect(sx+2,sy+3+wy,6,1); ctx.fillRect(sx+8,sy+8+((wy+5)%8),5,1);
      ctx.fillStyle='#2d6fd9'; ctx.fillRect(sx,sy+14,OW_T,2);
    }
    else if(t===3){ // building wall with bricks
      ctx.fillStyle='#9a7a5a'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#7a5f45';
      ctx.fillRect(sx,sy+5,OW_T,1); ctx.fillRect(sx,sy+11,OW_T,1);
      ctx.fillRect(sx+7,sy,1,5); ctx.fillRect(sx+3,sy+6,1,5); ctx.fillRect(sx+11,sy+6,1,5);
      ctx.fillStyle='#b08a6a'; ctx.fillRect(sx,sy,OW_T,2);
    }
    else if(t===4){ // door with frame
      ctx.fillStyle='#5a4028'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#3a2818'; ctx.fillRect(sx+3,sy+2,10,14);
      ctx.fillStyle='#6a4f30'; ctx.fillRect(sx+4,sy+3,8,12);
      ctx.fillStyle='#ffd93f'; ctx.fillRect(sx+10,sy+9,2,2);
    }
    else if(t===7){ // arena mat
      ctx.fillStyle='#d4a574'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#c49464'; ctx.fillRect(sx,sy,OW_T,1); ctx.fillRect(sx,sy+15,OW_T,1);
      ctx.fillStyle='#e0b584'; ctx.fillRect(sx+7,sy+7,2,2);
    }
  }
  // NPC rival wrestlers
  S.ow.npcs.forEach(n=>{
    if(n.beaten) return;
    const nx=n.x*OW_T+ox, ny=n.y*OW_T+oy;
    const wbase=WRESTLERS.find(w=>w.id===n.id);
    drawOWWrestler(nx,ny,TCOL[wbase.type]);
    // "!" if player is close
    if(Math.abs(S.ow.px-n.x)+Math.abs(S.ow.py-n.y)===1){
      text('!', nx+8, ny-10, 14, '#ffd93f', 'center', 'bold ');
    }
  });
  // player - detailed top-down pixel wrestler
  const px=S.ow.px*OW_T+ox, py=S.ow.py*OW_T+oy;
  function drawOWWrestler(wx,wy,gearColor){
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(wx+8,wy+15,6,2,0,0,7); ctx.fill();
    // legs (dark tights)
    ctx.fillStyle='#2a2f3a'; ctx.fillRect(wx+5,wy+11,2,4); ctx.fillRect(wx+9,wy+11,2,4);
    // boots
    ctx.fillStyle='#1a1d24'; ctx.fillRect(wx+4,wy+14,4,2); ctx.fillRect(wx+8,wy+14,4,2);
    // torso (gear color with shading)
    ctx.fillStyle=gearColor; ctx.fillRect(wx+4,wy+6,8,6);
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(wx+4,wy+6,8,1);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(wx+4,wy+11,8,1);
    // belt
    ctx.fillStyle='#ffd93f'; ctx.fillRect(wx+4,wy+10,8,1);
    // arms (skin)
    ctx.fillStyle='#e8b88a'; ctx.fillRect(wx+2,wy+7,2,4); ctx.fillRect(wx+12,wy+7,2,4);
    ctx.fillStyle='#d4a075'; ctx.fillRect(wx+2,wy+10,2,1); ctx.fillRect(wx+12,wy+10,2,1);
    // head
    ctx.fillStyle='#e8b88a'; ctx.fillRect(wx+5,wy+1,6,5);
    // hair
    ctx.fillStyle='#3a2818'; ctx.fillRect(wx+5,wy+1,6,2); ctx.fillRect(wx+5,wy+1,2,4); ctx.fillRect(wx+9,wy+1,2,4);
    // headband (gear color)
    ctx.fillStyle=gearColor; ctx.fillRect(wx+5,wy+3,6,1);
  }
  drawOWWrestler(px,py,'#ff5252');
  text('TAMERS WORLD', 10, 10, 14, '#e8f5ee', 'left', 'bold ');
  text('Find the arenas!', 10, 30, 12, '#8fa89b', 'left');
  S.buttons=[];
}
function owMove(dx,dy){
  if(!S.ow||S.ow.moving) return;
  const nx=S.ow.px+dx, ny=S.ow.py+dy;
  S.ow.dir = dy<0?'up':dy>0?'down':dx<0?'left':'right';
  if(owBlocked(nx,ny)){ drawAll(); return; }
  const t=owTile(nx,ny);
  S.ow.px=nx; S.ow.py=ny; SFX.click();
  if(t===4){ // door -> arena battle!
    startBattle(mkTeam(S.stable), randTeam(), {a:'human',b:'ai'});
    S.screen='battle'; drawAll(); return;
  }
  // check NPC challenge: adjacent rival wants to fight
  const npc = S.ow.npcs.find(n=>!n.beaten && Math.abs(S.ow.px-n.x)+Math.abs(S.ow.py-n.y)===1);
  if(npc){
    const wbase=WRESTLERS.find(w=>w.id===npc.id);
    const foeIds=['titan'];  // 1v1 test: only TITAN
    npc.beaten=true;
    startBattle(mkTeam(S.stable), mkTeam(foeIds), {a:'human',b:'ai'});
    log(npc.name+' wants a fight!');
    S.screen='battle'; drawAll(); return;
  }
  drawAll();
}

function drawAll(){
  S.focus=0;
  if(S.screen==='menu') drawMenu();
  else if(S.screen==='chart') drawChart();
  else if(S.screen==='draft') drawDraft();
  else if(S.screen==='battle') drawBattle();
  else if(S.screen==='over') drawOver();
  else if(S.screen==='recruit') drawRecruit();
  else if(S.screen==='overworld') drawOverworld();
  if(S.paused){ ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    text('PAUSED',W/2,340,40,'#e8f5ee','center','bold '); text('P to resume',W/2,390,14,'#8fa89b','center'); }
}

// ---------- LOOP ----------
let last=0;
function loop(ts){ const dt=Math.min(0.05,(ts-last)/1000||0); last=ts; S.t+=dt;
  if(S.screen==='battle'&&!S.paused) drawBattle();
  requestAnimationFrame(loop); }

// ---------- GAME HOOKS ----------
window.GAME = {
  get state(){ return S.screen; },
  get mode(){ return S.mode; },
  get turn(){ return S.battle?S.battle.turn:0; },
  get wins(){ return {...S.wins}; },
  get log(){ return S.log.slice(-5); },
  get teams(){ if(!S.battle) return null;
    const t=s=>S.battle[s].team.map(m=>({name:m.name,type:m.type,hp:m.hp,maxhp:m.maxhp,alive:m.alive,status:m.status}));
    return {a:t('a'), b:t('b'), activeA:S.battle.a.active, activeB:S.battle.b.active, over:S.battle.over, winner:S.battle.winner}; },
  get draft(){ return {pool:[...S.draftPool], idx:S.draftIdx, teams:{a:[...S.draftTeams.a],b:[...S.draftTeams.b]}}; },
  startMode,
  _S:S,
};
drawAll();
requestAnimationFrame(loop);
</script>
