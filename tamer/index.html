// ---------- AUDIO ----------
let AC = null, muted = false;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f0, f1, dur, type, vol, delay){
  if(muted) return; const c = ac(); if(!c) return;
  const t = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f0, t);
  if(f1 && f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol||0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
const SFX = {
  click(){ tone(800,800,0.05,'square',0.06); },
  pick(){ tone(520,780,0.09,'square',0.08); },
  hit(){ tone(140,60,0.16,'triangle',0.16); },
  super(){ tone(660,660,0.09,'sine',0.12); tone(880,880,0.12,'sine',0.12,0.09); },
  weak(){ tone(220,180,0.1,'square',0.07); },
  miss(){ tone(300,150,0.12,'sine',0.08); },
  faint(){ tone(420,70,0.5,'sine',0.14); },
  status(){ tone(330,330,0.08,'square',0.08); tone(330,330,0.08,'square',0.08,0.12); },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,f,0.16,'square',0.09,i*0.14)); },
  lose(){ [400,300,200].forEach((f,i)=>tone(f,f,0.18,'triangle',0.1,i*0.16)); },
};

// ---------- STATE ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 480, H = 720;
function fit(){ const s = Math.min(innerWidth/W, innerHeight/H); cv.style.width = (W*s)+'px'; cv.style.height = (H*s)+'px'; }
addEventListener('resize', fit); fit();

const S = {
  screen:'menu',            // menu | chart | draft | battle | over
  mode:null,                // ladder | quick | versus
  draftPool:[], draftOrder:[], draftIdx:0, draftTeams:{a:[],b:[]},
  battle:null,              // battle object
  ui:'main',                // battle submenu: main|moves|switch|busy
  chooser:'a',              // which side is choosing now (versus: 'a' then 'b')
  pending:{a:null,b:null},  // chosen actions
  log:[],
  ladderIdx:0,
  stable:null,          // persistent team IDs for overworld
  recruit:null,         // {wrestler, chance} pending post-fight offer
  ow:null,              // overworld state {px,py,dir,moving}
  wins:{a:0,b:0},
  anims:[],                 // active tween list
  t:0,
};
function log(m){ S.log.push(m); if(S.log.length>40) S.log.shift(); }

// battle mon: {base, name, type, maxhp, hp, atk, def, spd, moves, status:null|'bleed'|'dazed', alive:true}
function inst(base){ return { base, name:base.name, type:base.type, maxhp:base.hp, hp:base.hp,
  atk:base.atk, def:base.def, spd:base.spd, moves:base.moves.map(m=>({...m})), status:null, alive:true }; }
function mkTeam(ids){ return ids.map(id=>inst(WRESTLERS.find(m=>m.id===id))); }
function randTeam(){ const ids = WRESTLERS.map(m=>m.id);
  for(let i=ids.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [ids[i],ids[j]]=[ids[j],ids[i]]; }
  return mkTeam(ids.slice(0,5)); }

// ---------- BATTLE ENGINE ----------
function effOf(moveType, defType){ return (CHART[moveType] && CHART[moveType][defType]) || 1; }
function calcDmg(user, move, target){
  const eff = effOf(move.t, target.type);
  const stab = move.t === user.type ? 1.5 : 1;
  const rand = 0.85 + Math.random()*0.15;
  const dmg = Math.max(1, Math.floor(move.p * (user.atk/target.def) * 0.45 * eff * stab * rand));
  return {dmg, eff};
}
function startBattle(teamA, teamB, controllers){
  startBattleAnim(); // controllers: {a:'human'|'ai'|'p1'|'p2', b:...}
  S.battle = { a:{team:teamA, active:0}, b:{team:teamB, active:0}, ctrl:controllers, over:false, winner:null, turn:1 };
  S.log = []; S.ui='main'; S.chooser='a'; S.pending={a:null,b:null};
  log('Battle start!');
}
function activeMon(side){ const s=S.battle[side]; return s.team[s.active]; }
function foe(side){ return side==='a'?'b':'a'; }
function aliveCount(side){ return S.battle[side].team.filter(m=>m.alive).length; }

// execute one full turn once both actions chosen. action: {kind:'move',i} | {kind:'switch',i}
function resolveTurn(){
  const B=S.battle, A=S.pending.a, Bp=S.pending.b;
  S.pending={a:null,b:null}; S.ui='busy'; B.turn++;
  const order=[];
  // switches go first
  [['a',A],['b',Bp]].forEach(([s,act])=>{ if(act && act.kind==='switch') order.push([s,act,Infinity]); });
  [['a',A],['b',Bp]].forEach(([s,act])=>{
    if(act && act.kind==='move') order.push([s,act, activeMon(s).spd + (activeMon(s).status==='dazed'?0:0)]);
  });
  order.sort((x,y)=> y[2]-x[2] || (Math.random()-0.5));
  // queue animation steps
  const steps=[];
  order.forEach(([s,act])=>{
    const me=activeMon(s), f=foe(s), foeM=activeMon(f);
    if(!me.alive) return;
    if(act.kind==='switch'){
      steps.push(()=>{ B[s].active=act.i; const m=activeMon(s);
        log(m.name+' enters the fray!');
        SFX.pick(); pushAnim({k:'send', side:s}); });
      return;
    }
    // paralyze check
    if(me.status==='dazed' && Math.random()<0.25){
      steps.push(()=>{ log(me.name+' is dazed! They can\'t move!'); SFX.status(); pushAnim({k:'dazed', side:s}); });
      return;
    }
    const mv=me.moves[act.i];
    steps.push(()=>{
      if(Math.random()*100 >= mv.a){ log(me.name+' used '+mv.n+'... went wide!'); SFX.miss(); pushAnim({k:'miss', side:f}); return; }
      const {dmg, eff} = calcDmg(me, mv, foeM);
      foeM.hp = Math.max(0, foeM.hp - dmg);
      pushAnim({k:'hit', side:f, big:eff>1, mv:mv.n}); pushAnim({k:'wmove', side:s, mv:mv.n});
      if(eff>1){ log(me.name+' used '+mv.n+'! A crushing hit! ('+dmg+')'); SFX.super(); }
      else if(eff<1){ log(me.name+' used '+mv.n+'. It barely dents it... ('+dmg+')'); SFX.weak(); }
      else { log(me.name+' used '+mv.n+'! ('+dmg+')'); SFX.hit(); }
      if(mv.e && foeM.alive && !foeM.status && Math.random()<mv.e.ch){
        foeM.status = mv.e.k;
        log(foeM.name+(mv.e.k==='bleed'?' is bleeding!':' is dazed!')); SFX.status();
      }
      if(foeM.hp<=0 && foeM.alive){
        foeM.alive=false; foeM.hp=0;
        log(foeM.name+' went down!'); SFX.faint(); pushAnim({k:'faint', side:f});
      }
    });
  });
  // end-of-turn burn
  steps.push(()=>{
    ['a','b'].forEach(s=>{ const m=activeMon(s);
      if(m.alive && m.status==='bleed'){ const d=Math.max(1,Math.floor(m.maxhp/16)); m.hp=Math.max(0,m.hp-d);
        log(m.name+' is hurt by bleeding! ('+d+')');
        if(m.hp<=0){ m.alive=false; log(m.name+' went down!'); SFX.faint(); pushAnim({k:'faint', side:s}); }
      }});
  });
  runSteps(steps, afterTurn);
}
function afterTurn(){
  const B=S.battle;
  if(!B) return;
  // check battle over
  const aAlive=aliveCount('a')>0, bAlive=aliveCount('b')>0;
  if(!aAlive || !bAlive){
    B.over=true; B.winner = aAlive?'a':'b';
    const w = B.winner;
    if(S.mode==='versus') log((w==='a'?'P1':'P2')+' wins the battle!');
    else log((w==='a'?'You win':'You lose')+' the battle!');
    if(w==='a'){ SFX.fanfare(); } else { SFX.lose(); }
    setTimeout(()=>onBattleEnd(), 1400);
    S.ui='busy'; drawBattle(); return;
  }
  // fainted actives must be replaced
  const need = ['a','b'].filter(s=>!activeMon(s).alive);
  if(need.length){ S.ui='faintpick'; S.faintSide=need[0]; S.faintQueue=need.slice(1); maybeAIFaint(); }
  else { S.ui='main'; S.chooser='a'; maybeAI('a'); }
  drawBattle();
}
// AI must auto-replace a fainted mon (it can't click buttons)
function maybeAIFaint(){
  const s=S.faintSide;
  if(!s || !S.battle || S.battle.ctrl[s]!=='ai') return;
  setTimeout(()=>{
    if(!S.battle || S.battle.over || S.ui!=='faintpick' || S.faintSide!==s) return;
    const B=S.battle, foeM=activeMon(foe(s));
    const benched=B[s].team.map((m,i)=>({m,i})).filter(o=>o.i!==B[s].active && o.m.alive);
    if(!benched.length) return;
    let bi=0, bs=-1;
    benched.forEach((o,i)=>{ const sc=Math.max(...o.m.moves.map(mv=>mv.p*effOf(mv.t,foeM.type)));
      if(sc>bs){ bs=sc; bi=i; } });
    doSwitchPick(bi);
  }, 700);
}
function onBattleEnd(){
  const B=S.battle, w=B.winner;
  if(S.mode==='ladder'){
    if(w==='a'){ S.ladderIdx++;
      if(S.ladderIdx>=3){ S.screen='over'; S.overText='CHAMPION OF THE LADDER!'; S.overWin=true; }
      else {
        // post-fight recruitment: a random foe wrestler is impressed
        const foeTeam = S.battle.b.team;
        const candidate = foeTeam[(Math.random()*foeTeam.length)|0];
        const remaining = S.battle.a.team.filter(m=>m.alive).length;
        const chance = Math.min(0.95, 0.55 + remaining*0.08);
        S.recruit = { base:candidate.base, chance };
        S.screen='recruit';
      }
    } else { S.screen='over'; S.overText='LADDER FAILED vs '+LADDER_NAMES[S.ladderIdx]; S.overWin=false; }
  } else if(S.mode==='quick'){
    S.screen='over'; S.overText = w==='a'?'VICTORY!':'DEFEAT'; S.overWin = w==='a';
  } else { // versus
    if(w==='a') S.wins.a++; else S.wins.b++;
    S.screen='over';
    S.overText = (w==='a'?'P1':'P2')+' WINS THE BATTLE!';
    S.overWin = true; S.overVersus = true;
  }
  drawAll();
}
function sideName(s){ const c=S.battle.ctrl[s]; return c==='p1'?'P1':c==='p2'?'P2':(s==='a'?'You':'Foe'); }

// ---------- AI ----------
function aiChoose(side){
  const B=S.battle, me=activeMon(side), f=foe(side), foeM=activeMon(f);
  // switch if in trouble and a better option exists
  const benched = B[side].team.map((m,i)=>({m,i})).filter(o=>o.i!==B[side].active && o.m.alive);
  if(me.hp < me.maxhp*0.35 && benched.length && Math.random()<0.35){
    let best=null, bestScore=-1;
    benched.forEach(o=>{ const off=Math.max(...o.m.moves.map(mv=>mv.p*effOf(mv.t,foeM.type)));
      const def=effOf(foeM.moves[0].t, o.m.type); const score=off/(def||1);
      if(score>bestScore){bestScore=score;best=o;} });
    if(best && bestScore>1.2){ S.pending[side]={kind:'switch', i:best.i}; aiDone(side); return; }
  }
  // pick move: score by power * effectiveness * stab
  let bi=0, bs=-1;
  me.moves.forEach((mv,i)=>{ const s = mv.p * effOf(mv.t, foeM.type) * (mv.t===me.type?1.3:1) * (0.9+Math.random()*0.2);
    if(s>bs){bs=s;bi=i;} });
  S.pending[side]={kind:'move', i:bi};
  aiDone(side);
}
function aiDone(side){
  const other=foe(side);
  if(S.pending[other] || S.battle.ctrl[other]==='ai'){ /* both in eventually */ }
  if(S.pending.a && S.pending.b){ resolveTurn(); }
  else if(S.battle.ctrl[other]==='ai' && !S.pending[other]){ setTimeout(()=>{ if(S.battle&&!S.battle.over) aiChoose(other); }, 450); }
  else { // other side is human: prompt them
    S.chooser=other; S.ui = (S.battle.ctrl[other]==='p2') ? 'main-p2' : 'main';
    drawBattle();
  }
}
function maybeAI(side){
  if(!S.battle || S.battle.over) return;
  if(S.battle.ctrl[side]==='ai'){ S.ui='busy'; drawBattle(); setTimeout(()=>{ if(S.battle&&!S.battle.over) aiChoose(side); }, 500); }
  else { S.ui = (S.battle.ctrl[side]==='p2') ? 'main-p2' : 'main'; S.chooser=side; drawBattle(); }
}
function humanAct(side, act){
  if(!S.battle || S.battle.over) return;
  S.pending[side]=act;
  const other=foe(side);
  if(S.pending[other]){ resolveTurn(); return; }
  if(S.battle.ctrl[other]==='ai'){ S.ui='busy'; drawBattle(); setTimeout(()=>{ if(S.battle&&!S.battle.over) aiChoose(other); }, 450); }
  else { S.chooser=other; S.ui = (S.battle.ctrl[other]==='p2') ? 'main-p2' : 'main'; drawBattle(); }
}

// ---------- STEP RUNNER (simple sequential animations) ----------
let stepTimer=null;
function runSteps(steps, done){
  let i=0;
  function next(){
    if(i>=steps.length){ stepTimer=null; done(); return; }
    try{ steps[i](); }catch(e){ console.error(e); }
    i++; drawBattle();
    stepTimer=setTimeout(next, 750);
  }
  next();
}
function pushAnim(a){ a.t0=performance.now(); S.anims.push(a); }

// ---------- DRAFT ----------
function startDraft(mode){
  S.mode=mode; S.screen='draft';
  S.draftPool = WRESTLERS.map(m=>m.id);
  S.draftTeams={a:[],b:[]}; S.draftIdx=0; S.wins={a:0,b:0};
  S.draftOrder = mode==='versus' ? ['p1','p2','p1','p2','p1','p2','p1','p2','p1','p2'] : ['human','ai','human','ai','human','ai','human','ai','human','ai'];
  S.ladderIdx=0;
  if(mode==='ladder') log('Draft your team of 3!');
  drawAll();
}
function draftPick(id){
  const who=S.draftOrder[S.draftIdx];
  S.draftPool=S.draftPool.filter(x=>x!==id);
  if(who==='human'||who==='p1') S.draftTeams.a.push(id); else S.draftTeams.b.push(id);
  SFX.pick(); S.draftIdx++;
  if(S.draftIdx>=10){ finishDraft(); return; }
  const nxt=S.draftOrder[S.draftIdx];
  drawAll();
  if(nxt==='ai'){ setTimeout(()=>{ // AI draft: prefer type coverage, slight random
    const pool=S.draftPool;
    const pick = pool[(Math.random()*pool.length)|0];
    draftPick(pick);
  }, 600); }
}
function finishDraft(){
  const teamA=mkTeam(S.draftTeams.a), teamB=mkTeam(S.draftTeams.b);
  if(S.mode==='ladder'){ startBattle(teamA, randTeam(), {a:'human',b:'ai'}); log('Challenger: '+LADDER_NAMES[0]+'!'); }
  else if(S.mode==='quick'){ startBattle(teamA, teamB, {a:'human',b:'ai'}); }
  else { startBattle(teamA, teamB, {a:'p1',b:'p2'}); }
  S.screen='battle';
  drawAll();
}
function startMode(mode){
  if(mode==='ladder'||mode==='versus') startDraft(mode);
  else if(mode==='quick'){ S.mode='quick'; S.screen='battle'; S.wins={a:0,b:0};
    startBattle(randTeam(), randTeam(), {a:'human',b:'ai'}); drawAll(); }
  maybeAI('a');
}

// ---------- INPUT ----------
S.buttons=[]; S.focus=0; S.paused=false;
function btn(x,y,w,h,label,fn,opts){ S.buttons.push(Object.assign({x,y,w,h,label,fn},opts||{})); }
function toGame(e){ const r=cv.getBoundingClientRect();
  const cx=(e.clientX-r.left)/r.width*W, cy=(e.clientY-r.top)/r.height*H; return [cx,cy]; }
let ptrX=0, ptrY=0;
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); const [x,y]=toGame(e);
  for(const b of S.buttons){ if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h&&!b.disabled){ SFX.click(); b.fn(); return; } }
  ptrX=x; ptrY=y;
});
cv.addEventListener('pointerup', e=>{ const [x,y]=toGame(e);
  if(S.screen==='overworld'&&S.ow){
    const dx=x-ptrX, dy=y-ptrY;
    if(Math.hypot(dx,dy)>24){
      if(Math.abs(dx)>Math.abs(dy)) owMove(dx>0?1:-1, 0);
      else owMove(0, dy>0?1:-1);
    }
  }
});
addEventListener('keydown', e=>{
  const k=e.key;
  if(k==='m'||k==='M'){ muted=!muted; drawAll(); return; }
  if(k==='p'||k==='P'){ S.paused=!S.paused; drawAll(); return; }
  if(S.screen==='overworld'&&S.ow){
    if(k==='ArrowUp'||k==='w'||k==='W') owMove(0,-1);
    else if(k==='ArrowDown'||k==='s'||k==='S') owMove(0,1);
    else if(k==='ArrowLeft'||k==='a'||k==='A') owMove(-1,0);
    else if(k==='ArrowRight'||k==='d'||k==='D') owMove(1,0);
    return;
  }
  if(S.screen!=='battle'||!S.battle||S.battle.over) {
    if(k==='Enter'){ const b=S.buttons[S.focus]; if(b&&!b.disabled){b.fn();} }
    if(k==='ArrowDown'||k==='ArrowRight'){ S.focus=(S.focus+1)%Math.max(1,S.buttons.length); drawAll(); }
    if(k==='ArrowUp'||k==='ArrowLeft'){ S.focus=(S.focus-1+S.buttons.length)%Math.max(1,S.buttons.length); drawAll(); }
    return;
  }
  const ui=S.ui;
  if(ui==='main'||ui==='main-p2'){ if(k==='f'||k==='F'||k==='1'){ S.ui = ui==='main-p2'?'moves-p2':'moves'; SFX.click(); drawBattle(); }
    if(k==='s'||k==='S'||k==='2'){ S.ui = ui==='main-p2'?'switch-p2':'switch'; SFX.click(); drawBattle(); } }
  else if(ui==='moves'||ui==='moves-p2'){ const n=parseInt(k);
    if(n>=1&&n<=4){ const m=activeMon(S.chooser); if(m.moves[n-1]){ S.ui='busy'; humanAct(S.chooser,{kind:'move',i:n-1}); } }
    if(k==='Escape'){ S.ui = ui==='moves-p2'?'main-p2':'main'; drawBattle(); } }
  else if(ui==='switch'||ui==='switch-p2'){ const n=parseInt(k);
    if(n>=1&&n<=3){ doSwitchPick(n-1); }
    if(k==='Escape'){ S.ui = ui.endsWith('p2')?'main-p2':'main'; drawBattle(); } }
  if(k==='ArrowDown'||k==='ArrowRight'){ S.focus=(S.focus+1)%Math.max(1,S.buttons.length); drawBattle(); }
  if(k==='ArrowUp'||k==='ArrowLeft'){ S.focus=(S.focus-1+S.buttons.length)%Math.max(1,S.buttons.length); drawBattle(); }
  if(k==='Enter'){ const b=S.buttons[S.focus]; if(b&&!b.disabled){ SFX.click(); b.fn(); } }
});
function doSwitchPick(idx){
  const B=S.battle, side=S.faintSide||S.chooser;
  const benched=B[side].team.map((m,i)=>({m,i})).filter(o=>o.i!==B[side].active&&o.m.alive);
  if(idx<0||idx>=benched.length) return;
  const pick=benched[idx].i;
  if(S.ui==='faintpick'){
    B[side].active=pick; const m=activeMon(side);
    log(m.name+' enters the fray!'); SFX.pick();
    if(S.faintQueue&&S.faintQueue.length){ S.faintSide=S.faintQueue.shift(); maybeAIFaint(); }
    else { S.faintSide=null; S.faintQueue=null; S.ui='main'; S.chooser='a'; }
    drawBattle(); if(S.ui==='main') maybeAI('a');
  } else {
    const p2 = (S.ui==='switch-p2');
    S.ui='busy'; humanAct(side,{kind:'switch', i:pick});
  }
}

// ---------- CRITTERS ----------
const _sprCache={};
function _getPixelSprite(shape,color){
  const key=shape+'|'+color;
  if(_sprCache[key]) return _sprCache[key];
  const S=64, c=document.createElement('canvas'); c.width=S; c.height=S;
  const g=c.getContext('2d');
  // draw the detailed wrestler onto g at 40x40 (reuse logic via a temp ctx swap)
  const realCtx=ctx;
  try{ drawWrestlerBody(g, shape, color, S); }catch(e){}
  _sprCache[key]=c; return c;
}
function drawCritter(shape, x, y, r, color, o){
  o=o||{};
  const spr=_getPixelSprite(shape,color,o.wid);
  const S=spr.width, targetR=r*3.2;
  ctx.save(); ctx.translate(x,y);
  if(o.alpha!==undefined) ctx.globalAlpha=o.alpha;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(spr, -targetR/2, -targetR/2, targetR, targetR);
  ctx.imageSmoothingEnabled=true;
  if(o.flash){ ctx.globalAlpha=o.flash*0.7; ctx.fillStyle='#fff';
    ctx.fillRect(-targetR/2,-targetR/2,targetR,targetR);
    ctx.globalAlpha=o.alpha!==undefined?o.alpha:1; }
  ctx.restore();
}
function drawWrestlerBody(g, shape, color, S){
  // Detailed wrestler drawn at SxS pixels on context g — called once per shape/color, cached
  const _saveCtx = typeof ctx!=='undefined' ? ctx : null;
  // Temporarily swap global ctx for the drawing code below
  const origDraw = drawWrestlerBodyDraw;
  origDraw(g, shape, color, S);
}
function drawWrestlerBodyDraw(g, shape, color, S, wid){
  // DETAILED: 96px canvas, per-wrestler unique features, expressive faces
  const u = S/96;
  const skin='#e8b88a', skinD='#c9986a', skinDD='#8a5a35', skinL='#f7d4a8';
  const gear=color, dark='rgba(0,0,0,0.4)';
  const wide = shape==='big'?1.25 : shape==='lean'?0.88 : shape==='stocky'?1.12 : 1.0;
  // Per-wrestler features
  const F = {
    anvil:  {hair:'mohawk', hairC:'#0a0a0a', beard:'full', beardC:'#0a0a0a', gear2:'#ff4444'},
    titan:  {hair:'bald', hairC:'#0a0a0a', beard:'goatee', beardC:'#0a0a0a', gear2:'#4488ff'},
    lola:   {hair:'ponytail', hairC:'#f0d060', beard:'none', gear2:'#44ff88'},
    velvet: {hair:'short', hairC:'#8844ff', beard:'none', gear2:'#aa66ff'},
    prof:   {hair:'side', hairC:'#5a3a20', beard:'full', beardC:'#5a3a20', gear2:'#888888', glasses:true},
    sato:   {hair:'topknot', hairC:'#0a0a0a', beard:'none', gear2:'#ffffff'},
    maddog: {hair:'wild', hairC:'#4a2a10', beard:'full', beardC:'#4a2a10', gear2:'#ff8844'},
    brutus: {hair:'shaved', hairC:'#0a0a0a', beard:'none', gear2:'#222222', scar:true},
    jax:    {hair:'styled', hairC:'#0a0a0a', beard:'none', gear2:'#ffdd44'},
    nova:   {hair:'spiky', hairC:'#f0e060', beard:'none', gear2:'#ff66aa'},
  }[wid] || {hair:'short', hairC:'#222', beard:'none', gear2:'#888'};

  g.save(); g.translate(S/2, S/2+8); g.scale(u*wide, u);
  g.lineWidth=1.2;

  // === DETAILED HEAD (bigger, expressive) ===
  const hy=-48;
  // neck
  g.fillStyle=skinD;
  g.beginPath(); g.moveTo(-7,hy+12); g.lineTo(7,hy+12); g.lineTo(9,-34); g.lineTo(-9,-34); g.fill();
  g.fillStyle=skin; g.fillRect(-6,hy+8,12,6);
  // head shape (more detailed)
  g.fillStyle=skin;
  g.beginPath(); g.ellipse(0,hy,11,13,0,0,7); g.fill();
  // cheekbones and jaw
  g.fillStyle=skinL; g.fillRect(-8,hy-8,5,10); // left cheek highlight
  g.fillStyle=skinD; g.fillRect(5,hy-2,5,8); // right cheek shadow
  g.fillStyle=skin;
  g.beginPath(); g.moveTo(-8,hy+4); g.quadraticCurveTo(0,hy+16,8,hy+4); g.lineTo(8,hy+8); g.quadraticCurveTo(0,hy+18,-8,hy+8); g.fill();
  g.strokeStyle=dark; g.lineWidth=1.5;
  g.beginPath(); g.ellipse(0,hy,11,13,0,0,7); g.stroke();
  // ears
  g.fillStyle=skin; g.fillRect(-12,hy-3,3,6); g.fillRect(9,hy-3,3,6);
  g.fillStyle=skinD; g.fillRect(-11,hy-1,1,3); g.fillRect(10,hy-1,1,3);

  // HAIR (per-wrestler styles)
  g.fillStyle=F.hairC;
  if(F.hair==='mohawk'){
    g.fillRect(-3,hy-20,6,10); g.fillRect(-2,hy-22,4,4);
  } else if(F.hair==='bald'){
    // just side hair
    g.fillRect(-11,hy-6,2,8); g.fillRect(9,hy-6,2,8);
  } else if(F.hair==='ponytail'){
    g.beginPath(); g.ellipse(0,hy-8,11,7,0,Math.PI,0); g.fill();
    g.fillRect(-3,hy-14,6,4);
    g.beginPath(); g.ellipse(8,hy+2,4,10,0.4,0,7); g.fill(); // ponytail
    g.fillStyle='#d0a040'; g.fillRect(6,hy-2,3,12);
  } else if(F.hair==='short'){
    g.beginPath(); g.ellipse(0,hy-6,11,8,0,Math.PI,0); g.fill();
    g.fillRect(-11,hy-10,4,10); g.fillRect(7,hy-10,4,10);
  } else if(F.hair==='side'){
    g.beginPath(); g.ellipse(-2,hy-7,10,7,0,Math.PI,0); g.fill();
    g.fillRect(-11,hy-10,6,6);
  } else if(F.hair==='topknot'){
    g.beginPath(); g.ellipse(0,hy-6,10,6,0,Math.PI,0); g.fill();
    g.beginPath(); g.arc(0,hy-16,4,0,7); g.fill();
    g.fillRect(-2,hy-14,4,4);
  } else if(F.hair==='wild'){
    for(let i=0;i<7;i++){ const a=Math.PI+i*0.5; g.fillRect(Math.cos(a)*10-2, hy-8+Math.sin(a)*8-2, 5, 5); }
    g.beginPath(); g.ellipse(0,hy-6,11,7,0,Math.PI,0); g.fill();
  } else if(F.hair==='shaved'){
    g.fillStyle='#1a1a1a'; g.beginPath(); g.ellipse(0,hy-8,10,3,0,Math.PI,0); g.fill();
  } else if(F.hair==='styled'){
    g.beginPath(); g.ellipse(0,hy-7,11,8,0,Math.PI,0); g.fill();
    g.fillRect(-4,hy-16,12,5); // quiff
    g.fillStyle='#333'; g.fillRect(-4,hy-16,12,2);
  } else if(F.hair==='spiky'){
    for(let i=0;i<5;i++){ g.beginPath(); g.moveTo(-10+i*5,hy-8); g.lineTo(-7+i*5,hy-18); g.lineTo(-4+i*5,hy-8); g.fill(); }
  }
  // headband (gear color)
  g.fillStyle=gear; g.fillRect(-11,hy-9,22,4);
  g.fillStyle='rgba(255,255,255,0.4)'; g.fillRect(-11,hy-9,22,1.5);

  // FACE (detailed, expressive)
  // eyes (white with pupils, positioned)
  g.fillStyle='#fff';
  g.fillRect(-8,hy-2,6,4); g.fillRect(2,hy-2,6,4);
  g.fillStyle='#0a0a0a';
  g.fillRect(-6,hy-1,3,3); g.fillRect(4,hy-1,3,3);
  g.fillStyle='#fff'; g.fillRect(-6,hy-1,1,1); g.fillRect(4,hy-1,1,1); // glint
  // thick brows (angry, per character)
  g.fillStyle=F.hairC;
  g.save(); g.translate(-5,hy-5); g.rotate(-0.35); g.fillRect(-6,-1.5,11,3); g.restore();
  g.save(); g.translate(5,hy-5); g.rotate(0.35); g.fillRect(-5,-1.5,11,3); g.restore();
  // nose (defined)
  g.fillStyle=skinD;
  g.beginPath(); g.moveTo(0,hy+2); g.lineTo(-2,hy+7); g.lineTo(2,hy+7); g.fill();
  g.fillStyle=skinDD; g.fillRect(-1,hy+6,2,1);
  // mouth (snarl/grit)
  g.fillStyle='#4a1a15'; g.fillRect(-5,hy+9,10,3);
  g.fillStyle='#fff'; g.fillRect(-5,hy+9,10,1.2);
  g.fillStyle='#4a1a15'; g.fillRect(-3,hy+10,2,1.5); g.fillRect(1,hy+10,2,1.5);
  // glasses (prof)
  if(F.glasses){
    g.strokeStyle='#222'; g.lineWidth=1.5;
    g.strokeRect(-8,hy-3,6,5); g.strokeRect(2,hy-3,6,5);
    g.beginPath(); g.moveTo(-2,hy-1); g.lineTo(2,hy-1); g.stroke();
  }
  // scar (brutus)
  if(F.scar){
    g.strokeStyle='#a06a3a'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(4,hy-6); g.lineTo(7,hy+2); g.stroke();
    g.beginPath(); g.moveTo(3,hy-3); g.lineTo(8,hy-3); g.stroke();
  }
  // BEARD
  if(F.beard==='full'){
    g.fillStyle=F.beardC;
    g.beginPath(); g.moveTo(-8,hy+6); g.quadraticCurveTo(0,hy+22,8,hy+6); g.lineTo(8,hy+12); g.quadraticCurveTo(0,hy+26,-8,hy+12); g.fill();
    g.fillStyle='rgba(255,255,255,0.15)'; g.fillRect(-6,hy+10,3,8);
  } else if(F.beard==='goatee'){
    g.fillStyle=F.beardC;
    g.beginPath(); g.moveTo(-3,hy+10); g.lineTo(3,hy+10); g.lineTo(0,hy+18); g.fill();
  }

  // === BODY (detailed, 3-tone shading) ===
  // traps
  g.fillStyle=skin;
  g.beginPath(); g.moveTo(-8,-36); g.lineTo(-22,-28); g.lineTo(-17,-20); g.lineTo(-5,-28); g.fill();
  g.beginPath(); g.moveTo(8,-36); g.lineTo(22,-28); g.lineTo(17,-20); g.lineTo(5,-28); g.fill();
  g.fillStyle=skinD;
  g.beginPath(); g.moveTo(-8,-36); g.lineTo(-15,-32); g.lineTo(-12,-26); g.lineTo(-5,-28); g.fill();
  // deltoids (detailed)
  for(const s of [-1,1]){
    g.fillStyle=skin; g.beginPath(); g.arc(s*23,-20,9,0,7); g.fill();
    g.fillStyle=skinL; g.beginPath(); g.arc(s*21,-23,4,0,7); g.fill();
    g.fillStyle=skinD; g.beginPath(); g.arc(s*24,-17,5,0,7); g.fill();
    g.strokeStyle=dark; g.lineWidth=1.2; g.beginPath(); g.arc(s*23,-20,9,0,7); g.stroke();
    // delt striations
    g.strokeStyle=skinDD; g.lineWidth=0.8;
    g.beginPath(); g.moveTo(s*18,-22); g.lineTo(s*20,-16); g.stroke();
    g.beginPath(); g.moveTo(s*24,-24); g.lineTo(s*26,-18); g.stroke();
  }
  // chest (detailed pecs)
  g.fillStyle=skin;
  g.beginPath(); g.moveTo(-20,-26); g.lineTo(20,-26); g.lineTo(15,-2); g.lineTo(-15,-2); g.fill();
  // pec muscles
  g.fillStyle=skinL; g.beginPath(); g.ellipse(-9,-18,8,6,0,0,7); g.fill();
  g.beginPath(); g.ellipse(9,-18,8,6,0,0,7); g.fill();
  g.fillStyle=skinD;
  g.beginPath(); g.ellipse(-9,-14,6,3,0,0,7); g.fill();
  g.beginPath(); g.ellipse(9,-14,6,3,0,0,7); g.fill();
  g.fillStyle=skinDD; g.fillRect(-1,-22,2,14);
  g.strokeStyle=skinD; g.lineWidth=0.8;
  for(let i=0;i<3;i++){
    g.beginPath(); g.moveTo(-15,-20+i*4); g.lineTo(-3,-19+i*4); g.stroke();
    g.beginPath(); g.moveTo(15,-20+i*4); g.lineTo(3,-19+i*4); g.stroke();
  }
  g.strokeStyle=dark; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(-20,-26); g.lineTo(20,-26); g.lineTo(15,-2); g.lineTo(-15,-2); g.closePath(); g.stroke();
  // lats
  g.fillStyle=skin;
  g.beginPath(); g.moveTo(-20,-14); g.lineTo(-26,0); g.lineTo(-18,0); g.lineTo(-14,-10); g.fill();
  g.beginPath(); g.moveTo(20,-14); g.lineTo(26,0); g.lineTo(18,0); g.lineTo(14,-10); g.fill();
  // abs (detailed 6-pack)
  g.fillStyle=skin; g.fillRect(-12,-2,24,14);
  g.fillStyle=skinL; g.fillRect(-11,-1,4,12);
  g.fillStyle=skinD;
  g.fillRect(-9,1,18,1.2); g.fillRect(-8,5,16,1.2); g.fillRect(-6,9,12,1.2);
  g.fillStyle=skinDD; g.fillRect(-1,-2,2,14);
  g.strokeStyle=dark; g.strokeRect(-12,-2,24,14);
  // singlet straps (gear with detail)
  g.fillStyle=gear; g.fillRect(-20,-26,7,30); g.fillRect(13,-26,7,30);
  g.fillStyle=F.gear2; g.fillRect(-20,-26,7,3); g.fillRect(13,-26,7,3);
  g.fillStyle='rgba(0,0,0,0.25)'; g.fillRect(-20,0,7,4); g.fillRect(13,0,7,4);
  // championship belt (detailed)
  g.fillStyle='#1a1d24'; g.fillRect(-13,12,26,7);
  g.fillStyle='#8a6a1a'; g.fillRect(-13,12,26,1.5); g.fillRect(-13,17.5,26,1.5);
  g.fillStyle='#ffd93f'; g.beginPath(); g.ellipse(0,15.5,7,5,0,0,7); g.fill();
  g.fillStyle='#b8962f'; g.beginPath(); g.ellipse(0,15.5,5,3.5,0,0,7); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.ellipse(0,15.5,2.5,2,0,0,7); g.fill();

  // === ARMS (detailed with muscles) ===
  for(const s of [-1,1]){
    const x = s<0 ? -28 : 20;
    // upper arm (bicep)
    g.fillStyle=skin;
    g.beginPath(); g.moveTo(x+2,-16); g.lineTo(x+10,-16); g.lineTo(x+9,0); g.lineTo(x+3,0); g.fill();
    g.fillStyle=skinL; g.beginPath(); g.ellipse(x+6,-10,3.5,5,0,0,7); g.fill(); // bicep peak
    g.fillStyle=skinD; g.fillRect(x+3,-2,7,3);
    g.strokeStyle=dark; g.lineWidth=1.2;
    g.beginPath(); g.moveTo(x+2,-16); g.lineTo(x+10,-16); g.lineTo(x+9,0); g.lineTo(x+3,0); g.closePath(); g.stroke();
    // elbow
    g.fillStyle=skin; g.beginPath(); g.arc(x+6,3,5,0,7); g.fill();
    g.strokeStyle=dark; g.beginPath(); g.arc(x+6,3,5,0,7); g.stroke();
    // forearm (detailed)
    g.fillStyle=skin; g.fillRect(x+2,7,8,13);
    g.fillStyle=skinL; g.fillRect(x+3,8,3,11);
    g.fillStyle=skinD; g.fillRect(x+2,15,8,2);
    // forearm veins
    g.strokeStyle=skinDD; g.lineWidth=1;
    g.beginPath(); g.moveTo(x+5,9); g.quadraticCurveTo(x+6,14,x+5,18); g.stroke();
    g.strokeStyle=dark; g.lineWidth=1.2; g.strokeRect(x+2,7,8,13);
    // wristband (detailed)
    g.fillStyle=gear; g.fillRect(x+2,18,8,4);
    g.fillStyle=F.gear2; g.fillRect(x+2,18,8,1.5);
    // fist (detailed knuckles)
    g.fillStyle=skin; g.beginPath(); g.arc(x+6,26,6,0,7); g.fill();
    g.fillStyle=skinD;
    for(let k=0;k<4;k++){ g.fillRect(x+1+k*3,21,2,2); }
    g.strokeStyle=dark; g.beginPath(); g.arc(x+6,26,6,0,7); g.stroke();
  }

  // === LEGS (detailed) ===
  // hips
  g.fillStyle='#232833'; g.fillRect(-13,19,26,7);
  g.fillStyle='#343c4e'; g.fillRect(-13,19,26,2);
  for(const s of [-1,1]){
    const x = s<0 ? -13 : 1;
    // thigh (quad definition)
    g.fillStyle='#2a3040'; g.fillRect(x,25,12,15);
    g.fillStyle='#3a4458'; g.beginPath(); g.ellipse(x+6,30,4,6,0,0,7); g.fill();
    g.strokeStyle='#1a1e26'; g.lineWidth=0.8;
    g.beginPath(); g.moveTo(x+6,27); g.lineTo(x+6,38); g.stroke();
    g.strokeStyle=dark; g.lineWidth=1.2; g.strokeRect(x,25,12,15);
    // knee pad (detailed)
    g.fillStyle=gear; g.fillRect(x,38,12,7);
    g.fillStyle=F.gear2; g.fillRect(x,38,12,2);
    g.fillStyle='rgba(0,0,0,0.2)'; g.fillRect(x,42,12,3);
    g.strokeStyle=dark; g.strokeRect(x,38,12,7);
    // shin
    g.fillStyle='#232833'; g.fillRect(x+1,45,10,10);
    g.strokeStyle=dark; g.strokeRect(x+1,45,10,10);
    // boot (detailed)
    g.fillStyle='#15181f'; g.fillRect(x-1,54,14,8);
    g.fillStyle='#2a2f3a'; g.fillRect(x-1,54,14,3);
    g.fillStyle='#0a0c10'; g.fillRect(x-1,60,14,2);
    g.strokeStyle=dark; g.strokeRect(x-1,54,14,8);
  }
  g.restore();
}

// ---------- RENDER HELPERS ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function text(str,x,y,size,color,align,font){ ctx.fillStyle=color||'#e8f5ee'; ctx.font=(font||'')+size+'px "Courier New",monospace';
  ctx.textAlign=align||'left'; ctx.textBaseline='top'; ctx.fillText(str,x,y); }

function animState(side){
  const now=performance.now(); let dx=0,dy=0,flash=0,alpha=1,scale=1;
  S.anims=S.anims.filter(a=>now-a.t0<900);
  S.anims.forEach(a=>{ if(a.side!==side) return; const t=(now-a.t0)/450;
    if(a.k==='hit'){ dx = side==='a'?Math.sin(t*20)*6:-Math.sin(t*20)*6; flash=Math.max(0,1-t); }
    else if(a.k==='faint'){ dy=t*40; alpha=1-t; }
    else if(a.k==='send'){ scale=0.3+0.7*Math.min(1,t*2); }
    else if(a.k==='dazed'){ dx=Math.sin(t*30)*4; }
  });
  return {dx,dy,flash,alpha,scale};
}

/* ================= TAMERS 3D — low-poly battle renderer (1996-style) =================
   Tiny software flat-shaded polygon engine. No dependencies.
   Renders to a half-res offscreen canvas, upscaled chunky for the PS1 look. */

const T3 = {
  W: 240, H: 360, cv: null, cx: null,
  shake: 0, dolly: 0,
  crowd: null,
  init(){
    if(this.cv) return;
    this.cv = document.createElement('canvas');
    this.cv.width = this.W; this.cv.height = this.H;
    this.cx = this.cv.getContext('2d');
    // seeded crowd dots
    let s = 1234567;
    const rnd = ()=>{ s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; };
    this.crowd = [];
    for(let i=0;i<340;i++){
      this.crowd.push({x: rnd()*this.W, y: 26+rnd()*120,
        c: ['#3a4a6b','#4a3a5b','#5b4a3a','#2e3a4e','#54455e'][Math.floor(rnd()*5)],
        r: 1+rnd()*1.6});
    }
  }
};

// ---------- math ----------
function mEuler(rx, ry, rz){
  const cx=Math.cos(rx), sx=Math.sin(rx), cy=Math.cos(ry), sy=Math.sin(ry), cz=Math.cos(rz), sz=Math.sin(rz);
  // Rx
  const A=[1,0,0, 0,cx,-sx, 0,sx,cx];
  // Ry
  const B=[cy,0,sy, 0,1,0, -sy,0,cy];
  // Rz
  const C=[cz,-sz,0, sz,cz,0, 0,0,1];
  return mMul(mMul(B,A),C);
}
function mMul(A,B){
  const C=new Array(9);
  for(let r=0;r<3;r++) for(let c=0;c<3;c++)
    C[r*3+c]=A[r*3]*B[c]+A[r*3+1]*B[3+c]+A[r*3+2]*B[6+c];
  return C;
}
function xPt(M,T,x,y,z){
  return [M[0]*x+M[1]*y+M[2]*z+T[0], M[3]*x+M[4]*y+M[5]*z+T[1], M[6]*x+M[7]*y+M[8]*z+T[2]];
}
function xNrm(M,x,y,z){
  const l=Math.hypot(x,y,z)||1; return [(M[0]*x+M[1]*y+M[2]*z)/l,(M[3]*x+M[4]*y+M[5]*z)/l,(M[6]*x+M[7]*y+M[8]*z)/l];
}

// ---------- scene graph ----------
function tNode(px,py,pz){
  return {p:[px||0,py||0,pz||0], r:[0,0,0], geo:[], kids:[], M:[1,0,0,0,1,0,0,0,1], T:[0,0,0]};
}
function updateNode(n, PM, PT){
  const R = mEuler(n.r[0], n.r[1], n.r[2]);
  n.M = mMul(PM, R);
  const p=n.p;
  n.T = [PT[0]+PM[0]*p[0]+PM[1]*p[1]+PM[2]*p[2],
         PT[1]+PM[3]*p[0]+PM[4]*p[1]+PM[5]*p[2],
         PT[2]+PM[6]*p[0]+PM[7]*p[1]+PM[8]*p[2]];
  for(let i=0;i<n.kids.length;i++) updateNode(n.kids[i], n.M, n.T);
}

// box centered at (x,y,z), size w,h,d, color [r,g,b]; returns tri list (local space)
function tBox(w,h,d,c,x,y,z){
  x=x||0; y=y||0; z=z||0;
  const hw=w/2, hh=h/2, hd=d/2;
  const F=[
    {n:[1,0,0],  q:[[hw,-hh,-hd],[hw,-hh,hd],[hw,hh,hd],[hw,hh,-hd]]},
    {n:[-1,0,0], q:[[-hw,-hh,hd],[-hw,-hh,-hd],[-hw,hh,-hd],[-hw,hh,hd]]},
    {n:[0,1,0],  q:[[-hw,hh,-hd],[-hw,hh,hd],[hw,hh,hd],[hw,hh,-hd]]},
    {n:[0,-1,0], q:[[-hw,-hh,hd],[-hw,-hh,-hd],[hw,-hh,-hd],[hw,-hh,hd]]},
    {n:[0,0,1],  q:[[-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]]},
    {n:[0,0,-1], q:[[hw,-hh,-hd],[-hw,-hh,-hd],[-hw,hh,-hd],[hw,hh,-hd]]},
  ];
  const tris=[];
  for(const f of F){
    const q=f.q.map(v=>[v[0]+x, v[1]+y, v[2]+z]);
    tris.push({v:[q[0],q[1],q[2]], n:f.n, c:c});
    tris.push({v:[q[0],q[2],q[3]], n:f.n, c:c});
  }
  return tris;
}

// ---------- camera + render ----------
const T3CAM = { p:[1.7,2.9,7.4], l:[0,1.05,0], fov:40 };
const T3LIGHT = (()=>{ const l=Math.hypot(-0.35,0.8,0.5); return [-0.35/l, 0.8/l, 0.5/l]; })();

function t3Render(nodes){
  // nodes: [{root, flash}]
  const cx=T3.cx, W=T3.W, H=T3.H;
  const now=performance.now()/1000;
  // camera with sway + shake + dolly
  const sh=T3.shake; T3.shake*=0.9; if(T3.shake<0.01) T3.shake=0;
  T3.dolly*=0.94;
  const shx=(Math.random()-0.5)*sh*0.5, shy=(Math.random()-0.5)*sh*0.4;
  const C=[T3CAM.p[0]+Math.sin(now*0.5)*0.18+shx, T3CAM.p[1]+Math.sin(now*0.7)*0.1+shy, T3CAM.p[2]-T3.dolly*0.7];
  const L=[T3CAM.l[0], T3CAM.l[1], T3CAM.l[2]];
  // basis
  let f=[L[0]-C[0],L[1]-C[1],L[2]-C[2]]; const fl=Math.hypot(f[0],f[1],f[2]); f=[f[0]/fl,f[1]/fl,f[2]/fl];
  let r=[f[2]*0-f[1]*1, f[0]*0-f[2]*0, 0]; // cross(f, up) with up=[0,1,0]: [f.y*0 - f.z*1, f.z*0 - f.x*0, f.x*1 - f.y*0]
  r=[-f[2], 0, f[0]]; const rl=Math.hypot(r[0],r[2])||1; r=[r[0]/rl,0,r[2]/rl];
  const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  const focal=(H/2)/Math.tan(T3CAM.fov*Math.PI/360);

  // collect world tris
  const out=[];
  for(const nd of nodes){
    updateNode(nd.root, [1,0,0,0,1,0,0,0,1], [0,0,0]);
    const stack=[nd.root];
    while(stack.length){
      const n=stack.pop();
      for(const t of n.geo){
        const wv=[xPt(n.M,n.T,t.v[0][0],t.v[0][1],t.v[0][2]),
                  xPt(n.M,n.T,t.v[1][0],t.v[1][1],t.v[1][2]),
                  xPt(n.M,n.T,t.v[2][0],t.v[2][1],t.v[2][2])];
        const wn=xNrm(n.M,t.n[0],t.n[1],t.n[2]);
        // to camera space
        const cv=wv.map(p=>{ const d=[p[0]-C[0],p[1]-C[1],p[2]-C[2]];
          return [d[0]*r[0]+d[1]*r[1]+d[2]*r[2], d[0]*u[0]+d[1]*u[1]+d[2]*u[2], d[0]*f[0]+d[1]*f[1]+d[2]*f[2]]; });
        if(cv[0][2]<0.15||cv[1][2]<0.15||cv[2][2]<0.15) continue;
        const cn=[wn[0]*r[0]+wn[1]*r[1]+wn[2]*r[2], wn[0]*u[0]+wn[1]*u[1]+wn[2]*u[2], wn[0]*f[0]+wn[1]*f[1]+wn[2]*f[2]];
        if(cn[2]>=-0.02) continue; // backface cull
        const depth=(cv[0][2]+cv[1][2]+cv[2][2])/3;
        const pts=cv.map(p=>[W/2+(p[0]/p[2])*focal, H/2-(p[1]/p[2])*focal]);
        // flat shade in world space
        const li=Math.max(0, wn[0]*T3LIGHT[0]+wn[1]*T3LIGHT[1]+wn[2]*T3LIGHT[2]);
        const br=0.42+0.58*li;
        out.push({pts, depth, c:t.c, br, flash:nd.flash||0});
      }
      for(const k of n.kids) stack.push(k);
    }
  }
  out.sort((a,b)=>b.depth-a.depth);
  for(const t of out){
    const fl2=Math.min(1,(t.flash||0));
    const R=Math.min(255, t.c[0]*t.br+fl2*95)|0,
          G=Math.min(255, t.c[1]*t.br+fl2*95)|0,
          B=Math.min(255, t.c[2]*t.br+fl2*95)|0;
    cx.fillStyle='rgb('+R+','+G+','+B+')';
    cx.beginPath();
    cx.moveTo(t.pts[0][0],t.pts[0][1]); cx.lineTo(t.pts[1][0],t.pts[1][1]); cx.lineTo(t.pts[2][0],t.pts[2][1]);
    cx.closePath(); cx.fill();
  }
}

// project a world point to offscreen coords (for FX)
function t3Project(x,y,z){
  const now=performance.now()/1000;
  const C=[T3CAM.p[0]+Math.sin(now*0.5)*0.18, T3CAM.p[1]+Math.sin(now*0.7)*0.1, T3CAM.p[2]-T3.dolly*0.7];
  const L=T3CAM.l;
  let f=[L[0]-C[0],L[1]-C[1],L[2]-C[2]]; const fl=Math.hypot(f[0],f[1],f[2]); f=[f[0]/fl,f[1]/fl,f[2]/fl];
  let r=[-f[2],0,f[0]]; const rl=Math.hypot(r[0],r[2])||1; r=[r[0]/rl,0,r[2]/rl];
  const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  const d=[x-C[0],y-C[1],z-C[2]];
  const cxp=d[0]*r[0]+d[1]*r[1]+d[2]*r[2], cyp=d[0]*u[0]+d[1]*u[1]+d[2]*u[2], czp=d[0]*f[0]+d[1]*f[1]+d[2]*f[2];
  const focal=(T3.H/2)/Math.tan(T3CAM.fov*Math.PI/360);
  return [T3.W/2+(cxp/Math.max(0.15,czp))*focal, T3.H/2-(cyp/Math.max(0.15,czp))*focal];
}

// ---------- arena background (drawn in offscreen before the 3D) ----------
function t3DrawBG(){
  const cx=T3.cx, W=T3.W, H=T3.H, now=performance.now()/1000;
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#04060c'); g.addColorStop(0.55,'#0a1224'); g.addColorStop(1,'#05070d');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // crowd dots
  for(const d of T3.crowd){
    cx.fillStyle=d.c;
    cx.fillRect(d.x, d.y, d.r, d.r);
  }
  // crowd glow band
  cx.fillStyle='rgba(40,60,110,0.25)'; cx.fillRect(0,120,W,30);
  // spotlight beams
  cx.save(); cx.globalAlpha=0.10;
  for(const bx of [W*0.25, W*0.75]){
    const sway=Math.sin(now*0.8+bx)*14;
    cx.fillStyle='#cfe4ff';
    cx.beginPath(); cx.moveTo(bx-8,0); cx.lineTo(bx+8,0);
    cx.lineTo(bx+sway+40,H*0.75); cx.lineTo(bx+sway-40,H*0.75);
    cx.closePath(); cx.fill();
  }
  cx.restore();
}

// ---------- wrestling ring ----------
function buildRing(){
  const root=tNode(0,0,0);
  const DARK=[18,22,40], MAT=[46,60,96], MAT2=[40,52,84];
  root.geo.push(...tBox(7.4,1.1,7.4,DARK, 0,-0.56,0));       // apron
  root.geo.push(...tBox(6.6,0.14,6.6,MAT, 0,-0.07,0));       // mat
  root.geo.push(...tBox(6.7,0.05,6.7,MAT2, 0,-0.015,0));     // mat edge trim
  // center emblem: simple gold diamond (flat boxes)
  root.geo.push(...tBox(0.9,0.02,0.9,[190,160,60], 0,0.012,0));
  root.geo.push(...tBox(0.55,0.025,0.55,MAT, 0,0.012,0));
  // posts
  for(const sx of [-1,1]) for(const sz of [-1,1]){
    root.geo.push(...tBox(0.2,1.7,0.2,[28,32,52], sx*3.15, 0.85, sz*3.15));
    root.geo.push(...tBox(0.34,0.3,0.12,[150,40,50], sx*2.95, 1.32, sz*2.95)); // turnbuckle pad
  }
  // ropes: red / white / blue
  const ropeC=[[200,60,70],[225,225,230],[70,110,220]];
  const rh=[0.62,0.98,1.34];
  for(let i=0;i<3;i++){
    root.geo.push(...tBox(6.3,0.055,0.055,ropeC[i], 0,rh[i],3.15));
    root.geo.push(...tBox(6.3,0.055,0.055,ropeC[i], 0,rh[i],-3.15));
    root.geo.push(...tBox(0.055,0.055,6.3,ropeC[i], 3.15,rh[i],0));
    root.geo.push(...tBox(0.055,0.055,6.3,ropeC[i], -3.15,rh[i],0));
  }
  return root;
}

// ---------- wrestler builder ----------
const W3CFG={
  anvil:{skin:[178,122,90],  trunk:[205,45,50],  boot:[28,28,34], band:[205,45,50], hair:'spike', belt:true,  bulk:1.18, trim:[235,195,75], pad:[205,45,50], hairC:[22,22,28]},
  titan:{skin:[212,162,122], trunk:[45,85,205],  boot:[28,28,34], band:[45,85,205], hair:'bald',  belt:false, bulk:1.04, trim:[240,240,245], pad:[30,60,160], hairC:[22,22,28]},
};
function w3cfg(id){ return W3CFG[id]||{skin:[190,150,120],trunk:[120,120,130],boot:[30,30,34],band:[200,200,200],hair:'bald',belt:false,bulk:1.0}; }

function buildWrestler(cfg){

// ---------- poses & keyframes ----------
// pose = {j:{torso,head,shL,elbL,shR,elbR,legL,kneeL,legR,kneeR: [rx,ry,rz]}, root:{p:[x,y,z], rx, ry}}
const JN=['torso','head','shL','elbL','shR','elbR','legL','kneeL','legR','kneeR'];
function blankJ(){ const o={}; for(const n of JN) o[n]=[0,0,0]; return o; }
function mkPose(jpart, rpart){
  const j=blankJ();
  for(const k in (jpart||{})) if(j[k]) j[k]=(jpart[k]||[0,0,0]).slice();
  return {j, root:{p:((rpart&&rpart.p)||[0,0,0]).slice(), rx:(rpart&&rpart.rx)||0, ry:(rpart&&rpart.ry)||0}};
}
function lerpPose(a,b,k){
  const j={};
  for(const n of JN){ const A=a.j[n],B2=b.j[n];
    j[n]=[A[0]+(B2[0]-A[0])*k, A[1]+(B2[1]-A[1])*k, A[2]+(B2[2]-A[2])*k]; }
  return {j, root:{p:[a.root.p[0]+(b.root.p[0]-a.root.p[0])*k,
                    a.root.p[1]+(b.root.p[1]-a.root.p[1])*k,
                    a.root.p[2]+(b.root.p[2]-a.root.p[2])*k],
                   rx:a.root.rx+(b.root.rx-a.root.rx)*k, ry:a.root.ry+(b.root.ry-a.root.ry)*k}};
}
function sampleKF(kf,t){
  if(t<=kf[0].t) return kf[0].pose;
  for(let i=0;i<kf.length-1;i++){
    const A=kf[i],B=kf[i+1];
    if(t<=B.t){ let k=(t-A.t)/Math.max(1e-5,B.t-A.t); k=k*k*(3-2*k); return lerpPose(A.pose,B.pose,k); }
  }
  return kf[kf.length-1].pose;
}
function applyPose(m, pose){
  for(const n of JN){ const v=pose.j[n]; m.J[n].r[0]=v[0]; m.J[n].r[1]=v[1]; m.J[n].r[2]=v[2]; }
  m.root.p[0]=m.baseX+pose.root.p[0];
  m.root.p[1]=pose.root.p[1];
  m.root.p[2]=m.baseZ+pose.root.p[2];
  m.root.r[0]=pose.root.rx;
  m.root.r[1]=m.baseRY+pose.root.ry;
  m.root.r[2]=0;
}

function moveAnimType(mv){
  if(!mv) return 'strike';
  if(/slam|powerbomb|demolition|chokeslam/i.test(mv)) return 'slam';
  if(/elbow/i.test(mv)) return 'elbow';
  if(/hug/i.test(mv)) return 'hold';
  if(/boot/i.test(mv)) return 'kick';
  if(/headbutt/i.test(mv)) return 'head';
  return 'strike';
}
function KF_for(type, dir){
  switch(type){
    case 'slam': return KF_slam(dir);
    case 'elbow': return KF_elbow(dir);
    case 'hold': return KF_hold(dir);
    case 'kick': return KF_strike('kick', dir);
    case 'head': return KF_strike('head', dir);
    default: return KF_strike('punch', dir);
  }
}

function idlePose3D(nowMs, side){
  const t=nowMs/1000, ph=side==='a'?0:2.1;
  return mkPose({
    torso:[Math.sin(t*1.4+ph)*0.045, Math.sin(t*0.9+ph)*0.07, 0],
    head:[0, Math.sin(t*0.6+ph)*0.14, 0],
    shL:[-0.2+Math.sin(t*1.4+ph)*0.05, 0, 0.1],
    shR:[-0.2+Math.sin(t*1.4+ph+1)*0.05, 0, -0.1],
    elbL:[-0.4,0,0], elbR:[-0.4,0,0],
    legL:[0,0,0.02], legR:[0,0,-0.02],
  }, {p:[0, Math.sin(t*2.8+ph)*0.02, 0]});
}

// ---------- battle orchestration ----------
let W3={a:null,b:null}, RING3D=null;

function wrestler3D(side){
  const m=activeMon(side), id=m.base.id;
  if(!W3[side]||W3[side].id!==id){
    const model=buildWrestler(w3cfg(id));
    model.baseX=side==='a'?-1.2:1.2;
    model.baseZ=0;
    model.baseRY=side==='a'?Math.PI/2:-Math.PI/2;
    W3[side]={id, model};
  }
  return W3[side].model;
}

function latestAnim3D(side, kinds, maxMs){
  const now=performance.now();
  let best=null;
  for(const a of S.anims){
    if(a.side!==side) continue;
    if(kinds.indexOf(a.k)<0) continue;
    const age=now-a.t0;
    if(age<0||age>maxMs) continue;
    if(!best||a.t0>best.a.t0) best={a, t:age/1000};
  }
  return best;
}

// returns {pose, flash, fx:[{k:'impact', x,y,z}]}
function poseFor3D(side){
  const m=activeMon(side), dir=side==='a'?1:-1, now=performance.now();
  const fx=[];
  if(!m.alive) return {pose:POSE_LIE, flash:0, fx};
  let pose=idlePose3D(now, side), flash=0;
  const wm=latestAnim3D(side,['wmove'],950);
  if(wm){
    const type=moveAnimType(wm.a.mv), t=Math.min(1, wm.t/0.95);
    pose=sampleKF(KF_for(type,dir), t);
    if((type==='slam'&&t>0.58&&t<0.72)||(type==='elbow'&&t>0.58&&t<0.74)||
       ((type==='strike'||type==='kick'||type==='head')&&t>0.44&&t<0.58)||
       (type==='hold'&&t>0.42&&t<0.74))
      fx.push({k:'impact', x:dir*1.2, y:1.1, z:0});
    T3.dolly=1;
  }
  const ht=latestAnim3D(side,['hit'],950);
  if(ht){
    const type=moveAnimType(ht.a.mv), t=Math.min(1, ht.t/0.95);
    if(type==='slam') pose=sampleKF(KF_tossed(dir), t);
    else if(type==='elbow') pose=sampleKF(KF_crumple(dir), t);
    else if(type==='hold') pose=sampleKF(KF_held(dir), t);
    else pose=sampleKF(KF_recoil(dir), t);
    if(t<0.4) flash=1-t/0.4;
  }
  const fa=latestAnim3D(side,['faint'],1400);
  if(fa) pose=sampleKF(KF_faint(dir), Math.min(1, fa.t/1.1));
  const se=latestAnim3D(side,['send'],900);
  if(se) pose=sampleKF(KF_send(), Math.min(1, se.t/0.85));
  const dz=latestAnim3D(side,['dazed'],900);
  if(dz) pose.j.torso[2]+=Math.sin(now/90)*0.18;
  return {pose, flash, fx};
}

function t3DrawImpact(x, y){
  const cx=T3.cx;
  // jagged star
  cx.fillStyle='#fff6c8';
  cx.beginPath();
  const R1=13, R2=5.5;
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2-Math.PI/2, r=i%2?R2:R1;
    const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    i?cx.lineTo(px,py):cx.moveTo(px,py);
  }
  cx.closePath(); cx.fill();
  cx.fillStyle='#ffb13f';
  cx.beginPath(); cx.arc(x,y,5,0,7); cx.fill();
  // expanding ring
  cx.strokeStyle='rgba(255,240,200,0.8)'; cx.lineWidth=2;
  cx.beginPath(); cx.arc(x,y,18,0,7); cx.stroke();
}

function drawBattle3D(){
  const B=S.battle; if(!B) return;
  T3.init();
  if(!RING3D) RING3D=buildRing();
  const now=performance.now();
  S.anims=S.anims.filter(a=>now-a.t0<1600);
  // pose wrestlers
  const wa=wrestler3D('a'), wb=wrestler3D('b');
  const pa=poseFor3D('a'), pb=poseFor3D('b');
  applyPose(wa, pa.pose); applyPose(wb, pb.pose);
  // background + 3D
  t3DrawBG();
  t3Render([{root:RING3D, flash:0},{root:wa.root, flash:pa.flash},{root:wb.root, flash:pb.flash}]);
  // impact FX (project world -> offscreen)
  for(const f of pa.fx.concat(pb.fx)){
    if(f.k==='impact'){
      const s=t3Project(f.x, f.y, f.z);
      t3DrawImpact(s[0], s[1]);
      T3.shake=1;
    }
  }
  // chunky upscale to the main canvas
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(T3.cv, 0, 0, 480, 720);
  ctx.imageSmoothingEnabled=true;
}

const OW_W = 20, OW_H = 15;
function owTile(x,y){ if(x<0||y<0||x>=OW_W||y>=OW_H) return 2; return OW_MAP[y][x]; }
function owBlocked(x,y){ const t=owTile(x,y); return t===2||t===3; }
function startOverworld(){
  S.ow = { px:3, py:6, dir:'down', moving:false, mt:0,
    npcs:[
      {x:8, y:7, id:'titan', beaten:false, name:'TITAN CRUSH'},
      {x:14, y:8, id:'velvet', beaten:false, name:'"VELVET" VERA STORM'},
      {x:5, y:10, id:'brutus', beaten:false, name:'BRUTUS "THE BUTCHER"'},
    ]};

function drawOverworld(){
  ctx.fillStyle='#0e1420'; ctx.fillRect(0,0,W,H);
  const ox = W/2 - (S.ow.px*OW_T+OW_T/2), oy = 120 - (S.ow.py*OW_T+OW_T/2);
  // tiles - detailed pixel art
  for(let y=0;y<OW_H;y++) for(let x=0;x<OW_W;x++){
    const t=OW_MAP[y][x], sx=x*OW_T+ox, sy=y*OW_T+oy;
    if(sx<-OW_T||sy<-OW_T||sx>W+OW_T||sy>H+OW_T) continue;
    const px=(x*7+y*13)%16; // deterministic detail seed
    if(t===0||t===5||t===6){
      ctx.fillStyle='#3f9e4d'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#358a42';
      ctx.fillRect(sx+px%12,sy+2,2,2); ctx.fillRect(sx+(px+7)%12,sy+10,2,2);
      ctx.fillStyle='#4db45e'; ctx.fillRect(sx+(px+3)%12,sy+6,2,1);
      if(t===5){ // tall grass tufts
        ctx.fillStyle='#2a6e35';
        for(let i=0;i<4;i++){ const gx=sx+2+i*4; ctx.fillRect(gx,sy+5,2,9); ctx.fillRect(gx+1,sy+3,1,3); }
        ctx.fillStyle='#3f9e4d'; for(let i=0;i<4;i++){ const gx=sx+2+i*4; ctx.fillRect(gx,sy+5,1,9); }
      }
      if(t===6){ ctx.fillStyle='#ff6b9d'; ctx.fillRect(sx+6,sy+5,4,4);
        ctx.fillStyle='#ff9ec7'; ctx.fillRect(sx+6,sy+5,4,1); ctx.fillStyle='#c94a75'; ctx.fillRect(sx+6,sy+8,4,1); }
    }
    else if(t===1){ // path with stones
      ctx.fillStyle='#d4b48a'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#b8936a'; ctx.fillRect(sx,sy+14,OW_T,2);
      ctx.fillStyle='#c4a075';
      ctx.fillRect(sx+2+(px%8),sy+3,3,2); ctx.fillRect(sx+8+(px%4),sy+9,3,2);
      ctx.fillStyle='#e0c49a'; ctx.fillRect(sx+2+(px%8),sy+3,3,1);
    }
    else if(t===2){ // water with waves
      ctx.fillStyle='#3d8bff'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#5da2ff';
      const wy=(x*3+y*5)%10;
      ctx.fillRect(sx+2,sy+3+wy,6,1); ctx.fillRect(sx+8,sy+8+((wy+5)%8),5,1);
      ctx.fillStyle='#2d6fd9'; ctx.fillRect(sx,sy+14,OW_T,2);
    }
    else if(t===3){ // building wall with bricks
      ctx.fillStyle='#9a7a5a'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#7a5f45';
      ctx.fillRect(sx,sy+5,OW_T,1); ctx.fillRect(sx,sy+11,OW_T,1);
      ctx.fillRect(sx+7,sy,1,5); ctx.fillRect(sx+3,sy+6,1,5); ctx.fillRect(sx+11,sy+6,1,5);
      ctx.fillStyle='#b08a6a'; ctx.fillRect(sx,sy,OW_T,2);
    }
    else if(t===4){ // door with frame
      ctx.fillStyle='#5a4028'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#3a2818'; ctx.fillRect(sx+3,sy+2,10,14);
      ctx.fillStyle='#6a4f30'; ctx.fillRect(sx+4,sy+3,8,12);
      ctx.fillStyle='#ffd93f'; ctx.fillRect(sx+10,sy+9,2,2);
    }
    else if(t===7){ // arena mat
      ctx.fillStyle='#d4a574'; ctx.fillRect(sx,sy,OW_T,OW_T);
      ctx.fillStyle='#c49464'; ctx.fillRect(sx,sy,OW_T,1); ctx.fillRect(sx,sy+15,OW_T,1);
      ctx.fillStyle='#e0b584'; ctx.fillRect(sx+7,sy+7,2,2);
    }
  }
  // NPC rival wrestlers
  S.ow.npcs.forEach(n=>{
    if(n.beaten) return;
    const nx=n.x*OW_T+ox, ny=n.y*OW_T+oy;
    const wbase=WRESTLERS.find(w=>w.id===n.id);
    drawOWWrestler(nx,ny,TCOL[wbase.type]);
    // "!" if player is close
    if(Math.abs(S.ow.px-n.x)+Math.abs(S.ow.py-n.y)===1){
      text('!', nx+8, ny-10, 14, '#ffd93f', 'center', 'bold ');
    }
  });
  // player - detailed top-down pixel wrestler
  const px=S.ow.px*OW_T+ox, py=S.ow.py*OW_T+oy;
  function drawOWWrestler(wx,wy,gearColor){
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(wx+8,wy+15,6,2,0,0,7); ctx.fill();
    // legs (dark tights)
    ctx.fillStyle='#2a2f3a'; ctx.fillRect(wx+5,wy+11,2,4); ctx.fillRect(wx+9,wy+11,2,4);
    // boots
    ctx.fillStyle='#1a1d24'; ctx.fillRect(wx+4,wy+14,4,2); ctx.fillRect(wx+8,wy+14,4,2);
    // torso (gear color with shading)
    ctx.fillStyle=gearColor; ctx.fillRect(wx+4,wy+6,8,6);
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(wx+4,wy+6,8,1);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(wx+4,wy+11,8,1);
    // belt
    ctx.fillStyle='#ffd93f'; ctx.fillRect(wx+4,wy+10,8,1);
    // arms (skin)
    ctx.fillStyle='#e8b88a'; ctx.fillRect(wx+2,wy+7,2,4); ctx.fillRect(wx+12,wy+7,2,4);
    ctx.fillStyle='#d4a075'; ctx.fillRect(wx+2,wy+10,2,1); ctx.fillRect(wx+12,wy+10,2,1);
    // head
    ctx.fillStyle='#e8b88a'; ctx.fillRect(wx+5,wy+1,6,5);
    // hair
    ctx.fillStyle='#3a2818'; ctx.fillRect(wx+5,wy+1,6,2); ctx.fillRect(wx+5,wy+1,2,4); ctx.fillRect(wx+9,wy+1,2,4);
    // headband (gear color)
    ctx.fillStyle=gearColor; ctx.fillRect(wx+5,wy+3,6,1);
  }
  drawOWWrestler(px,py,'#ff5252');
  text('TAMERS WORLD', 10, 10, 14, '#e8f5ee', 'left', 'bold ');
  text('Find the arenas!', 10, 30, 12, '#8fa89b', 'left');
  S.buttons=[];
}
function owMove(dx,dy){
  if(!S.ow||S.ow.moving) return;
  const nx=S.ow.px+dx, ny=S.ow.py+dy;
  S.ow.dir = dy<0?'up':dy>0?'down':dx<0?'left':'right';
  if(owBlocked(nx,ny)){ drawAll(); return; }
  const t=owTile(nx,ny);
  S.ow.px=nx; S.ow.py=ny; SFX.click();
  if(t===4){ // door -> arena battle!
    startBattle(mkTeam(S.stable), randTeam(), {a:'human',b:'ai'});
    S.screen='battle'; drawAll(); return;
  }
  // check NPC challenge: adjacent rival wants to fight
  const npc = S.ow.npcs.find(n=>!n.beaten && Math.abs(S.ow.px-n.x)+Math.abs(S.ow.py-n.y)===1);
  if(npc){
    const wbase=WRESTLERS.find(w=>w.id===npc.id);
    const foeIds=['titan'];  // 1v1 test: only TITAN
    npc.beaten=true;
    startBattle(mkTeam(S.stable), mkTeam(foeIds), {a:'human',b:'ai'});
    log(npc.name+' wants a fight!');
    S.screen='battle'; drawAll(); return;
  }
  drawAll();
}

function drawAll(){
  S.focus=0;
  if(S.screen==='menu') drawMenu();
  else if(S.screen==='chart') drawChart();
  else if(S.screen==='draft') drawDraft();
  else if(S.screen==='battle') drawBattle();
  else if(S.screen==='over') drawOver();
  else if(S.screen==='recruit') drawRecruit();
  else if(S.screen==='overworld') drawOverworld();
  if(S.paused&&(S.screen==='battle'||S.screen==='overworld')){ ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    text('PAUSED',W/2,340,40,'#e8f5ee','center','bold '); text('P to resume',W/2,390,14,'#8fa89b','center'); }
}

// ---------- LOOP ----------
let last=0;
function loop(ts){ const dt=Math.min(0.05,(ts-last)/1000||0); last=ts; if(!S.paused) S.t+=dt;
  if(S.screen==='battle'&&!S.paused) drawBattle();
  requestAnimationFrame(loop); }
