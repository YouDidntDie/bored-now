}, {passive:false});
cv.addEventListener('touchmove', e => {

// ===== ENDLESS LIMBO: procedural chunks =====
const TS = 16, TH = 17;
const CHUNK_W = 30; // tiles per chunk
let chunks = new Map(); // chunkIdx -> {tiles: 2D array, demons: [], pickups: []}
let highestChunk = -1;

function genChunk(ci){
  // difficulty ramps with distance
  const diff = Math.min(1, ci / 40);
  const tiles = [];
  for(let y=0; y<TH; y++) tiles.push(new Array(CHUNK_W).fill(' '));
  const demons = [], pickups = [];
  
  // ground with gaps
  let gx = 0;
  while(gx < CHUNK_W){
    const segLen = 8 + Math.floor(Math.random()*10 * (1-diff*0.5));
    const gapLen = ci===0 ? 0 : 2 + Math.floor(Math.random()*4*diff + Math.random()*2);
    for(let i=0; i<segLen && gx+i<CHUNK_W; i++){
      tiles[TH-1][gx+i] = '#';
    }
    // demons on ground
    if(ci > 0 && Math.random() < 0.4 + diff*0.4){
      const dx = gx + Math.floor(Math.random()*segLen);
      if(dx < CHUNK_W) demons.push({tx: ci*CHUNK_W+dx, ty: TH-2, type: Math.random()<0.25+diff*0.2?1:0});
    }
    // soul arcs over gaps
    if(gapLen > 0 && Math.random() < 0.6){
      const sx = gx + segLen + Math.floor(gapLen/2);
      for(let s=-1; s<=1; s++) if(sx+s >=0 && sx+s < CHUNK_W) pickups.push({tx: ci*CHUNK_W+sx+s, ty: TH-4});
    }
    gx += segLen + gapLen;
  }
  
  // floating bone platforms with souls
  const nPlat = 1 + Math.floor(Math.random()*2);
  for(let p=0; p<nPlat; p++){
    const px = 5 + Math.floor(Math.random()*(CHUNK_W-12));
    const py = 6 + Math.floor(Math.random()*6);
    const pw = 3 + Math.floor(Math.random()*4);
    for(let i=0; i<pw; i++) tiles[py][px+i] = '=';
    // souls on platform
    for(let i=0; i<pw; i++) if(Math.random()<0.7) pickups.push({tx: ci*CHUNK_W+px+i, ty: py-1});
    // flyer above platform
    if(ci > 1 && Math.random() < 0.3+diff*0.3){
      demons.push({tx: ci*CHUNK_W+px+Math.floor(pw/2), ty: py-3, type: 1});
    }
  }
  
  chunks.set(ci, {tiles, demons, pickups});
  if(ci > highestChunk) highestChunk = ci;
}

function ensureChunks(){
  const needUpTo = Math.floor((camX + W + 200) / (CHUNK_W*TS));
  const haveFrom = Math.floor(Math.max(0, camX - 200) / (CHUNK_W*TS));
  for(let ci=haveFrom; ci<=needUpTo; ci++){
    if(!chunks.has(ci)) genChunk(ci);
  }
  // prune old
  for(const ci of chunks.keys()){
    if(ci < haveFrom - 2) chunks.delete(ci);
  }
}

function tileAt(tx, ty){
  if(ty<0||ty>=TH) return ' ';
  const ci = Math.floor(tx / CHUNK_W);
  if(!chunks.has(ci)) return ' ';
  const lx = tx - ci*CHUNK_W;
  return chunks.get(ci).tiles[ty][lx];
}
const solids = new Set(['#','=']);
function solidAt(px, py){
  return solids.has(tileAt(Math.floor(px/TS), Math.floor(py/TS)));
}

// ===== SOUL (player) =====
const soul = {
  x: 32, y: 200, vx: 0, vy: 0, w: 12, h: 16,
  onGround: false, coyote: 0, jbuf: 0,
  face: 1, alive: true, invuln: 0,
  armor: false,
  trail: [],
};
const GRAV = 0.45, MAXFALL = 9;
const RUN_ACC = 0.35, RUN_MAX = 3.2, FRICTION = 0.85, AIR_ACC = 0.22;
const JUMP_V = -8.5, JUMP_HOLD = 0.55;

let demons = [], pickups = [];
function spawnFromChunks(){
  demons = []; pickups = [];
  for(const [ci, ch] of chunks){
    for(const d of ch.demons){
      demons.push({ x:d.tx*TS+2, y:d.ty*TS, w:12, h:14, vx:-0.5, vy:0, alive:true, t:Math.random()*10, type:d.type, ctx:d.tx });
    }
    for(const p of ch.pickups){
      pickups.push({ x:p.tx*TS+4, y:p.ty*TS+4, taken:false, t:Math.random()*10, ctx:p.tx });
    }
  }
}
let soulsCollected = 0, lives = 3;
let camX = 0;
let particles = [];
let shake = 0;

let maxDist = 0;
function reset(){
  soul.x = 32; soul.y = 200; soul.vx = 0; soul.vy = 0; soul.alive = true; soul.invuln = 0;
  chunks.clear(); highestChunk = -1; if(window._spawnedChunks) window._spawnedChunks.clear();
  genChunk(0); genChunk(1);
  soulsCollected = 0; camX = 0; particles = []; maxDist = 0;
  document.getElementById('souls').textContent = '◊ 0';
  document.getElementById('lives').textContent = '♥ ' + lives;
  document.getElementById('circle').textContent = 'CIRCLE I — LIMBO · 0m';
}

function moveBody(b, isPlayer){
  b.x += b.vx;
  if(b.vx > 0){
    if(solidAt(b.x+b.w, b.y+2) || solidAt(b.x+b.w, b.y+b.h-2)){ b.x = Math.floor((b.x+b.w)/TS)*TS - b.w - 0.1; b.vx = isPlayer?0:-b.vx; }
  } else if(b.vx < 0){
    if(solidAt(b.x, b.y+2) || solidAt(b.x, b.y+b.h-2)){ b.x = Math.floor(b.x/TS)*TS + TS + 0.1; b.vx = isPlayer?0:-b.vx; }
  }
  b.y += b.vy;
  b.onGround = false;
  if(b.vy > 0){
    if(solidAt(b.x+2, b.y+b.h) || solidAt(b.x+b.w-2, b.y+b.h)){
      b.y = Math.floor((b.y+b.h)/TS)*TS - b.h; b.vy = 0; b.onGround = true;
    }
  } else if(b.vy < 0){
    if(solidAt(b.x+2, b.y) || solidAt(b.x+b.w-2, b.y)){
      b.y = Math.floor(b.y/TS)*TS + TS + 0.1; b.vy = 0;
    }
  }
  b.vy = Math.min(b.vy + GRAV, MAXFALL);
}

function drawSoul(x, y, t){
  if(soul.invuln > 0 && Math.floor(t*12)%2===0) return;
  // AI sprite with procedural animation: flicker, squash, tilt
  const speed = Math.abs(soul.vx);
  const runBob = soul.onGround ? Math.sin(t*18)*2*Math.min(1, speed/2) : 0;
  const airTilt = !soul.onGround ? Math.max(-0.2, Math.min(0.2, soul.vy*0.03)) : 0;
  const flick = 1 + Math.sin(t*20)*0.04;
  const w = 36*flick, h = 36/flick;
  ctx.save();
  ctx.translate(x, y + runBob*0.3);
  ctx.rotate(airTilt + Math.sin(t*3)*0.03);
  // glow behind
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
  g.addColorStop(0, 'rgba(100,150,255,0.4)');
  g.addColorStop(1, 'rgba(100,150,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-22, -22, 44, 44);
  if(soulImg.complete && soulImg.naturalWidth){
    // flip based on facing
    ctx.scale(soul.face, 1);
    ctx.drawImage(soulImg, -w/2, -h/2 + runBob*0.5, w, h);
  }
  ctx.restore();
  if(soul.armor){
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 14+Math.sin(t*6)*1, 0, 7); ctx.stroke();
  }
}

function drawDemon(d, t){
  const x = d.x + d.w/2, y = d.y + d.h;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y+1, 9, 3, 0, 0, 7); ctx.fill();
  if(demonImg.complete && demonImg.naturalWidth){
    // walk animation: bob + squash + tilt
    const walkPhase = t*10 + d.t;
    const bob = d.type===1 ? Math.sin(t*6+d.t)*3 : Math.abs(Math.sin(walkPhase))*3;
    const squash = 1 + Math.sin(walkPhase*2)*0.06;
    const tilt = d.type===0 ? Math.sin(walkPhase)*0.08 : Math.sin(t*3+d.t)*0.1;
    const w = 32, h = 32*squash;
    ctx.save();
    ctx.translate(x, y - 16 + bob*0.3);
    ctx.rotate(tilt);
    // flip based on movement direction
    ctx.scale(d.vx < 0 ? 1 : -1, 1);
    ctx.drawImage(demonImg, -w/2, -h/2, w, h);
    ctx.restore();
  }
}

function drawBG(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0005');
  g.addColorStop(0.5, '#1a0505');
  g.addColorStop(0.8, '#2a0a05');
  g.addColorStop(1, '#0a0005');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const p1 = camX * 0.2;
  ctx.fillStyle = 'rgba(255,80,0,0.15)';
  for(let i=0; i<20; i++){
    const fx = ((i*97 - p1) % (W+80) + W+80) % (W+80) - 40;
    const fh = 30 + Math.sin(t*2+i)*8;
    ctx.beginPath();
    ctx.moveTo(fx-12, H); ctx.quadraticCurveTo(fx, H-fh, fx+12, H);
    ctx.fill();
  }
  const p2 = camX * 0.4;
  ctx.fillStyle = '#120608';
  for(let i=0; i<12; i++){
    const px = ((i*173 - p2) % (W+120) + W+120) % (W+120) - 60;
    const ph = 80 + (i%3)*30;
    ctx.fillRect(px, H-ph-40, 24, ph);
    ctx.beginPath();
    ctx.moveTo(px, H-ph-40); ctx.lineTo(px+12, H-ph-55); ctx.lineTo(px+24, H-ph-40);
    ctx.fill();
  }
  const p3 = camX * 0.6;
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 3;
  for(let i=0; i<8; i++){
    const cx = ((i*211 - p3) % (W+100) + W+100) % (W+100) - 50;
    const len = 40 + (i%4)*20 + Math.sin(t+i)*3;
    ctx.beginPath(); ctx.moveTo(cx, 0);
    for(let s=0; s<len; s+=8) ctx.lineTo(cx + Math.sin(s*0.5+i)*2, s);
    ctx.stroke();
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(cx-3, len, 6, 8);
  }
  const p4 = camX * 0.8;
  for(let i=0; i<15; i++){
    const sx = ((i*137 - p4) % (W+60) + W+60) % (W+60) - 30;
    const sy = 60 + (i*53)%120 + Math.sin(t*1.5+i)*6;
    const alpha = 0.15 + Math.sin(t*2+i)*0.05;
    ctx.fillStyle = `rgba(100,150,255,${alpha})`;
    ctx.beginPath(); ctx.ellipse(sx, sy, 4, 6, 0, 0, 7); ctx.fill();
  }
}

function drawTiles(){
  const x0 = Math.floor(camX/TS), x1 = x0 + W/TS + 2;
  for(let ty=0; ty<TH; ty++) for(let tx=x0; tx<x1; tx++){
    const ch = tileAt(tx, ty);
    if(!solids.has(ch)) continue;
    const x = tx*TS - camX, y = ty*TS;
    ctx.fillStyle = '#3a2a20';
    ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = '#4a352a';
    ctx.fillRect(x, y, TS, 4);
    ctx.fillRect(x, y, 4, TS);
    ctx.fillStyle = '#2a1e16';
    ctx.fillRect(x, y+TS-3, TS, 3);
    ctx.fillRect(x+TS-3, y, 3, TS);
    ctx.fillStyle = '#1a120c';
    if((tx*7+ty*13)%5===0) ctx.fillRect(x+4, y+6, 8, 2);
    if((tx*11+ty*7)%7===0) ctx.fillRect(x+6, y+3, 2, 7);
    if((tx*5+ty*11)%9===0){
      ctx.fillStyle = '#ff4400';
      ctx.fillRect(x+5, y+10, 6, 1);
    }
    if(ch==='='){
      ctx.fillStyle = '#d4c4a8';
      ctx.fillRect(x, y, TS, 6);
      ctx.fillStyle = '#b8a888';
      ctx.fillRect(x, y+4, TS, 2);
    }
  }
}

let lastT = 0, gameT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastT)/1000, 0.05); lastT = ts;
  gameT += dt;
  const t = gameT;
  
  if(soul.alive){
    const ax = (right()?1:0) - (left()?1:0);
    if(ax !== 0){
      soul.face = ax;
      const acc = soul.onGround ? RUN_ACC : AIR_ACC;
      soul.vx += ax * acc;
      soul.vx = Math.max(-RUN_MAX, Math.min(RUN_MAX, soul.vx));
    } else {
      soul.vx *= soul.onGround ? FRICTION : 0.98;
      if(Math.abs(soul.vx) < 0.05) soul.vx = 0;
    }
    if(soul.onGround) soul.coyote = 0.12; else soul.coyote -= dt;
    if(jumpHeld() && !soul.jumpWasHeld){ soul.jbuf = 0.12; }
    soul.jumpWasHeld = jumpHeld();
    soul.jbuf -= dt;
    if(soul.jbuf > 0 && soul.coyote > 0){
      soul.vy = JUMP_V; soul.onGround = false; soul.coyote = 0; soul.jbuf = 0;
      for(let i=0;i<6;i++) particles.push({x:soul.x+6, y:soul.y+16, vx:(Math.random()-0.5)*2, vy:-Math.random()*1.5, life:0.4, c:'#8a7a6a'});
    }
    if(!jumpHeld() && soul.vy < JUMP_V*JUMP_HOLD) soul.vy = JUMP_V*JUMP_HOLD;
    
    moveBody(soul, true);
    
    soul.trail.push({x:soul.x+6, y:soul.y+8, life:0.3});
    if(soul.trail.length > 12) soul.trail.shift();
    soul.trail.forEach(p => p.life -= dt);
    soul.trail = soul.trail.filter(p => p.life > 0);
    
    if(soul.y > 400){
      lives--;
      document.getElementById('lives').textContent = '♥ ' + lives;
      if(lives <= 0){ lives = 3; reset(); }
      else { soul.x = 32; soul.y = 200; soul.vx = 0; soul.vy = 0; }
    }
    
    if(soul.invuln > 0) soul.invuln -= dt;
    const targetCam = Math.max(0, soul.x - W*0.4);
    camX += (targetCam - camX) * 0.12;
  }
  
  for(const d of demons){
    if(!d.alive) continue;
    d.t += dt;
    if(d.type===1){
      d.x += d.vx;
      d.y += Math.sin(d.t*3)*0.8;
      if(Math.random()<0.01) d.vx *= -1;
    } else {
      d.vy = Math.min(d.vy + GRAV, MAXFALL);
      moveBody(d, false);
    }
    if(d.x < camX - 50 || d.x > camX + W + 50) continue;
    
    if(soul.alive && soul.invuln <= 0){
      const sx = soul.x, sy = soul.y, sw = soul.w, sh = soul.h;
      if(sx < d.x+d.w && sx+sw > d.x && sy < d.y+d.h && sy+sh > d.y){
        if(soul.vy > 0 && sy+sh - d.y < 10){
          d.alive = false;
          soul.vy = jumpHeld() ? -10 : -6;
          soulsCollected += 2;
          document.getElementById('souls').textContent = '◊ ' + soulsCollected;
          for(let i=0;i<12;i++) particles.push({x:d.x+6, y:d.y+7, vx:(Math.random()-0.5)*3, vy:-Math.random()*3, life:0.6, c:'#ff4400'});
          shake = 0.15;
        } else {
          if(soul.armor){ soul.armor = false; soul.invuln = 1.5; }
          else {
            lives--;
            document.getElementById('lives').textContent = '♥ ' + lives;
            soul.invuln = 2;
            if(lives <= 0){ lives = 3; reset(); }
          }
          soul.vx = (sx < d.x ? -1 : 1) * 4;
          soul.vy = -5;
        }
      }
    }
  }
  
  for(const p of pickups){
    if(p.taken) continue;
    p.t += dt;
    if(Math.abs(soul.x+6 - p.x) < 14 && Math.abs(soul.y+8 - p.y) < 14){
      p.taken = true;
      soulsCollected++;
      document.getElementById('souls').textContent = '◊ ' + soulsCollected;
      for(let i=0;i<8;i++) particles.push({x:p.x, y:p.y, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, life:0.4, c:'#8fb3ff'});
    }
  }
  
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  if(shake > 0) shake -= dt;
  
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*4*shake*10, (Math.random()-0.5)*4*shake*10);
  
  drawBG(t);
  drawTiles();
  
  for(const p of pickups){
    if(p.taken) continue;
    const x = p.x - camX, y = p.y + Math.sin(p.t*3)*2;
    if(x < -20 || x > W+20) continue;
    ctx.fillStyle = 'rgba(140,180,255,0.9)';
    ctx.beginPath(); ctx.ellipse(x, y, 4, 5.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(x, y-1, 1.8, 2.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(140,180,255,0.25)';
    ctx.beginPath(); ctx.arc(x, y, 9+Math.sin(p.t*4)*1.5, 0, 7); ctx.fill();
  }
  
  for(const d of demons){
    if(!d.alive) continue;
    const x = d.x - camX;
    if(x < -30 || x > W+30) continue;
    ctx.save(); ctx.translate(x, 0);
    drawDemon({x:0, y:d.y, w:d.w, h:d.h, vx:d.vx, t:d.t, type:d.type}, t);
    ctx.restore();
  }
  
  for(const p of soul.trail){
    ctx.fillStyle = `rgba(100,150,255,${p.life*1.5})`;
    ctx.beginPath(); ctx.arc(p.x - camX, p.y, 3*p.life*3, 0, 7); ctx.fill();
  }
  
  if(soul.alive) drawSoul(soul.x + soul.w/2 - camX, soul.y + soul.h/2, t);
  
  for(const p of particles){
    ctx.fillStyle = p.c;
    ctx.globalAlpha = Math.max(0, p.life*2);
    ctx.fillRect(p.x - camX, p.y, 3, 3);
    ctx.globalAlpha = 1;
  }
  

  
  ctx.restore();
  
  // endless: track distance, ensure chunks, respawn from new chunks
  const dist = Math.floor(soul.x / 50);
  if(dist > maxDist){
    maxDist = dist;
    document.getElementById('circle').textContent = 'CIRCLE I — LIMBO · ' + maxDist + 'm';
  }
  ensureChunks();
  // add entities from new chunks only (track spawned chunk set)
  if(!window._spawnedChunks) window._spawnedChunks = new Set();
  for(const [ci, ch] of chunks){
    if(window._spawnedChunks.has(ci)) continue;
    window._spawnedChunks.add(ci);
    for(const d of ch.demons){
      demons.push({ x:d.tx*TS+2, y:d.ty*TS, w:12, h:14, vx:-0.5, vy:0, alive:true, t:Math.random()*10, type:d.type });
    }
    for(const p of ch.pickups){
      pickups.push({ x:p.tx*TS+4, y:p.ty*TS+4, taken:false, t:Math.random()*10 });
    }
  }
  // prune entities far behind
  demons = demons.filter(d => d.x > camX - 100);
  pickups = pickups.filter(p => p.x > camX - 100);

}

reset();
requestAnimationFrame(loop);
})();
</script>
