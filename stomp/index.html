<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STOMP — Circle I: Limbo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { display:flex; align-items:center; justify-content:center; font-family:monospace; }
  #wrap { position:relative; width:100%; max-width:960px; }
  canvas { display:block; width:100%; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; touch-action:none; }
  #hud { position:absolute; top:8px; left:12px; right:12px; display:flex; justify-content:space-between; color:#8fa3ff; font-size:14px; text-shadow:2px 2px 0 #000; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="hud"><span id="souls">◊ 0</span><span id="circle">CIRCLE I — LIMBO</span><span id="lives">♥ 3</span></div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 480, H = 270;
ctx.imageSmoothingEnabled = false;

// ===== INPUT =====
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if([' ','arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
let touchL=false, touchR=false, touchX=0;
cv.addEventListener('touchstart', e => {
  for(const t of e.changedTouches){
    const r = cv.getBoundingClientRect();
    const x = (t.clientX - r.left) / r.width;
    if(x < 0.5){ touchL = true; touchX = x; } else touchR = true;
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchmove', e => {
  for(const t of e.changedTouches){
    const r = cv.getBoundingClientRect();
    const x = (t.clientX - r.left) / r.width;
    if(x < 0.5) touchX = x;
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e => {
  for(const t of e.changedTouches){
    const r = cv.getBoundingClientRect();
    const x = (t.clientX - r.left) / r.width;
    if(x < 0.5) touchL = false; else touchR = false;
  }
  e.preventDefault();
}, {passive:false});
const left = () => keys['arrowleft']||keys['a']||(touchL&&touchX<0.25);
const right = () => keys['arrowright']||keys['d']||(touchL&&touchX>=0.25);
const jumpHeld = () => keys[' ']||keys['arrowup']||keys['w']||touchR;

// ===== LEVEL: Circle I — Limbo =====
const MAP = [
"                                                                                                    ",
"                                                                                                    ",
"                                                                                                    ",
"                                                                                                    ",
"                        o o o                                                                        ",
"                       ======                                          o o o                        ",
"                                                                     =======                       ",
"            o                                                              D                        ",
"           ===              D                  o o               =================                   ",
"                            ===              =====                                            D     ",
"         D                                                                          ===============",
"       =======            o o o                D                        o                           ",
"                         =======             ======                    ===             o o o         ",
"  o o         D                                                              D      =======        ",
" =====     ======                                                          =====                   ",
"              o o o              D          o o o               D                                    ",
"##########=========##########=======##############=========#############=======####################E",
];
const TW = MAP[0].length, TH = MAP.length, TS = 16;
const solids = new Set(['#','=']);
function tileAt(tx, ty){
  if(tx<0||tx>=TW||ty<0||ty>=TH) return ' ';
  return MAP[ty][tx];
}
function solidAt(px, py){
  return solids.has(tileAt(Math.floor(px/TS), Math.floor(py/TS)));
}

// ===== SOUL (player) =====
const soul = {
  x: 32, y: 200, vx: 0, vy: 0, w: 12, h: 16,
  onGround: false, coyote: 0, jbuf: 0,
  face: 1, alive: true, invuln: 0,
  armor: false,
  trail: [],
};
const GRAV = 0.45, MAXFALL = 9;
const RUN_ACC = 0.35, RUN_MAX = 3.2, FRICTION = 0.85, AIR_ACC = 0.22;
const JUMP_V = -8.5, JUMP_HOLD = 0.55;

let demons = [];
function spawnDemons(){
  demons = [];
  for(let y=0; y<TH; y++) for(let x=0; x<TW; x++){
    if(MAP[y][x]==='D'){
      demons.push({ x:x*TS+2, y:y*TS, w:12, h:14, vx:-0.5, vy:0, alive:true, t:Math.random()*10, type: Math.random()<0.3?1:0 });
    }
  }
}
let pickups = [];
function spawnPickups(){
  pickups = [];
  for(let y=0; y<TH; y++) for(let x=0; x<TW; x++){
    if(MAP[y][x]==='o') pickups.push({ x:x*TS+4, y:y*TS+4, taken:false, t:Math.random()*10 });
  }
}
let soulsCollected = 0, lives = 3;
let camX = 0;
let particles = [];
let shake = 0;

function reset(){
  soul.x = 32; soul.y = 200; soul.vx = 0; soul.vy = 0; soul.alive = true; soul.invuln = 0;
  spawnDemons(); spawnPickups();
  soulsCollected = 0; camX = 0; particles = [];
  document.getElementById('souls').textContent = '◊ 0';
  document.getElementById('lives').textContent = '♥ ' + lives;
}

function moveBody(b, isPlayer){
  b.x += b.vx;
  if(b.vx > 0){
    if(solidAt(b.x+b.w, b.y+2) || solidAt(b.x+b.w, b.y+b.h-2)){ b.x = Math.floor((b.x+b.w)/TS)*TS - b.w - 0.1; b.vx = isPlayer?0:-b.vx; }
  } else if(b.vx < 0){
    if(solidAt(b.x, b.y+2) || solidAt(b.x, b.y+b.h-2)){ b.x = Math.floor(b.x/TS)*TS + TS + 0.1; b.vx = isPlayer?0:-b.vx; }
  }
  b.y += b.vy;
  b.onGround = false;
  if(b.vy > 0){
    if(solidAt(b.x+2, b.y+b.h) || solidAt(b.x+b.w-2, b.y+b.h)){
      b.y = Math.floor((b.y+b.h)/TS)*TS - b.h; b.vy = 0; b.onGround = true;
    }
  } else if(b.vy < 0){
    if(solidAt(b.x+2, b.y) || solidAt(b.x+b.w-2, b.y)){
      b.y = Math.floor(b.y/TS)*TS + TS + 0.1; b.vy = 0;
    }
  }
  b.vy = Math.min(b.vy + GRAV, MAXFALL);
}

function drawSoul(x, y, t){
  if(soul.invuln > 0 && Math.floor(t*12)%2===0) return;
  const flick = Math.sin(t*20)*1.5;
  const g = ctx.createRadialGradient(x, y, 2, x, y, 18);
  g.addColorStop(0, 'rgba(100,150,255,0.5)');
  g.addColorStop(1, 'rgba(100,150,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x-18, y-18, 36, 36);
  ctx.fillStyle = '#4a7dff';
  ctx.beginPath();
  ctx.moveTo(x, y-12+flick);
  ctx.quadraticCurveTo(x+7, y-4, x+5, y+4);
  ctx.quadraticCurveTo(x+3, y+9, x, y+9);
  ctx.quadraticCurveTo(x-3, y+9, x-5, y+4);
  ctx.quadraticCurveTo(x-7, y-4, x, y-12+flick);
  ctx.fill();
  ctx.fillStyle = '#9dc4ff';
  ctx.beginPath();
  ctx.moveTo(x, y-7+flick*0.7);
  ctx.quadraticCurveTo(x+4, y-2, x+3, y+3);
  ctx.quadraticCurveTo(x+1, y+6, x, y+6);
  ctx.quadraticCurveTo(x-1, y+6, x-3, y+3);
  ctx.quadraticCurveTo(x-4, y-2, x, y-7+flick*0.7);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(x, y+1, 2.5, 3.5, 0, 0, 7); ctx.fill();
  const ex = soul.face * 2;
  ctx.fillStyle = '#0a1a3a';
  ctx.fillRect(x-3+ex, y-2, 2, 3);
  ctx.fillRect(x+1+ex, y-2, 2, 3);
  if(soul.armor){
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 12+Math.sin(t*6)*1, 0, 7); ctx.stroke();
  }
}

function drawDemon(d, t){
  const x = d.x + d.w/2, y = d.y + d.h;
  const bob = Math.sin(t*8 + d.t)*1;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y+1, 7, 2.5, 0, 0, 7); ctx.fill();
  const squash = 1 + Math.sin(t*8+d.t)*0.08;
  ctx.fillStyle = d.type===1 ? '#8b0000' : '#c0392b';
  const bw = 12, bh = 12*squash;
  ctx.fillRect(x-bw/2, y-bh+bob, bw, bh);
  ctx.fillStyle = d.type===1 ? '#5a0000' : '#922b21';
  ctx.fillRect(x-bw/2+2, y-bh+bob+6, bw-4, bh-8);
  ctx.fillStyle = '#f5e6c8';
  ctx.beginPath();
  ctx.moveTo(x-6, y-bh+bob+2); ctx.lineTo(x-9, y-bh+bob-5); ctx.lineTo(x-4, y-bh+bob); ctx.fill();
  ctx.moveTo(x+6, y-bh+bob+2); ctx.lineTo(x+9, y-bh+bob-5); ctx.lineTo(x+4, y-bh+bob); ctx.fill();
  ctx.fillStyle = '#ffeb00';
  const look = d.vx < 0 ? -1 : 1;
  ctx.fillRect(x-4+look, y-bh+bob+4, 3, 3);
  ctx.fillRect(x+1+look, y-bh+bob+4, 3, 3);
  ctx.fillStyle = '#000';
  ctx.fillRect(x-3+look, y-bh+bob+5, 1, 2);
  ctx.fillRect(x+2+look, y-bh+bob+5, 1, 2);
  ctx.fillStyle = '#000';
  ctx.fillRect(x-5, y-bh+bob+2, 4, 1.5);
  ctx.fillRect(x+1, y-bh+bob+2, 4, 1.5);
  const step = Math.sin(t*12+d.t)*2;
  ctx.fillStyle = '#5a0000';
  ctx.fillRect(x-6, y-2, 5, 3+step*0.3);
  ctx.fillRect(x+1, y-2, 5, 3-step*0.3);
  if(d.type===1){
    const flap = Math.sin(t*15+d.t)*4;
    ctx.fillStyle = '#4a0000';
    ctx.beginPath();
    ctx.moveTo(x-4, y-bh+bob+4); ctx.quadraticCurveTo(x-14, y-bh+bob-4+flap, x-10, y-bh+bob+6); ctx.fill();
    ctx.moveTo(x+4, y-bh+bob+4); ctx.quadraticCurveTo(x+14, y-bh+bob-4-flap, x+10, y-bh+bob+6); ctx.fill();
  }
}

function drawBG(t){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0005');
  g.addColorStop(0.5, '#1a0505');
  g.addColorStop(0.8, '#2a0a05');
  g.addColorStop(1, '#0a0005');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const p1 = camX * 0.2;
  ctx.fillStyle = 'rgba(255,80,0,0.15)';
  for(let i=0; i<20; i++){
    const fx = ((i*97 - p1) % (W+80) + W+80) % (W+80) - 40;
    const fh = 30 + Math.sin(t*2+i)*8;
    ctx.beginPath();
    ctx.moveTo(fx-12, H); ctx.quadraticCurveTo(fx, H-fh, fx+12, H);
    ctx.fill();
  }
  const p2 = camX * 0.4;
  ctx.fillStyle = '#120608';
  for(let i=0; i<12; i++){
    const px = ((i*173 - p2) % (W+120) + W+120) % (W+120) - 60;
    const ph = 80 + (i%3)*30;
    ctx.fillRect(px, H-ph-40, 24, ph);
    ctx.beginPath();
    ctx.moveTo(px, H-ph-40); ctx.lineTo(px+12, H-ph-55); ctx.lineTo(px+24, H-ph-40);
    ctx.fill();
  }
  const p3 = camX * 0.6;
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 3;
  for(let i=0; i<8; i++){
    const cx = ((i*211 - p3) % (W+100) + W+100) % (W+100) - 50;
    const len = 40 + (i%4)*20 + Math.sin(t+i)*3;
    ctx.beginPath(); ctx.moveTo(cx, 0);
    for(let s=0; s<len; s+=8) ctx.lineTo(cx + Math.sin(s*0.5+i)*2, s);
    ctx.stroke();
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(cx-3, len, 6, 8);
  }
  const p4 = camX * 0.8;
  for(let i=0; i<15; i++){
    const sx = ((i*137 - p4) % (W+60) + W+60) % (W+60) - 30;
    const sy = 60 + (i*53)%120 + Math.sin(t*1.5+i)*6;
    const alpha = 0.15 + Math.sin(t*2+i)*0.05;
    ctx.fillStyle = `rgba(100,150,255,${alpha})`;
    ctx.beginPath(); ctx.ellipse(sx, sy, 4, 6, 0, 0, 7); ctx.fill();
  }
}

function drawTiles(){
  const x0 = Math.floor(camX/TS), x1 = x0 + W/TS + 2;
  for(let ty=0; ty<TH; ty++) for(let tx=x0; tx<x1; tx++){
    const ch = tileAt(tx, ty);
    if(!solids.has(ch)) continue;
    const x = tx*TS - camX, y = ty*TS;
    ctx.fillStyle = '#3a2a20';
    ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = '#4a352a';
    ctx.fillRect(x, y, TS, 4);
    ctx.fillRect(x, y, 4, TS);
    ctx.fillStyle = '#2a1e16';
    ctx.fillRect(x, y+TS-3, TS, 3);
    ctx.fillRect(x+TS-3, y, 3, TS);
    ctx.fillStyle = '#1a120c';
    if((tx*7+ty*13)%5===0) ctx.fillRect(x+4, y+6, 8, 2);
    if((tx*11+ty*7)%7===0) ctx.fillRect(x+6, y+3, 2, 7);
    if((tx*5+ty*11)%9===0){
      ctx.fillStyle = '#ff4400';
      ctx.fillRect(x+5, y+10, 6, 1);
    }
    if(ch==='='){
      ctx.fillStyle = '#d4c4a8';
      ctx.fillRect(x, y, TS, 6);
      ctx.fillStyle = '#b8a888';
      ctx.fillRect(x, y+4, TS, 2);
    }
  }
}

let lastT = 0, gameT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastT)/1000, 0.05); lastT = ts;
  gameT += dt;
  const t = gameT;
  
  if(soul.alive){
    const ax = (right()?1:0) - (left()?1:0);
    if(ax !== 0){
      soul.face = ax;
      const acc = soul.onGround ? RUN_ACC : AIR_ACC;
      soul.vx += ax * acc;
      soul.vx = Math.max(-RUN_MAX, Math.min(RUN_MAX, soul.vx));
    } else {
      soul.vx *= soul.onGround ? FRICTION : 0.98;
      if(Math.abs(soul.vx) < 0.05) soul.vx = 0;
    }
    if(soul.onGround) soul.coyote = 0.12; else soul.coyote -= dt;
    if(jumpHeld() && !soul.jumpWasHeld){ soul.jbuf = 0.12; }
    soul.jumpWasHeld = jumpHeld();
    soul.jbuf -= dt;
    if(soul.jbuf > 0 && soul.coyote > 0){
      soul.vy = JUMP_V; soul.onGround = false; soul.coyote = 0; soul.jbuf = 0;
      for(let i=0;i<6;i++) particles.push({x:soul.x+6, y:soul.y+16, vx:(Math.random()-0.5)*2, vy:-Math.random()*1.5, life:0.4, c:'#8a7a6a'});
    }
    if(!jumpHeld() && soul.vy < JUMP_V*JUMP_HOLD) soul.vy = JUMP_V*JUMP_HOLD;
    
    moveBody(soul, true);
    
    soul.trail.push({x:soul.x+6, y:soul.y+8, life:0.3});
    if(soul.trail.length > 12) soul.trail.shift();
    soul.trail.forEach(p => p.life -= dt);
    soul.trail = soul.trail.filter(p => p.life > 0);
    
    if(soul.y > TH*TS + 40){
      lives--;
      document.getElementById('lives').textContent = '♥ ' + lives;
      if(lives <= 0){ lives = 3; reset(); }
      else { soul.x = 32; soul.y = 200; soul.vx = 0; soul.vy = 0; }
    }
    
    if(soul.invuln > 0) soul.invuln -= dt;
    const targetCam = Math.max(0, Math.min(soul.x - W*0.4, TW*TS - W));
    camX += (targetCam - camX) * 0.12;
  }
  
  for(const d of demons){
    if(!d.alive) continue;
    d.t += dt;
    if(d.type===1){
      d.x += d.vx;
      d.y += Math.sin(d.t*3)*0.8;
      if(Math.random()<0.01) d.vx *= -1;
    } else {
      d.vy = Math.min(d.vy + GRAV, MAXFALL);
      moveBody(d, false);
    }
    if(d.x < camX - 50 || d.x > camX + W + 50) continue;
    
    if(soul.alive && soul.invuln <= 0){
      const sx = soul.x, sy = soul.y, sw = soul.w, sh = soul.h;
      if(sx < d.x+d.w && sx+sw > d.x && sy < d.y+d.h && sy+sh > d.y){
        if(soul.vy > 0 && sy+sh - d.y < 10){
          d.alive = false;
          soul.vy = jumpHeld() ? -10 : -6;
          soulsCollected += 2;
          document.getElementById('souls').textContent = '◊ ' + soulsCollected;
          for(let i=0;i<12;i++) particles.push({x:d.x+6, y:d.y+7, vx:(Math.random()-0.5)*3, vy:-Math.random()*3, life:0.6, c:'#ff4400'});
          shake = 0.15;
        } else {
          if(soul.armor){ soul.armor = false; soul.invuln = 1.5; }
          else {
            lives--;
            document.getElementById('lives').textContent = '♥ ' + lives;
            soul.invuln = 2;
            if(lives <= 0){ lives = 3; reset(); }
          }
          soul.vx = (sx < d.x ? -1 : 1) * 4;
          soul.vy = -5;
        }
      }
    }
  }
  
  for(const p of pickups){
    if(p.taken) continue;
    p.t += dt;
    if(Math.abs(soul.x+6 - p.x) < 14 && Math.abs(soul.y+8 - p.y) < 14){
      p.taken = true;
      soulsCollected++;
      document.getElementById('souls').textContent = '◊ ' + soulsCollected;
      for(let i=0;i<8;i++) particles.push({x:p.x, y:p.y, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, life:0.4, c:'#8fb3ff'});
    }
  }
  
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  if(shake > 0) shake -= dt;
  
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*4*shake*10, (Math.random()-0.5)*4*shake*10);
  
  drawBG(t);
  drawTiles();
  
  for(const p of pickups){
    if(p.taken) continue;
    const x = p.x - camX, y = p.y + Math.sin(p.t*3)*2;
    if(x < -20 || x > W+20) continue;
    ctx.fillStyle = 'rgba(140,180,255,0.9)';
    ctx.beginPath(); ctx.ellipse(x, y, 4, 5.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(x, y-1, 1.8, 2.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(140,180,255,0.25)';
    ctx.beginPath(); ctx.arc(x, y, 9+Math.sin(p.t*4)*1.5, 0, 7); ctx.fill();
  }
  
  for(const d of demons){
    if(!d.alive) continue;
    const x = d.x - camX;
    if(x < -30 || x > W+30) continue;
    ctx.save(); ctx.translate(x, 0);
    drawDemon({x:0, y:d.y, w:d.w, h:d.h, vx:d.vx, t:d.t, type:d.type}, t);
    ctx.restore();
  }
  
  for(const p of soul.trail){
    ctx.fillStyle = `rgba(100,150,255,${p.life*1.5})`;
    ctx.beginPath(); ctx.arc(p.x - camX, p.y, 3*p.life*3, 0, 7); ctx.fill();
  }
  
  if(soul.alive) drawSoul(soul.x + soul.w/2 - camX, soul.y + soul.h/2, t);
  
  for(const p of particles){
    ctx.fillStyle = p.c;
    ctx.globalAlpha = Math.max(0, p.life*2);
    ctx.fillRect(p.x - camX, p.y, 3, 3);
    ctx.globalAlpha = 1;
  }
  
  const ex = (TW-1)*TS - camX;
  if(ex > -40 && ex < W+40){
    ctx.fillStyle = '#000';
    ctx.fillRect(ex-8, TH*TS-16*4, 24, 16*4);
    ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2;
    const pulse = 1 + Math.sin(t*4)*0.1;
    ctx.strokeRect(ex-8, TH*TS-16*4, 24*pulse, 16*4);
    ctx.fillStyle = '#ff4400';
    ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('▼', ex+4, TH*TS-16*4-6);
  }
  
  ctx.restore();
  
  const exitX = (TW-1)*TS;
  if(soul.x > exitX - 10 && soul.x < exitX + 20){
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#8fa3ff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
    ctx.fillText('CIRCLE I CLEARED', W/2, H/2-10);
    ctx.font = '12px monospace';
    ctx.fillText(soulsCollected + ' souls gathered', W/2, H/2+15);
    if(!soul.exitT) soul.exitT = t;
    if(t - soul.exitT > 2.5){ soul.exitT = 0; reset(); }
  }
}

reset();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
