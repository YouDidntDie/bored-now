<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DROP — a 2017 story</title>
<style>
  html,body{margin:0;padding:0;background:#05070c;height:100%;overflow:hidden;
    font-family:'Courier New',ui-monospace,monospace;-webkit-user-select:none;user-select:none;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;background:#0d2b45;max-width:100vw;max-height:100vh;}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
'use strict';
/* DROP — a 2017 top-down battle royale. Original in every way. */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 480, H = 720;

/* ---------------- utils ---------------- */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(rand(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function fmtTime(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

/* ---------------- audio ---------------- */
const AudioSys = {
  ctx:null, muted: localStorage.getItem('drop_mute')==='1',
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,d,type,v,slide){ if(this.muted||!this.ctx)return;
    const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
    g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+d+0.02); },
  noise(d,v,fc){ if(this.muted||!this.ctx)return;
    const t=this.ctx.currentTime,len=Math.floor(this.ctx.sampleRate*d),
    buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=this.ctx.createBufferSource();s.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;
    const g=this.ctx.createGain();g.gain.setValueAtTime(v||0.2,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.ctx.destination);s.start(t); },
  shoot(w){ if(w==='rifle'){this.noise(0.12,0.25,2500);this.tone(180,0.1,'square',0.1,60);}
    else if(w==='scatter'){this.noise(0.22,0.3,900);}
    else if(w==='smg'){this.noise(0.06,0.14,3000);this.tone(700,0.05,'square',0.06,300);}
    else {this.tone(620,0.07,'square',0.09,240);} },
  pickup(){this.tone(520,0.08,'sine',0.12);setTimeout(()=>this.tone(780,0.1,'sine',0.12),70);},
  hurt(){this.tone(140,0.15,'sawtooth',0.14,70);},
  heal(){[440,560,680].forEach((f,i)=>setTimeout(()=>this.tone(f,0.12,'sine',0.1),i*90));},
  zoneWarn(){this.tone(440,0.18,'square',0.12);setTimeout(()=>this.tone(330,0.22,'square',0.12),200);},
  ui(){this.tone(660,0.06,'square',0.08);},
  win(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,0.22,'triangle',0.14),i*120));},
  lose(){[400,340,280,200].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,'sawtooth',0.1),i*130));}
};

/* ---------------- weapons ---------------- */
const WEAPONS = {
  sidearm:{name:'SIDEARM',dmg:8, rate:3,  range:230,spread:0.06, speed:470,pellets:1,tier:0,color:'#ffd75e'},
  smg:    {name:'SMG',    dmg:6, rate:8,  range:210,spread:0.10, speed:510,pellets:1,tier:1,color:'#7ee787'},
  scatter:{name:'SCATTER',dmg:7, rate:1.3,range:165,spread:0.28, speed:410,pellets:5,tier:2,color:'#ff9d5e'},
  rifle:  {name:'RIFLE',  dmg:26,rate:1.7,range:370,spread:0.025,speed:780,pellets:1,tier:3,color:'#7ecbff'}
};
const TIER_ORDER=['sidearm','smg','scatter','rifle'];

/* ---------------- state ---------------- */
const S = {
  state:'menu', mode:null, t:0,
  fighters:[], bullets:[], crates:[],
  zone:{x:0,y:0,r:100,tx:0,ty:0,tr:100,phase:0,mode:'wait',timer:0},
  feed:[], banners:[],
  cam:{x:0,y:0},
  world:{x:0,y:0,w:1000,h:1400},
  round:1, wins:{p1:0,p2:0}, roundWinner:null, endTimer:0,
  paused:false, overInfo:null
};
const ZONE_DPS=[2,5,9,15,23,34];
const ZONE_WAIT=25, ZONE_SHRINK=12;

const BOT_NAMES=['VEX','MARA','JUNO','KILO','REX','NOVA','PIXL','DREK','SABLE','ONYX','FLINT'];
const BOT_COLORS=['#ff5e5e','#c77eff','#7effc7','#ffe75e','#5effef','#ff9d5e','#8fb8ff','#e87eff','#a3ff5e','#5e9dff','#ff5e9d'];

/* ---------------- input ---------------- */
const keys={};
const touches={}; // id -> {role, side, ox,oy,x,y}
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat)return; keys[e.code]=true; AudioSys.init();
  if(e.code==='KeyM'){AudioSys.muted=!AudioSys.muted;localStorage.setItem('drop_mute',AudioSys.muted?'1':'0');}
  if(e.code==='KeyP'&&(S.state==='play')){S.paused=!S.paused;}
  if(S.state==='menu'&&(e.code==='Digit1'||e.code==='Numpad1'))startGame('solo');
  if(S.state==='menu'&&(e.code==='Digit2'||e.code==='Numpad2'))startGame('versus');
  if((S.state==='over'||S.state==='roundEnd'||S.state==='matchEnd')&&e.code==='Enter')backToMenu();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

function canvasPos(t){const r=cv.getBoundingClientRect();
  return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)};}

cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{AudioSys.init();handleTap(canvasPos(e));});
cv.addEventListener('touchstart',e=>{e.preventDefault();AudioSys.init();
  for(const t of e.changedTouches){const p=canvasPos(t);handleTouchStart(t.identifier,p);}}, {passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  for(const t of e.changedTouches){const id=t.identifier;
    if(touches[id]){const p=canvasPos(t);touches[id].x=p.x;touches[id].y=p.y;}}}, {passive:false});
function touchEnd(e){for(const t of e.changedTouches){delete touches[t.identifier];}}
cv.addEventListener('touchend',touchEnd); cv.addEventListener('touchcancel',touchEnd);

function inCircle(p,cx,cy,r){return Math.hypot(p.x-cx,p.y-cy)<r;}

function handleTap(p){
  if(S.state==='menu'){
    if(p.y>300&&p.y<360)startGame('solo');
    else if(p.y>380&&p.y<440)startGame('versus');
    return;
  }
  if(S.state==='over'||S.state==='roundEnd'||S.state==='matchEnd'){backToMenu();return;}
}

function handleTouchStart(id,p){
  if(S.state==='menu'||S.state==='over'||S.state==='roundEnd'||S.state==='matchEnd'){handleTap(p);return;}
  if(S.state!=='play'||S.paused)return;
  if(S.mode==='solo'){
    if(inCircle(p,404,528,32)){tryHeal(getPlayer(0));return;}
    if(inCircle(p,404,618,48)){touches[id]={role:'fire',side:0,x:p.x,y:p.y};return;}
    if(p.y>60&&p.x<250){touches[id]={role:'stick',side:0,ox:p.x,oy:p.y,x:p.x,y:p.y};return;}
    touches[id]={role:'fire',side:0,x:p.x,y:p.y};
  } else {
    const side = p.x<240?0:1;
    const fx = side===0?64:416, mx = side===0?140:340;
    if(inCircle(p,mx,664,26)){tryHeal(getPlayer(side));return;}
    if(inCircle(p,fx,664,36)){touches[id]={role:'fire',side,x:p.x,y:p.y};return;}
    if(p.y>60&&p.y<640){touches[id]={role:'stick',side,ox:p.x,oy:p.y,x:p.x,y:p.y};return;}
  }
}

function getPlayer(side){ // side 0 = P1 / solo player, 1 = P2
  return S.fighters.find(f=>!f.isBot&&f.side===side);
}

/* ---------------- fighters ---------------- */
let nextId=1;
function makeFighter(x,y,o){
  o=o||{};
  return {id:nextId++,x,y,hp:100,armor:0,medkits:1,weapon:'sidearm',
    alive:true,isBot:!!o.bot,side:o.side==null?-1:o.side,
    name:o.name||'YOU',color:o.color||'#00ff9d',
    skill:o.skill==null?0.6:o.skill,
    fireCd:0,healT:0,aim:o.aim||0,mvx:0,mvy:0,
    kills:0,think:(o.think||0),reactT:0,strafe:Math.random()<0.5?1:-1,
    speed:o.bot?0:150,zoneAcc:0,wantFire:false,healDone:0};
}

function nearestEnemy(f,maxD){
  let best=null,bd=maxD==null?1e9:maxD;
  for(const o of S.fighters){ if(o===f||!o.alive)continue;
    const d=dist(f,o); if(d<bd){bd=d;best=o;} }
  return best?{f:best,d:bd}:null;
}
function nearestCrate(f,maxD){
  let best=null,bd=maxD==null?1e9:maxD;
  for(const c of S.crates){ if(c.opened)continue;
    const d=Math.hypot(f.x-c.x,f.y-c.y); if(d<bd){bd=d;best=c;} }
  return best?{c:best,d:bd}:null;
}

function applyLoot(f){
  const r=Math.random();
  let msg=null;
  if(r<0.42){
    const w=pick(['smg','scatter','rifle']);
    if(WEAPONS[w].tier>WEAPONS[f.weapon].tier){f.weapon=w;msg=WEAPONS[w].name+'!';}
    else if(f.medkits<3){f.medkits++;msg='+MEDKIT';}
    else {f.armor=Math.min(100,f.armor+50);msg='+ARMOR';}
  } else if(r<0.72){
    if(f.medkits<3){f.medkits++;msg='+MEDKIT';}
    else {f.armor=Math.min(100,f.armor+50);msg='+ARMOR';}
  } else { f.armor=Math.min(100,f.armor+50);msg='+ARMOR'; }
  if(!f.isBot){ if(msg)addBanner(msg,'',0.9,10); AudioSys.pickup(); }
}

function tryHeal(f){
  if(!f||!f.alive||f.healT>0||f.medkits<=0||f.hp>=100)return;
  f.healT=3; f.wantFire=false;
  if(!f.isBot)addBanner('HEALING…','',1.2,9);
}
function finishHeal(f){
  f.healT=0; f.medkits--;
  f.hp=Math.min(100,f.hp+50); f.healDone++;
  if(!f.isBot)AudioSys.heal();
}

function shoot(f){
  const w=WEAPONS[f.weapon];
  if(f.fireCd>0||f.healT>0)return;
  f.fireCd=1/w.rate;
  const tgt=nearestEnemy(f,w.range);
  let a;
  if(tgt){ a=angTo(f,tgt.f);
    if(f.isBot)a+=rand(-1,1)*(1-f.skill)*0.35;
  } else a=f.aim;
  f.aim=a;
  for(let i=0;i<w.pellets;i++){
    const aa=a+rand(-1,1)*w.spread+(w.pellets>1?(i-(w.pellets-1)/2)*0.09:0);
    S.bullets.push({x:f.x+Math.cos(a)*14,y:f.y+Math.sin(a)*14,
      vx:Math.cos(aa)*w.speed,vy:Math.sin(aa)*w.speed,
      dmg:w.dmg,range:w.range,traveled:0,owner:f});
  }
  if(S.bullets.length>160)S.bullets.splice(0,S.bullets.length-160);
  AudioSys.shoot(f.weapon);
}

function damage(t,dmg,src){
  if(!t.alive)return;
  if(t.healT>0){t.healT=0; if(!t.isBot)addBanner('HEAL INTERRUPTED','',1,9);}
  const absorbed=Math.min(t.armor,dmg*0.5);
  t.armor-=absorbed; t.hp-=(dmg-absorbed);
  if(!t.isBot)AudioSys.hurt();
  if(t.hp<=0){t.hp=0;t.alive=false;onKill(src,t);}
}

function onKill(src,victim){
  const sn=src&&src.alive!==undefined?src.name:'ZONE';
  addFeed((src?src.name:'THE ZONE')+' ✕ '+victim.name);
  if(src&&src!==victim)src.kills++;
  checkEnd();
}

function aliveCount(){let n=0;for(const f of S.fighters)if(f.alive)n++;return n;}
function humansAlive(){return S.fighters.filter(f=>!f.isBot&&f.alive);}

/* ---------------- zone ---------------- */
function zoneSetup(){
  const w=S.world;
  const cx=w.x+w.w/2, cy=w.y+w.h/2;
  const r=Math.max(w.w,w.h)*0.62;
  S.zone={x:cx,y:cy,r:r,tx:cx,ty:cy,tr:r,phase:0,mode:'wait',timer:ZONE_WAIT,
    sx:cx,sy:cy,sr:r};
}
function zoneUpdate(dt){
  const z=S.zone;
  z.timer-=dt;
  if(z.mode==='wait'&&z.timer<=0){
    z.phase++;
    z.sx=z.x;z.sy=z.y;z.sr=z.r;
    z.tr=Math.max(52,z.r*0.62);
    const maxOff=Math.max(0,z.r-z.tr);
    const a=Math.random()*TAU,d=Math.random()*maxOff;
    z.tx=z.sx+Math.cos(a)*d; z.ty=z.sy+Math.sin(a)*d;
    z.mode='shrink'; z.timer=ZONE_SHRINK;
    addBanner('ZONE SHRINKING','',1.6,8); AudioSys.zoneWarn();
  } else if(z.mode==='shrink'){
    const t=1-Math.max(0,z.timer)/ZONE_SHRINK;
    z.x=lerp(z.sx,z.tx,t); z.y=lerp(z.sy,z.ty,t); z.r=lerp(z.sr,z.tr,t);
    if(z.timer<=0){z.mode='wait';z.timer=ZONE_WAIT;}
  }
  const dps=ZONE_DPS[Math.min(z.phase,ZONE_DPS.length-1)]*(humansAlive().length===0?3:1);
  for(const f of S.fighters){
    if(!f.alive)continue;
    if(Math.hypot(f.x-z.x,f.y-z.y)>z.r){
      f.zoneAcc+=dt;
      if(f.zoneAcc>=0.5){f.zoneAcc=0;damage(f,dps*0.5,null);}
    } else f.zoneAcc=0;
  }
}

/* ---------------- bots ---------------- */
function botThink(b){
  const z=S.zone;
  const w=WEAPONS[b.weapon];
  const dz=Math.hypot(b.x-z.x,b.y-z.y)-z.r;
  const ne=nearestEnemy(b,900);
  if(dz>10){
    const a=angTo(b,z)+rand(-0.4,0.4);
    b.mvx=Math.cos(a);b.mvy=Math.sin(a);
    b.wantFire=!!ne&&ne.d<w.range*0.9;
    b.reactT=0;
    return;
  }
  if(b.hp<45&&b.medkits>0&&(!ne||ne.d>280)&&b.healT<=0){tryHeal(b);b.mvx=0;b.mvy=0;b.wantFire=false;return;}
  if(ne&&ne.d<w.range*1.15){
    const a=angTo(b,ne.f);
    const want=w.range*0.7;
    const radial=ne.d>want+30?1:(ne.d<want-60?-0.6:0);
    const px=Math.cos(a+Math.PI/2)*b.strafe, py=Math.sin(a+Math.PI/2)*b.strafe;
    b.mvx=Math.cos(a)*radial+px*0.8; b.mvy=Math.sin(a)*radial+py*0.8;
    const m=Math.hypot(b.mvx,b.mvy)||1;b.mvx/=m;b.mvy/=m;
    if(b.reactT<=0)b.reactT=lerp(0.65,0.12,b.skill);
    b.wantFire=true;
    if(Math.random()<0.02)b.strafe*=-1;
    return;
  }
  const nc=nearestCrate(b,620);
  if(nc){
    const a=angTo(b,nc.c)+rand(-0.2,0.2);
    b.mvx=Math.cos(a);b.mvy=Math.sin(a);b.wantFire=false;b.reactT=0;return;
  }
  const a=Math.random()*TAU;
  b.mvx=Math.cos(a)*0.5;b.mvy=Math.sin(a)*0.5;b.wantFire=false;b.reactT=0;
}

function botUpdate(b,dt){
  b.think-=1;
  if(b.think<=0){b.think=10;botThink(b);}
  if(b.reactT>0)b.reactT-=dt;
  if(b.wantFire&&b.reactT<=0)shoot(b);
}

/* ---------------- world gen ---------------- */
function inIsland(x,y,pad){
  const w=S.world,cx=w.x+w.w/2,cy=w.y+w.h/2;
  const rx=w.w*0.44-pad, ry=w.h*0.44-pad;
  const dx=(x-cx)/rx, dy=(y-cy)/ry;
  return dx*dx+dy*dy<1;
}
function randomIslandPt(pad){
  const w=S.world;
  for(let i=0;i<60;i++){
    const x=rand(w.x+40,w.x+w.w-40), y=rand(w.y+40,w.y+w.h-40);
    if(inIsland(x,y,pad||0))return{x,y};
  }
  return {x:w.x+w.w/2,y:w.y+w.h/2};
}

function startGame(mode){
  AudioSys.init();AudioSys.ui();
  S.mode=mode;S.fighters=[];S.bullets=[];S.crates=[];S.feed=[];S.banners=[];
  S.paused=false;S.overInfo=null;S.t=0;nextId=1;
  if(mode==='solo'){
    S.world={x:0,y:0,w:1000,h:1400};
    const pp=randomIslandPt(60);
    S.fighters.push(makeFighter(pp.x,pp.y,{side:0,name:'YOU',color:'#00ff9d',skill:1}));
    for(let i=0;i<11;i++){
      let p=randomIslandPt(60),tries=0;
      while(Math.hypot(p.x-pp.x,p.y-pp.y)<260&&tries<20){p=randomIslandPt(60);tries++;}
      const bad=i>=8;
      S.fighters.push(makeFighter(p.x,p.y,{bot:true,think:i%10,
        name:BOT_NAMES[i],color:BOT_COLORS[i],
        skill:bad?rand(0.25,0.45):rand(0.5,0.92)}));
    }
    for(let i=0;i<26;i++){const p=randomIslandPt(80);S.crates.push({x:p.x,y:p.y,opened:false});}
  } else {
    S.world={x:10,y:70,w:460,h:560};
    S.round=S.round||1;
    const p1=randomIslandPt(50),p2=randomIslandPt(50);
    S.fighters.push(makeFighter(p1.x,p1.y,{side:0,name:'P1',color:'#00ff9d',skill:1}));
    S.fighters.push(makeFighter(p2.x,p2.y,{side:1,name:'P2',color:'#ff5e7e',skill:1}));
    for(let i=0;i<8;i++){
      const p=randomIslandPt(50);
      S.fighters.push(makeFighter(p.x,p.y,{bot:true,think:i%10,
        name:BOT_NAMES[i],color:BOT_COLORS[i],skill:rand(0.35,0.85)}));
    }
    for(let i=0;i<14;i++){const p=randomIslandPt(60);S.crates.push({x:p.x,y:p.y,opened:false});}
  }
  for(const f of S.fighters)if(f.isBot)f.speed=95+f.skill*55;
  zoneSetup();
  S.state='play';
  addBanner(mode==='solo'?'DROP IN!':'ROUND '+S.round,'last one standing',2,10);
}

function startVersusMatch(){S.round=1;S.wins={p1:0,p2:0};startGame('versus');}

function backToMenu(){S.state='menu';S.mode=null;S.paused=false;AudioSys.ui();}

function checkEnd(){
  if(S.state!=='play')return;
  const alive=S.fighters.filter(f=>f.alive);
  if(S.mode==='solo'){
    const me=getPlayer(0);
    if(!me.alive){
      const place=alive.length+1;
      const best=parseInt(localStorage.getItem('drop_best')||'99',10);
      if(place<best)localStorage.setItem('drop_best',String(place));
      S.overInfo={win:false,place,kills:me.kills};
      S.state='over';AudioSys.lose();
    } else if(alive.length===1&&alive[0]===me){
      const w=parseInt(localStorage.getItem('drop_wins')||'0',10)+1;
      localStorage.setItem('drop_wins',String(w));
      localStorage.setItem('drop_best','1');
      S.overInfo={win:true,place:1,kills:me.kills};
      S.state='over';AudioSys.win();
    }
  } else {
    if(alive.length<=1){
      const winner=alive[0]||null;
      let label='DRAW';
      if(winner&&!winner.isBot){
        if(winner.side===0){S.wins.p1++;label='P1 TAKES ROUND '+S.round;}
        else {S.wins.p2++;label='P2 TAKES ROUND '+S.round;}
      } else if(winner){label=winner.name+' (BOT) TAKES ROUND '+S.round;}
      S.roundWinner=label;
      S.endTimer=3;S.state='roundEnd';
      AudioSys.win();
    }
  }
}

/* ---------------- feed & banners ---------------- */
function addFeed(t){S.feed.unshift({t,life:4});if(S.feed.length>5)S.feed.pop();}
function addBanner(text,sub,dur,prio){
  S.banners.push({text,sub:sub||'',life:dur||1.6,max:dur||1.6,prio:prio||5});
  S.banners.sort((a,b)=>b.prio-a.prio);
  if(S.banners.length>3)S.banners.length=3;
}

/* ---------------- update ---------------- */
function update(dt){
  S.t+=dt;
  for(const b of S.banners){b.life-=dt;}
  S.banners=S.banners.filter(b=>b.life>0);
  for(const f of S.feed){f.life-=dt;}
  S.feed=S.feed.filter(f=>f.life>0);

  if(S.state==='roundEnd'){
    S.endTimer-=dt;
    if(S.endTimer<=0){
      if(S.wins.p1>=2||S.wins.p2>=2||S.round>=5){
        S.state='matchEnd';
      } else { S.round++; startGame('versus'); }
    }
    return;
  }
  if(S.state!=='play'||S.paused)return;

  zoneUpdate(dt);

  // player input
  for(const f of S.fighters){
    if(!f.alive||f.isBot)continue;
    let mx=0,my=0,fire=false;
    if(S.mode==='solo'||f.side===0){
      if(keys.KeyW)my-=1; if(keys.KeyS)my+=1;
      if(keys.KeyA)mx-=1; if(keys.KeyD)mx+=1;
      if(S.mode==='solo'&&(keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight)){
        if(keys.ArrowUp)my-=1; if(keys.ArrowDown)my+=1;
        if(keys.ArrowLeft)mx-=1; if(keys.ArrowRight)mx+=1;
      }
      if(keys.Space)fire=true;
      if(keys.KeyE)tryHeal(f);
    }
    if(S.mode==='versus'&&f.side===1){
      if(keys.ArrowUp)my-=1; if(keys.ArrowDown)my+=1;
      if(keys.ArrowLeft)mx-=1; if(keys.ArrowRight)mx+=1;
      if(keys.Enter)fire=true;
      if(keys.Period)tryHeal(f);
    }
    for(const id in touches){
      const t=touches[id]; if(t.side!==(f.side===0?0:1))continue;
      if(t.role==='stick'){
        const dx=t.x-t.ox, dy=t.y-t.oy, d=Math.hypot(dx,dy);
        if(d>8){mx+=dx/d*Math.min(1,d/40);my+=dy/d*Math.min(1,d/40);}
      } else if(t.role==='fire')fire=true;
    }
    const m=Math.hypot(mx,my);
    if(m>0.01){f.mvx=mx/Math.max(1,m);f.mvy=my/Math.max(1,m);if(m>0.2)f.aim=Math.atan2(my,mx);}
    else {f.mvx=0;f.mvy=0;}
    if(f.healT>0){f.mvx*=0.4;f.mvy*=0.4;}
    if(fire)shoot(f);
  }

  // bots
  for(const f of S.fighters){ if(f.alive&&f.isBot)botUpdate(f,dt); }

  // movement + separation
  for(const f of S.fighters){
    if(!f.alive)continue;
    if(f.fireCd>0)f.fireCd-=dt;
    if(f.healT>0){f.healT-=dt;if(f.healT<=0)finishHeal(f);}
    const sp=f.isBot?f.speed:150;
    f.x+=f.mvx*sp*dt; f.y+=f.mvy*sp*dt;
    const w=S.world;
    f.x=clamp(f.x,w.x+14,w.x+w.w-14);
    f.y=clamp(f.y,w.y+14,w.y+w.h-14);
  }
  const fs=S.fighters;
  for(let i=0;i<fs.length;i++){const a=fs[i];if(!a.alive)continue;
    for(let j=i+1;j<fs.length;j++){const b=fs[j];if(!b.alive)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
      if(d<26&&d>0.01){const push=(26-d)/2/d;a.x-=dx*push;a.y-=dy*push;b.x+=dx*push;b.y+=dy*push;}
    }
  }

  // crates
  for(const f of S.fighters){
    if(!f.alive)continue;
    for(const c of S.crates){
      if(c.opened)continue;
      if(Math.hypot(f.x-c.x,f.y-c.y)<22){c.opened=true;applyLoot(f);}
    }
  }

  // bullets
  for(const b of S.bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.traveled+=Math.hypot(b.vx,b.vy)*dt;
    if(b.traveled>b.range){b.dead=true;continue;}
    for(const f of S.fighters){
      if(!f.alive||f===b.owner)continue;
      if(Math.hypot(f.x-b.x,f.y-b.y)<13){damage(f,b.dmg,b.owner);b.dead=true;break;}
    }
  }
  S.bullets=S.bullets.filter(b=>!b.dead);

  checkEnd();

  // camera (solo)
  if(S.mode==='solo'){
    const me=getPlayer(0);
    if(me){S.cam.x=clamp(me.x-W/2,0,S.world.w-W);S.cam.y=clamp(me.y-H/2,0,S.world.h-H);}
  } else {S.cam.x=0;S.cam.y=0;}
}

/* ---------------- render ---------------- */
function drawWorld(){
  const w=S.world,cx0=w.x+w.w/2,cy0=w.y+w.h/2;
  ctx.save();
  ctx.translate(-S.cam.x,-S.cam.y);
  // water
  ctx.fillStyle='#0d2b45';ctx.fillRect(w.x-60,w.y-60,w.w+120,w.h+120);
  // sand + grass island
  ctx.fillStyle='#6b5f3e';
  ctx.beginPath();ctx.ellipse(cx0,cy0,w.w*0.5,w.h*0.5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#1e4028';
  ctx.beginPath();ctx.ellipse(cx0,cy0,w.w*0.44,w.h*0.44,0,0,TAU);ctx.fill();
  // grass texture dots (deterministic-ish)
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(let i=0;i<40;i++){
    const a=(i*2.39996),rr=(i%7)/7;
    const gx=cx0+Math.cos(a)*w.w*0.44*rr, gy=cy0+Math.sin(a)*w.h*0.44*rr;
    ctx.fillRect(gx,gy,3,3);
  }
  // crates
  for(const c of S.crates){
    if(c.opened){ctx.fillStyle='#4a3a26';ctx.fillRect(c.x-9,c.y-9,18,18);}
    else{
      ctx.fillStyle='#8a6a3e';ctx.fillRect(c.x-10,c.y-10,20,20);
      ctx.fillStyle='#a8875a';ctx.fillRect(c.x-10,c.y-2,20,4);ctx.fillRect(c.x-2,c.y-10,4,20);
      ctx.strokeStyle='#5e4525';ctx.lineWidth=2;ctx.strokeRect(c.x-10,c.y-10,20,20);
    }
  }
  // zone
  const z=S.zone;
  ctx.save();
  ctx.strokeStyle='rgba(255,80,80,0.9)';ctx.lineWidth=3;ctx.setLineDash([10,8]);
  ctx.beginPath();ctx.arc(z.mode==='shrink'?z.tx:z.x,z.mode==='shrink'?z.ty:z.y,z.mode==='shrink'?z.tr:z.r,0,TAU);ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(120,220,255,0.85)';ctx.lineWidth=3;
  ctx.shadowColor='#78dcff';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.stroke();
  ctx.restore();
  // bullets
  for(const b of S.bullets){
    ctx.strokeStyle=b.owner?WEAPONS[b.owner.weapon].color:'#fff';
    ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-b.vx*0.02,b.y-b.vy*0.02);ctx.stroke();
  }
  // fighters
  for(const f of S.fighters){
    if(!f.alive)continue;
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(f.x,f.y+8,11,5,0,0,TAU);ctx.fill();
    // body
    ctx.fillStyle=f.color;
    ctx.beginPath();ctx.arc(f.x,f.y,11,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath();ctx.arc(f.x,f.y,11,0,TAU);ctx.fill();
    ctx.fillStyle=f.color;
    ctx.beginPath();ctx.arc(f.x,f.y-2,9,0,TAU);ctx.fill();
    // gun direction
    ctx.strokeStyle='#111';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(f.x,f.y);
    ctx.lineTo(f.x+Math.cos(f.aim)*17,f.y+Math.sin(f.aim)*17);ctx.stroke();
    // heal ring
    if(f.healT>0){
      ctx.strokeStyle='#7ee787';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(f.x,f.y,16,-Math.PI/2,-Math.PI/2+TAU*(1-f.healT/3));ctx.stroke();
    }
    // name + hp (bots / versus)
    if(f.isBot||S.mode==='versus'){
      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(f.x-20,f.y-30,40,5);
      ctx.fillStyle=f.hp>50?'#7ee787':(f.hp>25?'#ffd75e':'#ff5e5e');
      ctx.fillRect(f.x-20,f.y-30,40*clamp(f.hp/100,0,1),5);
      ctx.fillStyle='#fff';ctx.font='9px Courier New';ctx.textAlign='center';
      ctx.fillText(f.name,f.x,f.y-34);
    }
  }
  ctx.restore();
}

function drawHUD(){
  // top bar
  ctx.fillStyle='rgba(5,8,12,0.85)';ctx.fillRect(0,0,W,56);
  ctx.fillStyle='#e8f5ee';ctx.font='13px Courier New';ctx.textAlign='left';
  ctx.fillText('ALIVE '+aliveCount(),12,24);
  const z=S.zone;
  ctx.textAlign='center';
  if(z.mode==='shrink'){ctx.fillStyle='#ff5e5e';ctx.fillText('SHRINKING!',W/2,24);}
  else{ctx.fillStyle='#e8f5ee';ctx.fillText('ZONE '+fmtTime(z.timer),W/2,24);}
  ctx.fillStyle='#8fa89b';ctx.font='11px Courier New';
  ctx.fillText('PHASE '+(z.phase+1),W/2,42);
  ctx.textAlign='right';ctx.fillStyle='#e8f5ee';ctx.font='13px Courier New';
  if(S.mode==='solo'){
    const me=getPlayer(0);
    ctx.fillText('KILLS '+(me?me.kills:0),W-12,24);
  } else {
    ctx.fillText('R'+S.round+'  P1 '+S.wins.p1+' — '+S.wins.p2+' P2',W-12,24);
  }
  // kill feed
  ctx.textAlign='right';ctx.font='11px Courier New';
  S.feed.forEach((f,i)=>{
    ctx.fillStyle='rgba(232,245,238,'+clamp(f.life,0,1)*0.9+')';
    ctx.fillText(f.t,W-12,72+i*16);
  });
  // banners
  if(S.banners.length){
    const b=S.banners[0],a=clamp(b.life/0.4,0,1);
    ctx.textAlign='center';
    ctx.fillStyle='rgba(232,245,238,'+a+')';
    ctx.font='bold 26px Courier New';
    ctx.fillText(b.text,W/2,200);
    if(b.sub){ctx.font='13px Courier New';ctx.fillStyle='rgba(143,168,155,'+a+')';ctx.fillText(b.sub,W/2,224);}
  }
  if(S.mode==='solo')drawSoloHUD();else drawVersusHUD();
  // zone arrow when player outside (solo)
  if(S.mode==='solo'){
    const me=getPlayer(0),z2=S.zone;
    if(me&&me.alive&&Math.hypot(me.x-z2.x,me.y-z2.y)>z2.r){
      const sx=me.x-S.cam.x, sy=me.y-S.cam.y;
      const a=angTo(me,z2);
      const ax=clamp(sx+Math.cos(a)*60,30,W-30), ay=clamp(sy+Math.sin(a)*60,70,H-30);
      ctx.save();ctx.translate(ax,ay);ctx.rotate(a);
      ctx.fillStyle='#ff5e5e';
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
}

function drawSoloHUD(){
  const me=getPlayer(0);if(!me)return;
  // hp + armor
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(12,646,190,14);
  ctx.fillStyle=me.hp>50?'#7ee787':(me.hp>25?'#ffd75e':'#ff5e5e');
  ctx.fillRect(12,646,190*clamp(me.hp/100,0,1),14);
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(12,634,190,8);
  ctx.fillStyle='#7ecbff';ctx.fillRect(12,634,190*clamp(me.armor/100,0,1),8);
  ctx.fillStyle='#e8f5ee';ctx.font='11px Courier New';ctx.textAlign='left';
  ctx.fillText('HP '+Math.ceil(me.hp)+'  ARM '+Math.ceil(me.armor),12,678);
  ctx.fillText(WEAPONS[me.weapon].name+'   ✚×'+me.medkits,12,694);
  // touch buttons
  drawBtn(404,528,30,me.healT>0,'MED');
  drawBtn(404,618,48,false,'FIRE');
  // move stick
  for(const id in touches){const t=touches[id];
    if(t.role==='stick'&&t.side===0){
      ctx.strokeStyle='rgba(232,245,238,0.4)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(t.ox,t.oy,40,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(232,245,238,0.5)';
      ctx.beginPath();ctx.arc(t.ox+clamp(t.x-t.ox,-40,40),t.oy+clamp(t.y-t.oy,-40,40),16,0,TAU);ctx.fill();
    }
  }
  if(me.healT>0){
    ctx.fillStyle='#7ee787';ctx.font='bold 15px Courier New';ctx.textAlign='center';
    ctx.fillText('HEALING '+me.healT.toFixed(1)+'s',W/2,600);
  }
}

function drawVersusHUD(){
  const p1=getPlayer(0),p2=getPlayer(1);
  // hp bars
  if(p1){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(8,644,150,12);
    ctx.fillStyle='#00ff9d';ctx.fillRect(8,644,150*clamp(p1.hp/100,0,1),12);
    ctx.fillStyle='#e8f5ee';ctx.font='10px Courier New';ctx.textAlign='left';
    ctx.fillText('P1 '+Math.ceil(p1.hp)+' ✚'+p1.medkits,8,672);}
  if(p2){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W-158,644,150,12);
    ctx.fillStyle='#ff5e7e';ctx.fillRect(W-158,644,150*clamp(p2.hp/100,0,1),12);
    ctx.fillStyle='#e8f5ee';ctx.font='10px Courier New';ctx.textAlign='right';
    ctx.fillText('✚'+p2.medkits+' '+Math.ceil(p2.hp)+' P2',W-8,672);}
  ctx.textAlign='center';ctx.fillStyle='#8fa89b';ctx.font='11px Courier New';
  ctx.fillText('ROUND '+S.round+' / 5',W/2,664);
  // touch buttons
  drawBtn(64,664,34,false,'F1');drawBtn(140,664,24,false,'M1');
  drawBtn(416,664,34,false,'F2');drawBtn(340,664,24,false,'M2');
  for(const id in touches){const t=touches[id];
    if(t.role==='stick'){
      ctx.strokeStyle='rgba(232,245,238,0.35)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(t.ox,t.oy,34,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(232,245,238,0.45)';
      ctx.beginPath();ctx.arc(t.ox+clamp(t.x-t.ox,-34,34),t.oy+clamp(t.y-t.oy,-34,34),13,0,TAU);ctx.fill();
    }
  }
}

function drawBtn(x,y,r,active,label){
  ctx.fillStyle=active?'rgba(126,231,135,0.5)':'rgba(232,245,238,0.12)';
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(232,245,238,0.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();
  ctx.fillStyle='#e8f5ee';ctx.font=(r>30?'13px':'10px')+' Courier New';ctx.textAlign='center';
  ctx.fillText(label,x,y+4);
}

function drawMenu(){
  ctx.fillStyle='#05070c';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#00ff9d';ctx.font='bold 64px Courier New';
  ctx.shadowColor='#00ff9d';ctx.shadowBlur=24;
  ctx.fillText('DROP',W/2,170);ctx.shadowBlur=0;
  ctx.fillStyle='#8fa89b';ctx.font='14px Courier New';
  ctx.fillText('a 2017 story — last one standing',W/2,205);
  ctx.fillText('loot up. dodge the zone. survive.',W/2,228);
  menuBtn(W/2,330,'SOLO — you vs 11 bots');
  menuBtn(W/2,410,'VERSUS — 2P + 8 bots');
  ctx.fillStyle='#54655c';ctx.font='12px Courier New';
  ctx.fillText('solo: WASD move · SPACE fire · E medkit',W/2,500);
  ctx.fillText('versus: P1 WASD+SPACE · P2 arrows+ENTER',W/2,522);
  ctx.fillText('touch: left stick moves · FIRE auto-aims',W/2,544);
  const w=localStorage.getItem('drop_wins')||'0', bp=localStorage.getItem('drop_best');
  ctx.fillStyle='#8fa89b';
  ctx.fillText('wins '+w+(bp&&bp!=='99'?' · best #'+bp:''),W/2,590);
  ctx.fillStyle='#54655c';ctx.font='11px Courier New';
  ctx.fillText('M mute · P pause',W/2,640);
}
function menuBtn(cx,y,label){
  ctx.fillStyle='rgba(0,255,157,0.08)';ctx.fillRect(cx-190,y-30,380,60);
  ctx.strokeStyle='#00ff9d';ctx.lineWidth=2;ctx.strokeRect(cx-190,y-30,380,60);
  ctx.fillStyle='#00ff9d';ctx.font='15px Courier New';ctx.textAlign='center';
  ctx.fillText(label,cx,y+5);
}

function drawOver(){
  drawWorld();drawHUD();
  ctx.fillStyle='rgba(5,7,12,0.8)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  const o=S.overInfo;
  if(o.win){ctx.fillStyle='#00ff9d';ctx.font='bold 34px Courier New';
    ctx.shadowColor='#00ff9d';ctx.shadowBlur=18;
    ctx.fillText('LAST ONE STANDING',W/2,300);ctx.shadowBlur=0;}
  else{ctx.fillStyle='#ff5e5e';ctx.font='bold 34px Courier New';ctx.fillText('ELIMINATED',W/2,300);}
  ctx.fillStyle='#e8f5ee';ctx.font='16px Courier New';
  ctx.fillText('placement #'+o.place+' · '+o.kills+' kills',W/2,345);
  ctx.fillStyle='#8fa89b';ctx.font='13px Courier New';
  ctx.fillText('tap to continue',W/2,420);
}
function drawRoundEnd(){
  drawWorld();drawHUD();
  ctx.fillStyle='rgba(5,7,12,0.7)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.fillStyle='#ffd75e';ctx.font='bold 26px Courier New';
  ctx.fillText(S.roundWinner||'',W/2,330);
  ctx.fillStyle='#e8f5ee';ctx.font='16px Courier New';
  ctx.fillText('P1 '+S.wins.p1+' — '+S.wins.p2+' P2',W/2,370);
}
function drawMatchEnd(){
  drawWorld();drawHUD();
  ctx.fillStyle='rgba(5,7,12,0.85)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  let t='DRAW',c='#8fa89b';
  if(S.wins.p1>S.wins.p2){t='P1 WINS THE MATCH';c='#00ff9d';}
  else if(S.wins.p2>S.wins.p1){t='P2 WINS THE MATCH';c='#ff5e7e';}
  ctx.fillStyle=c;ctx.font='bold 30px Courier New';ctx.fillText(t,W/2,330);
  ctx.fillStyle='#e8f5ee';ctx.font='16px Courier New';
  ctx.fillText('P1 '+S.wins.p1+' — '+S.wins.p2+' P2',W/2,372);
  ctx.fillStyle='#8fa89b';ctx.font='13px Courier New';
  ctx.fillText('tap to continue',W/2,430);
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(S.state==='menu'){drawMenu();return;}
  if(S.state==='over'){drawOver();return;}
  if(S.state==='roundEnd'){drawRoundEnd();return;}
  if(S.state==='matchEnd'){drawMatchEnd();return;}
  drawWorld();drawHUD();
  if(S.paused){
    ctx.fillStyle='rgba(5,7,12,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e8f5ee';ctx.font='bold 28px Courier New';ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,360);
    ctx.font='13px Courier New';ctx.fillStyle='#8fa89b';
    ctx.fillText('P to resume',W/2,392);
  }
}

/* ---------------- GAME hooks ---------------- */
window.GAME={
  get state(){return S.state;},
  get mode(){return S.mode;},
  get alive(){return aliveCount();},
  get zonePhase(){return S.zone.phase;},
  get wins(){return {p1:S.wins.p1,p2:S.wins.p2};},
  get round(){return S.round;},
  startMode(m){ if(m==='solo')startGame('solo'); else if(m==='versus')startVersusMatch(); },
  _s:S
};

/* ---------------- main loop ---------------- */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  const step=1/60;let n=0;
  while(acc>=step&&n<5){update(step);acc-=step;n++;}
  render();
}
requestAnimationFrame(frame);
</script>
