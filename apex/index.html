<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>APEX — beaver vs lumberjack</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden;
    font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#05070c;touch-action:none;}
  #touch{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
    display:none;justify-content:flex-end;padding:0 16px;pointer-events:none;z-index:5;}
  #touch.on{display:flex;}
  #touch .grp{display:flex;gap:16px;}
  #touch button{pointer-events:auto;width:76px;height:76px;border-radius:50%;
    border:2px solid rgba(150,180,210,.5);background:rgba(70,90,120,.35);color:#cfe0f2;

  #touch button:active{background:rgba(120,160,200,.55);}
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);
    text-align:center;color:#3a3f45;font-size:11px;letter-spacing:.14em;pointer-events:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="grp"><button id="tJ">JMP</button></div>
</div>
<div id="hint">v4.2</div>
<script>
/* ================= APEX v4 =================
   1981, inverted: YOU ARE THE BEAVER. Steal the lumberjack's stacked logs, drop them on him.
   Or climb as the lumberjack. Or both, same screen.
   Pixel-native. Mobile-first. Everything original. */
/* ---------- pixel infra ---------- */
const W=480, H=720, PX=2;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const buf=document.createElement('canvas'), bctx=buf.getContext('2d');
function sizeBuf(){ buf.width=W*PX; buf.height=H*PX; }
sizeBuf();
function fit(){
  const vv=window.visualViewport;
  const aw=Math.max(1,(vv?vv.width:window.innerWidth)-8);
  const ah=Math.max(1,(vv?vv.height:window.innerHeight)-44);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const s=Math.min(aw/W,ah/H);
  const cw=Math.max(1,Math.floor(W*s)), ch=Math.max(1,Math.floor(H*s));
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  ctx.setTransform(dpr*cw/W,0,0,dpr*ch/H,0,0);
  sizeBuf();
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,80));
if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);
fit();
function mkSprite(w,h,fn){
  const c=document.createElement('canvas'); c.width=w*PX; c.height=h*PX;
  const g=c.getContext('2d'); g.scale(PX,PX); g.imageSmoothingEnabled=false;
  fn(g); return c;
}
function spr(img,x,y,tint){
  if(!tint){ bctx.drawImage(img,Math.round(x),Math.round(y),img.width/PX,img.height/PX); return; }
  const t=document.createElement('canvas'); t.width=img.width; t.height=img.height;
  const tg=t.getContext('2d'); tg.drawImage(img,0,0);
  tg.globalCompositeOperation='source-in'; tg.fillStyle=tint; tg.fillRect(0,0,t.width,t.height);
  bctx.drawImage(t,Math.round(x),Math.round(y),img.width/PX,img.height/PX);
}

function drawPixText(str,dx,y0,u){
  let cx=dx;
  for(const ch of str){
    const gl=ch===' '?null:(FONT5X7[ch]||FONT5X7['?']);
    if(gl)for(let r=0;r<gl.length;r++){const row=gl[r];
      for(let c=0;c<5;c++)if(row[c]==='1')bctx.fillRect(cx+c*u,y0+r*u,u,u);}
    cx+=ch===' '?4*u:6*u;
  }
}
function text(str,x,y,font,color,align){
  str=String(str).toUpperCase();
  const m=/(\d+)/.exec(font||''); const size=m?+m[1]:16;
  const u=Math.max(PX,Math.round(size/7/PX)*PX);
  let w=0; for(const ch of str) w+=ch===' '?4*u:6*u;
  let dx=align==='right'?x-w:align==='center'?x-w/2:x;
  dx=Math.round(dx); const y0=Math.round(y-3.5*u);
  bctx.fillStyle=color; drawPixText(str,dx,y0,u);
}
function pixW(str,font){
  const m=/(\d+)/.exec(font||''); const size=m?+m[1]:16;
  const u=Math.max(PX,Math.round(size/7/PX)*PX);
  let w=0; for(const ch of String(str).toUpperCase()) w+=ch===' '?4*u:6*u;
  return w;
}
/* ---------- audio: tiny synth ---------- */
let AC=null, muted=false;
function audio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume();
}
function beep(f0,f1,dur,type,vol){
  if(!AC||muted) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f0,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),AC.currentTime+dur);
    g.gain.setValueAtTime(vol||0.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function noiseBurst(dur,vol,lp){
  if(!AC||muted) return;
  try{
    const n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=AC.createBufferSource(); s.buffer=b;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||3000;
    const g=AC.createGain(); g.gain.value=vol||0.05;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  }catch(e){}
}
const sJump=()=>beep(300,520,0.12,'square',0.04);
const sScore=()=>beep(880,1320,0.08,'square',0.035);
const sHit=()=>{beep(160,60,0.25,'sawtooth',0.07);noiseBurst(0.15,0.06,1200);};
const sDeath=()=>beep(220,40,0.5,'sawtooth',0.07);
const sClear=()=>{beep(523,523,0.1,'square',0.05);setTimeout(()=>beep(659,659,0.1,'square',0.05),110);setTimeout(()=>beep(784,784,0.16,'square',0.05),220);};
const sWin=()=>sClear();
const sAlarm=()=>{for(let i=0;i<3;i++)setTimeout(()=>beep(660,660,0.12,'square',0.06),i*160);};
const sUI=()=>beep(440,440,0.05,'square',0.03);
const sTick=()=>noiseBurst(0.03,0.012,5000);
const sBounce=()=>beep(180,120,0.07,'triangle',0.03);
const sCrack=()=>{noiseBurst(0.2,0.09,900);beep(90,40,0.25,'triangle',0.08);};
let gnawSndT=0;
const sGnaw=()=>{ if(time-gnawSndT>0.09){ gnawSndT=time; noiseBurst(0.05,0.05,700);} };
/* ---------- helpers ---------- */
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
/* ---------- tower geometry (tuned, ported) ---------- */
const GY=[630,540,450,360,270,180];
let GDIR=[1,-1,1,-1,1,-1];
const GX0=30, GX1=450, TILT=14;
let GAPC=240; const GAPH=35;
let LX=[390,90,390,90,90];
const ladders=LX.map((x,i)=>({x,g0:i,g1:i+1}));
function surfY(i,x){ return GY[i]+TILT*GDIR[i]*(x-240)/210; }
function inGap(i,x){ return i>=1&&i<=4&&Math.abs(x-GAPC)<GAPH; }
function onGirderX(i,x){ return x>=GX0&&x<=GX1&&!inGap(i,x); }
const GRAV=1500, RUN=172, JUMPV=520, CLIMBV=135, ROLL_BASE=132;
/* log stacks live on the top girder — the beaver's turf */
let STACKX=[110,220,320,420];
const GNAW_T=1.15, REGROW_T=3.2;
/* ---------- procedural tower: new layout every stage ---------- */
function genTower(){
  // pick the log shaft side — logs drop from the top girder here
  const left=Math.random()<0.5, shaftX=left?90:390;
  LX[4]=shaftX; GDIR[5]=left?-1:1;
  for(let i=0;i<5;i++) GDIR[i]=Math.random()<0.5?-1:1;
  GAPC=Math.round(150+Math.random()*180); // middle gap wanders
  for(let i=0;i<4;i++){ // ladders dodge the gap so the jack can climb
    let x=240, guard=0;
    do{ x=Math.round(60+Math.random()*360); guard++; }
    while(guard<60&&Math.abs(x-GAPC)<GAPH+24);
    LX[i]=x;
  }
  const n=3+((Math.random()*2)|0); // 3-4 stacks, on the shaft side
  STACKX=[];
  const lo=left?140:60, hi=left?420:340;
  for(let i=0;i<n;i++){
    const x=Math.round(lo+(hi-lo)*(i+0.5)/n+(Math.random()*40-20));
    STACKX.push(Math.max(lo,Math.min(hi,x)));
  }
}
/* ---------- pre-baked backdrop ---------- */
const sky=mkSprite(W,H,(g)=>{
  g.fillStyle='#070b16'; g.fillRect(0,0,W,H);
  g.fillStyle='#0a1022'; g.fillRect(0,H*0.35,W,H*0.65);
  g.fillStyle='#0d1526'; g.fillRect(0,H*0.6,W,H*0.4);
  // stars
  g.fillStyle='#cfe0ff';
  for(let i=0;i<70;i++){ const x=(i*67)%W, y=(i*41)%Math.floor(H*0.5); if((i*13)%3) g.fillRect(x,y,2,2); }
  // moon
  g.fillStyle='#e8ecff'; g.fillRect(392,46,26,26);
  // far pines
  g.fillStyle='#0e1a24';
  for(let x=-10;x<W+20;x+=34){ const h=52+((x*7)%30);
    for(let r=0;r<3;r++){ const w=26-r*7; g.fillRect(x-w/2,H*0.62-h+r*14,w,14); } }
  // near pines
  g.fillStyle='#12241e';
  for(let x=6;x<W+20;x+=52){ const h=70+((x*11)%36);
    for(let r=0;r<4;r++){ const w=34-r*8; g.fillRect(x-w/2,H*0.78-h+r*15,w,15); }
    g.fillRect(x-3,H*0.78-h,6,h); }
});
const vig=mkSprite(W,H,(g)=>{
  const gr=g.createRadialGradient(W/2,H/2,H*0.30,W/2,H/2,H*0.75);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.40)');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
});
/* ---------- sprites (code-drawn, pixel) ---------- */
function drawGirders(){
  for(let i=0;i<6;i++){
    const segs=[];
    if(i>=1&&i<=4) segs.push([GX0,GAPC-GAPH],[GAPC+GAPH,GX1]);
    else segs.push([GX0,GX1]);
    for(const s of segs){ const x0=s[0], x1=s[1];
      for(let x=x0;x<x1;x+=4){
        const y=Math.round(surfY(i,x));
        bctx.fillStyle='#5e3a10'; bctx.fillRect(x,y-3,4,10);
        bctx.fillStyle='#8a5a20'; bctx.fillRect(x,y-3,4,3);
      }
      bctx.fillStyle='#4a2c10';
      for(let x=x0+44;x<x1-6;x+=92){
        const y=Math.round(surfY(i,x));
        bctx.fillRect(x,y+7,5,24);
      }
    }
  }
}
function drawLadders(){
  bctx.fillStyle='#7a5a30';
  for(const L of ladders){
    const yB=Math.round(surfY(L.g0,L.x)), yT=Math.round(surfY(L.g1,L.x));
    bctx.fillRect(L.x-8,yT,4,yB-yT);
    bctx.fillRect(L.x+4,yT,4,yB-yT);
    for(let y=yT+6;y<yB-4;y+=12) bctx.fillRect(L.x-8,y,16,4);
  }
}
function drawStack(t){
  const x=Math.round(t.x), gy=t.gy!==undefined?Math.round(t.gy):Math.round(surfY(5,x));
  const shake=t.gnaw>0?Math.sin(time*44)*t.gnaw*3:0;
  const sx=x+Math.round(shake);
  const pLog=(lx,ly,w)=>{ // one horizontal log in the pile
    bctx.fillStyle='#8a5a20'; bctx.fillRect(lx,ly,w,10);
    bctx.fillStyle='#c89840'; bctx.fillRect(lx,ly,w,3);
    bctx.fillStyle='#5e3a10'; bctx.fillRect(lx,ly,4,10);
    bctx.fillStyle='#4a2c10'; bctx.fillRect(lx,ly+8,w,2);
  };
  if(t.stage===0){ // looted bare — pallet + sawdust
    bctx.fillStyle='#4a3520'; bctx.fillRect(sx-16,gy-4,32,4);
    bctx.fillStyle='#c89840';
    bctx.fillRect(sx-12,gy-6,4,2); bctx.fillRect(sx+4,gy-7,5,2); bctx.fillRect(sx-2,gy-5,3,2);
    return;
  }
  if(t.stage===1){ // partial — 2 logs
    pLog(sx-22,gy-10,24); pLog(sx+2,gy-10,22);
    return;
  }
  let shear=0;
  if(t.falling>0){ const f=1-t.falling/0.45; shear=f*f*30*GDIR[5]; }
  const fx=sx+Math.round(shear);
  pLog(fx-27,gy-10,18); pLog(fx-9,gy-10,18); pLog(fx+9,gy-10,18); // bottom 3
  pLog(fx-18,gy-20,18); pLog(fx,gy-20,18); // top 2
  if(t.gnaw>0.04){ // the beaver worries the bottom log loose
    bctx.fillStyle='#3a2410';
    bctx.fillRect(sx-9,gy-10,Math.round(2+t.gnaw*6),10);
  }
  if(t.highlight){ // targeted stack pulses
    const p=2+Math.floor(time*6)%2;
    bctx.fillStyle='#ffd75a';
    bctx.fillRect(sx-30,gy-26,60,p); bctx.fillRect(sx-30,gy-6,60,p);
  }
}
function drawLog(b){
  const fr=Math.abs(Math.floor(b.rot*1.6))%3;
  bctx.save(); bctx.translate(Math.round(b.x),Math.round(b.y));
  bctx.fillStyle='#6e4a1a'; bctx.fillRect(-12,-5,24,10);
  bctx.fillStyle='#8a5a20'; bctx.fillRect(-12,-5,24,3);
  bctx.fillStyle='#4a2c10'; bctx.fillRect(-12,-5,3,10); bctx.fillRect(9,-5,3,10);
  bctx.fillStyle='#c89840'; bctx.fillRect(-11,-3,1,6); bctx.fillRect(10,-3,1,6);
  bctx.fillStyle='#4a2c10';
  for(let k=0;k<3;k++) bctx.fillRect(-6+k*6+fr*2-2,-5,2,10);
  bctx.restore();
}
function drawBeaver(b){
  const gnaw=b.gnawMode;
  bctx.save(); bctx.translate(Math.round(b.x),Math.round(b.y)); bctx.scale(b.face,1);
  const B='#7a4e1e', BD='#4a2c10', BL='#9a6a30';
  bctx.fillStyle=BD; // paddle tail
  bctx.fillRect(-18,-7,10,6); bctx.fillRect(-20,-6,3,4);
  bctx.fillStyle=BD; // feet
  if(!gnaw&&Math.abs(b.vx)>20){ const ph=Math.floor(time*10)%2;
    if(ph){ bctx.fillRect(-8,-3,6,3); bctx.fillRect(4,-5,6,3); }
    else { bctx.fillRect(-8,-5,6,3); bctx.fillRect(4,-3,6,3); }
  } else { bctx.fillRect(-8,-3,6,3); bctx.fillRect(4,-3,6,3); }
  if(gnaw){
    bctx.fillStyle=B; bctx.fillRect(-9,-13,17,11);
    bctx.fillStyle=BL; bctx.fillRect(5,-12,9,9);
    const bob=Math.floor(time*18)%2;
    bctx.fillStyle='#fff'; bctx.fillRect(12,-6+bob,3,4); bctx.fillRect(15,-6+bob,2,4);
    bctx.fillStyle='#1a1a1a'; bctx.fillRect(8,-10,2,2);
  } else {
    bctx.fillStyle=B; bctx.fillRect(-9,-14,19,12);
    bctx.fillStyle=BL; bctx.fillRect(6,-17,10,10);
    bctx.fillStyle='#fff'; bctx.fillRect(14,-10,2,4); bctx.fillRect(16,-10,2,4);
    bctx.fillStyle='#1a1a1a'; bctx.fillRect(10,-14,2,2);
    bctx.fillStyle=B; bctx.fillRect(4,-19,4,3);
  }
  bctx.restore();
}
function drawJack(c){
  if(!c) return;
  if(c.inv>0&&Math.floor(time*12)%2===0) return;
  const flash=c.stun>0&&Math.floor(time*16)%2===0;
  bctx.save(); bctx.translate(Math.round(c.x),Math.round(c.y)); bctx.scale(c.face,1);
  const P=flash?'#ff5a5a':'#2a4a7a', T=flash?'#ff5a5a':'#b03030', TD=flash?'#ff5a5a':'#701818';
  bctx.fillStyle=P;
  if(c.climbing){ bctx.fillRect(-5,-12,4,12); bctx.fillRect(1,-12,4,12); }
  else if(c.onGround&&Math.abs(c.vx)>10){ const ph=Math.floor(time*10)%2;
    if(ph){ bctx.fillRect(-6,-9,5,9); bctx.fillRect(2,-12,5,12); }
    else { bctx.fillRect(-6,-12,5,12); bctx.fillRect(2,-9,5,9); }
  } else if(!c.onGround&&!c.climbing){ bctx.fillRect(-7,-8,5,8); bctx.fillRect(2,-8,5,8); }
  else { bctx.fillRect(-5,-12,4,12); bctx.fillRect(1,-12,4,12); }
  bctx.fillStyle=T; bctx.fillRect(-7,-26,14,15);
  bctx.fillStyle=TD; bctx.fillRect(-7,-20,14,2); bctx.fillRect(-1,-26,2,15);
  bctx.fillStyle=T;
  if(c.climbing){ bctx.fillRect(-10,-40,4,15); bctx.fillRect(6,-40,4,15); }
  else { bctx.fillRect(5,-25,4,11); bctx.fillRect(-9,-25,4,8); }
  bctx.fillStyle='#e8b88a'; bctx.fillRect(-4,-34,9,8);
  bctx.fillStyle='#6a4a20'; bctx.fillRect(-4,-30,9,5);

function updateBeaver(dt){
  const b=beaver, ai=(mode==='climb');
  const spd=ai?aiBeavSpd():BEAV_SPD;
  b.gnawMode=false;
  let T=null;
  if(ai) T=aiStack;
  else{
    if(holdPtr&&holdPtr.stack.stage===2&&holdPtr.stack.falling<=0) T=holdPtr.stack;
    else if(keyGnaw) T=nearestTree(b.x,70);
  }
  for(const t of stacks) t.highlight=false;
  if(T) T.highlight=true;
  let mv=0;
  if(T){
    const dx=T.x-b.x;
    if(Math.abs(dx)>22) mv=Math.sign(dx);
    b.face=dx>=0?1:-1;
  }else if(!ai){
    if(ctlL)mv-=1; if(ctlR)mv+=1;
  }
  b.vx=mv*spd;
  b.x=clamp(b.x+b.vx*dt,GX0+24,GX1-24);
  if(mv!==0)b.face=mv;
  b.y=surfY(5,b.x);
  if(T&&Math.abs(T.x-b.x)<=26){
    b.gnawMode=true; b.face=T.x>=b.x?1:-1;
    T.gnaw+=dt/gnawTime(); sGnaw();
    if(Math.random()<10*dt) sawdust(T.x+b.face*8,surfY(5,T.x)-8);
    if(T.gnaw>=1) fellStack(T);
  }else{
    for(const t of stacks) t.gnaw=Math.max(0,t.gnaw-dt*(t===T?0.5:2)/gnawTime());
  }
  for(const t of stacks){
    if(t.falling>0){
      t.falling-=dt;
      if(t.falling<=0){ spawnLog(t); t.stage=0; t.growT=0; t.gnaw=0; }
    }else if(t.stage<2){
      t.growT+=dt;
      t.stage=t.growT>REGROW_T?2:t.growT>REGROW_T*0.4?1:0;
    }
  }
}

}

/* ---------- logs (ported barrel physics) ---------- */
function updateLogs(dt){
  let anyRoll=false;
  for(let i=logs.length-1;i>=0;i--){
    const b=logs[i];
    if(b.state==='roll'){
      anyRoll=true;
      b.x+=b.vx*dt; b.rot+=b.vx*dt/b.r;
      // ladder shafts: on the top girder the shaft is ladder 4 (LX[4]) — logs always drop;
      // lower girders keep the classic gamble
      const shaftX=b.girder>=5?LX[4]:LX[b.girder];
      const atShaft=Math.abs(b.x-shaftX)<10;
      if(atShaft&&(b.girder>=5||Math.random()<1.1*dt)){ b.state='fall'; b.vy=60; b.y+=3; }
      else if(!onGirderX(b.girder,b.x)){ b.state='fall'; b.vy=0; }
      else b.y=surfY(b.girder,b.x)-b.r;
    }else{
      b.vy+=GRAV*dt;
      const py=b.y;
      b.x+=b.vx*0.25*dt; b.y+=b.vy*dt; b.rot+=b.vx*dt/b.r;
      for(let j=5;j>=0;j--){
        if(!onGirderX(j,b.x))continue;
        const s=surfY(j,b.x)-b.r;
        if(py<=s&&b.y>=s&&b.vy>0){
          if(b.vy>320){ b.y=s; b.vy=-b.vy*0.35; sBounce(); }
          else{ b.y=s; b.vy=0; b.state='roll'; b.girder=j; b.vx=Math.abs(b.vx)*GDIR[j]||ROLL_BASE*GDIR[j]; sBounce(); }
          break;
        }
      }
    }
    if(b.y>H+40||b.x<-40||b.x>W+40) logs.splice(i,1);
  }
  tickT-=dt;
  if(anyRoll&&tickT<=0){ sTick(); tickT=0.15; }
}

/* ---------- lumberjack physics (ported) ---------- */
function startClimb(c,li,down){ c.climbing=true; c.ladder=li; c.x=ladders[li].x; c.vx=0; c.vy=0; }
function stepJack(c,ctl,dt,isAI){
  if(c.stun>0)c.stun-=dt;
  if(c.inv>0)c.inv-=dt;
  if(c.climbing){
    const L=ladders[c.ladder];
    const mv=(ctl.down?1:0)-(ctl.up?1:0);
    if(c.stun<=0)c.y+=mv*(isAI?aiClimbV():CLIMBV)*dt;
    c.x=L.x;
    if(mv<0&&c.y<=surfY(L.g1,L.x)+4){ c.y=surfY(L.g1,L.x); c.girder=L.g1; c.climbing=false; c.ladder=-1; c.onGround=true; c.vy=0; }
    else if(mv>0&&c.y>=surfY(L.g0,L.x)-2){ c.y=surfY(L.g0,L.x); c.girder=L.g0; c.climbing=false; c.ladder=-1; c.onGround=true; c.vy=0; }
    return;
  }
  const sp=isAI?aiSpeed():RUN;
  c.vx=((ctl.right?1:0)-(ctl.left?1:0))*(c.stun>0?0:sp);
  if(c.vx!==0)c.face=c.vx>0?1:-1;
  const jEdge=ctl.jump&&!c.jumpPrev;
  c.jumpPrev=!!ctl.jump;
  if(jEdge&&c.onGround&&c.stun<=0){ c.vy=-JUMPV; c.onGround=false; if(!isAI||Math.random()<0.5)sJump(); }
  c.vy+=GRAV*dt;
  const py=c.y;
  c.x=clamp(c.x+c.vx*dt,18,W-18);
  c.y+=c.vy*dt;
  if(c.vy>=0){
    for(let j=5;j>=0;j--){
      if(!onGirderX(j,c.x))continue;
      const s=surfY(j,c.x);
      if(py<=s+1&&c.y>=s){
        if(c.vy>380)burst(c.x,s,7,'#7d8aa0');
        c.y=s; c.vy=0; c.onGround=true; c.girder=j;
        break;
      }
    }
  }
  if(c.onGround&&!onGirderX(c.girder,c.x))c.onGround=false;
  if(c.stun<=0&&c.onGround){
    if(ctl.up&&c.girder<5&&Math.abs(c.x-LX[c.girder])<15)startClimb(c,c.girder,false);
    else if(ctl.down&&c.girder>0&&Math.abs(c.x-LX[c.girder-1])<15)startClimb(c,c.girder-1,true);
  }
}
/* ---------- AI lumberjack (ported) ---------- */
function aiControl(c,dt){
  aiThinkT-=dt;
  if(aiThinkT<=0){
    aiThinkT=0.12;
    aiPlan.left=aiPlan.right=aiPlan.up=aiPlan.down=aiPlan.jump=false;
    if(c.stun>0)return aiPlan;
    if(c.climbing){ aiPlan.up=true; return aiPlan; }
    if(c.girder<5){
      const tx=LX[c.girder], dx=tx-c.x;
      if(dx<-7)aiPlan.left=true; else if(dx>7)aiPlan.right=true;
      else if(c.onGround)aiPlan.up=true;
      const dirS=aiPlan.right?1:aiPlan.left?-1:0;
      if(dirS!==0&&c.onGround&&!onGirderX(c.girder,c.x+dirS*30))aiPlan.jump=true;
    }
    for(const b of logs){
      if(b.girder!==c.girder||b.state!=='roll')continue;
      const approaching=(b.vx>0&&b.x<c.x)||(b.vx<0&&b.x>c.x);
      const d=Math.abs(b.x-c.x);
      if(approaching&&d<120&&c.onGround){
        if(d<52+Math.random()*42&&Math.random()>aiWhiff())aiPlan.jump=true;
      }
    }
  }
  return aiPlan;
}

}
/* ---------- update ---------- */
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; p.t+=dt;
    if(p.t>p.life)parts.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i];
    f.y-=34*dt; f.t+=dt; if(f.t>1.1)floats.splice(i,1); }
}
function update(dt){
  time+=dt;
  if(bannerT>0)bannerT-=dt;
  if(shake>0)shake-=dt*3;
  updateParticles(dt);
  if(state==='menu'||state==='howto'||state==='matchEnd'||state==='gameOver'||state==='campWin'){ stateT+=dt; return; }
  stateT+=dt;
  if(state==='serve'){ if(stateT>1.6)state='play'; return; }
  if(state==='stageClear'){
    if(stateT>2.0){
      const last=(mode==='apex'&&stage>=APEX_STAGES)||(mode==='climb'&&stage>=CLIMB_STAGES);
      if(last){ if(mode==='apex')saveApexBest(); else if(score>best){best=score;try{localStorage.setItem('apex_best',best);}catch(_){}}
        state='campWin'; stateT=0; sWin(); confetti(60);
      }else{ stage++; resetStage(); banner='STAGE '+stage; bannerT=1.6; state='serve'; stateT=0; }
    }
    return;
  }
  if(state==='roundEnd'){ if(stateT>1.8)nextRound(roundWinner); return; }
  if(paused||state!=='play')return;
  if(mode==='apex'){ matchT+=dt; stageT+=dt; }
  if(mode==='versus'){ roundT-=dt; if(roundT<=0){roundWinner='p1';state='roundEnd';stateT=0;sWin();return;} }
  const bc=beaverControl(); ctlL=bc.left; ctlR=bc.right; keyGnaw=bc.gnaw;
  if(mode==='climb')aiBeaver(dt);
  updateBeaver(dt);
  const c=jack;
  if(c){
    if(mode==='apex')stepJack(c,aiControl(c,dt),dt,true);
    else stepJack(c,jackControl(),dt,false);
    if(c.y>H+40)jackFell();
    else if(c.onGround&&c.girder===5)jackReachedTop();
  }
  updateLogs(dt);
  if(c&&state==='play'){
    for(const b of logs){
      if(!logHitsJack(b,c))continue;
      const feet=c.y, bTop=b.y-b.r;
      if(!c.onGround&&!c.climbing&&feet<bTop+7){
        if(!b.jumped&&(mode==='climb'||mode==='versus')){ b.jumped=true; dodges++; score+=25; sScore(); }
        continue;
      }
      if(c.inv<=0){ hitJack(); break; }
    }
  }
}
/* ---------- draw ---------- */
function drawParts(){
  for(const p of parts){ bctx.fillStyle=p.color; const r=Math.max(2,Math.round(p.r)); bctx.fillRect(Math.round(p.x-r/2),Math.round(p.y-r/2),r,r); }
}
function drawFloats(){
  for(const f of floats){
    bctx.globalAlpha=Math.max(0,1-f.t/1.1);
    text(f.txt,f.x,f.y,'16',f.color,'center');
  }
  bctx.globalAlpha=1;
}
function drawBanner(){
  const w=pixW(banner,'16')+28;
  bctx.fillStyle='rgba(5,7,12,0.82)'; bctx.fillRect(Math.round(W/2-w/2),304,w,40);
  bctx.fillStyle='#ffd75a'; bctx.fillRect(Math.round(W/2-w/2),304,w,3);
  text(banner,W/2,322,'16','#ffd75a','center');
}
function drawCenter(msg,sub){
  bctx.fillStyle='rgba(4,4,10,0.72)'; bctx.fillRect(0,0,W,H);
  text(msg,W/2,H/2-24,'34','#ffd75a','center');
  if(sub)text(sub,W/2,H/2+18,'16','#c9cfe8','center');
}
function drawHUD(){
  if(mode==='apex'){
    text('SCORE '+score,W/2,22,'16','#8a93a0','center');
    text('STAGE '+stage+'/'+APEX_STAGES,W/2,42,'16','#8a93a0','center');
    text('HITS '+hits+'/3',14,22,'16','#ffd75a','left');
    text('ALARM '+alarms+'/3',W-14,22,'16','#ff5a5a','right');
  }else if(mode==='climb'){
    text('SCORE '+score,14,22,'16','#8a93a0','left');
    text('BEST '+best,14,42,'16','#5a6270','left');
    text('STAGE '+stage+'/'+CLIMB_STAGES,W-14,22,'16','#8a93a0','right');
    text('LIVES '+lives,W-14,42,'16','#7dff9a','right');
  }else{
    text('P1 '+wins.p1+' - '+wins.p2+' P2',W/2,22,'16','#8a93a0','center');
    text(''+Math.max(0,Math.ceil(roundT)),W/2,50,'28','#ffd75a','center');
  }
  bctx.fillStyle='#1a2230';
  bctx.fillRect(pauseBtn.x-14,pauseBtn.y-14,28,28);
  bctx.fillRect(muteBtn.x-14,muteBtn.y-14,28,28);
  text('II',pauseBtn.x,pauseBtn.y+2,'16','#cfe0f2','center');
  text(muted?'M-':'M',muteBtn.x,muteBtn.y+2,'16','#cfe0f2','center');
}
function drawMenu(){
  bctx.drawImage(sky,0,0,W,H);
  const bob=Math.sin(time*2)*3;
  text('APEX',W/2,140+bob,'76','#ffd75a','center');
  text('BEAVER VS LUMBERJACK',W/2,196,'20','#7fb2dd','center');
  text('A 1981 TOWER TALE',W/2,222,'16','#5a6270','center');
  drawStack({x:64,gy:312,stage:2,gnaw:0,falling:0,highlight:false});
  drawBeaver({x:416,y:308,face:-1,vx:0,gnawMode:false});
  drawStack({x:448,gy:312,stage:1,gnaw:0,falling:0,highlight:false});
  text('BEAVER VS LUMBERJACK',W/2,196,'20','#7fb2dd','center');
  text('A 1981 TOWER TALE',W/2,222,'16','#5a6270','center');
  for(const b of menuBtns){
    bctx.fillStyle='#141c2a'; bctx.fillRect(90,b.y-28,W-180,58);
    bctx.fillStyle='#2a3a55'; bctx.fillRect(90,b.y-28,W-180,4);
    bctx.fillStyle='#0e1420'; bctx.fillRect(90,b.y+26,W-180,4);
    text(b.label,W/2,b.y-6,'28','#e8f4ff','center');
    text(b.sub,W/2,b.y+18,'13','#8a93a0','center');
  }
  text('TAP TO BEGIN - M MUTE',W/2,H-36,'14','#3a3f45','center');
  bctx.drawImage(vig,0,0,W,H);
}
function drawHowto(){
  bctx.drawImage(sky,0,0,W,H);
  text('HOW TO PLAY',W/2,84,'34','#e8f4ff','center');
  const secs=[
    ['BEAVER - YOU STEAL THE LOGS','#ffd75a',[
      'THE JACK STACKED HIS LOGS UP TOP.',
      'PRESS AND HOLD A STACK TO WORRY IT LOOSE.',
      'THE BEAVER SCURRIES OVER AND GNAWS.',
      'WHEN A LOG BREAKS FREE - THIEF! IT',
      'TUMBLES DOWN THE TOWER.',
      '3 LOG HITS CLEAR THE STAGE. BUT EACH',
      'TIME THE JACK REACHES THE TOP:',
      'ALARM. 3 ALARMS AND THE RUN IS OVER.',
      'CLEAR ALL 8 STAGES.']],
    ['LUMBERJACK - YOU CLIMB','#7dff9a',[
      'ARROWS/WASD OR SWIPE TO RUN AND CLIMB.',
      'SPACE TO JUMP THE ROLLING LOGS.',
      'JUMPING A LOG SCORES +25.',
      'REACH THE TOP OF 8 STAGES. 3 LIVES.',
      'THE BEAVER GNAWS FASTER EVERY STAGE.']],
    ['VERSUS - SAME SCREEN','#7fb2dd',[
      'P1 LUMBERJACK: ARROWS + SPACE.',
      'P2 BEAVER: A/D TO MOVE, HOLD F OR',
      'PRESS-AND-HOLD A STACK TO STEAL.',
      'TOUCH: P1 SWIPES TO MOVE, P2 HOLDS STACKS.',
      'BEST OF 3. 60S ROUNDS.']],
  ];
  let y=128;
  for(const s of secs){
    text(s[0],36,y,'17',s[1],'left'); y+=26;
    for(const l of s[2]){ text(l,36,y,'13','#9aa4b5','left'); y+=20; }
    y+=14;
  }
  text('TAP TO GO BACK',W/2,H-40,'14','#3a3f45','center');
  bctx.drawImage(vig,0,0,W,H);
}
function render(){
  bctx.setTransform(PX,0,0,PX,0,0);
  bctx.imageSmoothingEnabled=false;
  if(state==='menu'){ drawMenu(); }
  else if(state==='howto'){ drawHowto(); }
  else{
    bctx.save();
    if(shake>0)bctx.translate(rnd(-3,3)*shake,rnd(-3,3)*shake);
    bctx.drawImage(sky,0,0,W,H);
    drawGirders(); drawLadders();
    for(const t of stacks)drawStack(t);
    for(const b of logs)drawLog(b);
    drawJack(jack);
    drawBeaver(beaver);
    drawParts(); drawFloats();
    bctx.drawImage(vig,0,0,W,H);
    drawHUD();
    if(bannerT>0)drawBanner();
    if(paused)drawCenter('PAUSED','P OR TAP TO RESUME');
    else if(state==='gameOver')drawCenter(mode==='apex'?'THE TOWER FALLS':'GAME OVER','TAP TO RETURN');
    else if(state==='campWin')drawCenter('CAMP CLEARED!','TAP TO RETURN');
    else if(state==='matchEnd')drawCenter(wins.p1>wins.p2?'LUMBERJACK WINS':'BEAVER WINS','TAP TO RETURN');
    bctx.restore();
  }
  syncTouch();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(buf,0,0,buf.width,buf.height,0,0,cv.width,cv.height);
}
/* ---------- main loop ---------- */
let lastT=0;
function frame(t){
  const dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
  if(!paused)update(dt);
  render();
  requestAnimationFrame(frame);
}
resetStage();
requestAnimationFrame(frame);
/* ---------- debug hooks ---------- */
window.__apex={
  get state(){return state;}, get mode(){return mode;}, get stage(){return stage;},
  get beaver(){return beaver;}, get stacks(){return stacks;}, get logs(){return logs;},
  get jack(){return jack;}, get hits(){return hits;}, get alarms(){return alarms;},
  get score(){return score;}, get lives(){return lives;},
  startMode, fellStack, update, toMenu,
  holdStackAt(i){ const t=stacks[i]; if(t){ holdPtr={id:"dbg",stack:t}; } },
  releaseHold(){ holdPtr=null; },
  setKeys(o){ for(const k in o)keys[k]=o[k]; },
};
</script>
