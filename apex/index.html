<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>APEX — a 1981 story. You are the ape.</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:#05070c; overflow:hidden;
    font-family:'Courier New', ui-monospace, monospace;
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; background:#05070c; touch-action:none; }
  #touch { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
    display:none; justify-content:space-between; padding:0 16px; pointer-events:none; z-index:5; }
  #touch.on { display:flex; }
  #touch .grp { display:flex; gap:16px; }
  #touch button { pointer-events:auto; width:76px; height:76px; border-radius:50%;
    border:2px solid rgba(232,244,255,.45); background:rgba(20,28,40,.55); color:#e8f4ff;
    font:bold 22px 'Courier New', monospace; touch-action:none; user-select:none; -webkit-user-select:none; }
  #touch button:active { background:rgba(120,160,200,.55); }
  #hint { position:absolute; left:0; right:0; bottom:-34px; text-align:center;
    color:#3a3f45; font-size:11px; letter-spacing:.14em; pointer-events:none;
    font-family:'Courier New', ui-monospace, monospace; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint">1981 &mdash; YOU ARE THE APE</div>
</div>
<div id="touch">
  <div class="grp"><button id="tL" aria-label="move left">&#9664;</button><button id="tR" aria-label="move right">&#9654;</button></div>
  <div class="grp"><button id="tJ" aria-label="jump">JMP</button></div>
</div>
<script>
'use strict';
/* ================= APEX =================
   A 1981 story. Tower-climb, inverted: you are the ape hurling cable spools,
   or the climber racing the tower, or both at once on one screen.
   Everything here is original: no borrowed characters, names, art, or levels.
*/

/* ---------- canvas ---------- */
const W = 480, H = 720;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function fit() {
  const vv = window.visualViewport;
  const aw = Math.max(1, (vv ? vv.width : window.innerWidth) - 8);
  const ah = Math.max(1, (vv ? vv.height : window.innerHeight) - 44); // room for the hint line
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(aw / W, ah / H); // contain: never overflows the viewport
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(dpr * cw / W, 0, 0, dpr * ch / H, 0, 0);
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 80));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
fit();

/* ---------- audio (tiny synth, no assets) ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(f0, f1, dur, type, vol) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
function noiseBurst(dur, vol, lp) {
  if (!AC || muted) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 1200;
  const g = AC.createGain(); g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
}
const sUI    = () => beep(520, 780, 0.07, 'square', 0.06);
const sJump  = () => beep(280, 640, 0.12, 'square', 0.05);
const sTick  = () => beep(95, 70, 0.05, 'triangle', 0.035);
const sBounce= () => noiseBurst(0.08, 0.10, 500);
const sThrow = () => beep(180, 90, 0.12, 'sawtooth', 0.07);
const sScore = () => beep(880, 1320, 0.09, 'square', 0.05);
const sHit   = () => { noiseBurst(0.25, 0.2, 800); beep(160, 60, 0.2, 'sawtooth', 0.1); };
const sDeath = () => { noiseBurst(0.5, 0.28, 600); beep(220, 40, 0.5, 'sawtooth', 0.12); };
const sClear = () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, f, 0.16, 'square', 0.07), i * 130)); };
const sWin   = () => { beep(440, 880, 0.18, 'square', 0.08); setTimeout(() => beep(660, 1320, 0.22, 'square', 0.08), 160); };
const sAlarm = () => { beep(660, 660, 0.12, 'square', 0.09); setTimeout(() => beep(520, 520, 0.16, 'square', 0.09), 150); };
let muted = false;
/* ---------- music: a tiny 8-step loop, very quiet ---------- */
let musStep = 0, musT = 0;
const BASSLINE = [110, 0, 110, 130.81, 0, 98, 0, 123.47];
function musicTick() {
  if (!AC || muted) return;
  const f = BASSLINE[musStep % BASSLINE.length];
  if (f) beep(f, f, 0.16, 'triangle', 0.032);
  if (musStep % 2 === 0) noiseBurst(0.03, 0.018, 6000);
  musStep++;
}

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- tower geometry ----------
   6 girders, index 0 (bottom) .. 5 (top). Slopes alternate; spools roll downhill.
   Middle gap on girders 1..4. Ladders alternate sides, clear of the gaps. */
const GY   = [630, 540, 450, 360, 270, 180];
const GDIR = [1, -1, 1, -1, 1, -1];       // spool roll direction per girder
const GX0 = 30, GX1 = 450, TILT = 14;
const GAPC = 240, GAPH = 35;              // middle gap, girders 1..4
const LX = [390, 90, 390, 90, 390];       // ladder x per ladder i (g0=i -> g1=i+1)
const ladders = LX.map((x, i) => ({ x, g0: i, g1: i + 1 }));

function surfY(i, x) { return GY[i] + TILT * GDIR[i] * (x - 240) / 210; }
function inGap(i, x) { return i >= 1 && i <= 4 && Math.abs(x - GAPC) < GAPH; }
function onGirderX(i, x) { return x >= GX0 && x <= GX1 && !inGap(i, x); }

/* physics tuning */
const GRAV = 1500, RUN = 172, JUMPV = 520, CLIMBV = 135;
const ROLL_BASE = 132;

/* ---------- state ---------- */
let state = 'menu';       // menu | serve | play | stageClear | roundEnd | matchEnd | gameOver | win
let stateT = 0, mode = 'apex';
let paused = false, time = 0;
let climber = null, barrels = [], parts = [], floats = [];
let ape = { x: 240, throwT: 0 };
let score = 0, dodges = 0, best = +(localStorage.getItem('apex_best') || 0);

let lives = 3, stage = 1, hits = 0, matchT = 0;
let round = 1, wins = { p1: 0, p2: 0 }, roundT = 0, roundWinner = null;
let alarms = 0, stageT = 0, apexBest = 0;
try { apexBest = +(localStorage.getItem('apex_bestscore') || 0); } catch (_) {}
const APEX_STAGES = 8, CLIMB_STAGES = 8;
// apex campaign escalation: the climber gets faster and wilier every stage
const aiSpeed = () => 150 + stage * 9;
const aiWhiff = () => Math.max(0.03, 0.16 - stage * 0.016);
const aiClimbV = () => CLIMBV * (1 + stage * 0.05);
function saveApexBest() {
  if (score > apexBest) { apexBest = score; try { localStorage.setItem('apex_bestscore', apexBest); } catch (_) {} }
}
let banner = '', bannerT = 0, shake = 0, bellT = 0;
let throwCd = 0, aiThrowT = 2, tickT = 0, aiSide = 1;
let lastInputT = 0, idleWarned = false;
let aimG = 1, aimEdge = 1; // keyboard aim reticle for the human ape
let pauseBtn = null, muteBtn = null;
let stars = [];
for (let i = 0; i < 70; i++) stars.push([rnd(0, W), rnd(0, H), rnd(0.4, 1.4)]);
/* night-city backdrop, generated once */
const skylineFar = [], skylineNear = [];
(function genSkyline() {
  let x = -30;
  while (x < W + 60) {
    const w = rnd(36, 72), h = rnd(100, 230), wins = [];
    for (let wy = H - h + 14; wy < H - 12; wy += 16)
      for (let wx = x + 6; wx < x + w - 6; wx += 12)
        if (Math.random() < 0.26) wins.push([wx, wy]);
    skylineFar.push({ x, w, h, wins });
    x += w + rnd(6, 20);
  }
  x = -40;
  while (x < W + 70) {
    const w = rnd(50, 96), h = rnd(50, 150), wins = [];
    for (let wy = H - h + 16; wy < H - 14; wy += 20)
      for (let wx = x + 8; wx < x + w - 8; wx += 16)
        if (Math.random() < 0.18) wins.push([wx, wy]);
    skylineNear.push({ x, w, h, wins });
    x += w + rnd(10, 30);
  }
})();
function drawSkyline() {
  const mg = ctx.createRadialGradient(398, 84, 8, 398, 84, 72);
  mg.addColorStop(0, 'rgba(232,240,255,0.45)');
  mg.addColorStop(1, 'rgba(232,240,255,0)');
  ctx.fillStyle = mg; ctx.fillRect(318, 4, 160, 160);
  ctx.fillStyle = '#dfe8f5';
  ctx.beginPath(); ctx.arc(398, 84, 22, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c2cde0';
  ctx.beginPath(); ctx.arc(390, 78, 5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(406, 92, 3.5, 0, TAU); ctx.fill();
  for (const b of skylineFar) {
    ctx.fillStyle = '#0a1322';
    ctx.fillRect(b.x, H - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255,205,110,0.5)';
    for (const q of b.wins) ctx.fillRect(q[0], q[1], 3, 5);
  }
  for (const b of skylineNear) {
    ctx.fillStyle = '#0e1828';
    ctx.fillRect(b.x, H - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255,205,110,0.32)';
    for (const q of b.wins) ctx.fillRect(q[0], q[1], 4, 6);
  }
}
function drawVignette() {
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.30, W / 2, H / 2, H * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
function confetti(n) {
  const colors = ['#ffd75a', '#7dff9a', '#7fb2dd', '#ff5a5a', '#e8f4ff'];
  for (let i = 0; i < n; i++) burst(rnd(60, W - 60), rnd(120, 320), 3, colors[i % colors.length]);
}

const humanClimber = () => mode === 'climb' || mode === 'versus';
const humanApe     = () => mode === 'apex' || mode === 'versus';

/* ---------- entities ---------- */
function resetClimber() {
  climber = { x: 60, y: surfY(0, 60), vx: 0, vy: 0, w: 18, h: 32,
    onGround: true, girder: 0, climbing: false, ladder: -1,
    face: 1, inv: 2, stun: 0, jumpPrev: false };
}
function resetStage() {
  barrels = []; parts = []; floats = [];
  ape = { x: 240, throwT: 0 };
  throwCd = 0; aiThrowT = 1.6; tickT = 0;
  hits = 0; alarms = 0; stageT = 0;
  lastInputT = time; idleWarned = false;
  resetClimber();
}
function throwDrum(gi, edge, speedMul) {
  if (barrels.length >= 24) return;
  const x = edge < 0 ? GX0 + 14 : GX1 - 14;
  const sp = (ROLL_BASE + (mode === 'climb' ? Math.min(stage * 9, 60) : 0)) * (speedMul || 1);
  barrels.push({ x, y: surfY(gi, x) - 11, vx: -edge * sp, vy: 0,
    r: 11, girder: gi, state: 'roll', rot: 0, jumped: false });
  ape.throwT = 0.35;
  sThrow();
}
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), sp = rnd(40, 260);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      t: 0, life: rnd(0.3, 0.8), color, r: rnd(1.5, 3) });
  }
}
function floatText(x, y, txt, color) {
  floats.push({ x, y, txt, color: color || '#ffd75a', t: 0 });
}

/* ---------- input ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; audio();
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (e.code === 'KeyP' && state === 'play') { paused = !paused; return; }
  if (state !== 'play' || paused) return;
  if (mode === 'apex') {
    if (e.code === 'ArrowUp') aimG = Math.min(5, aimG + 1);
    else if (e.code === 'ArrowDown') aimG = Math.max(0, aimG - 1);
    else if (e.code === 'ArrowLeft') aimEdge = -1;
    else if (e.code === 'ArrowRight') aimEdge = 1;
    else if (e.code === 'Space') aimThrow();
  } else if (mode === 'versus') {
    // P2 ape aims with W/S/A/D and throws with F (P1 climber owns the arrows)
    if (e.code === 'KeyW') aimG = Math.min(5, aimG + 1);
    else if (e.code === 'KeyS') aimG = Math.max(3, aimG - 1);
    else if (e.code === 'KeyA') aimEdge = -1;
    else if (e.code === 'KeyD') aimEdge = 1;
    else if (e.code === 'KeyF') aimThrow();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
/* DOM touch controls: fixed physical size (>=44px) in any orientation */
const touchHeld = { left: false, right: false, jump: false };
const coarsePointer = () => (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
function syncTouch() {
  const el = document.getElementById('touch');
  const want = coarsePointer() && (mode === 'climb' || mode === 'versus') &&
               (state === 'play' || state === 'serve') && !paused;
  if (want !== el.classList.contains('on')) el.classList.toggle('on', want);
  if (!want) { touchHeld.left = touchHeld.right = touchHeld.jump = false; }
}
[['tL', 'left'], ['tR', 'right'], ['tJ', 'jump']].forEach(([id, name]) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); audio(); touchHeld[name] = true; try { el.setPointerCapture(e.pointerId); } catch (_) {} });
  const off = e => { e.preventDefault(); touchHeld[name] = false; };
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
});
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toGame(e);
  handleTap(p.x, p.y);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  touchHeld.left = touchHeld.right = touchHeld.jump = false;
});

/* ---------- mode setup ---------- */
function startMode(m) {
  mode = m; score = 0; dodges = 0; lives = 3; stage = 1; hits = 0; matchT = 0;
  round = 1; wins = { p1: 0, p2: 0 }; roundWinner = null;
  resetStage(); paused = false;
  if (m === 'apex') {
    banner = 'YOU ARE THE APE — HOLD THE TOWER'; bannerT = 2.2;
    aimG = 1; aimEdge = 1;
  } else if (m === 'climb') {
    banner = 'CLIMB — REACH THE TOP'; bannerT = 2.0;
  } else {
    aimG = 5; aimEdge = 1;
    banner = 'VERSUS — CLIMBER VS APE'; bannerT = 2.0;
    startRound();
    return;
  }
  state = 'serve'; stateT = 0;
  sUI();
}
function startRound() {
  resetStage();
  roundT = 60; roundWinner = null;
  banner = 'ROUND ' + round; bannerT = 1.4;
  state = 'serve'; stateT = 0;
}
function nextRound(winner) {
  wins[winner]++;
  if (wins[winner] >= 2) {
    state = 'matchEnd'; stateT = 0;
    if (winner === 'p1') sWin(); else sHit();
  } else {
    round++;
    banner = winner === 'p1' ? 'CLIMBER TAKES THE ROUND' : 'APE TAKES THE ROUND';
    bannerT = 1.6; startRound();
  }
}
function toMenu() { state = 'menu'; paused = false; sUI(); }

/* ---------- tap handling ---------- */
const menuBtns = [
  { id: 'apex',   y: 380, label: 'APEX',   sub: '1P — you are the ape vs the AI climber' },
  { id: 'climb',  y: 458, label: 'CLIMB',  sub: '1P — climb the tower vs the AI ape' },
  { id: 'versus', y: 536, label: 'VERSUS', sub: '2P — climber vs ape, same screen' },
  { id: 'howto',  y: 614, label: 'HOW TO', sub: 'learn the tower' },
];
function nearestGirder(y, maxD, topOnly) {
  let bi = -1, bd = maxD;
  for (let i = 0; i < 6; i++) {
    if (topOnly && GY[i] > 400) continue;
    const d = Math.abs(GY[i] - y);
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}
/* player-ape spool throw: tap sets the reticle, keyboard aims it, both throw through aimThrow */
function aimThrow() {
  if (!humanApe() || throwCd > 0 || state !== 'play' || paused) return;
  throwDrum(aimG, aimEdge, 1);
  throwCd = mode === 'versus' ? 0.8 : 0.65;
}
function apeTap(x, y) {
  if (!humanApe() || throwCd > 0) return;
  const topOnly = mode === 'versus';
  if (topOnly && y > 380) return;              // P2 is restricted to the top half
  const gi = nearestGirder(y, 60, topOnly);
  if (gi < 0) return;
  const edge = x < W * 0.35 ? -1 : x > W * 0.65 ? 1 : (x < W / 2 ? -1 : 1);
  aimG = gi; aimEdge = edge;
  aimThrow();
}
function handleTap(x, y) {
  if (state === 'menu') {
    for (const b of menuBtns) {
      if (Math.abs(y - b.y) < 34 && x > 90 && x < W - 90) {
        if (b.id === 'howto') { state = 'howto'; stateT = 0; }
        else startMode(b.id);
        sUI(); return;
      }
    }
    return;
  }
  if (state === 'howto') { toMenu(); return; }
  if (state === 'matchEnd' || state === 'gameOver' || state === 'campWin') { toMenu(); return; }
  // pause / mute glyphs always tappable outside menu
  if (pauseBtn && Math.hypot(x - pauseBtn.x, y - pauseBtn.y) < 24) {
    if (state === 'play') { paused = !paused; sUI(); } return;
  }
  if (muteBtn && Math.hypot(x - muteBtn.x, y - muteBtn.y) < 24) { muted = !muted; sUI(); return; }
  if (state !== 'play' || paused) return;
  if (mode === 'apex') { apeTap(x, y); return; }
  if (mode === 'versus' && y < 380) { apeTap(x, y); return; }
  // climber tap = jump (mobile)
  if (humanClimber() && climber && !climber.climbing) {
    climber.tapJump = true;
  }
}

/* ---------- player control assembly ---------- */
function playerControl() {
  const p2 = mode === 'versus'; // P1 climber: arrows only; WASD+F drive the P2 ape
  const left  = !!(keys.ArrowLeft || (!p2 && keys.KeyA) || touchHeld.left);
  const right = !!(keys.ArrowRight || (!p2 && keys.KeyD) || touchHeld.right);
  const up    = !!(keys.ArrowUp || (!p2 && keys.KeyW));
  const down  = !!(keys.ArrowDown || (!p2 && keys.KeyS));
  const jump  = !!(keys.Space || touchHeld.jump || (climber && climber.tapJump));
  if (left || right || up || down || jump) lastInputT = time;
  if (climber) climber.tapJump = false;
  return { left, right, up, down, jump };
}

/* ---------- climber physics (shared by player + AI) ---------- */
function startClimb(c, li, down) {
  c.climbing = true; c.ladder = li;
  c.x = ladders[li].x; c.vx = 0; c.vy = 0;
}
function stepClimber(c, ctl, dt, isAI) {
  if (c.stun > 0) c.stun -= dt;
  if (c.inv > 0) c.inv -= dt;

  if (c.climbing) {
    const L = ladders[c.ladder];
    const mv = (ctl.down ? 1 : 0) - (ctl.up ? 1 : 0);
    if (c.stun <= 0) c.y += mv * (isAI ? aiClimbV() : CLIMBV) * dt;
    c.x = L.x;
    if (mv < 0 && c.y <= surfY(L.g1, L.x) + 4) {          // reached top
      c.y = surfY(L.g1, L.x); c.girder = L.g1;
      c.climbing = false; c.ladder = -1; c.onGround = true; c.vy = 0;
    } else if (mv > 0 && c.y >= surfY(L.g0, L.x) - 2) {   // reached bottom
      c.y = surfY(L.g0, L.x); c.girder = L.g0;
      c.climbing = false; c.ladder = -1; c.onGround = true; c.vy = 0;
    }
    return;
  }

  const sp = isAI ? aiSpeed() : RUN;
  c.vx = ((ctl.right ? 1 : 0) - (ctl.left ? 1 : 0)) * (c.stun > 0 ? 0 : sp);
  if (c.vx !== 0) c.face = c.vx > 0 ? 1 : -1;

  const jEdge = ctl.jump && !c.jumpPrev;
  c.jumpPrev = !!ctl.jump;
  if (jEdge && c.onGround && c.stun <= 0) {
    c.vy = -JUMPV; c.onGround = false;
    if (!isAI || Math.random() < 0.5) sJump();
  }

  c.vy += GRAV * dt;
  const py = c.y;

/* ---------- barrels ---------- */
function updateBarrels(dt) {
  let anyRoll = false;
  for (let i = barrels.length - 1; i >= 0; i--) {
    const b = barrels[i];
    if (b.state === 'roll') {
      anyRoll = true;
      b.x += b.vx * dt;
      b.rot += b.vx * dt / b.r;
      // chance to drop down a ladder shaft
      if (b.girder < 5 && Math.abs(b.x - LX[b.girder]) < 8 && Math.random() < 1.1 * dt) {
        b.state = 'fall'; b.vy = 0;
      } else if (!onGirderX(b.girder, b.x)) {
        b.state = 'fall'; b.vy = 0; // gap or girder end
      } else {
        b.y = surfY(b.girder, b.x) - b.r;
      }
    } else {
      b.vy += GRAV * dt;
      const py = b.y;
      b.x += b.vx * 0.25 * dt;
      b.y += b.vy * dt;
      b.rot += b.vx * dt / b.r;
      // land on a girder from above (highest one crossed)
      for (let j = 5; j >= 0; j--) {
        if (!onGirderX(j, b.x)) continue;
        const s = surfY(j, b.x) - b.r;
        if (py <= s && b.y >= s && b.vy > 0) {
          if (b.vy > 320) { b.y = s; b.vy = -b.vy * 0.35; sBounce(); } // bounce
          else { b.y = s; b.vy = 0; b.state = 'roll'; b.girder = j; b.vx = Math.abs(b.vx) * GDIR[j] || ROLL_BASE * GDIR[j]; sBounce(); }

    if (b.y > H + 40 || b.x < -40 || b.x > W + 40) barrels.splice(i, 1);
  }

  if (anyRoll && tickT <= 0) { sTick(); tickT = 0.15; }
}
function barrelHitsClimber(b, c) {

  if (state === 'stageClear') {
    if (stateT > 2.0) {
      const last = (mode === 'apex' && stage >= APEX_STAGES) || (mode === 'climb' && stage >= CLIMB_STAGES);
      if (last) {
        if (mode === 'apex') saveApexBest();

        state = 'campWin'; stateT = 0; sWin(); confetti(60);
      } else {

    ctx.fillStyle = '#e8f4ff';
    ctx.fillText('LIVES ' + lives + '   DODGES ' + dodges, W / 2, 44);
    if (best) { ctx.fillStyle = '#54655c'; ctx.fillText('BEST ' + best, W / 2, 64); }
    ctx.textAlign = 'left';
  } else {
    ctx.textAlign = 'left'; ctx.fillStyle = '#8a93a0';
    ctx.fillText('P1 ' + wins.p1 + ' — ' + wins.p2 + ' P2', 14, 26);
    ctx.fillText('ROUND ' + round, 14, 46);
    ctx.fillStyle = '#ffd75a'; ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(roundT) + 's', W / 2, 26); ctx.textAlign = 'left';
  }
  pauseBtn = { x: W - 30, y: 30 };
  muteBtn = { x: W - 30, y: 58 };
  ctx.fillStyle = '#3a3f45'; ctx.textAlign = 'center'; ctx.font = '13px "Courier New", monospace';
  ctx.fillText(paused ? '\u25B6' : 'II', pauseBtn.x, pauseBtn.y);
  ctx.fillText(muted ? 'M\u00D7' : 'M\u266A', muteBtn.x, muteBtn.y);
  ctx.textAlign = 'left';
}
function drawMenu() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8f4ff';
  ctx.font = 'bold 72px "Courier New", monospace';
  ctx.fillText('APEX', W / 2, 180);
  ctx.font = '15px "Courier New", monospace'; ctx.fillStyle = '#8a93a0';
  ctx.fillText('a 1981 story', W / 2, 214);
  ctx.fillStyle = '#8a5a20';
  ctx.fillText('you are the ape', W / 2, 238);
  // little tower ornament
  ctx.strokeStyle = '#33506e'; ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    const y = 300 + i * 16;
    ctx.beginPath(); ctx.moveTo(W / 2 - 60, y); ctx.lineTo(W / 2 + 60, y); ctx.stroke();
  }
  for (const b of menuBtns) {
    ctx.strokeStyle = '#e8f4ff'; ctx.lineWidth = 1.6;
    ctx.strokeRect(90, b.y - 30, W - 180, 60);
    ctx.fillStyle = '#e8f4ff'; ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText(b.label, W / 2, b.y - 2);
    ctx.font = '12px "Courier New", monospace'; ctx.fillStyle = '#8a93a0';
    ctx.fillText(b.sub, W / 2, b.y + 20);
  }
  ctx.font = '12px "Courier New", monospace'; ctx.fillStyle = '#54655c';
  const bestLine = (apexBest ? 'apex best ' + apexBest + '   ' : '') + (best ? 'climb best ' + best : '');
  if (bestLine) ctx.fillText(bestLine, W / 2, H - 62);
  ctx.fillStyle = '#3a3f45';
  ctx.fillText('M mute · P pause', W / 2, H - 40);
}
function drawHowto() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8f4ff'; ctx.font = 'bold 34px "Courier New", monospace';
  ctx.fillText('HOW TO PLAY', W / 2, 92);
  const secs = [
    ['APEX — YOU ARE THE APE (1P)', '#ffd75a', [
      'Tap a girder edge (or aim with arrows, SPACE throws)',
      'to roll a spool into the climber. 3 hits clears the stage.',
      'But each time the climber reaches the top: ALARM.',
      '3 alarms and the run is over. Hold all 8 stages.']],
    ['CLIMB — YOU ARE THE CLIMBER (1P)', '#7dff9a', [
      'Arrows / WASD to run and climb, SPACE to jump the spools.',
      'Jumping a spool scores. Reach the top of 8 stages.',
      '3 lives. The ape throws faster every stage.']],
    ['VERSUS — CLIMBER VS APE (2P)', '#7fb2dd', [
      'P1 climber: arrows + SPACE to move and jump.',
      'P2 ape: W/S aim girder, A/D edge, F throws.',
      'On touch: P1 uses buttons, P2 taps the tower top.',
      'Top scores for the climber, hits for the ape. Best of 3.']],
  ];
  let y = 140;
  ctx.textAlign = 'left';
  for (const [title, color, lines] of secs) {
    ctx.fillStyle = color; ctx.font = 'bold 14px "Courier New", monospace';
    ctx.fillText(title, 36, y); y += 22;
    ctx.fillStyle = '#8a93a0'; ctx.font = '12.5px "Courier New", monospace';
    for (const l of lines) { ctx.fillText(l, 36, y); y += 19; }
    y += 14;
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#3a3f45';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('tap anywhere to return', W / 2, H - 60);
  ctx.textAlign = 'left';
}
function centerText(main, sub, color) {
  ctx.textAlign = 'center';
  ctx.fillStyle = color || '#e8f4ff';
  ctx.font = 'bold 32px "Courier New", monospace';
  ctx.fillText(main, W / 2, H / 2 - 24);
  if (sub) {
    ctx.font = '15px "Courier New", monospace'; ctx.fillStyle = '#8a93a0';
    const lines = sub.split('\n');
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 8 + i * 22));
  }
  ctx.textAlign = 'left';
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 5, rnd(-1, 1) * shake * 5);
  ctx.clearRect(-10, -10, W + 20, H + 20);
  // night sky
  ctx.fillStyle = '#8a93a0';
  for (const [sx, sy, sr] of stars) {
    ctx.globalAlpha = 0.25; ctx.fillRect(sx, sy, sr, sr);
  }
  ctx.globalAlpha = 1;
  drawSkyline();

  if (state === 'menu') { drawMenu(); drawVignette(); ctx.restore(); return; }
  if (state === 'howto') { drawHowto(); drawVignette(); ctx.restore(); return; }

  drawVignette();
  drawLadders();
  drawGirders();
  drawReticle();
  drawDrums();
  drawApe();
  drawClimber(climber);
  for (const p of parts) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = 1 - f.t / 1.1; ctx.fillStyle = f.color;
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  drawHUD();

  if (bannerT > 0) {
    ctx.globalAlpha = Math.min(1, bannerT);
    ctx.fillStyle = '#e8f4ff'; ctx.textAlign = 'center';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText(banner, W / 2, 120);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(5,7,12,0.6)'; ctx.fillRect(0, 0, W, H);
    centerText('PAUSED', null);
  }
  if (state === 'roundEnd') {
    centerText(roundWinner === 'p1' ? 'CLIMBER TAKES IT' : 'APE TAKES IT',
      'p1 ' + wins.p1 + ' — ' + wins.p2 + ' p2');
  }
  if (state === 'matchEnd') {
    ctx.fillStyle = 'rgba(5,7,12,0.78)'; ctx.fillRect(0, 0, W, H);
    const p1w = wins.p1 > wins.p2;
    centerText(p1w ? 'CLIMBER WINS' : 'APE WINS',
      'rounds: p1 ' + wins.p1 + ' — ' + wins.p2 + ' p2\ntap to return',
      p1w ? '#7dff9a' : '#ff5a5a');
  }
  if (state === 'gameOver') {
    ctx.fillStyle = 'rgba(5,7,12,0.78)'; ctx.fillRect(0, 0, W, H);
    centerText('GAME OVER', 'score ' + score + '\nbest ' + (mode === 'apex' ? apexBest : best) + '\ntap to return', '#ff5a5a');
  }
  if (state === 'campWin') {
    ctx.fillStyle = 'rgba(5,7,12,0.78)'; ctx.fillRect(0, 0, W, H);
    const isApex = mode === 'apex';
    const cb = isApex ? apexBest : best;
    centerText(isApex ? 'APEX PREDATOR' : 'SUMMIT CONQUERED',
      (isApex ? 'the tower holds — all 8 stages' : 'all 8 stages climbed') +
      '\nscore ' + score + (cb ? '\nbest ' + cb : '') + '\ntap to return',
      '#7dff9a');
  }
  ctx.restore();
}

/* ---------- main loop ---------- */
let lastT = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  syncTouch();
  const mdt = Math.min(0.1, t / 1000 - (frame._l || t / 1000)); frame._l = t / 1000;
  musT -= mdt;
  if (musT <= 0) { musicTick(); musT = 60 / 132 / 2; }
  const now = t / 1000;
  const ft = Math.min(0.1, now - (lastT || now));
  lastT = now; acc += ft;
  while (acc >= DT) { update(DT); acc -= DT; }
  render();
}
requestAnimationFrame(frame);

/* ---------- debug hooks ---------- */
window.GAME = {
  get state() { return state; }, get mode() { return mode; },
  get score() { return score; }, get lives() { return lives; },
  get stage() { return stage; }, get climber() { return climber; },
  get barrels() { return barrels; }, get ape() { return ape; },
  get wins() { return wins; }, get hits() { return hits; },
  get dodges() { return dodges; }, get alarms() { return alarms; },
  get aimG() { return aimG; }, get aimEdge() { return aimEdge; },
  get paused() { return paused; }, get best() { return best; },
  get apexBest() { return apexBest; },
  get matchT() { return matchT; }, get roundT() { return roundT; },
  get round() { return round; },
  startMode, throwDrum, hitClimber, surfY, onGirderX,
  debug: {
    endServe() { if (state === 'serve') { state = 'play'; stateT = 99; } },
    teleportClimber(gi, x) {
      const c = climber;
      c.climbing = false; c.ladder = -1; c.girder = gi;
      c.x = x; c.y = surfY(gi, x); c.vx = 0; c.vy = 0; c.onGround = true; c.inv = 0;
    },
    throwAt(gi, edge) { throwDrum(gi, edge, 1); },
    setLives(n) { lives = n; },
    setAlarms(n) { alarms = n; },
    setHits(n) { hits = n; },
    setRoundT(n) { roundT = n; },
    setStage(n) { stage = n; },
    key(code, down) { keys[code] = !!down; },
    tap(x, y) { handleTap(x, y); },
    aim(g, e) { aimG = g; aimEdge = e; },
  },
};
</script>
