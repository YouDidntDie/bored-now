let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type, vol) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), ac.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function noiseBurst(dur, vol, freq) {
  const ac = audio(); if (!ac) return;
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200;
  const g = ac.createGain(); g.gain.value = vol || 0.10;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}

function bakePixelFood(map, palette, outline) {
  const N = 16, cv = document.createElement('canvas');
  cv.width = cv.height = N + 2;   // 1px de marge pour le contour
  const g = cv.getContext('2d');
  const isEmpty = (x, y) => (x < 0 || y < 0 || x >= N || y >= N || map[y][x] === '.');
  // passe 1 : contour par dilatation (8-connexité)
  g.fillStyle = outline;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (map[y][x] === '.') continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (isEmpty(x + dx, y + dy)) g.fillRect(x + 1 + dx, y + 1 + dy, 1, 1);
    }
  }
  // passe 2 : les pixels de l'aliment
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const ch = map[y][x];
    if (ch === '.' || !palette[ch]) continue;
    g.fillStyle = palette[ch];
    g.fillRect(x + 1, y + 1, 1, 1);
  }
  // montée en pixels francs (pas de lissage)
  const S = Math.round(CELL * dpr);
  const out = document.createElement('canvas');
  out.width = out.height = S;
  const og = out.getContext('2d');
  og.imageSmoothingEnabled = false;
  og.drawImage(cv, 0, 0, S, S);
  return out;
}

function ptext(text, x, y, size, color, align) {
  text = String(text).toUpperCase();
  const px = Math.max(1, Math.round(size / 7));
  let w = 0;
  for (const ch of text) w += ch === ' ' ? 4 * px : 6 * px;
  let dx = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  const y0 = Math.round(y - 4 * px);
  ctx.fillStyle = color;
  for (const ch of text) {
    const gl = ch === ' ' ? null : (FONT[ch] || FONT['?']);
    if (gl) for (let r = 0; r < gl.length; r++) {
      const row = gl[r];
      for (let c = 0; c < 5; c++)
        if (row[c] === '1') ctx.fillRect(dx + c * px, y0 + r * px, px, px);
    }
    dx += ch === ' ' ? 4 * px : 6 * px;
  }
}

  if (!G.waiting || G.burpCD > 0 || G.mode !== 'play') return;

// ---------- plats : morceaux compacts d'un seul aliment ----------
function genPiece() {
  const r = Math.random();
  const n = r < 0.25 ? 2 : (r < 0.70 ? 3 : 4);
  const cells = [{ x: 0, y: 0 }];
  const seen = new Set(['0,0']);
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let guard = 0;
  while (cells.length < n && guard++ < 200) {
    const from = cells[(Math.random() * cells.length) | 0];
    const d = dirs[(Math.random() * 4) | 0];
    const nx = from.x + d[0], ny = from.y + d[1], k = nx + ',' + ny;
    if (!seen.has(k)) { seen.add(k); cells.push({ x: nx, y: ny }); }
  }
  let minx = 1e9, miny = 1e9, maxx = -1e9;
  for (const c of cells) { minx = Math.min(minx, c.x); miny = Math.min(miny, c.y); maxx = Math.max(maxx, c.x); }
  for (const c of cells) { c.x -= minx; c.y -= miny; }
  // le tube fait 2 cases de large : on régénère si ça ne passe pas
  if (maxx - minx > 1 && guard < 195) return genPiece();
  return { cells: cells, food: 1 + ((Math.random() * 5) | 0) };
}

// ---------- apparition : ça descend de l'œsophage ----------
function spawnPiece() {
  const def = G.queue.shift();
  G.queue.push(genPiece());
  const p = {
    cells: def.cells, food: def.food,
    gx: 4, gy: TUBE_TOP,   // en haut de l'œsophage (2 cases de large : ça passe)
    lockT: 0, resets: 0, stuckT: 0
  };
  G.heldKey = null;
  G.fallT = 0;
  // le tube est toujours ouvert au spawn : le plat descend, point.
  G.piece = p; G.pieces++;
  sfxSpawn();
}

// ---------- collisions (bouche ouverte sous l'œsophage) ----------
function cellAt(gx, gy) {
  if (gx < 0 || gx >= COLS) return 1;
  if (gy >= ROWS) return 1;
  if (gy < 0) {
    if (gx >= MOUTH0 && gx <= MOUTH1 && gy >= TUBE_TOP) return 0; // le tube
    return 1;
  }
  return G.grid[gy][gx];
}
// ---------- collisions : tout est discret, case par case (Tetris) ----------
function canMove(p, dx, dy) {
  for (const c of p.cells)
    if (cellAt(p.gx + c.x + dx, p.gy + c.y + dy)) return false;
  return true;
}
function tryMove(p, dx, dy) {
  if (canMove(p, dx, dy)) { p.gx += dx; p.gy += dy; return true; }
  return false;
}
function pieceInside(p) {
  for (const c of p.cells) if (p.gy + c.y < 0) return false;
  return true;
}

// ---------- entrée : un pas par touche, case par case ----------
function stepPiece(dx, dy) {
  const p = G.piece;
  if (G.mode !== 'play' || G.paused || !p) return false;
  if (!tryMove(p, dx, dy)) return false;
  // un pas latéral ou vers le haut retarde le verrouillage (avec limite anti-stall)
  if (dx !== 0 || dy !== 1) {
    if (p.resets < MAX_RESETS) p.lockT = 0;
    p.resets++;
  }
  return true;
}
function pressDir(key, dx, dy) {
  stepPiece(dx, dy);   // la touche répond immédiatement
  G.heldKey = key; G.heldDx = dx; G.heldDy = dy;
  G.dasT = 0; G.dasOn = false;
}

// ---------- verrouillage ----------
function lockPiece() {
  const p = G.piece;
  for (const c of p.cells) {
    const gx = p.gx + c.x, gy = p.gy + c.y;
    if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) G.grid[gy][gx] = p.food;
  }
  G.piece = null;
  sfxLock();
  // chaque plat posé fait monter l'acide (la jauge, pas le chrono)
  G.acid = Math.min(ROWS, G.acid + ACID_PER_LOCK[G.wave - 1]);
  const rows = [];
  for (let y = 0; y < ROWS; y++) {
    let full = true;
    for (let x = 0; x < COLS; x++) if (!G.grid[y][x]) { full = false; break; }
    if (full) rows.push(y);
  }
  // NOTE : pas de clear vertical — une colonne pleine ne se digère pas,
  // sinon le jeu s'auto-sauve et le game over devient impossible.
  if (rows.length) {
    const cells = [];
    for (const y of rows) for (let x = 0; x < COLS; x++) cells.push({ x: x, y: y, f: G.grid[y][x] });
    G.clearInfo = { cells: cells, n: rows.length, t: CLEAR_T };
    G.mode = 'clearing';
    for (let i = 0; i < Math.min(24, cells.length * 2); i++) {
      const cc = cells[(Math.random() * cells.length) | 0];
      G.bubbles.push({
        x: FX + cc.x * CELL + Math.random() * CELL, y: FY + cc.y * CELL + Math.random() * CELL,
        vx: (Math.random() - 0.5) * 40, vy: -60 - Math.random() * 80,
        r: 2 + Math.random() * 4, t: 0.7 + Math.random() * 0.4
      });
    }
  } else { G.mode = 'play'; spawnPiece(); }
}

function collapseColumns() {
  for (let x = 0; x < COLS; x++) {
    const col = [], sok = [];
    for (let y = ROWS - 1; y >= 0; y--)
      if (G.grid[y][x]) { col.push(G.grid[y][x]); sok.push(G.soak[y][x]); }
    for (let y = ROWS - 1, i = 0; y >= 0; y--, i++) {
      G.grid[y][x] = i < col.length ? col[i] : 0;
      G.soak[y][x] = i < sok.length ? sok[i] : 0;
    }
  }
}

function applyClear() {
  const info = G.clearInfo;
  for (const cc of info.cells) { G.grid[cc.y][cc.x] = 0; G.soak[cc.y][cc.x] = 0; }
  collapseColumns();
  const pts = info.cells.length * info.cells.length * 5;
  G.score += pts;
  G.lines += info.n;
  G.linesWave += info.n;
  G.popups.push({ x: W / 2, y: FY + PH / 2, text: '+' + pts, t: 1.0 });
  sfxDigest(info.cells.length);
  // digérer une ligne = faire de la place : l'acide redescend fort (soulagement)
  G.acid = Math.max(0, G.acid - 2.0 * info.n);
  G.clearInfo = null;
  if (G.linesWave >= G.quota) {
    if (G.wave >= MAXWAVE) { G.mode = 'win'; sfxWin(); }
    else { G.mode = 'wavebreak'; G.breakT = 2.5; sfxService(); }
  } else { G.mode = 'play'; spawnPiece(); }
}

// ---------- boucle ----------
let last = 0;
function update(dt) {
  G.time += dt;
  for (const pp of G.popups) pp.t -= dt;
  G.popups = G.popups.filter(pp => pp.t > 0);
  for (const b of G.bubbles) {
    b.t -= dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy -= 30 * dt;
  }
  G.bubbles = G.bubbles.filter(b => b.t > 0);
  for (const q of G.puke) {
    q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt;
  }
  G.puke = G.puke.filter(q => q.t > 0);

  if (G.mode === 'clearing') {
    G.clearInfo.t -= dt;
    if (G.clearInfo.t <= 0) applyClear();
    return;
  }
  if (G.mode === 'wavebreak') {
    G.breakT -= dt;
    if (G.breakT <= 0) {
      G.wave++; G.quota = QUOTAS[G.wave - 1]; G.linesWave = 0;
      G.mode = 'play'; spawnPiece();
    }
    return;
  }
  if (G.mode !== 'play') return;
  if (G.burpCD > 0) G.burpCD -= dt;

  // ---- nausée : un plat coincé dans l'œsophage ----
  // (pas d'auto-récupération : le plat est clampé sans intersection,
  //  le seul salut c'est le ROT — ou l'acide s'il ronge le bouchon)
  if (G.waiting) {
    G.nausea += dt / NAUSEA_T;
    if (G.nausea >= 1) { doPuke(); return; }       // trop tard : tu dégueules
  }

  if (!G.piece) return;
  const p = G.piece;

  // ---- acide gastrique : il monte quand tu poses, il trempe, il bouffe ----
  if (G.acid >= ROWS - 1) { doPuke(); return; }  // noyé sous l'acide
  if (G.acid > 0.02) {
    let dissolved = false;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!G.grid[y][x]) continue;
      // l'acide part d'UNE rangée sous le plateau : le fond est safe au début
      if ((ROWS - y) < G.acid) {
        G.soak[y][x] += dt;
        if (G.soak[y][x] >= SOAK_T) {
          G.grid[y][x] = 0; G.soak[y][x] = 0; dissolved = true;
          G.bubbles.push({
            x: FX + x * CELL + Math.random() * CELL, y: FY + y * CELL + Math.random() * CELL,
            vx: (Math.random() - 0.5) * 50, vy: -70 - Math.random() * 90,
            r: 2 + Math.random() * 4, t: 0.6 + Math.random() * 0.4
          });
          sfxFizz();
        }
      }
    }
    if (dissolved) collapseColumns();
  }

  // ---- chute Tetris : une case par battement ----
  G.fallT += dt;
  const ft = FALL_T[G.wave - 1];
  let fguard = 0;
  while (G.fallT >= ft && fguard++ < 4) {
    G.fallT -= ft;
    if (!tryMove(p, 0, 1)) break;
    p.lockT = 0; p.resets = 0;
  }
  // ---- auto-répétition (DAS) quand on maintient une touche ----
  if (G.heldKey) {
    G.dasT += dt;
    if (!G.dasOn && G.dasT >= DAS_DELAY) { G.dasOn = true; G.dasT = 0; }
    if (G.dasOn) {
      let n = 0;
      while (G.dasT >= DAS_REPEAT && n++ < 10) { G.dasT -= DAS_REPEAT; stepPiece(G.heldDx, G.heldDy); }
    }
  }

  // ---- verrouillage : posé et entièrement dans l'estomac ----
  const inside = pieceInside(p);
  const resting = !canMove(p, 0, 1);
  if (resting && inside) {
    p.lockT += dt;
    if (p.lockT >= LOCK_T) { lockPiece(); return; }
  } else p.lockT = 0;
  // ---- coincé dans le gosier : à cheval sur la bouche, posé sur une pile à ras bord ----
  if (!inside && resting) p.stuckT += dt; else p.stuckT = 0;
  if (p.stuckT >= STUCK_T && !G.waiting) {
    G.waiting = p; G.piece = null; G.nausea = 0.0001; G.burpCD = 0;
    sfxNausea();
  }
}

// ---------- rendu ----------
const CREAM = '#f2e3c8', DIM = '#8a6f5c';

function drawVessel() {
  const ox = FX - 18, oy = FY - 18, ow = PW + 36, oh = PH + 36;
  // contour sombre externe (1 bloc)
  ctx.fillStyle = '#2a0d0f';
  ctx.fillRect(ox - BP, oy - BP, ow + BP * 2, oh + BP * 2);
  // paroi charnue
  ctx.fillStyle = '#5e2226';
  ctx.fillRect(ox, oy, ow, oh);
  // intérieur
  ctx.fillStyle = '#331416';
  ctx.fillRect(FX, FY, PW, PH);
  // bouche : ouverture en haut (on efface mur + contour)
  ctx.fillStyle = '#1c0a0b';
  ctx.fillRect(FX + MOUTH0 * CELL - 8, oy - BP, 2 * CELL + 16, 18 + BP + 8);
  // péristaltisme : fourmis de lumière sur le bord intérieur du mur
  const mouthX0 = FX + MOUTH0 * CELL - 8, mouthX1 = FX + MOUTH1 * CELL + CELL + 8;
  const t = Math.floor(G.time * 3);
  let i = 0;
  ctx.fillStyle = '#b0574f';
  const ant = (x, y, w, h, topEdge) => {
    if (topEdge && x + w > mouthX0 && x < mouthX1) { i++; return; }
    if ((i++ + t) % 6 < 3) ctx.fillRect(x, y, w, h);
  };
  for (let x = FX; x < FX + PW; x += BP) ant(x, FY - BP, BP, BP, true);
  for (let y = FY; y < FY + PH; y += BP) ant(FX + PW, y, BP, BP, false);
  for (let x = FX + PW - BP; x >= FX; x -= BP) ant(x, FY + PH, BP, BP, false);
  for (let y = FY + PH - BP; y >= FY; y -= BP) ant(FX - BP, y, BP, BP, false);
}
function drawEsophagus() {
  const ex0 = FX + MOUTH0 * CELL, ex1 = FX + MOUTH1 * CELL + CELL;
  const top = 6, bot = FY + 6;
  // intérieur sombre
  ctx.fillStyle = '#1c0a0b';
  ctx.fillRect(ex0, top, ex1 - ex0, bot - top);
  // murs en blocs + liseré clair intérieur
  for (let y = top; y < bot; y += BP) {
    const h = Math.min(BP, bot - y);
    ctx.fillStyle = '#5e2226';
    ctx.fillRect(ex0 - BP * 2, y, BP * 2, h);
    ctx.fillRect(ex1, y, BP * 2, h);
    ctx.fillStyle = '#b0574f';
    ctx.fillRect(ex0 - BP, y, BP, h);
    ctx.fillRect(ex1 - BP, y, BP, h);
  }
  // anneaux péristaltiques : barres qui descendent (quantifiées)
  ctx.fillStyle = 'rgba(176,87,79,0.8)';
  const n = 3, span = bot - top;
  for (let i = 0; i < n; i++) {
    const yy = Math.round((top + ((G.time * 60 + i * (span / n)) % span)) / (BP / 2)) * (BP / 2);
    ctx.fillRect(ex0 + 2, yy, ex1 - ex0 - 4, BP / 2);
  }
}
function drawFoodCell(gx, gy, f, scale, alpha) {
  const img = sprites[f]; if (!img) return;
  const s = CELL * (scale || 1);
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, FX + gx * CELL + (CELL - s) / 2, FY + gy * CELL + (CELL - s) / 2, s, s);
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(dpr * viewScale, 0, 0, dpr * viewScale, 0, 0);
  // fond : intérieur sombre
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#160809'); bg.addColorStop(1, '#0d0506');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // vignettage
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  drawEsophagus();
  drawVessel();

  // aliments posés
  const digesting = G.mode === 'clearing' && G.clearInfo;
  const dset = digesting ? new Set(G.clearInfo.cells.map(c => c.x + ',' + c.y)) : null;
  const dscale = digesting ? Math.max(0.05, G.clearInfo.t / CLEAR_T) : 1;
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const f = G.grid[y][x];
      if (!f) continue;
      if (dset && dset.has(x + ',' + y)) drawFoodCell(x, y, f, dscale, 0.9);
      else drawFoodCell(x, y, f, 1, 1);
    }

  // mare d'acide gastrique (monte du fond) — surface en escalier, pas de dégradé
  if (G.acid > 0.02) {
    const sy = FY + PH - G.acid * CELL;
    const step = 12;
    const surfY = x => Math.round((sy + Math.sin(x * 0.05 + G.time * 4) * 4) / step) * step;
    ctx.fillStyle = '#8fb83a';
    for (let x = FX; x < FX + PW; x += step)
      ctx.fillRect(x, surfY(x), step, FY + PH - surfY(x));
    ctx.fillStyle = '#c4e05f';
    for (let x = FX; x < FX + PW; x += step)
      ctx.fillRect(x, surfY(x), step, 6);
    // trempage : les plats qui marinent grésillent
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const sk = G.soak[y][x];
      if (sk > 0 && G.grid[y][x] && Math.floor(G.time * 16) % 2 === 0) {
        ctx.fillStyle = 'rgba(225,255,150,' + (0.25 + (sk / SOAK_T) * 0.45).toFixed(2) + ')';
        ctx.fillRect(FX + x * CELL + 2, FY + y * CELL + 2, CELL - 4, CELL - 4);
      }
    }
  }

  // pièce active
  if (G.piece) {
    const p = G.piece;
    const blink = p.lockT > 0.12 && (Math.floor(G.time * 12) % 2 === 0);
    const img = sprites[p.food];
    ctx.imageSmoothingEnabled = false;
    for (const c of p.cells) {
      const px = FX + (p.gx + c.x) * CELL, py = FY + (p.gy + c.y) * CELL;
      if (img) ctx.drawImage(img, px, py, CELL, CELL);
      if (blink) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4); }
    }
    ctx.imageSmoothingEnabled = true;
    if (G.hintT > 0 && G.wave === 1 && G.pieces <= 1) {
      ptext('← ↑ ↓ →  =  PÉRISTALTISME', W / 2, FY + PH / 2 - 54, 16, CREAM, 'center', );
      ptext('FINIS TES LIGNES AVANT L\'ACIDE', W / 2, FY + PH / 2 - 31, 13, DIM, 'center', );
    }
  }

  // plat en attente dans l'œsophage (nausée)
  if (G.waiting) {
    const p = G.waiting, bob = Math.sin(G.time * 6) * 3;
    const img = sprites[p.food];
    ctx.imageSmoothingEnabled = false;
    for (const c of p.cells) {
      const px = FX + (p.gx + c.x) * CELL, py = FY + (p.gy + c.y) * CELL + bob;
      if (img) ctx.drawImage(img, px, py, CELL, CELL);
    }
    ctx.imageSmoothingEnabled = true;
  }

  // bulles de digestion (carrées)
  for (const b of G.bubbles) {
    ctx.globalAlpha = Math.min(1, b.t * 2);
    ctx.fillStyle = '#9fe07a';
    const s = Math.max(2, b.r * 2);
    ctx.fillRect(b.x - s / 2, b.y - s / 2, s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(b.x - s / 2, b.y - s / 2, s * 0.4, s * 0.4);
    ctx.globalAlpha = 1;
  }

  // popups
  for (const pp of G.popups) {
    ctx.globalAlpha = Math.min(1, pp.t * 2);
    ptext(pp.text, pp.x, pp.y - (1 - pp.t) * 40 + 8, 22, '#ffe9b8', 'center', );
    ctx.globalAlpha = 1;
  }

  // vomi (game over)
  for (const q of G.puke) {
    ctx.globalAlpha = Math.min(1, q.t);
    ctx.fillStyle = q.c;
    const s = Math.max(2, q.r * 2);
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }

  // ----- HUD -----
  ptext('GARGANTUA', 16, 24, 20, CREAM, 'left', );
  ptext('1984', W - 16, 24, 12, DIM, 'right', );
  ptext('SCORE ' + String(G.score).padStart(7, '0'), 16, 54, 15, CREAM, 'left', );
  ptext('SERVICE ' + G.wave + '/' + MAXWAVE, W / 2, 54, 15, CREAM, 'center', );
  ptext('SUIVANT', W - 16, 46, 11, DIM, 'right', );
  ctx.imageSmoothingEnabled = false;
  for (let i = 0; i < 2 && i < G.queue.length; i++) {
    const q = G.queue[i], img = sprites[q.food], s = 9;
    let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    for (const c of q.cells) { minx = Math.min(minx, c.x); miny = Math.min(miny, c.y); maxx = Math.max(maxx, c.x); maxy = Math.max(maxy, c.y); }
    const ox = W - 62 + i * 30 - (maxx - minx + 1) * s / 2, oy = 62 - (maxy - miny + 1) * s / 2;
    if (img) for (const c of q.cells) ctx.drawImage(img, ox + (c.x - minx) * s, oy + (c.y - miny) * s, s, s);
  }
  ctx.imageSmoothingEnabled = true;
  ptext('DIGESTION ' + Math.min(G.linesWave, G.quota) + '/' + G.quota, 16, 82, 13, CREAM, 'left', );
  ctx.fillStyle = '#3a1d1f';
  ctx.fillRect(150, 74, 180, 14);
  ctx.fillStyle = '#9fe07a';
  ctx.fillRect(150, 74, 180 * Math.min(1, G.linesWave / G.quota), 14);
  // barre de nausée + halo
  if (G.waiting && G.mode === 'play') {
    ctx.fillStyle = 'rgba(140,220,90,' + (0.05 + 0.04 * Math.sin(G.time * 8)).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
    ptext('NAUSÉE', 16, 101, 13, '#c4e05f', 'left', );
    ctx.fillStyle = '#3a1d1f'; ctx.fillRect(90, 94, 110, 12);
    ctx.fillStyle = G.nausea > 0.7 ? '#ff7a5c' : '#c4e05f';
    ctx.fillRect(90, 94, 110 * Math.min(1, G.nausea), 12);
    if (G.burpCD <= 0 && Math.floor(G.time * 2) % 2 === 0) {
      ptext('ESPACE / TAP pour ROTER !', W / 2, FY + PH / 2 + 60, 14, CREAM, 'center', );
    }
  }

  let help = '←↑↓→ / swipe = péristaltisme · R = recommencer · P = pause';
  if (G.mode === 'title') help = 'ESPACE / TAP pour commencer';
  else if (G.mode === 'over' || G.mode === 'win') help = 'R / TAP pour recommencer';
  ptext(help, W / 2, H - 22, 10, DIM, 'center', );

  // ----- écrans -----
  if (G.mode === 'title') {
    ctx.fillStyle = 'rgba(10,4,5,0.88)';
    ctx.fillRect(0, 0, W, H);
    // mini-estomac pixel
    ctx.imageSmoothingEnabled = false;
    const ls = 120;
    ctx.drawImage(STOMACH_LOGO, W / 2 - ls / 2, 60, ls, ls);
    ctx.imageSmoothingEnabled = true;
    ptext('GARGANTUA', W / 2, 210, 58, CREAM, 'center', );
    ptext('1984 - l\'estomac qui n\'a jamais assez', W / 2, 263, 15, DIM, 'center', );
    ptext('Les plats descendent de l\'œsophage.', W / 2, 316, 16, '#e8d9b8', 'center', );
    ptext('Pas de rotation : TOI, tu diriges', W / 2, 342, 16, '#e8d9b8', 'center', );
    ptext('le PÉRISTALTISME : ← ↑ ↓ →', W / 2, 368, 16, '#e8d9b8', 'center', );
    ptext('Remplis une LIGNE pour DIGÉRER.', W / 2, 394, 16, '#e8d9b8', 'center', );
    ptext('L\'ACIDE MONTE À CHAQUE PLAT.', W / 2, 453, 15, '#c4e05f', 'center', );
    ptext('DIGÈRE POUR LE FAIRE REDESCENDRE.', W / 2, 475, 15, '#c4e05f', 'center', );
    ptext('PLAT COINCÉ ? ROTE OU TU DÉGUEULES.', W / 2, 501, 15, '#c4e05f', 'center', );
    if (Math.floor(G.time * 2) % 2 === 0) ptext('- ESPACE / TAP -', W / 2, 538, 18, CREAM, 'center', );
  } else if (G.mode === 'wavebreak') {
    ctx.fillStyle = 'rgba(10,4,5,0.72)';
    ctx.fillRect(0, FY, W, PH);
    ptext('SERVICE ' + G.wave + ' TERMINÉ', W / 2, FY + PH / 2 - 23, 30, CREAM, 'center', );
    ptext('à digérer : ' + QUOTAS[G.wave] + ' lignes', W / 2, FY + PH / 2 + 22, 16, '#e8d9b8', 'center', );
  } else if (G.mode === 'over') {
    ctx.fillStyle = 'rgba(10,4,5,0.85)';
    ctx.fillRect(0, 0, W, H);
    ptext('TU DÉGUEULES', W / 2, 245, 44, '#c4e05f', 'center', );
    ptext('score ' + G.score + ' · service ' + G.wave + ' · ' + G.lines + ' lignes', W / 2, 304, 16, '#e8d9b8', 'center', );
    if (Math.floor(G.time * 2) % 2 === 0) ptext('- R / TAP -', W / 2, 374, 18, CREAM, 'center', );
  } else if (G.mode === 'win') {
    ctx.fillStyle = 'rgba(10,4,5,0.85)';
    ctx.fillRect(0, 0, W, H);
    ptext('REPUS', W / 2, 242, 52, '#9fe07a', 'center', );
    ptext('score ' + G.score + ' · ' + G.lines + ' lignes digérées', W / 2, 304, 16, '#e8d9b8', 'center', );
    if (Math.floor(G.time * 2) % 2 === 0) ptext('- R / TAP -', W / 2, 374, 18, CREAM, 'center', );
  }
  if (G.paused && (G.mode === 'play' || G.mode === 'clearing')) {
    ctx.fillStyle = 'rgba(10,4,5,0.7)';
    ctx.fillRect(0, 0, W, H);
    ptext('PAUSE', W / 2, H / 2 - 14, 40, CREAM, 'center', );
  }
}

function startGame() {
  G.grid = newGrid();
  G.soak = newGrid();
  G.acid = 0; G.puke = [];
  G.queue = [genPiece(), genPiece(), genPiece()];
  G.score = 0; G.lines = 0; G.wave = 1;
  G.quota = QUOTAS[0]; G.linesWave = 0;
  G.clearInfo = null; G.popups = []; G.bubbles = [];
  G.nausea = 0; G.waiting = null; G.burpCD = 0;
  G.paused = false; G.pieces = 0;
  G.hintT = 10;
  G.mode = 'play';
  spawnPiece();
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000 || 0, 0.1);
  last = now;
  if (!G.paused) {
    if (G.hintT > 0) G.hintT -= dt;
    update(dt);
  }
  render();
}

// ---------- entrées ----------
const DIRS = {
  arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1],
  a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1]
};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (DIRS[k]) {
    if (!e.repeat) pressDir(k, DIRS[k][0], DIRS[k][1]);
    e.preventDefault(); return;
  }
  if ((k === ' ' || k === 'b') && G.waiting && G.mode === 'play' && !G.paused) {
    audio(); doBurp(); e.preventDefault(); return;
  }
  if (k === ' ' || k === 'enter') {
    audio();
    if (G.mode === 'title') startGame();
    else if (G.mode === 'over' || G.mode === 'win') startGame();
    e.preventDefault();
  } else if (k === 'r') {
    if (G.mode !== 'title') startGame();
  } else if (k === 'p' || k === 'escape') {
    if (G.mode === 'play' || G.mode === 'clearing') G.paused = !G.paused;
  }
});
window.addEventListener('keyup', e => {
  if (e.key.toLowerCase() === G.heldKey) G.heldKey = null;   // fin de l'auto-répétition
});

let tS = null;
canvas.addEventListener('touchstart', e => {
  audio();
  const t = e.touches[0];
  tS = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!tS) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - tS.x, dy = t.clientY - tS.y;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < 24) {
    if (G.mode === 'title' || G.mode === 'over' || G.mode === 'win') startGame();
    else if (G.waiting && G.mode === 'play') doBurp();
  } else {
    if (adx > ady) stepPiece(dx > 0 ? 1 : -1, 0);
    else stepPiece(0, dy > 0 ? 1 : -1);
  }
  tS = null;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
canvas.addEventListener('mousedown', () => {
  audio();
  if (G.mode === 'title' || G.mode === 'over' || G.mode === 'win') startGame();
  else if (G.waiting && G.mode === 'play') doBurp();
});

// ---------- debug / playtest ----------
window.GAME = {
  G: G,
  start: startGame,
  setG: (dx, dy) => pressDir('test', dx, dy),
  step: stepPiece,
  spawn: spawnPiece,
  setQuota: q => { G.quota = q; },
  acid: () => G.acid,
  nausea: () => G.nausea,
  burp: () => doBurp(),
  fillBottom: n => {
    for (let y = ROWS - 1; y >= ROWS - n; y--)
      for (let x = 0; x < COLS; x++) G.grid[y][x] = 1 + ((x + y) % 5);
  },
  fillMouth: () => { G.grid[0][4] = 1; G.grid[0][5] = 2; G.grid[1][4] = 3; },
  state: () => ({ mode: G.mode, score: G.score, lines: G.lines, wave: G.wave, pieces: G.pieces })
};

fit();
G.grid = newGrid();
requestAnimationFrame(frame);
</script>
