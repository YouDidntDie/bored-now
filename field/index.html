<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FIELD — a 1979 story, told twice</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; background:#04060b; overflow:hidden;
    position:fixed; inset:0; touch-action:none; overscroll-behavior:none;
    font-family:'Courier New', ui-monospace, monospace;
    -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #wrap { position:relative; line-height:0; }
  canvas { display:block; background:#04060b; touch-action:none; }
  #fx { position:absolute; inset:0; pointer-events:none; line-height:0;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,0.022) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 58%, rgba(0,0,5,0.42) 100%);
    mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fx"></div>
</div>
<script>
'use strict';
/* ================= FIELD =================
   A 1979 story, told twice. Be the ship, or be the rocks.
   PILOT  (1P): fly the ship, clear 8 waves of the crystal belt.
   FIELD  (1P): be the belt — shatter the AI pilot's 3 hulls.
   VERSUS (2P): ship vs field, same screen, best of 3 rounds.
   Single file, zero assets. Landscape-first, mobile-first.
*/

/* ---------- canvas: landscape arena, visualViewport contain-fit ---------- */
const W = 960, H = 540;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function fit() {
  const vv = window.visualViewport;
  const aw = Math.max(1, vv ? vv.width : window.innerWidth);
  const ah = Math.max(1, vv ? vv.height : window.innerHeight);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(aw / W, ah / H); // contain: never overflows the viewport
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(dpr * cw / W, 0, 0, dpr * ch / H, 0, 0);
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 60));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
fit();

/* ---------- audio: procedural, no assets ---------- */
let AC = null, master = null, muted = false, rumbleGain = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    } catch (e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(f0, f1, dur, type, vol, when) {
  if (!AC || muted) return;
  const t = (when || AC.currentTime);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, lp, hp) {
  if (!AC || muted) return;
  const t = AC.currentTime, n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  let node = src;
  if (lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node.connect(f); node = f; }
  if (hp) { const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; node.connect(f); node = f; }
  const g = AC.createGain();
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  node.connect(g); g.connect(master); src.start(t);
}
function ensureRumble() {
  if (rumbleGain || !AC) return;
  const len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200;
  rumbleGain = AC.createGain(); rumbleGain.gain.value = 0;
  src.connect(f); f.connect(rumbleGain); rumbleGain.connect(master); src.start();
}
const sShoot  = () => beep(880, 220, 0.09, 'square', 0.045);
const sBoom   = () => noiseBurst(0.35, 0.20, 900);
const sBigBoom= () => { noiseBurst(0.6, 0.30, 500); beep(90, 28, 0.5, 'sawtooth', 0.12); };
const sCrack  = () => { noiseBurst(0.12, 0.14, null, 1800); beep(320, 90, 0.14, 'triangle', 0.08); };
const sSpawn  = () => beep(140, 430, 0.16, 'triangle', 0.07);
const sHunter = () => beep(1200, 900, 0.22, 'sawtooth', 0.035);
const sUI     = () => beep(520, 780, 0.07, 'square', 0.06);
const sOver   = () => { beep(220, 55, 0.5, 'sawtooth', 0.11); beep(160, 40, 0.7, 'sawtooth', 0.10, AC ? AC.currentTime + 0.18 : 0); };
const sWin    = () => { const t = AC ? AC.currentTime : 0;
  [440, 554, 659, 880].forEach((f, i) => beep(f, f * 1.01, 0.16, 'square', 0.07, t + i * 0.13)); };
const sWaveClear = () => { const t = AC ? AC.currentTime : 0;
  [523, 659, 784].forEach((f, i) => beep(f, f, 0.12, 'triangle', 0.08, t + i * 0.09)); };
const sCombo  = n => beep(500 + n * 90, 900 + n * 90, 0.1, 'square', 0.06);
const sKlaxon = () => { beep(620, 620, 0.12, 'square', 0.05); beep(470, 470, 0.12, 'square', 0.05, AC ? AC.currentTime + 0.16 : 0); };

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function bounceEnt(p, r) {
  if (p.x < r + 6) { p.x = r + 6; p.vx = Math.abs(p.vx); }
  else if (p.x > W - r - 6) { p.x = W - r - 6; p.vx = -Math.abs(p.vx); }
  if (p.y < r + 6) { p.y = r + 6; p.vy = Math.abs(p.vy); }
  else if (p.y > H - r - 6) { p.y = H - r - 6; p.vy = -Math.abs(p.vy); }
}
function bounceBullet(b) {
  if (b.x < 3) { b.x = 3; b.vx = Math.abs(b.vx); }
  else if (b.x > W - 3) { b.x = W - 3; b.vx = -Math.abs(b.vx); }
  if (b.y < 3) { b.y = 3; b.vy = Math.abs(b.vy); }
  else if (b.y > H - 3) { b.y = H - 3; b.vy = -Math.abs(b.vy); }
}
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

/* ---------- input ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) {
    audio();
    if (e.code === 'KeyM') { muted = !muted; }
    if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
    if (e.code === 'Enter') primaryAction();
    if (e.code === 'KeyF' && state === 'play' && !paused && humanField()) tryHunter();
    if (state === 'menu') {
      if (e.code === 'KeyP') openHowto('pilot');
      if (e.code === 'KeyF') openHowto('field');
      if (e.code === 'KeyV') openHowto('versus');
    }
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
const pointers = new Map();
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); ensureRumble();
  const p = toGame(e);
  pointers.set(e.pointerId, { x: p.x, y: p.y });
  handleTap(p.x, p.y);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  const pt = pointers.get(e.pointerId); if (!pt) return;
  const p = toGame(e); pt.x = p.x; pt.y = p.y;
});
function releasePointer(e) { pointers.delete(e.pointerId); }
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('blur', () => { pointers.clear(); for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play' && !paused) paused = true;
});

/* ---------- state ---------- */
let state = 'menu';       // menu | howto | serve | play | roundEnd | matchEnd | gameOver | win
let stateT = 0, mode = 'pilot', howtoMode = 'pilot';
let paused = false, time = 0;
let ship = null, rocks = [], bullets = [], hunters = [], parts = [], rings = [], popups = [];
let score = 0, best = +(localStorage.getItem('field_best') || 0);
let bestTime = +(localStorage.getItem('field_best_time') || 0);
let lives = 3, aiLives = 3, aiLevel = 1, wave = 1, maxWave = 8;
let energy = 60, aiEnergy = 60;
let round = 1, wins = { ship: 0, field: 0 }, roundT = 60, roundWinner = null;
let comboN = 0, comboT = 0, matchT = 0, klaxonT = 0, hitstop = 0;
let banner = '', bannerT = 0, shake = 0;
let buttons = [];         // rebuilt every frame: {id,label,sub,x,y,w,h}

const humanShip  = () => mode === 'pilot' || mode === 'versus';
const humanField = () => mode === 'field' || mode === 'versus';
const SHIP_R = 10, RESPAWN_SAFE = 130;
const SHIP_PTS = [[18,0],[-2,-9],[-11,-17],[-8,-6],[-13,0],[-8,6],[-11,17],[-2,9]];
const SHIP_MINI = [[12,0],[-1,-6],[-7,-11],[-5,-4],[-9,0],[-5,4],[-7,11],[-1,6]];
const ROCK_COLORS = { 2: '#aef7ff', 1: '#7df9ff', 0: '#ffd166' };

/* ---------- entities ---------- */
function makeCrystal(r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU + rnd(-0.09, 0.09);
    const rr = r * rnd(0.84, 1.08);
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  const frac = [];
  for (let i = 0; i < 3; i++) {
    const v = pts[(Math.random() * 6) | 0];
    frac.push([[rnd(-r * 0.25, r * 0.25), rnd(-r * 0.25, r * 0.25)], [v[0] * 0.72, v[1] * 0.72]]);
  }
  return { pts, frac };
}
function spawnRock(x, y, size, vx, vy) {
  if (size === undefined) size = 2;
  const r = size === 2 ? 34 : size === 1 ? 20 : 10;
  const sp = size === 2 ? rnd(28, 55) : size === 1 ? rnd(70, 110) : rnd(50, 90);
  const a = rnd(0, TAU);
  if (parts.length > 420) return;
  rocks.push({
    x: x !== undefined ? x : rnd(60, W - 60), y: y !== undefined ? y : rnd(60, H - 60),
    vx: vx !== undefined ? vx : Math.cos(a) * sp,
    vy: vy !== undefined ? vy : Math.sin(a) * sp,
    r, size, crys: makeCrystal(r), rot: rnd(0, TAU), vr: rnd(-1.2, 1.2),
    fade: size === 0 ? 4.5 : Infinity,
  });
}
function splitRock(i, towardShip) {
  const rk = rocks[i]; if (!rk) return;
  rocks.splice(i, 1);
  burst(rk.x, rk.y, rk.size === 2 ? 16 : 10, '#bfe9f5');
  ring(rk.x, rk.y, rk.r, '#aef7ff');
  sCrack();
  if (rk.size === 0) return; // dust motes just dissolve
  const base = towardShip && ship ? Math.atan2(ship.y - rk.y, ship.x - rk.x) : null;
  for (let k = 0; k < 3; k++) {
    const a = base !== null ? base + (k - 1) * 0.95 + rnd(-0.22, 0.22) : rnd(0, TAU);
    const sp = rk.size === 2 ? rnd(75, 115) : rnd(55, 95);
    spawnRock(rk.x + rnd(-6, 6), rk.y + rnd(-6, 6), rk.size - 1,
      Math.cos(a) * sp, Math.sin(a) * sp);
  }
}
function resetShip(x, y) {
  ship = { x: x !== undefined ? x : W / 2, y: y !== undefined ? y : H / 2,
           vx: 0, vy: 0, ang: -Math.PI / 2, fireT: 0.4, inv: 2.5, thrust: false };
}
function resetEntities() {
  rocks = []; bullets = []; hunters = []; parts = []; rings = []; popups = [];
  comboN = 0; comboT = 0; hitstop = 0;
  energy = 60; aiEnergy = 60;
  resetShip();
}
function burst(x, y, n, color) {
  for (let i = 0; i < n && parts.length < 420; i++) {
    const a = rnd(0, TAU), sp = rnd(40, 240);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      t: 0, life: rnd(0.3, 0.8), color, r: rnd(1, 2.6) });
  }
}
function ring(x, y, r0, color) {
  rings.push({ x, y, r: r0 * 0.6, vr: r0 * 3.2 + 60, t: 0, life: 0.45, color });
}
function popup(x, y, txt, color) {
  popups.push({ x, y, txt, color: color || '#eafdff', t: 0, life: 1.1 });
  if (popups.length > 12) popups.shift();
}

/* ---------- mode setup ---------- */
function openHowto(m) { howtoMode = m; state = 'howto'; stateT = 0; sUI(); }
function startMode(m) {
  mode = m; score = 0; lives = 3; aiLives = 3; aiLevel = 1; wave = 1; matchT = 0;
  round = 1; wins = { ship: 0, field: 0 }; roundWinner = null;
  resetEntities();
  if (m === 'pilot') {
    spawnWave();
    banner = 'PILOT — CLEAR 8 WAVES'; bannerT = 2;
  } else if (m === 'field') {
    for (let i = 0; i < 4; i++) spawnRock();
    banner = 'FIELD — BREAK 3 HULLS'; bannerT = 2;
  } else {
    for (let i = 0; i < 5; i++) spawnRock();
    startRound();
    banner = 'VERSUS — SHIP VS FIELD'; bannerT = 2;
  }
  state = 'serve'; stateT = 0; paused = false;
  sUI();
}
function spawnWave() {
  const n = Math.min(3 + wave, 10);
  for (let i = 0; i < n; i++) {
    let x, y, tries = 0;
    do { x = rnd(60, W - 60); y = rnd(60, H - 60); tries++; }
    while (ship && dist2(x, y, ship.x, ship.y) < 210 * 210 && tries < 24);
    spawnRock(x, y, 2);
  }
  if (wave >= 3) spawnHunter(wave >= 6);
  if (wave >= 6) spawnHunter(true);
}
function startRound() {
  resetEntities();
  for (let i = 0; i < 5; i++) spawnRock();
  roundT = 60; stateT = 0; state = 'serve';
}
function nextRound(winner) {
  wins[winner]++;
  if (wins[winner] >= 2) {
    state = 'matchEnd'; stateT = 0;
    if (winner === 'ship') sWin(); else sOver();
  } else {
    round++;
    banner = winner === 'ship' ? 'SHIP SURVIVES THE ROUND' : 'FIELD TAKES THE ROUND';
    bannerT = 1.6; startRound();
  }
}
function endGame(kind) {
  state = kind; stateT = 0;
  if (kind === 'gameOver') {
    if (mode === 'pilot' && score > best) { best = score; localStorage.setItem('field_best', best); }
    sOver();
  } else {
    if (mode === 'pilot' && score > best) { best = score; localStorage.setItem('field_best', best); }
    if (mode === 'field' && (bestTime === 0 || matchT < bestTime)) {
      bestTime = matchT; localStorage.setItem('field_best_time', bestTime);
    }
    sWin();
  }
}
function toMenu() { state = 'menu'; stateT = 0; paused = false; sUI(); }
function primaryAction() {
  if (state === 'menu') openHowto('pilot');
  else if (state === 'howto') startMode(howtoMode);
  else if (state === 'matchEnd' || state === 'gameOver' || state === 'win') startMode(mode);
}

/* ---------- buttons & taps ---------- */
function addBtn(id, label, sub, x, y, w, h) { buttons.push({ id, label, sub, x, y, w, h }); }
function doButton(id) {
  sUI();
  if (id === 'pilot' || id === 'field' || id === 'versus') openHowto(id);
  else if (id === 'back') toMenu();
  else if (id === 'launch') startMode(howtoMode);
  else if (id === 'resume') paused = false;
  else if (id === 'restart') startMode(mode);
  else if (id === 'quit') toMenu();
  else if (id === 'rematch') startMode(mode);
  else if (id === 'tomenu') toMenu();
  else if (id === 'pause') paused = !paused;
  else if (id === 'mute') muted = !muted;
  else if (id === 'hunter') tryHunter();
}
function handleTap(x, y) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { doButton(b.id); return; }
  }
  if (state !== 'play' || paused) return;
  if (humanField()) {
    // versus: field commands the left half; ship steers on the right half
    if (mode === 'versus' && x >= W * 0.5) return;
    for (let i = rocks.length - 1; i >= 0; i--) {
      const rk = rocks[i];
      if (dist2(x, y, rk.x, rk.y) < (rk.r + 16) * (rk.r + 16)) {
        if (energy >= 15) { energy -= 15; ring(x, y, 10, '#ffd166'); splitRock(i, true); }
        else { popup(x, y, 'LOW ENERGY', '#ff5a3c'); sUI(); }
        return;
      }
    }
    if (energy >= 25 && rocks.length < 16) {
      if (!ship || dist2(x, y, ship.x, ship.y) > RESPAWN_SAFE * RESPAWN_SAFE) {
        energy -= 25; ring(x, y, 8, '#7df9ff'); spawnRock(x, y, 2); sSpawn();
      } else { popup(x, y, 'TOO CLOSE', '#ff5a3c'); sUI(); }
    } else if (energy < 25) { popup(x, y, 'LOW ENERGY', '#ff5a3c'); sUI(); }
  }
}
function tryHunter() {
  if (!humanField() || hunters.length > 0 || state !== 'play' || paused) return;
  if (energy >= 50) { energy -= 50; spawnHunter(true); }
  else sUI();
}
function spawnHunter(small) {
  const fromLeft = Math.random() < 0.5;
  hunters.push({
    x: fromLeft ? 40 : W - 40, y: rnd(90, H - 90),
    vx: (fromLeft ? 1 : -1) * rnd(70, 110), r: small ? 10 : 16,
    small: !!small, fireT: rnd(0.8, 1.4), wob: rnd(0, TAU),
  });
  ring(fromLeft ? 40 : W - 40, hunters[hunters.length - 1].y, 20, '#ffd166');
  sHunter();
}

/* ---------- per-frame update ---------- */
const SHIP_ACC = 460, SHIP_ROT = 4.0, FIRE_DT = 0.26;

function update(dt) {
  time += dt;
  if (state === 'menu' || state === 'howto' || state === 'matchEnd' || state === 'gameOver' || state === 'win') {
    stateT += dt; updateFx(dt); return;
  }
  stateT += dt;
  if (state === 'serve') { if (stateT > 1.6) state = 'play'; updateFx(dt); return; }
  if (state === 'roundEnd') { updateFx(dt); if (stateT > 1.8) nextRound(roundWinner); return; }
  if (paused) return;
  if (hitstop > 0) { hitstop -= dt; updateFx(dt * 0.15); return; }

  if (mode === 'versus') {
    roundT -= dt;
    if (roundT <= 0) { roundWinner = 'ship'; state = 'roundEnd'; stateT = 0; sWin(); return; }
  }
  if (mode === 'field') matchT += dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) comboN = 0; }

  /* --- ship --- */
  if (ship) {
    if (humanShip()) {
      let rot = 0, thrust = false;
      if (keys.ArrowLeft || keys.KeyA) rot -= 1;
      if (keys.ArrowRight || keys.KeyD) rot += 1;
      if (keys.ArrowUp || keys.KeyW) thrust = true;
      // touch: drag anywhere on the ship's side — the ship turns toward the
      // finger and burns. Pushing the finger right of the ship turns it right.
      for (const p of pointers.values()) {
        if (mode === 'versus' && p.x < W * 0.5) continue;
        const want = Math.atan2(p.y - ship.y, p.x - ship.x);
        const d = angDiff(ship.ang, want);
        rot = clamp(d * 3.2, -1, 1);
        thrust = true;
      }
      ship.ang += rot * SHIP_ROT * dt;
      if (thrust) {
        ship.vx += Math.cos(ship.ang) * SHIP_ACC * dt;
        ship.vy += Math.sin(ship.ang) * SHIP_ACC * dt;
        ship.thrust = true;
        if (Math.random() < 0.7) parts.push({
          x: ship.x - Math.cos(ship.ang) * 12, y: ship.y - Math.sin(ship.ang) * 12,
          vx: -Math.cos(ship.ang) * rnd(60, 150) + rnd(-30, 30),
          vy: -Math.sin(ship.ang) * rnd(60, 150) + rnd(-30, 30),
          t: 0, life: rnd(0.15, 0.35), color: '#ffb340', r: rnd(1, 2.6) });
      } else ship.thrust = false;
    } else {
      aiShip(dt);
    }
    ship.vx *= (1 - 0.28 * dt); ship.vy *= (1 - 0.28 * dt);
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    bounceEnt(ship, SHIP_R);
    if (ship.inv > 0) ship.inv -= dt;
    ship.fireT -= dt;
    if (ship.fireT <= 0) {
      ship.fireT = FIRE_DT;
      bullets.push({ x: ship.x + Math.cos(ship.ang) * 14, y: ship.y + Math.sin(ship.ang) * 14,
        vx: Math.cos(ship.ang) * 560 + ship.vx * 0.4,
        vy: Math.sin(ship.ang) * 560 + ship.vy * 0.4,
        t: 0, life: 1.1, r: 2.5, from: 'ship', color: '#eafdff' });

  if (rumbleGain) {
    const target = (ship && ship.thrust && !muted) ? 0.09 : 0;
    rumbleGain.gain.value += (target - rumbleGain.gain.value) * Math.min(1, dt * 8);
  }

  }

  /* --- field energy --- */

  /* --- rocks --- */
  for (let ri = rocks.length - 1; ri >= 0; ri--) {
    const rk = rocks[ri];
    rk.x += rk.vx * dt; rk.y += rk.vy * dt; rk.rot += rk.vr * dt;
    bounceEnt(rk, rk.r);

    if (s.x < s.r + 8) { s.x = s.r + 8; s.vx = Math.abs(s.vx); }

      const a = Math.atan2(ship.y - s.y, ship.x - s.x) + (s.small ? rnd(-0.1, 0.1) : rnd(-0.55, 0.55));
      bullets.push({ x: s.x, y: s.y, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250,

  /* --- bullets --- */

      const want = Math.atan2(ship.y - b.y, ship.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      const na = cur + clamp(angDiff(cur, want), -2.4 * dt, 2.4 * dt);
      const sp = Math.hypot(b.vx, b.vy);

}

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];

    if (p.t > p.life) parts.splice(i, 1);

  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += r.vr * dt; r.t += dt;
    if (r.t > r.life) rings.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 34 * dt; p.t += dt;
    if (p.t > p.life) popups.splice(i, 1);
  }
  if (shake > 0) shake -= dt * 3;
}

/* ---------- AI ship (FIELD mode): the pilot that learns ---------- */
let aiThinkT = 0, aiPlan = { rot: 0, thrust: false };
function aiShip(dt) {
  aiThinkT -= dt;
  if (aiThinkT <= 0) {
    aiThinkT = Math.max(0.14, 0.30 - aiLevel * 0.035); // sharper reactions per level
    let threat = null, td = 170 * 170;
    for (const rk of rocks) {
      if (rk.size === 0) continue;
      const d = dist2(rk.x, rk.y, ship.x, ship.y);
      if (d < td) { td = d; threat = rk; }
    }
    // also dodge incoming hunter sparks? the pilot only faces rocks here
    let want, thrust;
    if (threat) {
      const px = ship.x - threat.x - threat.vx * 0.35, py = ship.y - threat.y - threat.vy * 0.35;
      want = Math.atan2(py, px); thrust = true;
    } else if (rocks.length) {
      let nr = rocks[0], nd = 1e12;
      for (const rk of rocks) { const d = dist2(rk.x, rk.y, ship.x, ship.y); if (d < nd) { nd = d; nr = rk; } }
      want = Math.atan2(nr.y - ship.y, nr.x - ship.x) + rnd(-0.09, 0.09);
      thrust = nd > 200 * 200;
    } else { want = ship.ang; thrust = false; }
    const d = angDiff(ship.ang, want);
    aiPlan = { rot: clamp(d * 2.4, -1, 1), thrust };
  }
  const rotMul = Math.min(1.05, 0.78 + aiLevel * 0.06);
  const thrMul = Math.min(1.0, 0.86 + aiLevel * 0.05);
  ship.ang += aiPlan.rot * SHIP_ROT * rotMul * dt;
  if (aiPlan.thrust) {
    ship.vx += Math.cos(ship.ang) * SHIP_ACC * thrMul * dt;
    ship.vy += Math.sin(ship.ang) * SHIP_ACC * thrMul * dt;
    ship.thrust = true;
    if (Math.random() < 0.5) parts.push({
      x: ship.x - Math.cos(ship.ang) * 12, y: ship.y - Math.sin(ship.ang) * 12,
      vx: -Math.cos(ship.ang) * rnd(60, 130), vy: -Math.sin(ship.ang) * rnd(60, 130),
      t: 0, life: rnd(0.15, 0.3), color: '#ffb340', r: rnd(1, 2.2) });
  } else ship.thrust = false;
}

/* ---------- AI field (PILOT mode): the belt fights back ---------- */
let aiSpawnT = 2, aiSplitT = 5, aiHunterT = 20;
function aiField(dt) {
  aiSpawnT -= dt; aiSplitT -= dt; aiHunterT -= dt;
  if (aiSpawnT <= 0) {
    aiSpawnT = rnd(1.6, 2.6) - Math.min(wave * 0.08, 0.8);
    if (aiEnergy >= 25 && rocks.length < 12 && ship) {
      aiEnergy -= 25;
      const a = rnd(0, TAU);
      const x = clamp(ship.x + Math.cos(a) * rnd(230, 330), 60, W - 60);
      const y = clamp(ship.y + Math.sin(a) * rnd(230, 330), 60, H - 60);

        const d = dist2(rocks[i].x, rocks[i].y, ship.x, ship.y);
        if (d < bd) { bd = d; bi = i; }

/* ---------- collisions & outcomes ---------- */
function killShip() {
  if (!ship) return;
  burst(ship.x, ship.y, 26, '#ff5a3c'); burst(ship.x, ship.y, 12, '#ffffff');
  ring(ship.x, ship.y, 24, '#ff5a3c');

  } else if (mode === 'field') {
    aiLives--;

}
function addScore(base, x, y) {

function collisions(dt) {
  // ship bullets vs rocks + hunters

    const b = bullets[i];
    if (b.from !== 'ship') continue;
    let hit = false;
    for (let j = rocks.length - 1; j >= 0; j--) {
      const rk = rocks[j];
      if (dist2(b.x, b.y, rk.x, rk.y) < (rk.r + b.r) * (rk.r + b.r)) {
        const pts = rk.size === 2 ? 15 : rk.size === 1 ? 40 : 80;
        if (humanShip()) addScore(pts, rk.x, rk.y);
        const big = rk.size === 2;
        splitRock(j, false);
        if (big) { shake = Math.max(shake, 0.35); hitstop = Math.max(hitstop, 0.05); }
        hit = true; break;
      }
    }
    if (!hit) for (let j = hunters.length - 1; j >= 0; j--) {
      const s = hunters[j];
      if (dist2(b.x, b.y, s.x, s.y) < (s.r + b.r + 2) * (s.r + b.r + 2)) {
        burst(s.x, s.y, 16, '#ffd166'); ring(s.x, s.y, 14, '#ffd166'); sBoom();
        hunters.splice(j, 1);

        hit = true; break;

    }
    if (hit) bullets.splice(i, 1);
  }

  if (ship && ship.inv <= 0) {
    for (const rk of rocks) {
      if (rk.size === 0) continue;
      if (dist2(rk.x, rk.y, ship.x, ship.y) < (rk.r * 0.9 + SHIP_R) * (rk.r * 0.9 + SHIP_R)) {
        killShip(); break;

    }
  }
  // hunter sparks vs ship, hunter bodies vs ship
  if (ship && ship.inv <= 0) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.from !== 'hunter') continue;
      if (dist2(b.x, b.y, ship.x, ship.y) < (b.r + SHIP_R) * (b.r + SHIP_R)) {
        bullets.splice(i, 1); killShip(); break;
      }
    }
    if (ship) for (let j = hunters.length - 1; j >= 0; j--) {
      const s = hunters[j];
      if (dist2(s.x, s.y, ship.x, ship.y) < (s.r + SHIP_R) * (s.r + SHIP_R)) {
        burst(s.x, s.y, 14, '#ffd166'); hunters.splice(j, 1); killShip(); break;

  if (mode === 'pilot' && state === 'play' && rocks.length === 0 && hunters.length === 0 && ship) {
    if (wave >= maxWave) { endGame('win'); return; }
    wave++;
    banner = 'WAVE ' + wave + ' / ' + maxWave; bannerT = 1.6; sWaveClear();
    spawnWave();
  }
}

}

    ctx.fillStyle = '#eafdff'; ctx.fillText('AI HULL', 18, 74);
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = i < aiLives ? '#ff5a3c' : '#3a3f45'; ctx.lineWidth = 1.6;
      ctx.strokeRect(100 + i * 26, 62, 20, 14);
      if (i < aiLives) { ctx.fillStyle = '#ff5a3c'; ctx.fillRect(102 + i * 26, 64, 16, 10); }
    }
    ctx.strokeStyle = '#8a93a0'; ctx.lineWidth = 1.2;
    ctx.strokeRect(18, 92, 170, 12);
    ctx.fillStyle = '#7dff9a'; ctx.fillRect(20, 94, 166 * energy / 100, 8);
    ctx.fillStyle = '#54655c'; ctx.font = '12px "Courier New", monospace';
    ctx.fillText('tap rock 15 · tap space 25 · hunter 50', 18, 122);
  } else {
    ctx.fillStyle = '#8a93a0';
    ctx.fillText('SHIP ' + wins.ship + ' — ' + wins.field + ' FIELD', 18, 30);
    ctx.fillStyle = '#ffd166'; ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillText(Math.ceil(roundT) + 's', W / 2, 32);
    ctx.textAlign = 'left'; ctx.font = '14px "Courier New", monospace';
    ctx.strokeStyle = '#8a93a0'; ctx.lineWidth = 1.2;
    ctx.strokeRect(18, 44, 150, 12);
    ctx.fillStyle = '#7dff9a'; ctx.fillRect(20, 46, 146 * energy / 100, 8);
    ctx.save();
    ctx.strokeStyle = 'rgba(234,253,255,0.14)'; ctx.setLineDash([6, 8]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(W / 2, 44); ctx.lineTo(W / 2, H - 14); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(234,253,255,0.30)'; ctx.textAlign = 'center'; ctx.font = '12px "Courier New", monospace';
    ctx.fillText('FIELD', W / 4, 60); ctx.fillText('SHIP', W * 3 / 4, 60);
    ctx.textAlign = 'left'; ctx.restore();
  }
  // pause + mute (top right)
  const pb = { id: 'pause', label: paused ? '▶' : 'II', x: W - 64, y: 16, w: 48, h: 40 };
  const mb = { id: 'mute', label: muted ? 'M×' : 'M♪', x: W - 64, y: 62, w: 48, h: 40 };
  buttons.push(pb, mb);
  ctx.textAlign = 'center'; ctx.font = '15px "Courier New", monospace';
  for (const b of [pb, mb]) {
    ctx.strokeStyle = '#3a3f45'; ctx.lineWidth = 1.4;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#8a93a0';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + 26);
  }
  ctx.textAlign = 'left';
  // hunter button (human field)
  if (humanField() && state === 'play') {
    const hb = { id: 'hunter', label: 'HUNTER', sub: '50', x: 24, y: H - 84, w: 96, h: 64 };
    buttons.push(hb);
    const ok = energy >= 50 && hunters.length === 0;
    ctx.save();
    ctx.strokeStyle = ok ? '#ffd166' : '#3a3f45'; ctx.lineWidth = 1.8;
    ctx.shadowColor = ok ? 'rgba(255,209,102,0.5)' : 'transparent'; ctx.shadowBlur = ok ? 8 : 0;
    ctx.strokeRect(hb.x, hb.y, hb.w, hb.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = ok ? '#ffd166' : '#3a3f45'; ctx.textAlign = 'center';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText('HUNTER', hb.x + hb.w / 2, hb.y + 28);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillText('50', hb.x + hb.w / 2, hb.y + 48);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}
function drawServe() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eafdff'; ctx.font = 'bold 30px "Courier New", monospace';
  ctx.fillText(banner, W / 2, H / 2 - 30);
  ctx.font = '15px "Courier New", monospace'; ctx.fillStyle = '#8a93a0';
  const hints = {
    pilot: 'drag or arrows to fly — cannon fires on its own',
    field: 'tap crystals to shatter them · tap space to seed new ones',
    versus: 'P1 flies right half · P2 commands the left half',
  };
  ctx.fillText(hints[mode], W / 2, H / 2 + 8);
}
function drawPauseMenu() {
  buttons = [];
  ctx.fillStyle = 'rgba(4,6,11,0.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#eafdff'; ctx.font = 'bold 40px "Courier New", monospace';
  ctx.fillText('PAUSED', W / 2, 150);
  const defs = [
    ['resume', 'RESUME', 220], ['restart', 'RESTART', 296], ['quit', 'QUIT TO MENU', 372],
  ];
  for (const [id, label, y] of defs) {
    const b = { id, label, x: W / 2 - 170, y: y - 28, w: 340, h: 56 };
    buttons.push(b); drawButton(b);
  }
}
function drawEnd() {
  buttons = [];
  ctx.fillStyle = 'rgba(4,6,11,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  let title, color, lines = [];
  if (state === 'matchEnd') {
    const sw = wins.ship > wins.field;
    title = sw ? 'SHIP WINS' : 'FIELD WINS'; color = sw ? '#7dff9a' : '#ff5a3c';
    lines = ['rounds — ship ' + wins.ship + ' · field ' + wins.field];
  } else if (state === 'win') {
    color = '#7dff9a';
    if (mode === 'pilot') { title = 'BELT CLEARED'; lines = ['score ' + score, 'best ' + best]; }
    else { title = 'FIELD WINS'; lines = ['pilot down in ' + matchT.toFixed(1) + 's',
      bestTime > 0 ? 'best ' + bestTime.toFixed(1) + 's' : '']; }
  } else {
    color = '#ff5a3c'; title = 'GAME OVER';
    lines = ['score ' + score, 'best ' + best, 'reached wave ' + wave + '/' + maxWave];
  }
  ctx.fillStyle = color; ctx.font = 'bold 44px "Courier New", monospace';
  ctx.fillText(title, W / 2, 170);
  ctx.font = '16px "Courier New", monospace'; ctx.fillStyle = '#aeb9c2';
  lines.forEach((ln, i) => ln && ctx.fillText(ln, W / 2, 220 + i * 30));
  const rm = { id: 'rematch', label: mode === 'versus' ? 'REMATCH' : 'PLAY AGAIN', x: W / 2 - 200, y: 330, w: 180, h: 56 };
  const tm = { id: 'tomenu', label: 'MENU', x: W / 2 + 20, y: 330, w: 180, h: 56 };
  buttons.push(rm, tm); drawButton(rm); drawButton(tm);
}
function render(dt) {
  ctx.save();
  buttons = []; // every frame rebuilds its own buttons; no stale hits
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 6, rnd(-1, 1) * shake * 6);
  ctx.clearRect(-12, -12, W + 24, H + 24);
  if (state === 'menu') { drawBackdrop(dt); drawMenu(); ctx.restore(); return; }
  if (state === 'howto') { drawBackdrop(dt); drawHowto(); ctx.restore(); return; }
  drawBackdrop(dt);
  for (const rk of rocks) drawCrystal(rk);
  for (const s of hunters) drawHunter(s);
  if (ship) drawShip(ship);
  for (const b of bullets) {
    const spr = b.from === 'hunter' ? SPR_AMBER : SPR_WHITE;
    ctx.drawImage(spr, b.x - 12, b.y - 12, 24, 24);
  }
  for (const r of rings) {
    ctx.globalAlpha = clamp(1 - r.t / r.life, 0, 1);
    ctx.strokeStyle = r.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of parts) {
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  if (!(paused && state === 'play')) {
    for (const p of popups) {
      ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
      ctx.fillStyle = p.color; ctx.font = 'bold 15px "Courier New", monospace';
      ctx.fillText(p.txt, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  if (state === 'serve') drawServe();
  else drawHUD();
  if (bannerT > 0 && (state === 'play' || state === 'serve')) {
    ctx.globalAlpha = Math.min(1, bannerT * 1.4);
    ctx.fillStyle = '#eafdff'; ctx.textAlign = 'center';
    ctx.font = 'bold 30px "Courier New", monospace';
    ctx.fillText(banner, W / 2, H / 2 - 60);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  if (paused && state === 'play') drawPauseMenu();
  if (state === 'roundEnd') {
    ctx.fillStyle = '#eafdff'; ctx.textAlign = 'center';
    ctx.font = 'bold 30px "Courier New", monospace';
    ctx.fillText(roundWinner === 'ship' ? 'SHIP SURVIVES' : 'FIELD TAKES IT', W / 2, H / 2 - 20);
    ctx.font = '15px "Courier New", monospace'; ctx.fillStyle = '#8a93a0';
    ctx.fillText('ship ' + wins.ship + ' — ' + wins.field + ' field', W / 2, H / 2 + 16);
    ctx.textAlign = 'left';
  }
  if (state === 'matchEnd' || state === 'gameOver' || state === 'win') drawEnd();
  ctx.restore();
}

/* ---------- main loop ---------- */
let lastT = 0, acc = 0;
const DT = 1 / 60;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  let ft = Math.min(0.1, now - (lastT || now));
  lastT = now; acc += ft;
  while (acc >= DT) { update(DT); acc -= DT; if (bannerT > 0) bannerT -= DT; }
  render(Math.min(ft, 0.05));
}
requestAnimationFrame(frame);

/* ---------- debug hooks ---------- */
window.GAME = {
  get state() { return state; }, get mode() { return mode; }, get howtoMode() { return howtoMode; },
  get ship() { return ship; }, get rocks() { return rocks; },
  get bullets() { return bullets; }, get hunters() { return hunters; },
  get score() { return score; }, get lives() { return lives; },
  get aiLives() { return aiLives; }, get aiLevel() { return aiLevel; }, get wave() { return wave; },
  get energy() { return energy; }, set energy(v) { energy = v; },
  get wins() { return wins; }, get roundT() { return roundT; }, set roundT(v) { roundT = v; },
  get matchT() { return matchT; }, get best() { return best; }, get bestTime() { return bestTime; },
  get muted() { return muted; }, get paused() { return paused; },
  get comboN() { return comboN; }, get buttons() { return buttons; },
  W, H,
  startMode, openHowto, splitRock, spawnRock, tryHunter, spawnHunter, killShip, endGame, toMenu, doButton,
};
</script>
