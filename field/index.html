<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FIELD — a 1979 story, told twice</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; background:#04060b; overflow:hidden;
    position:fixed; inset:0; touch-action:none; overscroll-behavior:none;
    font-family:'Courier New', ui-monospace, monospace;
    -webkit-user-select:none; user-select:none; }
  body { display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #wrap { position:relative; line-height:0; }
  canvas { display:block; background:#04060b; touch-action:none; }
  #fx { position:absolute; inset:0; pointer-events:none; line-height:0;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,0.022) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 58%, rgba(0,0,5,0.42) 100%);
    mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="fx"></div>
</div>
<script>
'use strict';
/* ================= FIELD =================
   A 1979 story, told twice. Be the ship, or be the rocks.
   PILOT  (1P): fly the ship, clear 8 waves of the crystal belt.
   FIELD  (1P): be the belt — shatter the AI pilot's 3 hulls.
   VERSUS (2P): ship vs field, same screen, best of 3 rounds.
   Single file, zero assets. Landscape-first, mobile-first.
*/

/* ---------- canvas: responsive arena + pixel buffer ---------- */
const PX = 2;                                  // 1 "pixel" = 2px logiques
let W = 960, H = 540;
const canvas = document.getElementById('c');
const dctx = canvas.getContext('2d');          // écran : composite final
const pbuf = document.createElement('canvas'); // tout le jeu dessine ici,
const ctx = pbuf.getContext('2d');             // en unités logiques
function layout() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth;
  const vh = vv ? vv.height : window.innerHeight;
  if (vw / vh >= 1) { W = 960; H = 540; }      // landscape-first
  else { W = 540; H = 800; }                   // portrait
  pbuf.width = Math.ceil(W / PX); pbuf.height = Math.ceil(H / PX);
  ctx.setTransform(1 / PX, 0, 0, 1 / PX, 0, 0); // coords logiques -> pixels du buffer
}
function fit() {
  const oldW = W, oldH = H;
  layout();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth;
  const vh = vv ? vv.height : window.innerHeight;
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  dctx.imageSmoothingEnabled = false;
  dctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  // remap proportionnel : rien ne se téléporte quand on pivote mid-game
  // (fit() n'est appelé qu'après l'init complète du script)
  const sx = W / oldW, sy = H / oldH;
  if (sx !== 1 || sy !== 1) {
    const remap = o => { if (o && 'x' in o) { o.x = clamp(o.x * sx, 0, W); o.y = clamp(o.y * sy, 0, H); } };
    if (ship) remap(ship);
    rocks.forEach(remap); bullets.forEach(remap); hunters.forEach(remap);
    parts.forEach(remap); rings.forEach(remap); popups.forEach(remap);
  }
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 60));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);

/* ================= police pixel 5x7 ================= */
const FONT5X7 = {
'A': ["01110","10001","10001","11111","10001","10001","10001"],
'B': ["11110","10001","10001","11110","10001","10001","11110"],
'C': ["01110","10001","10000","10000","10000","10001","01110"],
'D': ["11110","10001","10001","10001","10001","10001","11110"],
'E': ["11111","10000","10000","11110","10000","10000","11111"],
'F': ["11111","10000","10000","11110","10000","10000","10000"],
'G': ["01110","10001","10000","10111","10001","10001","01111"],
'H': ["10001","10001","10001","11111","10001","10001","10001"],
'I': ["01110","00100","00100","00100","00100","00100","01110"],
'J': ["00111","00010","00010","00010","00010","10010","01100"],
'K': ["10001","10010","10100","11000","10100","10010","10001"],
'L': ["10000","10000","10000","10000","10000","10000","11111"],
'M': ["10001","11011","10101","10101","10001","10001","10001"],
'N': ["10001","11001","10101","10011","10001","10001","10001"],
'O': ["01110","10001","10001","10001","10001","10001","01110"],
'P': ["11110","10001","10001","11110","10000","10000","10000"],
'Q': ["01110","10001","10001","10001","10101","10010","01101"],
'R': ["11110","10001","10001","11110","10100","10010","10001"],
'S': ["01111","10000","10000","01110","00001","00001","11110"],
'T': ["11111","00100","00100","00100","00100","00100","00100"],
'U': ["10001","10001","10001","10001","10001","10001","01110"],
'V': ["10001","10001","10001","10001","10001","01010","00100"],
'W': ["10001","10001","10001","10101","10101","11011","10001"],
'X': ["10001","10001","01010","00100","01010","10001","10001"],
'Y': ["10001","10001","01010","00100","00100","00100","00100"],
'Z': ["11111","00001","00010","00100","01000","10000","11111"],
'0': ["01110","10001","10011","10101","11001","10001","01110"],
'1': ["00100","01100","00100","00100","00100","00100","01110"],
'2': ["01110","10001","00001","00110","01000","10000","11111"],
'3': ["11111","00010","00100","00010","00001","10001","01110"],
'4': ["00010","00110","01010","10010","11111","00010","00010"],
'5': ["11111","10000","11110","00001","00001","10001","01110"],
'6': ["00110","01000","10000","11110","10001","10001","01110"],
'7': ["11111","00001","00010","00100","01000","01000","01000"],
'8': ["01110","10001","10001","01110","10001","10001","01110"],
'9': ["01110","10001","10001","01111","00001","00010","01100"],
"'": ["00100","00100","00100","00000","00000","00000","00000"],
'"': ["01010","01010","01010","00000","00000","00000","00000"],
'.': ["00000","00000","00000","00000","00000","00110","00110"],
'!': ["00100","00100","00100","00100","00100","00000","00100"],
'?': ["01110","10001","00001","00010","00100","00000","00100"],
':': ["00000","00110","00110","00000","00110","00110","00000"],
'/': ["00001","00010","00010","00100","01000","01000","10000"],
'(': ["01000","00100","00010","00010","00010","00100","01000"],
')': ["01000","00100","00010","00010","00010","00100","01000"],
'-': ["00000","00000","00000","11111","00000","00000","00000"],
'+': ["00000","00100","00100","11111","00100","00100","00000"],
'<': ["00010","00100","01000","10000","01000","00100","00010"],
'×': ["00000","10001","01010","00100","01010","10001","00000"],
'·': ["00000","00000","00110","00110","00000","00000","00000"],
'—': ["00000","00000","00000","11111","00000","00000","00000"],
',': ["00000","00000","00000","00000","00110","00100","01000"],
'←': ["00100","01000","11111","01000","00100","00000","00000"],
'→': ["00100","00010","11111","00010","00100","00000","00000"],
'▶': ["10000","11000","11100","11110","11100","11000","10000"],
'❚': ["01100","01100","01100","01100","01100","01100","01100"],
'♪': ["00110","00101","00100","00100","01100","11100","01100"],
'✕': ["10001","01010","00100","01010","10001","00000","00000"]
};
function drawPixText(str, dx, y0, u) {
  let cx = dx;
  for (const ch of str) {
    const gl = ch === ' ' ? null : (FONT5X7[ch] || FONT5X7['?']);
    if (gl) for (let r = 0; r < gl.length; r++) {
      const row = gl[r];
      for (let c = 0; c < 5; c++)
        if (row[c] === '1') ctx.fillRect(cx + c * u, y0 + r * u, u, u);
    }
    cx += ch === ' ' ? 4 * u : 6 * u;
  }
}
// texte pixel : 'font' garde la forme '700 23px ...' — on n'en lit que la taille.
// u = unité de police en px logiques, multiple de PX pour tomber sur la grille.
function text(str, x, y, font, color, glow, glowBlur, align) {
  str = String(str).toUpperCase();
  ctx.shadowBlur = 0;   // pas de halo doux hérité : le glow est pixel, dessiné à la main
  const m = /(\d+)px/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of str) w += ch === ' ' ? 4 * u : 6 * u;
  let dx = align === 'right' ? x - w : align === 'left' ? x : x - w / 2;
  dx = Math.round(dx / PX) * PX;
  const y0 = Math.round((y - 3.5 * u) / PX) * PX;
  if (glow) {  // halo pixel : 8 voisins, d'autant plus doux que le texte est petit
    ctx.fillStyle = glow;
    const ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * Math.min(1, Math.max(0.32, u / 18));
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      if (!ox && !oy) continue;
      drawPixText(str, dx + ox * u, y0 + oy * u, u);
    }
    ctx.globalAlpha = ga;
  }
  ctx.fillStyle = color;
  drawPixText(str, dx, y0, u);
}
// largeur d'un texte pixel (pour les pastilles qui s'ajustent au contenu)
function pixW(str, font) {
  const m = /(\d+)px/.exec(font || '');
  const size = m ? +m[1] : 16;
  const u = Math.max(PX, Math.round(size / 7 / PX) * PX);
  let w = 0;
  for (const ch of String(str).toUpperCase()) w += ch === ' ' ? 4 * u : 6 * u;
  return w;
}

/* ---------- audio: procedural, no assets ---------- */
let AC = null, master = null, muted = false, rumbleGain = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    } catch (e) {}
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(f0, f1, dur, type, vol, when) {
  if (!AC || muted) return;
  const t = (when || AC.currentTime);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, lp, hp) {
  if (!AC || muted) return;
  const t = AC.currentTime, n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  let node = src;
  if (lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; node.connect(f); node = f; }
  if (hp) { const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; node.connect(f); node = f; }
  const g = AC.createGain();
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  node.connect(g); g.connect(master); src.start(t);
}
function ensureRumble() {
  if (rumbleGain || !AC) return;
  const len = AC.sampleRate, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 200;
  rumbleGain = AC.createGain(); rumbleGain.gain.value = 0;
  src.connect(f); f.connect(rumbleGain); rumbleGain.connect(master); src.start();
}
const sShoot  = () => beep(880, 220, 0.09, 'square', 0.045);
const sBoom   = () => noiseBurst(0.35, 0.20, 900);
const sBigBoom= () => { noiseBurst(0.6, 0.30, 500); beep(90, 28, 0.5, 'sawtooth', 0.12); };
const sCrack  = () => { noiseBurst(0.12, 0.14, null, 1800); beep(320, 90, 0.14, 'triangle', 0.08); };
const sSpawn  = () => beep(140, 430, 0.16, 'triangle', 0.07);
const sHunter = () => beep(1200, 900, 0.22, 'sawtooth', 0.035);
const sUI     = () => beep(520, 780, 0.07, 'square', 0.06);
const sOver   = () => { beep(220, 55, 0.5, 'sawtooth', 0.11); beep(160, 40, 0.7, 'sawtooth', 0.10, AC ? AC.currentTime + 0.18 : 0); };
const sWin    = () => { const t = AC ? AC.currentTime : 0;
  [440, 554, 659, 880].forEach((f, i) => beep(f, f * 1.01, 0.16, 'square', 0.07, t + i * 0.13)); };
const sWaveClear = () => { const t = AC ? AC.currentTime : 0;
  [523, 659, 784].forEach((f, i) => beep(f, f, 0.12, 'triangle', 0.08, t + i * 0.09)); };
const sCombo  = n => beep(500 + n * 90, 900 + n * 90, 0.1, 'square', 0.06);
const sKlaxon = () => { beep(620, 620, 0.12, 'square', 0.05); beep(470, 470, 0.12, 'square', 0.05, AC ? AC.currentTime + 0.16 : 0); };

/* ---------- helpers ---------- */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
function bounceEnt(p, r) {
  if (p.x < r + 6) { p.x = r + 6; p.vx = Math.abs(p.vx); }
  else if (p.x > W - r - 6) { p.x = W - r - 6; p.vx = -Math.abs(p.vx); }
  if (p.y < r + 6) { p.y = r + 6; p.vy = Math.abs(p.vy); }
  else if (p.y > H - r - 6) { p.y = H - r - 6; p.vy = -Math.abs(p.vy); }
}
function bounceBullet(b) {
  if (b.x < 3) { b.x = 3; b.vx = Math.abs(b.vx); }
  else if (b.x > W - 3) { b.x = W - 3; b.vx = -Math.abs(b.vx); }
  if (b.y < 3) { b.y = 3; b.vy = Math.abs(b.vy); }
  else if (b.y > H - 3) { b.y = H - 3; b.vy = -Math.abs(b.vy); }
}
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

/* ---------- input ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!e.repeat) {
    audio();
    if (e.code === 'KeyM') { muted = !muted; }
    if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') paused = !paused;
    if (e.code === 'Enter') primaryAction();
    if (e.code === 'KeyF' && state === 'play' && !paused && humanField()) tryHunter();
    if (state === 'menu') {
      if (e.code === 'KeyP') openHowto('pilot');
      if (e.code === 'KeyF') openHowto('field');
      if (e.code === 'KeyV') openHowto('versus');
    }
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
const pointers = new Map();
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); ensureRumble();
  const p = toGame(e);
  pointers.set(e.pointerId, { x: p.x, y: p.y });
  handleTap(p.x, p.y);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  const pt = pointers.get(e.pointerId); if (!pt) return;
  const p = toGame(e); pt.x = p.x; pt.y = p.y;
});
function releasePointer(e) { pointers.delete(e.pointerId); }
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('blur', () => { pointers.clear(); for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play' && !paused) paused = true;
});

/* ---------- state ---------- */
let state = 'menu';       // menu | howto | serve | play | roundEnd | matchEnd | gameOver | win
let stateT = 0, mode = 'pilot', howtoMode = 'pilot';
let paused = false, time = 0;
let ship = null, rocks = [], bullets = [], hunters = [], parts = [], rings = [], popups = [];
let score = 0, best = +(localStorage.getItem('field_best') || 0);
let bestTime = +(localStorage.getItem('field_best_time') || 0);
let lives = 3, aiLives = 3, aiLevel = 1, wave = 1, maxWave = 8;
let energy = 60, aiEnergy = 60;
let round = 1, wins = { ship: 0, field: 0 }, roundT = 60, roundWinner = null;
let comboN = 0, comboT = 0, matchT = 0, klaxonT = 0, hitstop = 0;
let banner = '', bannerT = 0, shake = 0;
let buttons = [];         // rebuilt every frame: {id,label,sub,x,y,w,h}

const humanShip  = () => mode === 'pilot' || mode === 'versus';
const humanField = () => mode === 'field' || mode === 'versus';
const SHIP_R = 10, RESPAWN_SAFE = 130;
const SHIP_PTS = [[18,0],[-2,-9],[-11,-17],[-8,-6],[-13,0],[-8,6],[-11,17],[-2,9]];
const SHIP_MINI = [[12,0],[-1,-6],[-7,-11],[-5,-4],[-9,0],[-5,4],[-7,11],[-1,6]];
const ROCK_COLORS = { 2: '#aef7ff', 1: '#7df9ff', 0: '#ffd166' };

/* ---------- entities ---------- */
function makeCrystal(r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU + rnd(-0.09, 0.09);
    const rr = r * rnd(0.84, 1.08);
    pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  const frac = [];
  for (let i = 0; i < 3; i++) {
    const v = pts[(Math.random() * 6) | 0];
    frac.push([[rnd(-r * 0.25, r * 0.25), rnd(-r * 0.25, r * 0.25)], [v[0] * 0.72, v[1] * 0.72]]);
  }
  return { pts, frac };
}
function spawnRock(x, y, size, vx, vy) {
  if (size === undefined) size = 2;
  const r = size === 2 ? 34 : size === 1 ? 20 : 10;
  const sp = size === 2 ? rnd(28, 55) : size === 1 ? rnd(70, 110) : rnd(50, 90);
  const a = rnd(0, TAU);
  if (parts.length > 420) return;
  rocks.push({
    x: x !== undefined ? x : rnd(60, W - 60), y: y !== undefined ? y : rnd(60, H - 60),
    vx: vx !== undefined ? vx : Math.cos(a) * sp,
    vy: vy !== undefined ? vy : Math.sin(a) * sp,
    r, size, crys: makeCrystal(r), rot: rnd(0, TAU), vr: rnd(-1.2, 1.2),
    fade: size === 0 ? 4.5 : Infinity,
  });
}
function splitRock(i, towardShip) {
  const rk = rocks[i]; if (!rk) return;
  rocks.splice(i, 1);
  burst(rk.x, rk.y, rk.size === 2 ? 16 : 10, '#bfe9f5');
  ring(rk.x, rk.y, rk.r, '#aef7ff');
  sCrack();
  if (rk.size === 0) return; // dust motes just dissolve
  const base = towardShip && ship ? Math.atan2(ship.y - rk.y, ship.x - rk.x) : null;
  for (let k = 0; k < 3; k++) {
    const a = base !== null ? base + (k - 1) * 0.95 + rnd(-0.22, 0.22) : rnd(0, TAU);
    const sp = rk.size === 2 ? rnd(75, 115) : rnd(55, 95);
    spawnRock(rk.x + rnd(-6, 6), rk.y + rnd(-6, 6), rk.size - 1,
      Math.cos(a) * sp, Math.sin(a) * sp);
  }
}
function resetShip(x, y) {
  ship = { x: x !== undefined ? x : W / 2, y: y !== undefined ? y : H / 2,
           vx: 0, vy: 0, ang: -Math.PI / 2, fireT: 0.4, inv: 2.5, thrust: false };
}
function resetEntities() {
  rocks = []; bullets = []; hunters = []; parts = []; rings = []; popups = [];
  comboN = 0; comboT = 0; hitstop = 0;
  energy = 60; aiEnergy = 60;
  resetShip();
}
function burst(x, y, n, color) {
  for (let i = 0; i < n && parts.length < 420; i++) {
    const a = rnd(0, TAU), sp = rnd(40, 240);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      t: 0, life: rnd(0.3, 0.8), color, r: rnd(1, 2.6) });
  }
}
function ring(x, y, r0, color) {
  rings.push({ x, y, r: r0 * 0.6, vr: r0 * 3.2 + 60, t: 0, life: 0.45, color });
}
function popup(x, y, txt, color) {
  popups.push({ x, y, txt, color: color || '#eafdff', t: 0, life: 1.1 });
  if (popups.length > 12) popups.shift();
}

/* ---------- mode setup ---------- */
function openHowto(m) { howtoMode = m; state = 'howto'; stateT = 0; sUI(); }
function startMode(m) {
  mode = m; score = 0; lives = 3; aiLives = 3; aiLevel = 1; wave = 1; matchT = 0;
  round = 1; wins = { ship: 0, field: 0 }; roundWinner = null;
  resetEntities();
  if (m === 'pilot') {
    spawnWave();
    banner = 'PILOT — CLEAR 8 WAVES'; bannerT = 2;
  } else if (m === 'field') {
    for (let i = 0; i < 4; i++) spawnRock();

  } else {

}
function spawnWave() {
  const n = Math.min(3 + wave, 10);
  for (let i = 0; i < n; i++) {
    let x, y, tries = 0;
    do { x = rnd(60, W - 60); y = rnd(60, H - 60); tries++; }
    while (ship && dist2(x, y, ship.x, ship.y) < 210 * 210 && tries < 24);

  if (wave >= 6) spawnHunter(true);
}
function startRound() {

  roundT = 60; stateT = 0; state = 'serve';
}
function nextRound(winner) {

    if (winner === 'ship') sWin(); else sOver();

    bannerT = 1.6; startRound();

}
function endGame(kind) {

function toMenu() { state = 'menu'; stateT = 0; paused = false; sUI(); }

/* ---------- buttons & taps ---------- */
function addBtn(id, label, sub, x, y, w, h) { buttons.push({ id, label, sub, x, y, w, h }); }

function handleTap(x, y) {

  }

      if (dist2(x, y, rk.x, rk.y) < (rk.r + 16) * (rk.r + 16)) {

      } else { popup(x, y, 'TOO CLOSE', '#ff5a3c'); sUI(); }

function tryHunter() {

function spawnHunter(small) {

/* ---------- per-frame update ---------- */
const SHIP_ACC = 460, SHIP_ROT = 4.0, FIRE_DT = 0.26;

function update(dt) {
  time += dt;
  if (state === 'menu' || state === 'howto' || state === 'matchEnd' || state === 'gameOver' || state === 'win') {
    stateT += dt; updateFx(dt); return;
  }
  stateT += dt;
  if (state === 'serve') { if (stateT > 1.6) state = 'play'; updateFx(dt); return; }
  if (state === 'roundEnd') { updateFx(dt); if (stateT > 1.8) nextRound(roundWinner); return; }
  if (paused) return;
  if (hitstop > 0) { hitstop -= dt; updateFx(dt * 0.15); return; }

  if (mode === 'versus') {
    roundT -= dt;
    if (roundT <= 0) { roundWinner = 'ship'; state = 'roundEnd'; stateT = 0; sWin(); return; }
  }
  if (mode === 'field') matchT += dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) comboN = 0; }

  /* --- ship --- */
  if (ship) {
    if (humanShip()) {
      let rot = 0, thrust = false;
      if (keys.ArrowLeft || keys.KeyA) rot -= 1;
      if (keys.ArrowRight || keys.KeyD) rot += 1;
      if (keys.ArrowUp || keys.KeyW) thrust = true;
      // touch: drag anywhere on the ship's side — the ship turns toward the
      // finger and burns. Pushing the finger right of the ship turns it right.
      for (const p of pointers.values()) {
        if (mode === 'versus' && p.x < W * 0.5) continue;
        const want = Math.atan2(p.y - ship.y, p.x - ship.x);
        const d = angDiff(ship.ang, want);
        rot = clamp(d * 3.2, -1, 1);
        thrust = true;
      }
      ship.ang += rot * SHIP_ROT * dt;
      if (thrust) {
        ship.vx += Math.cos(ship.ang) * SHIP_ACC * dt;
        ship.vy += Math.sin(ship.ang) * SHIP_ACC * dt;
        ship.thrust = true;
        if (Math.random() < 0.7) parts.push({
          x: ship.x - Math.cos(ship.ang) * 12, y: ship.y - Math.sin(ship.ang) * 12,
          vx: -Math.cos(ship.ang) * rnd(60, 150) + rnd(-30, 30),
          vy: -Math.sin(ship.ang) * rnd(60, 150) + rnd(-30, 30),
          t: 0, life: rnd(0.15, 0.35), color: '#ffb340', r: rnd(1, 2.6) });
      } else ship.thrust = false;
    } else {
      aiShip(dt);
    }
    ship.vx *= (1 - 0.28 * dt); ship.vy *= (1 - 0.28 * dt);
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    bounceEnt(ship, SHIP_R);
    if (ship.inv > 0) ship.inv -= dt;
    ship.fireT -= dt;
    if (ship.fireT <= 0) {
      ship.fireT = FIRE_DT;
      bullets.push({ x: ship.x + Math.cos(ship.ang) * 14, y: ship.y + Math.sin(ship.ang) * 14,
        vx: Math.cos(ship.ang) * 560 + ship.vx * 0.4,
        vy: Math.sin(ship.ang) * 560 + ship.vy * 0.4,
        t: 0, life: 1.1, r: 2.5, from: 'ship', color: '#eafdff' });
      sShoot();
    }
  }
  // thrust rumble follows the burn
  if (rumbleGain) {
    const target = (ship && ship.thrust && !muted) ? 0.09 : 0;
    rumbleGain.gain.value += (target - rumbleGain.gain.value) * Math.min(1, dt * 8);
  }
  // hunter warning klaxon (pilot mode)
  if (mode === 'pilot' && hunters.length > 0 && ship) {
    klaxonT -= dt;
    if (klaxonT <= 0) { klaxonT = 1.5; sKlaxon(); }
  }

  /* --- field energy --- */
  energy = Math.min(100, energy + 14 * dt);
  aiEnergy = Math.min(100, aiEnergy + 14 * dt);
  if (!humanField()) aiField(dt);

  /* --- rocks --- */
  for (let ri = rocks.length - 1; ri >= 0; ri--) {
    const rk = rocks[ri];
    rk.x += rk.vx * dt; rk.y += rk.vy * dt; rk.rot += rk.vr * dt;
    bounceEnt(rk, rk.r);
    if (rk.size === 0) {
      rk.fade -= dt;
      if (rk.fade <= 0) { burst(rk.x, rk.y, 5, '#bfe9f5'); rocks.splice(ri, 1); }
    }
  }

  /* --- hunters --- */
  for (let i = hunters.length - 1; i >= 0; i--) {
    const s = hunters[i];
    s.wob += dt * 3; s.x += s.vx * dt; s.y += Math.sin(s.wob) * 34 * dt;
    if (s.x < s.r + 8) { s.x = s.r + 8; s.vx = Math.abs(s.vx); }
    else if (s.x > W - s.r - 8) { s.x = W - s.r - 8; s.vx = -Math.abs(s.vx); }
    if (s.y < 70) s.y = 70; else if (s.y > H - 70) s.y = H - 70;
    s.fireT -= dt;
    if (s.fireT <= 0 && ship && ship.inv <= 0) {
      s.fireT = (s.small ? 1.15 : 1.7) * Math.max(0.5, 1 - wave * 0.04);
      const a = Math.atan2(ship.y - s.y, ship.x - s.x) + (s.small ? rnd(-0.1, 0.1) : rnd(-0.55, 0.55));
      bullets.push({ x: s.x, y: s.y, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250,
        t: 0, life: 2.4, r: 3, from: 'hunter', color: '#ffb340' });
      beep(700, 500, 0.08, 'square', 0.04);
    }
  }

  /* --- bullets --- */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.from === 'hunter' && ship) {
      const want = Math.atan2(ship.y - b.y, ship.x - b.x);
      const cur = Math.atan2(b.vy, b.vx);
      const na = cur + clamp(angDiff(cur, want), -2.4 * dt, 2.4 * dt);
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.t += dt;
    bounceBullet(b);
    if (b.t > b.life) bullets.splice(i, 1);
  }

  updateFx(dt);
  collisions(dt);
}

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.t += dt;
    if (p.t > p.life) parts.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += r.vr * dt; r.t += dt;
    if (r.t > r.life) rings.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 34 * dt; p.t += dt;
    if (p.t > p.life) popups.splice(i, 1);
  }
  if (shake > 0) shake -= dt * 3;
}

/* ---------- AI ship (FIELD mode): the pilot that learns ---------- */
let aiThinkT = 0, aiPlan = { rot: 0, thrust: false };
function aiShip(dt) {
  aiThinkT -= dt;
  if (aiThinkT <= 0) {
    aiThinkT = Math.max(0.14, 0.30 - aiLevel * 0.035); // sharper reactions per level
    let threat = null, td = 170 * 170;
    for (const rk of rocks) {
      if (rk.size === 0) continue;
      const d = dist2(rk.x, rk.y, ship.x, ship.y);
      if (d < td) { td = d; threat = rk; }
    }
    // also dodge incoming hunter sparks? the pilot only faces rocks here
    let want, thrust;
    if (threat) {
      const px = ship.x - threat.x - threat.vx * 0.35, py = ship.y - threat.y - threat.vy * 0.35;
      want = Math.atan2(py, px); thrust = true;
    } else if (rocks.length) {
      let nr = rocks[0], nd = 1e12;
      for (const rk of rocks) { const d = dist2(rk.x, rk.y, ship.x, ship.y); if (d < nd) { nd = d; nr = rk; } }
      want = Math.atan2(nr.y - ship.y, nr.x - ship.x) + rnd(-0.09, 0.09);
      thrust = nd > 200 * 200;
    } else { want = ship.ang; thrust = false; }
    const d = angDiff(ship.ang, want);
    aiPlan = { rot: clamp(d * 2.4, -1, 1), thrust };
  }
  const rotMul = Math.min(1.05, 0.78 + aiLevel * 0.06);
  const thrMul = Math.min(1.0, 0.86 + aiLevel * 0.05);
  ship.ang += aiPlan.rot * SHIP_ROT * rotMul * dt;
  if (aiPlan.thrust) {
    ship.vx += Math.cos(ship.ang) * SHIP_ACC * thrMul * dt;
    ship.vy += Math.sin(ship.ang) * SHIP_ACC * thrMul * dt;
    ship.thrust = true;
    if (Math.random() < 0.5) parts.push({
      x: ship.x - Math.cos(ship.ang) * 12, y: ship.y - Math.sin(ship.ang) * 12,
      vx: -Math.cos(ship.ang) * rnd(60, 130), vy: -Math.sin(ship.ang) * rnd(60, 130),
      t: 0, life: rnd(0.15, 0.3), color: '#ffb340', r: rnd(1, 2.2) });
  } else ship.thrust = false;
}

/* ---------- AI field (PILOT mode): the belt fights back ---------- */
let aiSpawnT = 2, aiSplitT = 5, aiHunterT = 20;
function aiField(dt) {
  aiSpawnT -= dt; aiSplitT -= dt; aiHunterT -= dt;
  if (aiSpawnT <= 0) {
    // the belt fights back — but slowly enough that a sharp pilot outpaces it
    aiSpawnT = rnd(6.5, 9.5) - Math.min(wave * 0.08, 0.8);
    if (aiEnergy >= 25 && rocks.length < 12 && ship) {
      aiEnergy -= 25;
      const a = rnd(0, TAU);
      const x = clamp(ship.x + Math.cos(a) * rnd(230, 330), 60, W - 60);
      const y = clamp(ship.y + Math.sin(a) * rnd(230, 330), 60, H - 60);
      spawnRock(x, y, 2); ring(x, y, 12, '#c724b1');
    }
  }
  if (aiSplitT <= 0) {
    aiSplitT = rnd(3.5, 5.5);
    if (aiEnergy >= 15 && ship) {
      let bi = -1, bd = 280 * 280;
      for (let i = 0; i < rocks.length; i++) {
        if (rocks[i].size === 0) continue;
        const d = dist2(rocks[i].x, rocks[i].y, ship.x, ship.y);
        if (d < bd) { bd = d; bi = i; }
      }
      if (bi >= 0) { aiEnergy -= 15; splitRock(bi, true); }
    }
  }
  if (aiHunterT <= 0) {
    aiHunterT = rnd(20, 28);
    if (hunters.length === 0 && wave >= 3) spawnHunter(wave >= 6);
  }
}

/* ---------- collisions & outcomes ---------- */
function killShip() {
  if (!ship) return;
  burst(ship.x, ship.y, 26, '#ff5a3c'); burst(ship.x, ship.y, 12, '#ffffff');
  ring(ship.x, ship.y, 24, '#ff5a3c');
  sBigBoom(); shake = 1; hitstop = 0.09;
  ship = null;
  if (mode === 'pilot') {
    lives--;
    if (lives <= 0) { endGame('gameOver'); return; }
    popup(W / 2, H / 2, 'HULL BREACHED', '#ff5a3c');
    setTimeout(() => { if (state === 'play' && !ship) resetShip(); }, 1200);
  } else if (mode === 'field') {
    aiLives--;
    aiLevel = Math.min(5, aiLevel + 1);
    if (aiLives <= 0) { endGame('win'); return; }
    banner = 'HULL DOWN — THE PILOT ADAPTS'; bannerT = 2;
    setTimeout(() => { if (state === 'play' && !ship) resetShip(); }, 1200);
  } else {
    roundWinner = 'field'; state = 'roundEnd'; stateT = 0;
  }
}
function addScore(base, x, y) {
  comboN = comboT > 0 ? comboN + 1 : 1;
  comboT = 2.5;
  const pts = base * comboN;
  score += pts;
  popup(x, y, '+' + pts, comboN > 1 ? '#ffd166' : '#eafdff');
  if (comboN >= 3) { popup(x, y - 22, 'COMBO x' + comboN, '#ffd166'); sCombo(comboN); }
}
function collisions(dt) {
  // ship bullets vs rocks + hunters
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.from !== 'ship') continue;
    let hit = false;
    for (let j = rocks.length - 1; j >= 0; j--) {
      const rk = rocks[j];
      if (dist2(b.x, b.y, rk.x, rk.y) < (rk.r + b.r) * (rk.r + b.r)) {
        const pts = rk.size === 2 ? 15 : rk.size === 1 ? 40 : 80;
        if (humanShip()) addScore(pts, rk.x, rk.y);
        const big = rk.size === 2;
        splitRock(j, false);
        if (big) { shake = Math.max(shake, 0.35); hitstop = Math.max(hitstop, 0.05); }
        hit = true; break;
      }
    }
    if (!hit) for (let j = hunters.length - 1; j >= 0; j--) {
      const s = hunters[j];
      if (dist2(b.x, b.y, s.x, s.y) < (s.r + b.r + 2) * (s.r + b.r + 2)) {
        burst(s.x, s.y, 16, '#ffd166'); ring(s.x, s.y, 14, '#ffd166'); sBoom();
        hunters.splice(j, 1);
        if (humanShip()) addScore(s.small ? 900 : 300, s.x, s.y);
        hit = true; break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }
  // rocks vs ship (dust motes are harmless)
  if (ship && ship.inv <= 0) {
    for (const rk of rocks) {
      if (rk.size === 0) continue;
      if (dist2(rk.x, rk.y, ship.x, ship.y) < (rk.r * 0.9 + SHIP_R) * (rk.r * 0.9 + SHIP_R)) {
        killShip(); break;
      }
    }
  }
  // hunter sparks vs ship, hunter bodies vs ship
  if (ship && ship.inv <= 0) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.from !== 'hunter') continue;
      if (dist2(b.x, b.y, ship.x, ship.y) < (b.r + SHIP_R) * (b.r + SHIP_R)) {
        bullets.splice(i, 1); killShip(); break;
      }
    }
    if (ship) for (let j = hunters.length - 1; j >= 0; j--) {
      const s = hunters[j];
      if (dist2(s.x, s.y, ship.x, ship.y) < (s.r + SHIP_R) * (s.r + SHIP_R)) {
        burst(s.x, s.y, 14, '#ffd166'); hunters.splice(j, 1); killShip(); break;
      }
    }
  }
  // pilot: wave cleared -> next wave, or victory after wave 8
  if (mode === 'pilot' && state === 'play' && rocks.length === 0 && hunters.length === 0 && ship) {
    if (wave >= maxWave) { endGame('win'); return; }
    wave++;
    banner = 'WAVE ' + wave + ' / ' + maxWave; bannerT = 1.6; sWaveClear();
    spawnWave();
  }
}

/* ---------- backdrop: parallax starfield + nebula (pre-rendered) ---------- */
const stars = [];
for (let i = 0; i < 170; i++) {
  const z = i < 80 ? 0.25 : i < 135 ? 0.55 : 1;
  // union des deux orientations (960x540 / 540x800) : le ciel couvre tout, partout
  stars.push({ x: rnd(0, 960), y: rnd(0, 800), z, r: rnd(0.6, 1.4 + z), tw: rnd(0, TAU) });
}
const nebula = document.createElement('canvas');
nebula.width = 480; nebula.height = 270;
(function paintNebula() {
  const c = nebula.getContext('2d');
  const blobs = [
    [120, 70, 150, 'rgba(0,120,160,0.20)'], [380, 200, 170, 'rgba(150,40,140,0.16)'],
    [300, 60, 110, 'rgba(40,60,180,0.14)'], [60, 220, 120, 'rgba(0,90,120,0.12)'],

function makeGlowSprite(color) {
  // sprite pixel : cœur blanc + croix couleur, pas de gradient

  const c = s.getContext('2d');

const SPR_WHITE = makeGlowSprite('#eafdff'), SPR_AMBER = makeGlowSprite('#ffb340');

/* ---------- render ---------- */
function strokePoly(pts, x, y, rot, color, width, glow) {
  ctx.save();
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow / PX; }
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(PX, Math.round((width || PX) / PX) * PX);
  ctx.beginPath();
  const c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i < pts.length; i++) {
    const rx = Math.round((pts[i][0] * c - pts[i][1] * s) / PX) * PX,
          ry = Math.round((pts[i][0] * s + pts[i][1] * c) / PX) * PX;
    if (i === 0) ctx.moveTo(Math.round(x / PX) * PX + rx, Math.round(y / PX) * PX + ry);
    else ctx.lineTo(Math.round(x / PX) * PX + rx, Math.round(y / PX) * PX + ry);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function drawShip(s) {
  const blink = s.inv > 0 && Math.floor(time * 10) % 2 === 0;
  if (blink) return;
  ctx.save();
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 12 / PX;
  strokePoly(SHIP_PTS, s.x, s.y, s.ang, '#6ff5ff', PX);
  if (s.thrust) {
    const fl = 20 + Math.random() * 10;
    ctx.shadowColor = '#ffb340'; ctx.shadowBlur = 14 / PX;
    strokePoly([[-11, 5], [-11 - fl, 0], [-11, -5]], s.x, s.y, s.ang, '#ffb340', PX);
  }
  ctx.restore();
}
function drawHunter(s) {
  ctx.save();
  ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 10 / PX;
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = PX;
  const r = Math.round(s.r / PX) * PX, x = Math.round(s.x / PX) * PX, y = Math.round(s.y / PX) * PX;
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.8, y);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.8, y);
  ctx.closePath(); ctx.stroke();
  for (const [ox, oy] of [[1, -1], [-1, -1], [1, 1], [-1, 1]]) {
    ctx.strokeRect(x + ox * r * 0.8 - PX, y + oy * r * 0.8 - PX, PX * 2, PX * 2);
  }
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(x - PX, y - PX, PX * 2, PX * 2);
  ctx.restore();
}
function drawCrystal(rk) {
  const col = ROCK_COLORS[rk.size];
  if (rk.size === 0) ctx.globalAlpha = clamp(rk.fade / 1.5, 0, 1);
  strokePoly(rk.crys.pts, rk.x, rk.y, rk.rot, col, PX, 9);
  ctx.save();
  ctx.globalAlpha = (rk.size === 0 ? clamp(rk.fade / 1.5, 0, 1) : 1) * 0.45;
  ctx.strokeStyle = col; ctx.lineWidth = PX;
  const c = Math.cos(rk.rot), s = Math.sin(rk.rot);
  ctx.beginPath();
  for (const seg of rk.crys.frac) {
    const ax = Math.round((rk.x + seg[0][0] * c - seg[0][1] * s) / PX) * PX,
          ay = Math.round((rk.y + seg[0][0] * s + seg[0][1] * c) / PX) * PX,
          bx = Math.round((rk.x + seg[1][0] * c - seg[1][1] * s) / PX) * PX,
          by = Math.round((rk.y + seg[1][0] * s + seg[1][1] * c) / PX) * PX;
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  }
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawBackdrop(dt) {
  ctx.drawImage(nebula, 0, 0, W, H);
  for (const st of stars) {
    st.x -= st.z * 7 * dt;
    if (st.x < 0) { st.x = W; st.y = rnd(0, H); }
    const a = (0.35 + 0.65 * st.z) * (0.72 + 0.28 * Math.sin(time * 2.4 + st.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = st.z > 0.8 ? '#eafdff' : '#9fb3bd';
    ctx.fillRect(st.x, st.y, st.r, st.r);
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(0,229,255,0.20)'; ctx.lineWidth = 2;
  ctx.strokeRect(6, 6, W - 12, H - 12);
}
function drawButton(b) {
  ctx.save();
  ctx.strokeStyle = '#eafdff'; ctx.lineWidth = PX;
  ctx.shadowColor = 'rgba(0,229,255,0.55)'; ctx.shadowBlur = 10 / PX;
  const bx = Math.round(b.x / PX) * PX, by = Math.round(b.y / PX) * PX,
        bw = Math.round(b.w / PX) * PX, bh = Math.round(b.h / PX) * PX;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.restore();
  const fs = Math.max(14, Math.round(bh * 0.3));
  const cy = by + bh / 2;
  text(b.label, bx + bw / 2, cy + (b.sub ? -7 : 3), 'bold ' + fs + 'px', '#eef4fa', '#00e5ff');
  if (b.sub) text(b.sub, bx + bw / 2, cy + 15, '12px', '#8a93a0');
}
const MENU_CRYS = [];
for (let i = 0; i < 9; i++) MENU_CRYS.push(makeCrystal(13));
function drawMenu() {
  buttons = [];

  const logoY = land ? H * 0.2 : H * 0.14;

  // crystals

const HOWTO = {

function drawHUD() {
  if (mode === 'pilot') {
    text('SCORE ' + score, 18, 30, '14px', '#8a93a0', null, null, 'left');

  } else if (mode === 'field') {
    text('TIME ' + matchT.toFixed(1) + 's', 18, 30, '14px', '#8a93a0', null, null, 'left');
    if (bestTime > 0) text('BEST ' + bestTime.toFixed(1) + 's', 18, 52, '14px', '#8a93a0', null, null, 'left');
    text('AI HULL', 18, 74, '14px', '#eafdff', null, null, 'left');
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = i < aiLives ? '#ff5a3c' : '#3a3f45'; ctx.lineWidth = PX;
      const qx = Math.round((100 + i * 26) / PX) * PX;
      ctx.strokeRect(qx, 62, 20, 14);

    ctx.strokeStyle = '#8a93a0'; ctx.lineWidth = PX;

    text('SHIP ' + wins.ship + ' — ' + wins.field + ' FIELD', 18, 30, '14px', '#8a93a0', null, null, 'left');

function drawServe() {

function drawPauseMenu() {

function drawEnd() {
  buttons = [];
  ctx.fillStyle = 'rgba(4,6,11,0.78)'; ctx.fillRect(0, 0, W, H);
  let title, color, lines = [];
  if (state === 'matchEnd') {

function render(dt) {

  if (state === 'menu') { drawBackdrop(dt); drawMenu(); }
  else if (state === 'howto') { drawBackdrop(dt); drawHowto(); }

  drawBackdrop(dt);
  for (const rk of rocks) drawCrystal(rk);
  for (const s of hunters) drawHunter(s);
  if (ship) drawShip(ship);
  for (const b of bullets) {
    const spr = b.from === 'hunter' ? SPR_AMBER : SPR_WHITE;

    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);

  ctx.globalAlpha = 1;
  if (!(paused && state === 'play')) {
    for (const p of popups) {

    ctx.globalAlpha = 1;
  }
  if (paused && state === 'play') drawPauseMenu();
  if (state === 'roundEnd') {
    text(roundWinner === 'ship' ? 'SHIP SURVIVES' : 'FIELD TAKES IT', W / 2, H / 2 - 20, 'bold 30px', '#f5f8fc', '#00e5ff');
    text('ship ' + wins.ship + ' — ' + wins.field + ' field', W / 2, H / 2 + 16, '15px', '#8a93a0');

  dctx.drawImage(pbuf, 0, 0, W, H);
}

/* ---------- main loop ---------- */
let lastT = 0, acc = 0;
const DT = 1 / 60;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  let ft = Math.min(0.1, now - (lastT || now));
  lastT = now; acc += ft;
  while (acc >= DT) { update(DT); acc -= DT; if (bannerT > 0) bannerT -= DT; }
  render(Math.min(ft, 0.05));
}
fit(); // init après toutes les déclarations (le remap a besoin des entités)
requestAnimationFrame(frame);

  get ship() { return ship; }, get rocks() { return rocks; },

  get score() { return score; }, get lives() { return lives; },
  get aiLives() { return aiLives; }, get aiLevel() { return aiLevel; }, get wave() { return wave; },
  get energy() { return energy; }, set energy(v) { energy = v; },
  get wins() { return wins; }, get roundT() { return roundT; }, set roundT(v) { roundT = v; },
  get matchT() { return matchT; }, get best() { return best; }, get bestTime() { return bestTime; },
  get muted() { return muted; }, get paused() { return paused; },
  get comboN() { return comboN; }, get buttons() { return buttons; },
