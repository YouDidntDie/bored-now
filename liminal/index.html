  for(let row=0;row<4;row++){
    const y0=row*64, h=64;
    const n=8-row*1; // fewer tiles as we go up (perspective)
    for(let i=0;i<16;i++){
      const x0=i*64;
      // tile
      g.fillStyle=(i+row)%5===0?'#d8d0b8':'#b8b09a';
      g.fillRect(x0+2,y0+2,60,h-4);
      if((i+row)%5===0){
        // neon panel: bright tubes
        g.fillStyle='#fffbe8';g.fillRect(x0+8,y0+10,48,h-20);
        g.fillStyle='#ffffff';g.fillRect(x0+12,y0+16,40,8);g.fillRect(x0+12,y0+30,40,8);
      }
      g.strokeStyle='#6a644e';g.lineWidth=2;g.strokeRect(x0+1,y0+1,62,h-2);
    }
  }
})();


const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,HH=0;
let fogG=null;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;HH=H>>1;
  fogG=ctx.createLinearGradient(0,0,0,H);
  fogG.addColorStop(0,'rgba(40,36,18,0)');fogG.addColorStop(1,'rgba(40,36,18,.28)');}
addEventListener('resize',rs);rs();

/* seeded rng */
function h2(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))|0;h=(h*1274126177)|0;return(h^(h>>>16))>>>0;}
function m32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

/* infinite backrooms: open office, partition walls, pillars. chunk 16. */
const CH=16, cc=new Map();
function chunk(cx,cy){
  const k=(cx+512)*2048+(cy+512); let g=cc.get(k); if(g)return g;
  g=new Uint8Array(CH*CH);
  const r=m32(h2(cx,cy));
  const ns=12+((r()*8)|0);
  for(let s=0;s<ns;s++){
    const hz=r()<0.5, ln=2+((r()*4)|0);
    let x=(r()*CH)|0, y=(r()*CH)|0;
    for(let i=0;i<ln;i++){
      const px=hz?x+i:x, py=hz?y:y+i;
      if(px>=0&&px<CH&&py>=0&&py<CH)g[py*CH+px]=1;
    }
  }
  for(let p=0,n=(r()*3)|0;p<n;p++){
    const x=1+((r()*(CH-3))|0), y=1+((r()*(CH-3))|0);
    g[y*CH+x]=1;g[y*CH+x+1]=1;g[(y+1)*CH+x]=1;g[(y+1)*CH+x+1]=1;
  }
  if(cx===0&&cy===0)for(let y=6;y<10;y++)for(let x=6;x<10;x++)g[y*CH+x]=0;
  if(cc.size>144)cc.delete(cc.keys().next().value);
  cc.set(k,g); return g;
}
function tile(tx,ty){
  const cx=(tx>>4), cy=(ty>>4);
  // tx,ty are always >=0 in practice (world coords), use fast mod
  const lx=tx&15, ly=ty&15;
  // handle negatives (rare, player won't go negative far)
  if(tx<0||ty<0){
    const cx2=Math.floor(tx/CH), cy2=Math.floor(ty/CH);
    const lx2=((tx%CH)+CH)%CH, ly2=((ty%CH)+CH)%CH;
    return chunk(cx2,cy2)[ly2*CH+lx2];
  }
  return chunk(cx,cy)[ly*CH+lx];
}
function solid(x,y){
  const r=0.22;
  return tile(Math.floor(x+r),Math.floor(y))||tile(Math.floor(x-r),Math.floor(y))||
         tile(Math.floor(x),Math.floor(y+r))||tile(Math.floor(x),Math.floor(y-r));
}

/* player */
const P={x:8.5,y:8.5,a:0,dist:0};
function cast(px,py,dx,dy,max){
  let mx=Math.floor(px),my=Math.floor(py);
  const ddx=Math.abs(1/(dx||1e-9)), ddy=Math.abs(1/(dy||1e-9));
  let sx,sy,sdx,sdy;
  if(dx<0){sx=-1;sdx=(px-mx)*ddx;}else{sx=1;sdx=(mx+1-px)*ddx;}
  if(dy<0){sy=-1;sdy=(py-my)*ddy;}else{sy=1;sdy=(my+1-py)*ddy;}
  let side=0,d=max;
  for(let i=0;i<64;i++){
    if(sdx<sdy){d=sdx;sdx+=ddx;mx+=sx;side=0;}else{d=sdy;sdy+=ddy;my+=sy;side=1;}
    if(d>max)return{dist:max,side,hit:false,tx:0};
    if(tile(mx,my))return{dist:d,side,hit:true,tx:side?px+d*dx:py+d*dy};
  }
  return{dist:max,side,hit:false,tx:0};
}

/* audio: fluorescent hum */
let AC=null,humG=null;
function audio(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const o1=AC.createOscillator(),o2=AC.createOscillator(),o3=AC.createOscillator();
    o1.frequency.value=120;o2.frequency.value=240;o3.frequency.value=360;
    o1.type='sawtooth';o2.type='sawtooth';o3.type='sine';
    const g1=AC.createGain(),g2=AC.createGain(),g3=AC.createGain();
    g1.gain.value=0.012;g2.gain.value=0.006;g3.gain.value=0.008;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=800;
    o1.connect(g1);o2.connect(g2);o3.connect(g3);
    g1.connect(f);g2.connect(f);g3.connect(f);
    humG=AC.createGain();humG.gain.value=1;
    f.connect(humG);humG.connect(AC.destination);
    o1.start();o2.start();o3.start();
    // slow amplitude wobble = dying ballast
    const lfo=AC.createOscillator(),lg=AC.createGain();
    lfo.frequency.value=0.13;lg.gain.value=0.25;
    lfo.connect(lg);lg.connect(humG.gain);lfo.start();
  }catch(e){}
}
function step(){
  if(!AC)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=90+Math.random()*30;
    g.gain.setValueAtTime(0.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.09);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+0.1);
  }catch(e){}
}

/* input */
const joy={x:0,y:0,id:null}, look={id:null,lx:0};
const joyEl=document.getElementById('joy'), stk=document.getElementById('stk');
addEventListener('touchstart',e=>{
  audio(); if(AC&&AC.state==='suspended')AC.resume();
  for(const t of e.changedTouches){
    if(t.clientX<W*0.45&&joy.id===null){joy.id=t.identifier;joyOx=t.clientX;joyOy=t.clientY;}
    else if(look.id===null){look.id=t.identifier;look.lx=t.clientX;}
  }
},{passive:false});
let joyOx=0,joyOy=0;
addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){
      let dx=(t.clientX-joyOx)/45, dy=(t.clientY-joyOy)/45;
      const m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;}
      joy.x=dx;joy.y=dy;
      stk.style.left=(31+dx*32)+'px';stk.style.top=(31+dy*32)+'px';
    }else if(t.identifier===look.id){
      P.a+=(t.clientX-look.lx)*0.006; look.lx=t.clientX;
    }
  }
},{passive:false});
function endT(e){
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){joy.id=null;joy.x=0;joy.y=0;stk.style.left='31px';stk.style.top='31px';}
    if(t.identifier===look.id)look.id=null;
  }
}
addEventListener('touchend',endT);addEventListener('touchcancel',endT);
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;audio();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* flicker */
let flick=1,flickT=0;

/* main */
let running=false,last=0,stepT=0;
const dHud=document.getElementById('dHud');
let best=0; try{best=parseFloat(localStorage.getItem('liminal_best')||'0');}catch(e){}
function fmtBest(){
  document.getElementById('best').textContent=best>0?('FARTHEST — '+Math.floor(best)+' m'):'';
}
fmtBest();

function loop(t){
  if(!running)return;
  requestAnimationFrame(loop);
  const dt=Math.min((t-last)/1000,0.05);last=t;

  /* move */
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  mx+=joy.x;my+=joy.y;
  const ml=Math.hypot(mx,my);
  if(ml>0.01){
    const sp=2.6*dt, nx=mx/ml, ny=my/ml;
    const dx=Math.cos(P.a)*nx-Math.sin(P.a)*ny;
    const dy=Math.sin(P.a)*nx+Math.cos(P.a)*ny;
    // wait: forward is -y in stick; map stick up = forward
    const fwx=Math.cos(P.a)*(-ny), fwy=Math.sin(P.a)*(-ny);
    const stx=Math.cos(P.a+Math.PI/2)*nx, sty=Math.sin(P.a+Math.PI/2)*nx;
    const vx=fwx+stx, vy=fwy+sty;
    const ox=P.x, oy=P.y;
    if(!solid(P.x+vx*sp,P.y))P.x+=vx*sp;
    if(!solid(P.x,P.y+vy*sp))P.y+=vy*sp;
    P.dist+=Math.hypot(P.x-ox,P.y-oy);
    stepT+=dt; if(stepT>0.42){stepT=0;step();}
  }
  // keyboard turn
  if(keys['q'])P.a-=2.4*dt;
  if(keys['e'])P.a+=2.4*dt;

  /* flicker */
  flickT-=dt;
  if(flickT<=0){ flick=Math.random()<0.06?0.55+Math.random()*0.3:1; flickT=0.08+Math.random()*0.4; }

  /* render: office ceiling strip (rotates with look) */
  const ceilOff=((-P.a/(Math.PI*2))*1024)%1024;
  ctx.globalAlpha=flick;
  ctx.drawImage(ceilCv,ceilOff<0?ceilOff+1024:ceilOff,0,W,HH,0,0,W,HH);
  // wrap: draw second copy if needed
  const off2=(ceilOff<0?ceilOff+1024:ceilOff);
  if(off2+W>1024)ctx.drawImage(ceilCv,off2-1024,0,W,HH,0,0,W,HH);
  ctx.globalAlpha=1;
  ctx.fillStyle='#2e2820';ctx.fillRect(0,HH,W,H-HH);   // floor (dark carpet)

  const dirx=Math.cos(P.a),diry=Math.sin(P.a);
  const px=-diry*0.66, py=dirx*0.66;
  const tw=backTex.width||64, th=backTex.height||64;
  const texOK=backTex.complete&&backTex.naturalWidth;
  ctx.imageSmoothingEnabled=false;
  for(let x=0;x<W;x+=4){
    const cam=2*x/W-1;
    const rdx=dirx+px*cam, rdy=diry+py*cam;
    const r=cast(P.x,P.y,rdx,rdy,24);
    const dc=r.dist*(rdx*dirx+rdy*diry);
    const lh=Math.min(H*2,H/Math.max(0.1,dc));
    const y0=HH-lh/2;
    if(r.hit&&texOK){
      let tx=((r.tx%1)+1)%1;
      const sx=Math.floor(tx*tw);
      ctx.drawImage(backTex,sx,0,1,th,x,y0,4,lh);
    }else{
      ctx.fillStyle='#8a7a4a';
      ctx.fillRect(x,y0,4,lh);
    }
  }
  // shading overlay (cheap, one pass)
  ctx.fillStyle='rgba(0,0,0,'+(0.22*(2-flick))+')';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle=fogG;ctx.fillRect(0,0,W,H);

  dHud.textContent=Math.floor(P.dist)+' m';
  if(P.dist>best){best=P.dist;try{localStorage.setItem('liminal_best',''+Math.floor(best));}catch(e){}}
}

document.getElementById('go').onclick=function(){
  audio(); if(AC&&AC.state==='suspended')AC.resume();
  // face the most open direction
  let bestA=0,bestD=0;
  for(let a=0;a<Math.PI*2;a+=Math.PI/8){
    const r=cast(P.x,P.y,Math.cos(a),Math.sin(a),24);
    if(r.dist>bestD){bestD=r.dist;bestA=a;}
  }
  P.a=bestA;
  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='flex';
  joyEl.style.display='block';
  document.getElementById('hint').style.display='block';
  setTimeout(()=>document.getElementById('hint').style.display='none',5000);
  running=true;last=performance.now();
  requestAnimationFrame(loop);
};
rs();
</script>
